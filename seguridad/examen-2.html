más SPAM en e-mail", "El e-mail es vulnerable y descentralizado; las redes privadas pueden filtrar."]], "q": [["En el phishing, tras robar la contraseña se redirige a la web oficial para…", ["Acelerar la conexión", "Que el usuario no note el ataque", "Cifrar los datos", "Evitar el SPAM"], 1, "Así el usuario cree que ha entrado con normalidad."], ["Verdadero o falso: el hoax siempre busca instalar malware.", ["Verdadero", "Falso"], 1, "Sus objetivos van de la broma al daño de imagen, el incordio o la recolección de direcciones."], ["¿Qué principio sustenta la ingeniería social?", ["El software siempre tiene fallos", "El usuario es el eslabón débil", "Las redes no son seguras", "El cifrado es débil"], 1, "Se manipula a usuarios legítimos."], ["¿Por qué hay más SPAM por e-mail que por redes sociales?", ["Porque el e-mail es más rápido", "Las redes privadas pueden filtrar y el e-mail es vulnerable y descentralizado", "Porque no hay antivirus", "Por el cifrado"], 1, "Causas probables que señalan los apuntes."]], "s": ["Fraude = acción deliberada contra una de las 3 propiedades; vías: mensaje, web, intrusión, malware.", "SPAM (no solicitado) · Hoax (falso) · Phishing (el usuario entrega datos engañado)."]}, {"id": "i", "n": "Intrusiones y vulnerabilidades", "th": [["Amenazas por la red", "<div class=\"sc\"><table><tr><th>Amenaza<\/th><th>Qué es<\/th><th>Técnica<\/th><\/tr><tr><td>Suplantación<\/td><td>Hacerse pasar por un tercero<\/td><td>Spoofing (IP, DNS, ARP, e-mail, web)<\/td><\/tr><tr><td>Intromisión<\/td><td>Colarse y acceder a servicios<\/td><td>Phishing, fuerza bruta, diccionario, code injection<\/td><\/tr><tr><td>Modificación<\/td><td>Alterar información (tras una intromisión)<\/td><td>Servicios de aplicación<\/td><\/tr><tr><td>Interceptación<\/td><td>Desviar la información a otro destino<\/td><td>Hijacking<\/td><\/tr><tr><td>Espionaje<\/td><td>Observar el tráfico<\/td><td>Sniffing<\/td><\/tr><tr><td>Denegación<\/td><td>Impedir el servicio<\/td><td>DoS/DDoS, flooding<\/td><\/tr><\/table><\/div><p>Niveles: <b>físico/enlace<\/b>, <b>red/transporte<\/b> y <b>aplicación<\/b>. Intruso errático (prueba sin objetivo) vs. <b>profesional<\/b> (objetivo concreto, paciente, sin huellas; idealista o criminal). Herramientas: ingeniería social, malware y vulnerabilidades.<\/p>"], ["Técnicas de intrusión", "<ul><li><b>Spoofing / poisoning<\/b>: suplantar identidad. <i>E-mail<\/i> (cabeceras), <i>DNS<\/i> (nombres falsos o DNS falso), <i>IP<\/i> (dirección origen), <i>ARP<\/i> (confunde la caché ARP y el switch/AP para recibir las tramas), <i>DHCP<\/i> (servidor falso con puerta de enlace o DNS manipulados).<\/li><li><b>Sniffing<\/b>: leer el tráfico. Con hubs es posible; con switches o APs hace falta ARP spoofing.<\/li><li><b>Man in the middle<\/b>: intruso en un punto intermedio, normalmente por spoofing; permite sniffing.<\/li><\/ul>"], ["Vulnerabilidades y ataques", "<ul><li><b>Fuerza bruta<\/b>: todas las combinaciones. <b>Diccionario<\/b>: contraseñas comunes (usuario predecible).<\/li><li><b>Fuzzy<\/b>: probar patrones habituales (<code>/admin<\/code>, <code>.git<\/code>).<\/li><li><b>Hijacking<\/b>: el MITM pasa a ser receptor final (ej.: secuestro de sesión robando la cookie).<\/li><li><b>DoS/DDoS<\/b>: colapsar un servicio con peticiones falsas; <i>flooding<\/i> inunda la red.<\/li><li><b>Exploit<\/b>: software que ayuda a vulnerar una medida de seguridad; se ejecuta o distribuye manualmente (Metasploit).<\/li><li><b>Zero day<\/b>: el descubridor no informa y explota la vulnerabilidad.<\/li><\/ul>"], ["Cultura hacker", "<p><mark>Black hat<\/mark> (crackers): intrusiones no autorizadas. <mark>White hat<\/mark>: descubren vulnerabilidades e informan. <mark>Script-kiddie<\/mark>: ejecuta sin saber qué hace. Para la seguridad, amenaza tanto el diestro como el inexperto. Emblema: el <i>glider<\/i> del Juego de la vida de Conway.<\/p>"]], "c": [["Suplantación vs. espionaje", "Suplantación: hacerse pasar por otro (spoofing). Espionaje: observar el tráfico (sniffing)."], ["ARP spoofing", "Tramas falsas que confunden la caché ARP de equipos y switch/AP para que las tramas lleguen al intruso."], ["DHCP spoofing", "DHCP falso que sirve configuración falsa (puerta de enlace, DNS) a nuevos clientes."], ["Man in the middle", "Intruso en un punto intermedio de la comunicación, normalmente por spoofing; permite sniffing."], ["Fuerza bruta vs. diccionario", "Bruta: todas las combinaciones. Diccionario: lista de contraseñas comunes."], ["Ataque fuzzy", "Probar patrones habituales, como /admin o el directorio .git."], ["Hijacking", "Desviar una comunicación en curso hacia un tercero (ej.: robo de cookie de sesión)."], ["Exploit", "Software que ayuda a vulnerar una medida de seguridad; se ejecuta o distribuye manualmente."], ["Zero day", "Ataque que explota una vulnerabilidad que el descubridor no comunicó al fabricante."], ["White hat vs. black hat", "White: descubre e informa de vulnerabilidades. Black: intrusiones no autorizadas (crackers)."]], "q": [["El sniffing consiste en…", ["Falsear el remitente", "Leer el tráfico de la red", "Inundar un servicio", "Probar contraseñas"], 1, "Permite avanzar en la intrusión u obtener datos relevantes."], ["¿A quién engaña el ARP spoofing?", ["Al servidor DNS", "A la caché ARP de otros equipos y del switch o AP", "Al antivirus", "Al servidor DHCP"], 1, "Así las tramas se envían al ordenador ilegítimo."], ["Explotar una vulnerabilidad sin informar al fabricante es un ataque…", ["Fuzzy", "De día cero", "De diccionario", "De flooding"], 1, "Ataque de día cero."], ["¿Diferencia entre fuerza bruta y diccionario?", ["Bruta prueba todas las combinaciones; diccionario, contraseñas comunes", "Son lo mismo", "Diccionario usa exploits", "Bruta solo funciona en WiFi"], 0, "El diccionario supone un comportamiento predecible del usuario."], ["Verdadero o falso: el flooding busca colapsar normalmente la red más que un servicio concreto.", ["Verdadero", "Falso"], 0, "Es una técnica concreta para lograr un DoS."], ["Un white hat…", ["Realiza intrusiones no autorizadas", "Ejecuta sin saber qué hace", "Descubre vulnerabilidades e informa a los propietarios", "Es siempre un cracker"], 2, "Black hat = intrusión; script-kiddie = ejecuta sin saber."]], "s": ["6 amenazas: suplantación, intromisión, modificación, interceptación, espionaje, denegación.", "Spoofing (e-mail, DNS, IP, ARP, DHCP) → sniffing → MITM → hijacking.", "Fuerza bruta, diccionario, fuzzy, DoS, exploit, zero day."]}, {"id": "m", "n": "Malware", "th": [["Malware y clasificación por propagación", "<p><mark>Malware<\/mark>: código con intención maliciosa u oculta que vulnera una propiedad segura sin consentimiento; se define por la intención del autor. Objetivos: <b>propagarse<\/b> y hacer una fechoría (<i>payload<\/i>).<\/p><div class=\"sc\"><table><tr><th>Tipo<\/th><th>Cómo actúa<\/th><\/tr><tr><td>Virus<\/td><td>Fragmento de código que infecta ejecutables (.exe, .dll), sectores de arranque, drivers, macros o ficheros por lotes. En declive: EXE y DLL pueden ir firmados.<\/td><\/tr><tr><td>Gusano<\/td><td>Se duplica <b>entero<\/b>, sin alterar otros ejecutables; aprovecha una <b>vulnerabilidad<\/b> para ejecutarse (ej.: autorun.inf en pendrives, systemd/cron en Linux). Reside en memoria; no suele requerir al usuario.<\/td><\/tr><tr><td>Troyano<\/td><td>Parece un programa legítimo, pero al ejecutarlo realiza una acción encubierta o inicia otra propagación (caballo de Troya).<\/td><\/tr><\/table><\/div>"], ["Payloads", "<ul><li><b>Spyware<\/b>: recopila información de la actividad. <b>Adware<\/b>: publicidad no deseada por canales no legítimos.<\/li><li><b>Crimeware<\/b>: enriquece ilícitamente a quien lo controla (<b>botnet<\/b> o red zombi: fuerza bruta a disposición del intruso).<\/li><li><b>Ransomware<\/b>: cifra los ficheros y pide dinero (Bitcoin, negociable). A veces la clave se recupera con herramientas de antivirus.<\/li><li><b>Keyloggers<\/b> (pulsaciones; también hardware) y <b>screenloggers<\/b> (capturas de pantalla, no constantes).<\/li><li><b>Mineros<\/b>: usan la potencia del equipo para minar criptomonedas.<\/li><li><b>Rootkits<\/b>: acceso privilegiado continuo y presencia oculta; el Secure Boot los dificulta.<\/li><li><b>RAT<\/b>: administración remota usada como carga. <b>BOT<\/b>: RAT que además ejecuta scripts. Los antiguos escuchan en un puerto (evitan NAT/PAT); los modernos hacen <b>llamada a casa<\/b> a una dirección programada.<\/li><\/ul>"], ["Cyber Kill Chain", "<p>Ataques <b>no dirigidos<\/b> (SPAM masivo) o <b>dirigidos<\/b> (objetivo concreto): se profesionalizan y se planifican en fases, cada una con técnicas y herramientas diferenciadas.<\/p><div class=\"extra\">Las siete fases habituales (Lockheed Martin) son: reconocimiento, armamento, entrega, explotación, instalación, mando y control, y acciones sobre objetivos. No vienen en el texto de los apuntes, solo en la imagen.<\/div>"]], "c": [["Malware", "Código con intención maliciosa u oculta que vulnera una propiedad segura sin consentimiento."], ["Virus", "Fragmento de código que modifica ejecutables y otros ficheros para ejecutarse con ellos sin ser visto."], ["Gusano", "Se duplica entero y necesita una vulnerabilidad para ejecutarse; no altera ejecutables."], ["Troyano", "Programa aparentemente legítimo que realiza una acción encubierta al ejecutarlo."], ["Spyware vs. adware", "Spyware: espía la actividad. Adware: publicidad no deseada."], ["Botnet", "Conjunto de equipos infectados controlados por un intruso (red zombi)."], ["Ransomware", "Cifra los ficheros y exige un pago (normalmente criptomoneda) por la clave."], ["Keylogger vs. screenlogger", "Keylogger registra pulsaciones; screenlogger captura la pantalla (evolución)."], ["Rootkit", "Acceso privilegiado continuo y oculto; difícil con Secure Boot."], ["RAT vs. BOT", "RAT: administración remota. BOT: además ejecuta scripts de instrucciones."], ["Llamada a casa", "El malware moderno se conecta a una dirección programada, saltándose NAT/PAT."], ["Ataque dirigido", "Tiene un objetivo concreto y se planifica en fases (Kill Chain)."]], "q": [["¿Qué rasgos identifican a un gusano?", ["Modifica ejecutables", "Se duplica entero y aprovecha una vulnerabilidad para ejecutarse", "Se hace pasar por legítimo", "Solo cifra el disco"], 1, "Fichero individual + vulnerabilidad de la máquina destino."], ["Un programa que parece legítimo pero oculta una acción es un…", ["Virus", "Gusano", "Troyano", "Rootkit"], 2, "Del caballo de Troya de la Odisea."], ["Un conjunto de equipos infectados bajo control de un intruso es…", ["Una DMZ", "Una botnet", "Un honeypot", "Un rootkit"], 1, "También llamada red zombi."], ["¿Qué dificulta la instalación de rootkits?", ["El autorun", "El Secure Boot", "Los keyloggers", "El adware"], 1, "También ayuda el escaneo previo al arranque."], ["¿Por qué los virus ya no son tan populares?", ["Porque no existen", "Los EXE y DLL de Windows pueden estar firmados criptográficamente", "Porque ya no hay macros", "Por el SPAM"], 1, "La firma criptográfica dificulta inyectarse en ellos."], ["Verdadero o falso: los RAT modernos se quedan escuchando en un puerto.", ["Verdadero", "Falso"], 1, "Eso hacían los antiguos; los modernos hacen llamada a casa."], ["El ransomware suele pedir el pago en…", ["Transferencia bancaria", "Bitcoin u otra moneda virtual", "Efectivo", "Tarjeta"], 1, "Para ocultar su rastro; además es negociable."]], "s": ["Propagación: virus (infecta ejecutables) · gusano (se duplica + vulnerabilidad) · troyano (disfraz).", "Payloads: spyware, adware, crimeware/botnet, ransomware, loggers, mineros, rootkit, RAT/BOT.", "Ataques dirigidos → fases (Kill Chain)."]}, {"id": "p", "n": "Prevención y antivirus", "th": [["Educación del usuario", "<ul><li>Software legítimo, solo el necesario y actualizado.<\/li><li>Desconfiar de lo sospechoso por mensajería; los servicios <b>nunca<\/b> piden contraseñas por correo.<\/li><li>Contraseñas largas, complejas, secretas, distintas por servicio; <b>gestores de contraseñas<\/b> y <b>TOTP<\/b>.<\/li><li>No acceder a sistemas sensibles desde equipos o redes desconocidos (hotspots, bibliotecas).<\/li><li>Escanear pendrives, avisar al administrador y usar <b>privilegios de usuario<\/b> a diario.<\/li><\/ul>"], ["El técnico informático", "<ul><li><mark>Mínimo privilegio<\/mark> y permisos por <b>whitelist<\/b>, no blacklist.<\/li><li>Datos en carpeta de red de un servidor desatendido; <b>copia de seguridad<\/b> programada.<\/li><li>Disco principal primero en el orden de arranque; <b>Secure Boot<\/b>; revisar políticas (Autoplay).<\/li><li>Antivirus actualizado y escaneo previo al arranque (rootkits).<\/li><li>Desactivar pronto a usuarios que ya no se usan.<\/li><li>Configurar red y routers: <b>firewall + proxy<\/b> contra la llamada a casa.<\/li><\/ul>"], ["El antivirus", "<p>Imprescindible en todo equipo conectado. Busca estadísticamente trazas de malware conocido (memoria secundaria, principal y comunicaciones) con una base de indicadores/huellas heurísticas que debe estar <b>actualizada<\/b>.<\/p><ul><li><b>Al vuelo<\/b>: mientras se ejecutan programas o se inserta un dispositivo.<\/li><li><b>A propósito<\/b>: escaneo pedido por el usuario.<\/li><li><b>Durante el arranque<\/b>: antes de cargar el SO, buscando rootkits.<\/li><\/ul><p>Conclusión: el punto clave es la <mark>educación del usuario<\/mark>. Fuente de formación: <b>INCIBE<\/b>.<\/p>"]], "c": [["Whitelist vs. blacklist", "Permisos concedidos solo a lo explícitamente permitido (whitelist), no lista de lo prohibido."], ["Mínimo privilegio", "Cada usuario con el menor nivel de permisos con el que pueda trabajar."], ["Cómo evitar la llamada a casa", "Configuración de red segura (red y aplicación) con firewall y proxy."], ["Antivirus al vuelo", "Busca malware al ejecutar programas (de secundaria a principal) o al insertar dispositivos."], ["Antivirus durante el arranque", "Escanea antes de cargar el SO para encontrar rootkits."], ["Qué usa un antivirus", "Base de datos de indicadores numéricos (huellas heurísticas) que debe estar actualizada."], ["INCIBE", "Instituto Nacional de Ciberseguridad; fuente de formación y concienciación."]], "q": [["Los permisos deben basarse en…", ["Una blacklist", "Una whitelist", "El nombre de usuario", "El horario"], 1, "Se permite solo lo explícitamente autorizado."], ["El escaneo durante el arranque sirve sobre todo para detectar…", ["Hoaxes", "Rootkits", "Keyloggers hardware", "SPAM"], 1, "Antes de cargar el SO, rootkits en el sistema de ficheros."], ["Verdadero o falso: un servicio legítimo puede pedirte la contraseña por correo si hay un problema.", ["Verdadero", "Falso"], 1, "Nunca lo hacen."], ["¿Qué combinación se propone contra la llamada a casa?", ["Antivirus y SAI", "Firewall y proxy", "RAID y copias", "TOTP y TLS"], 1, "Configuración segura en nivel de red y aplicación."], ["¿Para qué sirve la copia de seguridad ante un ataque?", ["Evitarlo", "Restaurar a un estado anterior tras una pérdida de integridad", "Cifrar el tráfico", "Detectar rootkits"], 1, "Es una medida pasiva de recuperación."]], "s": ["Usuario: legítimo, actualizado, desconfiar, contraseñas distintas + gestor + TOTP.", "Técnico: mínimo privilegio, whitelist, backup, Secure Boot, firewall + proxy.", "Antivirus: al vuelo · a propósito · en arranque; base actualizada."]}];
const D=[["f", "Explica qué es la ingeniería social y diferencia SPAM, hoax y phishing.", ["Manipular usuarios legítimos; el usuario es el eslabón débil", "SPAM: no solicitado, remitente falso, publicidad", "Hoax: contenido falso, objetivos variados", "Phishing: el usuario entrega voluntariamente los datos; web falsa y redirección a la oficial"]], ["i", "Describe las seis amenazas por la red y una técnica asociada a cada una.", ["Suplantación: spoofing", "Intromisión: phishing, fuerza bruta, diccionario, code injection", "Modificación tras intromisión", "Interceptación: hijacking", "Espionaje: sniffing", "Denegación: DoS/DDoS, flooding"]], ["m", "Diferencia virus, gusano y troyano y cita cinco tipos de payload.", ["Virus: infecta ejecutables y otro código", "Gusano: se duplica entero y usa una vulnerabilidad", "Troyano: apariencia legítima y acción encubierta", "Payloads: spyware, adware, crimeware/botnet, ransomware, loggers, mineros, rootkits, RAT/BOT"]], ["p", "¿Qué medidas de prevención debe aplicar el técnico y cómo actúa un antivirus?", ["Mínimo privilegio y whitelist", "Copias de seguridad y datos en servidor", "Secure Boot y orden de arranque", "Firewall + proxy", "Antivirus: al vuelo, a propósito y durante el arranque con base actualizada"]]];
const FF={"f": "<h1>Fraude<\/h1>\n<p>Entendemos como fraude una acción deliberada, que tiene como objetivo perjudicar de alguna manera a alguien contra quien se comete, en la seguridad informática buscan reducir cualquiera de las tres propiedades seguras, sus usos más comunes son:<\/p>\n<ul>\n<li>Un mensaje.<\/li>\n<li>A través de la web.<\/li>\n<li>Por una intrusión directa de una persona.<\/li>\n<li>Por la actuación de malware.<\/li>\n<\/ul>\n<p>Que además suelen combinarse. A menudo, también se combinan con las habilidades personales para extraer información, a esas habilidades las denominamos ingeniería social.<\/p><h1>Ingeniería Social<\/h1>\n<p>La práctica de obtener información confidencial a través de la manipulación de usuarios legítimos, el principio que sustenta la ingeniería social es el que en cualquier sistema los usuarios son el eslabón débil, ejemplos de esto pueden ser cosas como el clickfix o el typosquating.<\/p><h1>Los Mensajes y la Web<\/h1>\n<p>Mensajes, web e ingeniería social están íntimamente ligados. El correo electrónico (e-mail) y otras fuentes de mensajería son el origen y una herramienta más en el fraude.<\/p>\n<h2>SPAM<\/h2>\n<p>Mensajes o correos recibidos sin ser solicitados, suelen tener remitentes desconocidos, falsos o cuya dirección ha sido usurpada, normalmente son publicidad.<\/p>\n<h3>Hoaxes<\/h3>\n<p>Son correos o mensajes cuyo contenido es falso  y suelen ser sobre:<\/p>\n<ul>\n<li>Alertas sobre virus incurables<\/li>\n<li>Mensajes de temática religiosa<\/li>\n<li>Temas solidarios<\/li>\n<li>Temas relacionados con la suerte<\/li>\n<li>Leyendas urbanas<\/li>\n<li>Métodos para hacerse millonario<\/li>\n<li>Regalos de grandes compañías<\/li>\n<\/ul>\n<p>Sus objetivos pueden ir desde bromas, hasta daños a la imagen, pasando por el incordio de alguien si se usan datos reales o la recolección de direcciones.<\/p>\n<h3>Phishing (Password fISHING)<\/h3>\n<p>Es la técnica en la que, mediante una decepción, el usuario entrega voluntariamente sus datos, suele realizarse mediante mensajes y web. Mensajes o correos con redirecciones a webs falsas que una vez tienen tu contraseña te envían a la oficial, para que no notes el ataque.<\/p>\n<h3>Malware por Correo<\/h3>\n<p>El e-mail y otros sistemas de mensajes son frecuente fuente de transmisión de malware, en general cualquier sistema de transferencia de ficheros puede ser utilizado para transmitir malware: páginas de descargas, <a target=\"_blank\" rel=\"noopener\" href=\"https://www.qbittorrent.org/\">QBittorrent<\/a>, <a target=\"_blank\" rel=\"noopener\" href=\"https://www.emule-project.com/home/perl/general.cgi?l=17\">eMule<\/a>,... Estas pueden ser herramientas útiles, pero el usuario debe saber utilizarlas con cuidado, para una guía sobre ello vease <a target=\"_blank\" rel=\"noopener\" href=\"https://thebeginnersguide.substack.com/p/the-beginners-guide-to-torrenting\">https://thebeginnersguide.substack.com/p/the-beginners-guide-to-torrenting<\/a><\/p>\n<h3>Cifras<\/h3>\n<p>La cantidad de spam que se propaga por internet a través del e-mail es realmente enorme, a través de otras redes de chat o sociales las cifras son mucho menores.\nLas causas son probablemente:<\/p>\n<ul>\n<li>Por un lado, esas redes de chat y sociales pertenecen a empresas privadas, que pueden poner algún mecanismo para filtrar el spam.<\/li>\n<li>Por otro lado, tecnológicamente, el e-mail es bastante vulnerable y tiene un reparto descentralizado.<\/li>\n<\/ul>\n<p>En 2017, el nivel de SPAM ha bajado al 55% (<a target=\"_blank\" rel=\"noopener\" href=\"https://securelist.com/spam-and-phishing-in-q2-2017/81537/\">Spam y Phising en 2017<\/a>). Posiblemente el SPAM haya dejado de ser tan lucrativo como antes, debido a los mejores sistemas de detección y al aumento de otros tipos de comunicaciones por medio de las redes sociales.<\/p>\n<p>En 2026, el <a target=\"_blank\" rel=\"noopener\" href=\"https://clean.email/blog/insights/email-spam-statistics-2026\">SPAM sigue siendo el mayor tipo de tráfico de email<\/a>, aunque su proporción es variable:<\/p>\n<ul>\n<li>Kaspersky's 2025 telemetry estima el SPAM en un 44.99%, aproximadamente 169–176 mil millones de emails diarios.<\/li>\n<\/ul>", "i": "<h1>Intrusiones por la red<\/h1>\n<p>Intento deliberado de una persona de vulnerar una de las tres características seguras mediante métodos manuales, aunque también se puede combinar con malware (automático), puede ocurrir en los niveles:<\/p>\n<ul>\n<li>Físico/Enlace<ul>\n<li>En redes cableadas, supone interceptar el cable, lo cual implica un desplazamiento físico de personas a algún punto de la instalación<\/li>\n<li>En redes inalámbricas, con poca protección, se puede lograr un enlace a un punto de acceso de una red, o lograr examinar el interior de las tramas.<\/li>\n<\/ul>\n<\/li>\n<li>Red/Transporte<ul>\n<li>Dado que en esta capa se encuentra internet y esta es una interconexión de redes, se puede lograr interceptar o abrir un transporte remotamente.<\/li>\n<\/ul>\n<\/li>\n<li>Aplicación<ul>\n<li>Se explotan vulnerabilidades, se desglosan dos grandes tipos:<ul>\n<li>Por un lado, el intruso que no tiene una intención concreta, sino que simplemente prueba, a veces se cuelan en algún sitio, su comportamiento es irregular y errático.<\/li>\n<li>Por otro lado, el intruso profesional que sabe lo que hace: tiene un objetivo concreto y no se desvía de él. Actúan como detectives: con paciencia, recopilando información, ordenándola, haciendo deducciones lógicas y no dejando huellas de su actividad. Cuando se deciden a atacar son rápidos y fulminantes, en este grupo podemos encontrar:<ul>\n<li>A los intrusos con algún objetivo idealista (ej: vulnerar la seguridad de algún sitio por el orgullo de hacerlo; vulnerar la seguridad de alguna entidad como protesta por algún hecho relacionado con ella)<\/li>\n<li>A los intrusos con algún objetivo relacionado con el crimen (ej: obtener información valiosa de gobiernos, empresas, particulares, famosos, etc.) En algunos casos se trata de individuos solos y en otros pertenecen a bandas de crimen organizado Las herramientas que utiliza un intruso son básicamente tres: ingeniería social, malware y vulnerabilidades.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>Amenzas por la Red<\/h2>\n<ul>\n<li>Suplantación: Un atacante se hace pasar por un tercero, para dar información falsa o fraudulenta (spoofing –IP,DNS, ARP, e-mail,web…).<\/li>\n<li>Intromisón: Alguien consigue “colarse” a través de la red, y por ella, acceder a servicios que le permiten obtener información. (Phishing / Fuerza bruta / Diccionarios / Code Injection).<\/li>\n<li>Modificación: Se modifica información. Normalmente, tras una intromisión, haciendo uso de servicios de aplicación.<\/li>\n<li>Interceptación: La información que viaja por la red es desviada hacia otro destino (con técnicas conocidas como “secuestro” – Hijacking).<\/li>\n<li>Espionaje: Se observa el tráfico de una red para obtener información cuando viaja (sniffing).<\/li>\n<li>Denegación de servicio (DoS / DDoS): Intenta impedir el correcto funcionamiento de un servicio con técnicas como la “inundación”, de tal manera que el servicio no pueda atender a las peticiones legítimas.<\/li>\n<\/ul>\n<h2>Técnicas de Intrusión<\/h2>\n<ul>\n<li>Spoofing o también llamado poisoning: Consiste en suplantar la identidad, en aquellos servicios de red donde sea posible.<ul>\n<li>E-mail spoofing: falsear el remitente de un e-mail, cambiando las cabeceras del interior dele-mail.<\/li>\n<li>DNS spoofing: introducir nombres falsos en un sistema DNS legítimo, de tal manera que se resuelvan a una IP no legítima, o bien, lograr montar un DNS falso, y que algún cliente lo utilice. <ul>\n<li>IP spoofing: sustituir la dirección IP del remitente de un paquete por otra.<\/li>\n<\/ul>\n<\/li>\n<li>ARP spoofing: En una red local con con hubs es posible hacer sniffing de las tramas de otros ordenadores, porque el hub reenvía las tramas a todos. En una red con switches o APs no se puede. El ARP spoofing consiste en la emisión desde un ordenador ilegítimo de tramas falsas que logren confundir a la caché ARP de otros ordenadores y del switch o AP, para que seenvíen las tramas al ordenador ilegítimo.<\/li>\n<li>DHCP spoofing: hacerse pasar por un DHCP legítimo en una LAN, y servir información de configuración falsa a los nuevos clientes, en especial la de la puerta de acceso o los DNS, con intención de desviar sus comunicaciones.<\/li>\n<\/ul>\n<\/li>\n<li>Sniffing: Leer el tráfico de la red, con el objetivo de conseguir datos que permitan avanzar en la intrusión u otros datos relevantes.<\/li>\n<li>Man in the middle: Es una expresión que significa que un intruso logra un acceso a algún punto intermedio de una comunicación, en cualquiera de los niveles de red. Normalmente se logra mediante alguna técnica de spoofing, y permite hacer sniffing.<\/li>\n<\/ul><h1>Las Vulnerabilidades del Software<\/h1>\n<p>Todo el software se programa teniendo en mente en primer lugar su funcionalidad, y suponiendo un uso predecible y regular de él. En segundo lugar, los programadores implementan algunas medidas de seguridad para aquellas situaciones irregulares que se les ocurren. Parte de las situaciones irregulares son predecibles y otra parte no puede ser ni imaginada por los desarrolladores del software. Esas situaciones son, en principio, las vulnerabilidades. Los intrusos exploran formas de utilizar irregularmente el software y que no hayan sido previstas por los programadores.<\/p>\n<p>No obstante, a medida que los intrusos investigan, los desarrolladores van implementando medidas de seguridad nuevas para paliar las vulnerabilidades encontradas.<\/p>\n<h2>Fuerza Bruta<\/h2>\n<p>Consiste en probar todas las combinaciones posibles de contraseñas o palabras de paso para acceder a un determinado servicio.<\/p>\n<h2>Ataques de Diccionario<\/h2>\n<p>Consiste en suponer que el comportamiento de un usuario a la hora de elegir una contraseña es predecible, y probar una lista más o menos larga de contraseñas comunes.<\/p>\n<h2>Ataque Fuzzy<\/h2>\n<p>Se intentan probar los patrones más habituales para conseguir información. Por ejemplo, es común que muchas URL incluyan una terminación <code>/admin<\/code> para acceder al backed, o incluyan el código fuente en el directorio <code>.git<\/code>.<\/p>\n<h2>Hijacking<\/h2>\n<p>Consiste en desviar una comunicación en marcha hacia un tercero, un man in the middle, que dejaría de estar en medio para pasar a ser receptor final.Por ejemplo es bastante frecuente el secuestro de sesión, interceptando la cookie que lleva la información de la sesión de un tercero.<\/p>\n<h2>DoS y DDoS ([Distributed] Denial of Service)<\/h2>\n<p>Consiste en enviar muchas peticiones falsas a un servicio, logrando que se colapse y deje de servir a las peticiones legítimas. <\/p>\n<p>El flooding (inundación) es una técnica concreta para logar un DoS, inundando de peticiones las redes. Normalmente se intenta provocar un colapso en la red, más que en un servicio concreto.<\/p>\n<h2>Exploit<\/h2>\n<p>Llamamos así a cualquier pieza de software que ayuda a vulnerar una medida de seguridad, seguramente aprovechando vulnerabilidades de los sistemas, un exploit debe ser ejecutado y/o distribuido manualmente.<\/p>\n<ul>\n<li>Aplicaciones que ayudan a hacer DoS.<\/li>\n<li>Aplicaciones que prueban diccionarios sobre sistemas.<\/li>\n<li>Aplicaciones que intentan descubrir la contraseña de una Wifi criptoanalizando tramas cifradas.<\/li>\n<li>El código que un intruso escribe en un formulario de una web para hacer SQL injection.<\/li>\n<li>Algún script que se sube a un servidor web para tomar el control del navegador de un usuario.<\/li>\n<\/ul>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"https://en.wikipedia.org/wiki/Metasploit\">Metasploit<\/a> es el estándar de facto en cuanto a herramientas que agrupan exploits.<\/p>\n<h2>Zero day<\/h2>\n<p>Cuando se descubre una vulnerabilidad en un sistema, se suele informar de ella al fabricante de forma que sea solucionada en las siguientes actualizaciones. Si el descubridor de esa vulnerabilidad decide no informar, y aprovechar dicha vulnerabilidad (manualmente, utilizando malware o un exploit), se dice que el ataque es un ataque de día cero.<\/p><h1>La Cultura de la Intrusión<\/h1>\n<p>La “cultura hacker” o “movimiento hacker”, entre ellas se encuentran todo tipo de personas y resulta difícil establecer clasificaciones.<\/p>\n<p>En general, se necesita mucha destreza y conocimientos técnicos de un montón de vulnerabilidades, pero desde el punto de vista de la Seguridad Informática, tanta amenaza representa alguien diestro como alguien inexperto.<\/p>\n<p>El logo del movimiento hacker es el de la ilustración, corresponde a una determinada posición de fichas “the glider” en un juego propuesto por el matemático John Horton Conway llamado “Juego de la vida”.<\/p>\n<svg viewBox=\"0 0 30 30\" width=\"120\" role=\"img\" aria-label=\"Glider\"><rect width=\"30\" height=\"30\" rx=\"3\" fill=\"#fff\" stroke=\"#999\"/><rect x=\"11\" y=\"1\" width=\"8\" height=\"8\" fill=\"#111\"/><rect x=\"21\" y=\"11\" width=\"8\" height=\"8\" fill=\"#111\"/><rect x=\"1\" y=\"21\" width=\"8\" height=\"8\" fill=\"#111\"/><rect x=\"11\" y=\"21\" width=\"8\" height=\"8\" fill=\"#111\"/><rect x=\"21\" y=\"21\" width=\"8\" height=\"8\" fill=\"#111\"/><\/svg>\n<h2>Terminología<\/h2>\n<ul>\n<li>Black Hat: Por un lado muchos de los autodenominados hackers intentan intrusiones no autorizadas a través de redes, con el objeto de vulnerar alguna de las propiedades seguras, en muchas ocasiones. A menudo se les llama crackers, aunque también se conoce con ese nombre a los que se saltan sistemas de seguridad del software.<\/li>\n<li>White Hat: Por otro lado, algunos hackers proclaman que sus intenciones no son vulnerar las propiedades seguras, sino descubrir vulnerabilidades, e informar a los propietarios de los sistemas de éstas.<\/li>\n<li>Script-kiddie: Se creó para denominar a los que simplemente ejecutan sin saber el que.<\/li>\n<\/ul>", "m": "<h1>Malware<\/h1>\n<p>Código con intención maliciosa u oculta que intenta deliberadamente vulnerar cualquiera de las tres propiedades sin el consentimiento de su propietario, el software es considerado malware en base a las intenciones del autor a la hora de crearlo, sus obejtivos son propagarse y realizar alguna fechoría.<\/p>\n<h2>Clasificación por Propagación<\/h2>\n<p>Según la forma de propagarse, denominamos al malware como virus, gusano o troyano.<\/p>\n<h3>Virus<\/h3>\n<p>Los virus entran en un ordenador mediante la ejecución de un archivo, son fragmentos de código no programas completos, modifica otros programas ejecutables (.exe, .dll...) para inyectarse en ellos de manera invisible para ejecutarse con ellos si ser vistos.<\/p>\n<p>También es código ejecutable los sectores de arranque y algunas partes del sistema operativo, como los drivers. Hay otros tipos de ficheros, que no son directamente ejecutables por el S.O., pero se interpretan por algunos programas: macros del Office, ficheros por lotes (BAT, SH), que también podrían ser infectados.<\/p>\n<p>Los virus ya no son tan populares, ya que los ficheros EXE y DLL de Windows pueden estar firmados criptográficamente.<\/p>\n<h3>Gusanos<\/h3>\n<p>Un gusano tiene la propiedad de duplicarse a sí mismo pero no altera ficheros ejecutables ni otros códigos, utiliza las vulnerabilidades del S.O. como vía de duplicación. Reside en memoria e intenta propagarse a través de servicios de red, y dispositivos de memoria secundaria. No suele requerir intervención del usuario.<\/p>\n<p>Por ejemplo, son bastante comunes los gusanos de pendrive. Intentan propagarse a través de los pendrives que insertamos en una y otra máquina. El gusano se copia en el pendrive, y luego debe utilizar alguna vulnerabilidad para lograr ser ejecutado: en el caso de los pendrives, alterando el fichero autorun.inf, y esperando que alguna máquina Windows lo ejecute automáticamente. En un ordenador Linux, podría crear un servicio de systemd, o modificar un fichero cron.<\/p>\n<p>En resumen, los puntos clave para identificar a un gusano:<\/p>\n<ol>\n<li>Se duplica entero, normalmente como un fichero individual<\/li>\n<li>Debe aprovechar alguna vulnerabilidad en la máquina de destino para lograr ser ejecutado allí.<\/li>\n<\/ol>\n<h3>Troyano<\/h3>\n<p>Se presenta al usuario como un programa aparentemente legítimo e inofensivo pero al ejecutarlo ocasiona alguna acción encubierta, o inicia algún otro tipo de propagación. El término troyano proviene de la historia del caballo de Troya mencionado en la Odisea de Homero.<\/p>\n<h2>Payload<\/h2>\n<p>Los posibles payloads de los malwares son variadísimos, algunos términos que se utilizan comunmente para designarlos se verán a continuación, la carga de un determinado malware puede caer en más de una de éstas categorías.<\/p>\n<h3>Spyware<\/h3>\n<p>Recopila información sobre las actividades realizadas en un ordenador. La función más común que tienen estos programas es la de recopilar información sobre el usuario y distribuirlo a empresas publicitarias u otras organizaciones interesadas, aunque consideramos spyware al software que espía cualquier cosa.<\/p>\n<h3>Adware<\/h3>\n<p>Intenta propagar publicidad no deseada, por canales no legítimos.<\/p>\n<h3>Crimeware<\/h3>\n<p>Ayuda a realizar actividades que enriquezcan a quien controla el software de manera ilícita.<\/p>\n<p>Un ejemplo podría ser una BotNet, un conjunto de ordenadores infectados por un determinado Spybot se denomina una BotNet, o red zombi. Una red zombi representa una amenaza en sí misma, dado que es una fuerza bruta disponible para una finalidad , desconocida al servicio del intruso que la controla y relacionada con su identidad.<\/p>\n<h3>Ransomware<\/h3>\n<p>El malware secuestra la información del ordenador, generalmente encriptando los ficheros del disco duro. Después, envía la contraseña que ha usado para el cifrado a algún servidor de Internet y muestra un mensaje pidiendo dinero para recuperar dicha contraseña.<\/p>\n<p>Los pagos exigidos suelen ser en Bitcoin u otra moneda virtual, para intentar ocultar su rastro. Además, los pagos suelen ser negociables.<\/p>\n<p>En ocasiones, la clave de cifrado puede recuperarse del ordenador infectado. Los fabricantes de antivirus tienen varias herramientas para recuperar los datos de un ordenador infectado.<\/p>\n<h3>Keyloggers<\/h3>\n<p>Registran pulsaciones de teclas, para posteriormente transmitirlas a algún otro lugar, permiten espiar documentación que se teclea, datos confidenciales, etc.<\/p>\n<p>Si se tiene acceso físico a una máquina también existen los keyloggers hardware, algunos con memoria flash, otros con red, pueden ser muy difíciles de detectar.<\/p>\n<h3>Screenloggers<\/h3>\n<p>Evolución de los anteriores, capturan la pantalla entera, o trozos de pantalla, para posteriormente transmitirlas a algún otro lugar.<\/p>\n<p>Dado que una captura de pantalla consta de muchos más bytes que una pulsación de teclado, no están constantemente capturando. <\/p>\n<p>También existen en formato físico.<\/p>\n<h3>Mineros<\/h3>\n<p>La carga intenta utilizar la potencia del ordenador infectado para minar alguna determinada criptomoneda, a favor del intruso que ha programado el malware. Las criptomonedas se obtienen realizando muchas operaciones matemáticas, con lo que hace falta potencia de cálculo, que es bastante cara.<\/p>\n<h3>Rootkits<\/h3>\n<p>Permite un acceso de privilegio continuo a un ordenador pero mantiene su presencia activamente oculta al control de los administradores y del propio sistema al corromper el funcionamiento normal del sistema operativo o de otras aplicaciones.<\/p>\n<p>En otras palabras, usualmente se lo asocia con que se esconde a sí mismo y a otros programas, procesos, archivos, directorios, claves de registro, y puertos.<\/p>\n<p>Últimamente es difícil que infecten un ordenador, siempre que tenga activado el secure boot.<\/p>\n<h3>BOTs y RATs (roBOTs y Remote Administration Tools)<\/h3>\n<p>Un RAT es un software que permite administrar remotamente un ordenador, pero si se usa de carga de un malware, un intruso puede entonces realizar gran cantidad de tareas sobre el ordenador infectado.<\/p>\n<p>No obstante, los RATs han evolucionado en BOTs, que son capaces, además, de ejecutar scripts de instrucciones.<\/p>\n<p>Cuando un BOT infecta un ordenador y o periódicamente, se intenta conectar a una dirección que tiene programada, en la que tiene un script con instrucciones.<\/p>\n<p>Los más antiguos o rudimentarios de los RAT se quedan escuchando en un puerto, esperando a que se conecte el intruso, lo cual evita el NAT/PAT del router. Los RAT más modernos son activos y utilizan la técnica de la llamada a casa, el intruso utiliza una dirección IP dinámica.<\/p><h1>Cyber Kill Chain<\/h1>\n<p>Los ataques pueden ser:<\/p>\n<ul>\n<li>No dirigidos: Por ejemplo, campañas masivas de SPAM, sin importar demasiado a quién.<\/li>\n<li>Dirigidos: Los hackers tienen un objetivo concreto, como una empresa, un centro de datos o una persona.<\/li>\n<\/ul>\n<p>En el segundo caso, el ataque se profesionaliza, se planifica en una serie de fases, cada una con sus ténicas y herramientas diferenciadas.<\/p>\n<div class=\"sc\"><svg viewBox=\"0 0 1000 80\" style=\"min-width:760px\" role=\"img\" aria-label=\"Cyber Kill Chain\"><g><rect x=\"0\" y=\"10\" width=\"134\" height=\"60\" rx=\"8\" fill=\"#fbe9e7\" stroke=\"#b3261e\"/><text x=\"67\" y=\"45\" text-anchor=\"middle\" font-size=\"13\" fill=\"#241a19\">1. Reconocimiento<\/text><\/g><g><rect x=\"143\" y=\"10\" width=\"134\" height=\"60\" rx=\"8\" fill=\"#fbe9e7\" stroke=\"#b3261e\"/><text x=\"210\" y=\"45\" text-anchor=\"middle\" font-size=\"13\" fill=\"#241a19\">2. Armamento<\/text><\/g><g><rect x=\"286\" y=\"10\" width=\"134\" height=\"60\" rx=\"8\" fill=\"#fbe9e7\" stroke=\"#b3261e\"/><text x=\"353\" y=\"45\" text-anchor=\"middle\" font-size=\"13\" fill=\"#241a19\">3. Entrega<\/text><\/g><g><rect x=\"429\" y=\"10\" width=\"134\" height=\"60\" rx=\"8\" fill=\"#fbe9e7\" stroke=\"#b3261e\"/><text x=\"496\" y=\"45\" text-anchor=\"middle\" font-size=\"13\" fill=\"#241a19\">4. Explotación<\/text><\/g><g><rect x=\"572\" y=\"10\" width=\"134\" height=\"60\" rx=\"8\" fill=\"#fbe9e7\" stroke=\"#b3261e\"/><text x=\"639\" y=\"45\" text-anchor=\"middle\" font-size=\"13\" fill=\"#241a19\">5. Instalación<\/text><\/g><g><rect x=\"715\" y=\"10\" width=\"134\" height=\"60\" rx=\"8\" fill=\"#fbe9e7\" stroke=\"#b3261e\"/><text x=\"782\" y=\"45\" text-anchor=\"middle\" font-size=\"13\" fill=\"#241a19\">6. C2 con<\/text><\/g><g><rect x=\"858\" y=\"10\" width=\"134\" height=\"60\" rx=\"8\" fill=\"#fbe9e7\" stroke=\"#b3261e\"/><text x=\"925\" y=\"45\" text-anchor=\"middle\" font-size=\"13\" fill=\"#241a19\">7. Acciones so<\/text><\/g><\/svg><\/div><p class=\"tag\">Esquema redibujado (la imagen original es externa y no carga aquí): las siete fases de la Intrusion Kill Chain.<\/p>", "p": "<h1>Prevención<\/h1>\n<p>Las medidas de seguridad activas contra el fraude, intrusiones y amenazas es muy variada, y depende del momento, pero a rasgos generales, hay tres puntos de especial incidencia<\/p>\n<h2>Educación del Usuario<\/h2>\n<ul>\n<li>Instalar software legítimo, y sólo si realmente se necesita, y, en ese caso, estar pendiente de mantenerlo actualizado para evitar la explotación de vulnerabilidades.<\/li>\n<li>Cualquier cosa que venga por correo electrónico u otros medios de mensajería digital, y de la que se pueda sospechar, probablemente sea falsa y su enlace también.<\/li>\n<li>Informar al usuario de que los servicios en los que esté registrado nunca le van a pedir sus contraseñas por correo.<\/li>\n<li>Escoger contraseñas de longitud y complejidad adecuadas, mantenerlas en secreto y cambiarlas con frecuencia. En la medida de lo posible, mantener contraseñas diferentes para servicios diferentes, especialmente para aquellos más sensibles.<ul>\n<li>Promover <a target=\"_blank\" rel=\"noopener\" href=\"https://keepassxc.org/\">gestores de contraseñas<\/a> y <a target=\"_blank\" rel=\"noopener\" href=\"https://en.wikipedia.org/wiki/Time-based_one-time_password\">TOTP<\/a>.<\/li>\n<\/ul>\n<\/li>\n<li>Intentar no acceder a sistemas sensibles desde máquinas o redes desconocidas:<ul>\n<li>Hotspots.<\/li>\n<li>Ordenadores de uso público, como bibliotecas.<\/li>\n<\/ul>\n<\/li>\n<li>Utilizar el antivirus instalado para escanear pendrives y discos extraíbles.<\/li>\n<li>Informar al administrador cuanto antes de cualquier sospecha.<\/li>\n<li>Utilizar privilegios de usuario para el trabajo diario. Los privilegios de administración deben dejarse sólo para tareas de administración.<\/li>\n<\/ul>\n<h2>El técnico Informático<\/h2>\n<ul>\n<li>Los usuarios que trabajen con una máquina deben tener el menor nivel de permisos con que se les permita trabajar.<\/li>\n<li>Los permisos se basarán en una whitelist, no en una blacklist.<\/li>\n<li>Los datos, documentos, etc., que se elaboren deben ir a una carpeta de red en un servidor desatendido, o a través de cualquier otro medio de sincronización de información.<\/li>\n<li>Debe programarse una copia de seguridad, para que en caso de un ataque activo con pérdida de integridad pueda restaurarse a un estado anterior<\/li>\n<li>Debe cambiarse el orden de los dispositivos de arranque, para colocar en primer lugar el disco duro principal.<\/li>\n<li>Secure Boot dificulta la instalación de rootkits.<\/li>\n<li>Revisar las políticas de seguridad del sistema operativo, por ejemplo, Autoplay de Windows, o el equivalente en otros sistemas operativos.<\/li>\n<li>Debe mantenerse un antivirus y asegurarse de que se mantiene totalmente actualizado.<\/li>\n<li>Periódicamente es necesario programar un escaneo de malware previo al arranque del sistema operativo, para detectar rootkits.<\/li>\n<li>Cuando se produzcan cambios en los usuarios (rotación de personal) deben desactivarse cuanto antes los usuarios que ya no se usarán.<\/li>\n<li>Debe prestarse atención a la configuración de la red local, y de los enrutadores. Para evitar la llamada a casa puede utilizarse configuraciones de red seguras, en el nivel de red y aplicación, mediante la combinación de un firewall y un proxy.<\/li>\n<\/ul>\n<h2>El Antivirus<\/h2>\n<ul>\n<li>Hoy en día es imprescindible que todos los ordenadores conectados tenga uno.<\/li>\n<li>Un antivirus funciona buscando estadísticamente trazas de malware conocido en memoria secundaria, principal y comunicaciones. Para ello, disponen de una base de datos de indicadores de malware, que debe estar actualizada. Son indicadores numéricos… “huellas” heurísticas que pueden indicar la presencia de un determinado malware.<\/li>\n<li>Tienen varias formas de actuar:<ul>\n<li>Al vuelo: buscan malware mientras se ejecutan programas (pasan de memoria secundaria a principal), cuando se inserta<\/li>\n<li>A propósito: buscan malware por indicación del usuario en memoria secundaria<\/li>\n<li>Durante el arranque: cuando todavía no está cargado el sistema operativo, buscando rootkits en el sistema de ficheros.<\/li>\n<\/ul>\n<\/li>\n<\/ul><h1>Conclusión<\/h1>\n<p>Es importante saber que los fraudes e intrusiones existen, y que tarde o temprano seremos un objetivo. La participación de un antivirus es casi imprescindible, pero, en un ámbito empresarial puede ser conveniente prestar también atención a la configuración de red, y a evitar que los usuarios trabajen en los sistemas operativos con privilegios de administración.<\/p>\n<p>La configuración basada en estaciones de trabajo y servidores garantiza un mayor control sobre la información. No obstante, el punto clave siempre es la educación de los usuarios, para que las acciones del día a día se realicen desde una perspectiva segura, lo que suele repercutir en mayor tranquilidad, tanto para usuarios de la empresa, como para los técnicos.<\/p>\n<h2>Instituto Nacional de Ciberseguridad<\/h2>\n<p>El <a target=\"_blank\" rel=\"noopener\" href=\"https://incibe.es\">Instituto Nacional de Ciberseguridad (INCIBE)<\/a>, dependiente del Ministerio de industria, energía y turismo. Es una buena fuente de información para la formación y concienciación en seguridad informática.<\/p>"};
const $=s=>document.querySelector(s),sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
let S={done:{},known:{},wrong:{},best:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem('seg_ex2')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('seg_ex2',JSON.stringify(S))}catch(e){}};
let V='th',TP='all',FP=false,FI=0,FL=false,tm=null;
const tops=()=>T.filter(t=>TP==='all'||t.id===TP);
const VS=[['th','Resumen'],['ff','Full Flav'],['fc','Flashcards'],['ts','Test'],['ex','Examen'],['dv','Desarrollo'],['rv','Repaso'],['gl','Glosario'],['ch','Chuleta']];
function prog(){let n=T.length,k=T.filter(t=>S.done[t.id]).length;T.forEach(t=>{n+=t.c.length;t.c.forEach((_,j)=>{if(S.known[t.id+'c'+j]===1)k++})});const p=Math.round(100*k/n);$('#pg').style.width=p+'%';$('#pt').textContent=p+' % completado · '+Object.keys(S.wrong).length+' preguntas por repasar'}
function nav(){$('#nv').innerHTML=VS.map(v=>`<button class="${V===v[0]?'on':''}" onclick="V='${v[0]}';clearInterval(tm);R()">${v[1]}</button>`).join('');$('#tp').innerHTML=[['all','Todos']].concat(T.map(t=>[t.id,t.n])).map(t=>`<button class="${TP===t[0]?'on':''}" onclick="TP='${t[0]}';FI=0;FL=false;clearInterval(tm);R()">${t[1]}</button>`).join('');prog()}
function R(){nav();const m=$('#m');m.innerHTML='';m.classList.toggle('wide',V==='ff');({th,fc,ts,ex,dv,rv,gl,ch,ff})[V](m);window.scrollTo(0,0)}
function th(m){tops().forEach(t=>{m.insertAdjacentHTML('beforeend',`<h2>${t.n}</h2>`+t.th.map(s=>`<details><summary>${s[0]}</summary><div>${s[1]}</div></details>`).join('')+`<button onclick="S.done['${t.id}']=!S.done['${t.id}'];save();R()">${S.done[t.id]?'✓ Tema completado (quitar)':'Marcar tema como completado'}</button>`)});ces();va()}
function ces(){const a=$('#cs');if(!a)return;const n=+$('#cn').value||0;$('#co').textContent=a.value.replace(/[a-zñ]/gi,c=>{const A='abcdefghijklmnñopqrstuvwxyz';const i=A.indexOf(c.toLowerCase());return i<0?c:A[(i+n)%A.length]})}
function va(){const w=$('#w');if(!w)return;$('#vo').textContent=Math.ceil(w.value/0.7);$('#vo2').textContent=Math.round($('#am').value*230)}
function cards(){return tops().flatMap(t=>t.c.map((c,j)=>({k:t.id+'c'+j,t:t.n,q:c[0],a:c[1]}))).filter(c=>!FP||S.known[c.k]!==1)}
function fc(m){const L=cards();if(FI>=L.length)FI=0;m.innerHTML=`<label><input type="checkbox" ${FP?'checked':''} onchange="FP=this.checked;FI=0;R()"> Solo pendientes</label>`;if(!L.length){m.innerHTML+='<div class="card">🎉 ¡Todas dominadas!</div>';return}const c=L[FI];m.innerHTML+=`<p class="tag">${FI+1}/${L.length} · ${c.t}</p><div class="card fc ${FL?'back':''}" tabindex="0" role="button" onclick="FL=!FL;R()" onkeydown="if(event.key==' '||event.key=='Enter'){event.preventDefault();FL=!FL;R()}">${FL?c.a:'<b>'+c.q+'</b>'}</div><div class="row"><button onclick="mk('${c.k}',1)">✓ La sabía</button><button onclick="mk('${c.k}',0)">↻ Repasar</button></div><p class="tag">Pulsa la tarjeta (o Enter) para voltearla.</p>`}
function mk(k,v){S.known[k]=v;save();FI++;FL=false;R()}
function qs(){return tops().flatMap(t=>t.q.map((q,j)=>({k:t.id+j,t:t.n,q})))}
function ts(m){m.innerHTML=`<div class="card"><p>${qs().length} preguntas, con feedback inmediato.</p><button class="on" onclick="quiz(sh(qs()),true)">Empezar test</button></div>`}
function ex(m){m.innerHTML=`<div class="card"><p>Examen aleatorio de los temas seleccionados arriba. Sin feedback hasta el final.</p><label>Nº de preguntas: <input type="number" id="en" value="15" min="3" max="40" style="width:80px"></label> <label><input type="checkbox" id="ec" checked> Cronómetro</label><p><button class="on" onclick="quiz(sh(qs()).slice(0,+$('#en').value||15),false,$('#ec').checked)">Empezar examen</button></p></div>`}
function quiz(L,fb,clock){const m=$('#m');let i=0,res=[],t0=Date.now();clearInterval(tm);
function head(){return `<p class="tag">Pregunta ${i+1}/${L.length}${clock?' · ⏱ <span id="tc"></span>':''}</p>`}
if(clock)tm=setInterval(()=>{const e=$('#tc');if(e){const s=Math.floor((Date.now()-t0)/1000);e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}},500);
function rec(it,ok){res.push({it,ok});if(!ok)S.wrong[it.k]=2;else if(S.wrong[it.k]&&!--S.wrong[it.k])delete S.wrong[it.k];save();prog()}
function nxt(){i++;i<L.length?show():end()}

m.innerHTML=head()+`<div class="card"><b>${q[0]}</b>`+q[1].map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join('')+'<div id="fb"></div></div>';
m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const j=+b.dataset.j,ok=j===q[2];rec(it,ok);if(!fb)return nxt();m.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.j===q[2])x.classList.add('ok')});if(!ok)b.classList.add('ko');$('#fb').innerHTML=`<div class="fb ${ok?'ok':'ko'}"><b>${ok?'¡Correcto!':'Incorrecto.'}</b> ${q[3]}</div><p><button class="on" id="nx">Siguiente →</button></p>`;$('#nx').onclick=nxt;$('#nx').focus()})}
function ord(it){const q=it.q,pool=sh(q[1]),ch=[];function d(){m.innerHTML=head()+`<div class="card"><b>${q[0]}</b><p class="tag">Pulsa los pasos en el orden correcto.</p><ol>${ch.map(x=>`<li>${x}</li>`).join('')}</ol>`+pool.filter(x=>!ch.includes(x)).map(x=>`<button class="opt" data-v="${x}">${x}</button>`).join('')+'<div id="fb"></div></div>';m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ch.push(b.dataset.v);if(ch.length<pool.length)return d();const ok=ch.join('|')===q[1].join('|');rec(it,ok);if(!fb)return nxt();d();m.querySelectorAll('.opt').forEach(x=>x.disabled=true);$('#fb').innerHTML=`<div class="fb ${ok?'ok':'ko'}"><b>${ok?'¡Correcto!':'Orden incorrecto.'}</b> Orden: ${q[1].join(' → ')}. ${q[3]}</div><p><button class="on" id="nx">Siguiente →</button></p>`;$('#nx').onclick=nxt})}d()}
function end(){clearInterval(tm);const ok=res.filter(r=>r.ok).length,by={};res.forEach(r=>{by[r.it.t]=by[r.it.t]||[0,0];by[r.it.t][1]++;if(r.ok)by[r.it.t][0]++});const n=(10*ok/res.length).toFixed(1);
m.innerHTML=`<div class="card"><div class="big">${n} / 10</div><p>${ok} de ${res.length} aciertos${clock?' · '+Math.round((Date.now()-t0)/1000)+' s':''}.</p><table><tr><th>Tema</th><th>Aciertos</th></tr>${Object.entries(by).map(([k,v])=>`<tr><td>${k}</td><td>${v[0]}/${v[1]}</td></tr>`).join('')}</table></div>`+(res.some(r=>!r.ok)?'<h3>Para repasar</h3>'+res.filter(r=>!r.ok).map(r=>`<div class="card"><b>${r.it.q[0]}</b><p>${r.it.q[2]==='o'?r.it.q[1].join(' → '):'✓ '+r.it.q[1][r.it.q[2]]}</p><p class="tag">${r.it.q[3]}</p></div>`).join(''):'<p>🎉 Sin fallos.</p>');}
show()}
function dv(m){m.innerHTML='<p>La mitad del examen es de desarrollo: escribe tu respuesta y contrasta con los puntos clave.</p>';D.filter(d=>TP==='all'||d[0]===TP).forEach((d,i)=>{m.insertAdjacentHTML('beforeend',`<details><summary>${d[1]}</summary><div><textarea rows="5" placeholder="Escribe aquí tu respuesta…"></textarea><p><b>Puntos clave</b> (marca los que has cubierto):</p>${d[2].map(p=>`<label style="display:block"><input type="checkbox" onchange="dc(this)"> ${p}</label>`).join('')}<p class="tag dr"></p></div></details>`)})}
function dc(e){const d=e.closest('div'),c=d.querySelectorAll('input:checked').length,n=d.querySelectorAll('input').length;d.querySelector('.dr').textContent=`Cubiertos ${c}/${n}`+(c<n?' · repasa los que faltan':' · ¡completo!')}
function rv(m){const w=qs().filter(x=>S.wrong[x.k]),pc=T.flatMap(t=>t.c.map((c,j)=>({k:t.id+'c'+j,q:c[0],a:c[1]}))).filter(c=>S.known[c.k]===0);
m.innerHTML=`<h3>Preguntas falladas (${w.length})</h3>`+(w.length?`<button class="on" onclick="quiz(sh(qs().filter(x=>S.wrong[x.k])),true)">Practicar fallos</button>`+w.map(x=>`<div class="card">${x.q[0]}<p class="tag">${x.t}</p></div>`).join(''):'<p>Ninguna. Se eliminan al acertarlas dos veces.</p>')+`<h3>Flashcards por repasar (${pc.length})</h3>`+pc.map(c=>`<details><summary>${c.q}</summary><div>${c.a}</div></details>`).join('')}
function gl(m){m.innerHTML='<input type="search" id="gq" placeholder="Buscar término…" aria-label="Buscar en el glosario"><div id="gr"></div>';const f=()=>{const q=$('#gq').value.toLowerCase();$('#gr').innerHTML=T.flatMap(t=>t.c.map(c=>[t.n,c[0],c[1]])).filter(c=>(c[1]+c[2]).toLowerCase().includes(q)).map(c=>`<div class="card"><b>${c[1]}</b> <span class="tag">${c[0]}</span><br>${c[2]}</div>`).join('')};$('#gq').oninput=f;f()}
function ff(m){m.insertAdjacentHTML('beforeend','<p class="tag">Texto íntegro de los apuntes de mi queridísimo FLAVIUS (los .md), sin resumir.</p>');tops().forEach(t=>m.insertAdjacentHTML('beforeend',`<h2>${t.n}</h2><div class="md">${FF[t.id]}</div>`))}
function ch(m){tops().forEach(t=>m.insertAdjacentHTML('beforeend',`<div class="card"><h3>${t.n}</h3><ul>${t.s.map(x=>`<li>${x}</li>`).join('')}</ul></div>`))}
$('#th').onclick=()=>{const r=document.documentElement;const d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=d?'light':'dark'};
$('#rs').onclick=()=>{if(confirm('¿Borrar todo el progreso?')){S={done:{},known:{},wrong:{},best:{}};save();R()}};
R();
</script></body></html>
