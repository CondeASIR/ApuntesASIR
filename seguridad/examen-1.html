const FF={"p": "<h1>Autenticación<\/h1>\n<p>La confidencialidad es la propiedad que índica que quien ve algo, debería poder verlo. Para poder cumplir esto se debe autenticar al usuario, no confundir con identificar, la primera implica una demostración.<\/p>\n<ul>\n<li>Variantes\n<ul>\n<li>Información que solo conoce el usuario<\/li>\n<li>Objeto que solo posee el usuario<\/li>\n<li>Biometría<br />\nEl saber o tener algo solo indica que el usuario posee la credencial, al contrarioque la biometría que puede autenticar que alguien es quien dice, todo esto teniendo en cuenta que las dos primeras en el fondo son bits y participan en la criptografía y esta última no.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h1>Criptografía<\/h1>\n<p>La criptografía proviene de las antiguas palabras griegas <em>kryptós<\/em>, que significa &quot;oculto&quot;, y <em>graphein<\/em>, que significa &quot;estudiar&quot;. Si la criptografía es la práctica y el estudio de proteger datos, el criptoanálisis es la práctica y el estudio de romper esas protecciones.<\/p>\n<p>La idea es que un usuario, utilizando alguna contraseña (“la clave”), y algún método matemático (“el algoritmo de cifrado”), transforma los bytes (“en claro”) en otros bytes (“encriptados”), que no tienen sentido. Un usuario legítimo (quizá el mismo que la encriptó o quizá otro) puede volver a restaurar la información original a partir de la cifrada (“desencriptar”), a costa de poseer la claves que lo permita y utilizando el algoritmo adecuado.<\/p>\n<h2>Utilización<\/h2>\n<ul>\n<li>Información almacenada<\/li>\n<li>Información en movimiento\n<ul>\n<li>Nivel físico / de enlace (proteger la LAN)<\/li>\n<li>Nivel de red / transporte (si atraviesa otras redes)<\/li>\n<li>Nivel de aplicación (extremo a extremo)<\/li>\n<\/ul>\n<\/li>\n<li>Desafío/respuesta: Una forma de evitar que las contraseñas que utilizamos a menudo para autenticarnos viajen de un lugar a otro, pudiendo ser interceptadas.<\/li>\n<li>Firma digital, que garantiza:\n<ul>\n<li>Integridad<\/li>\n<li>autenticación<\/li>\n<li>no repudio<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>Criptografía simétrica<\/h2>\n<ul>\n<li>Se utiliza una única clave para encriptar y desencriptar<\/li>\n<li>La clave debe haber sido comunicada previamente (de forma segura)<\/li>\n<li>El algoritmo la usa de una forma para encriptar y al contrario para deshacerlo<\/li>\n<li>El algoritmo hoy en día es público y para que sean seguros se exigen claves suficientemente grandes<\/li>\n<li>Suelen necesitar poca capacidad de cálculo<\/li>\n<li>Tienen debilidades, o se pueden atacar usando criptoanálisis, pero si el algoritmo es bueno y la clave grande puede ser complicado de adivinar.<\/li>\n<li>Hoy en día los que se utilizan son solo unos pocos<\/li>\n<\/ul>\n<h4>Cifrado del César<\/h4>\n<p>Cada letra del alfabeto se reemplaza por la que se encuentra varias posiciones más a la derecha. Es un cifrado por sustitución, y puede atacarse criptográficamente con medios muy básicos. Originalmente se desplazaban dos posiciones, y posteriormente la clave se acordaba previamente como el número de posiciones a desplazar, por ejemplo usando 3:<br />\n&quot;En el parque a las cinco se convierte&quot; en &quot;<em>Hq ho sdutx d odv flqfr<\/em>&quot;<\/p>\n<h4>Cifrado por sustitución<\/h4>\n<p>Otro cifrado proveniente del anterior en el que la el elfabeto es la propia clave<br />\n<img loading=\"lazy\" src=\"https://alvarogonzalezsotillo.github.io/apuntes-clase/seguridad-alta-disponibilidad/apuntes/1/media/cifrado-sustitucion.png\" alt=\"Cifrado por sustitución\" /><\/p>\n<h3>Algoritmos comunes<\/h3>\n<ul>\n<li>DES (Data Encryption Standard) 1976: Estándar en EEUU en 1976, 26 años después pasa a ser AES, se ha demostrado su debilidad, aún así variantes como el triple DES se siguen usando para aplicaciones de no muy alta seguridad.<\/li>\n<li>AES (Advanced Encryption Standard) 2002: Fue escogido  en una competición para reemplazar a DES, este algoritmo:\n<ul>\n<li>Es de dominio público<\/li>\n<li>Es simétrico<\/li>\n<li>Admite claves de 128, 192 y 256 bits<\/li>\n<li>Se puede implementar por software y hardware<\/li>\n<\/ul>\n<\/li>\n<li>Otros usados son:\n<ul>\n<li>Serpent<\/li>\n<li>Twofish:Evolución de Blowfish, más lento que AES<\/li>\n<li>RC6: Evolución de RC5 por una empresa privada (RSA Security)<\/li>\n<li>Recientemente: Camellia de 2000, Salsa20, Chacha20 y Rumba20 de 2008<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>Criptografía asimétrica<\/h2>\n<ul>\n<li>Se utiliza un algoritmo público y conocido por los usuarios, toda la seguridad reside en la clave.<\/li>\n<li>Dos claves por participante\n<ul>\n<li>Pública: Asociada a la identidad, se utilizará para que la otra parte cifre la información dirigida a la una.<\/li>\n<li>Privada: Un secreto que servirá para descifrar lo que le sea enviado por otros.<\/li>\n<\/ul>\n<\/li>\n<li>Es el más moderno (mitades del sigo XX)<\/li>\n<li>Se basan en operaciones o funciones de un solo sentido, una de las más significativas es por ejemplo la descomposición en factores primos.<br />\nEl proceso sigue el siguiente curso:<\/li>\n<\/ul>\n<ol>\n<li>Texto plano<\/li>\n<li>Cifrado con clave A o B<\/li>\n<li>Galimatías A o B<\/li>\n<li>Descifrado usando la clave opuesta<\/li>\n<li>Texto plano<br />\nSupongamos un número n que está compuesto por sólo dos factores primos, es decir, siendo p y q primos.<\/li>\n<\/ol>\n<div class=\"math\">n = p × q<\/div>\n<p>Si sabemos p y q es facil saber el valor de n: basta multiplicar.<\/p>\n<p>Sin embargo, si sólo sabemos el valor de n, para hallar p o q es necesario aplicar fuerza bruta, probando a dividir por todos los factores primos, esto es computacionalmente muy costoso y lento.<\/p>\n<p>Si p y q tuvieran unos pocos cientos de cifras, obtenerlos podría llevar años, utilizando ordenadores muy potentes, en el algoritmo RSA, el más utilizado de los asimétricos, la clave pública<br />\ncontiene el número n mientras que la privada contiene p y q por separado.<\/p>\n<ul>\n<li>Se utilizan tmabién para la firma digital, se firma algo usando la clave privada (otorgandole autenticación, integridad y no repudio) y se comprueba usando la clave pública.<\/li>\n<li>Hoy en día son muy seguros<\/li>\n<li>Son bastante costosos computacionalmente: consumen recursos de tiempo de CPU y de espacio en memoria.<\/li>\n<\/ul>\n<h3>Algoritmos comunes<\/h3>\n<ul>\n<li>RSA (Rivest-Shamir-Adleman) 1977: El más usado, respaladado por RSA Security que mantiene su patente.<\/li>\n<li>Diffie-Hellman 1976 <a href=\"https://www.rfc-editor.org/rfc/rfc7919.html\">RFC 7919<\/a>.<\/li>\n<li>ElGamal 1984 Similar al anterior pero con medios algo más modernos, este es libre de regalías, lo que permite su uso público y modificación (usado en GnuPG para la implementación del <a href=\"https://www.rfc-editor.org/rfc/rfc4880.txt\">RFC4880<\/a> y por PGP recientemente)<\/li>\n<li>ECC 1985: riptografía de curvas elípticas, ujeto a patentes, derivado de la criptografía asimétrica, usa claves más cortas y algoritmos más rápidos.<\/li>\n<\/ul>\n<h3>El desafío / respuesta criptográfico<\/h3>\n<p>Busca que las contraseñas no viajen, se usa, por ejemplo entre un Windows cliente y el servidor de dominio.<br />\nImaginando al servidor como A y al cliente como B:<\/p>\n<ol>\n<li>A genera un mensaje aleatorio que B cifra simétricamente usando la clave.<\/li>\n<li>El mensaje se envía a A.<\/li>\n<li>A prueba a descifrar el mensaje.<\/li>\n<li>Si se descifra, B conocía la clave.<\/li>\n<\/ol>\n<h2>Criptografía híbrida<\/h2>\n<p>Se usa un algoritmo asimétrico para intercambiar la clave simétrica con la que se continua la comunicación, esto crea un canal seguro para el intercambio inicial y elimina el coste computacional desmensurado posterior.<br />\nEsto se usa, por ejemplo, para el protocolo <span class=\"wl\">HTTPS<\/span>:<br />\n<img loading=\"lazy\" src=\"https://alvarogonzalezsotillo.github.io/apuntes-clase/seguridad-alta-disponibilidad/apuntes/1/media/criptografia-hibrida.svg\" alt=\"HTTPS\" /><\/p>\n<h2>Algoritmos de resumen criptográficos<\/h2>\n<p>Son algoritmos que se aplican a un conjunto de datos y tienen como propósito principal detectar cambios accidentales o deliberados en una secuencia de datos para proteger su integridad, verificando que no haya discrepancias.<\/p>\n<p>La idea es transmitir los datos junto a su resumen, recalcular este y si no coinciden, rechazar los datos o solicitar una retransmisión de ellos, en esto, además de la criptografía asimétrica se bassa la firma digital. Son una especie de evolución de otros algoritms de comprobación como puede ser el CRC, salvo que el caso de uso cambia de fallos físicos a manipulación deliberada.<\/p>\n<p>Los más conocidos son:<\/p>\n<ul>\n<li>MD5 (Message Digest version 5) 128 bits: El resumen consiste de 32 bytes, regularmente hexadecimales.<\/li>\n<li>Los SHA (Secure Hash Algorithm): Familia de algoritmos relacionados con el gobierno de EEUU.<\/li>\n<\/ul>\n<h1>Firma digital<\/h1>\n<p>Como hemos mencionado antes esta asegura integridadd, autenticación y no repudio<\/p>\n<h2>El mecanismo<\/h2>\n<ol>\n<li>La información a firmar se resume con un algoritmo de resumen.<\/li>\n<li>El resumen se cifra utilizando la clave privada.<\/li>\n<li>Se envían el texto en claro y la firma.<\/li>\n<li>Utilizando la clave pública se puede comprobar la firma.<\/li>\n<\/ol>\n<h1>Aplicaciones<\/h1>\n<h2>Información almacenada<\/h2>\n<h3>EFS (Encrypted File System)<\/h3>\n<p>Windows cifrará el contenido del objeto seleccionado con una clave que genera a partir de la contraseña del usuario, de tal modo que ante una sustracción física del almacenamiento, no sea posible acceder a los datos. También es posible hacerlo, con mucha más flexibilidad utilizando el comando cipher.<br />\nEFS soporta:<\/p>\n<ul>\n<li>AES (simétrico) con claves de 256 bits<\/li>\n<li>RSA (el más popular de los asimétricos) con claves de hasta 16384 bits<\/li>\n<li>ECC (otro algoritmo asimétrico) con claves de hasta 512 bits<br />\nSi no se indica lo contrario, windows 7 utiliza un algoritmo simétrico, con una clave auto-generada., para utilizar los otros algoritmos, es necesario disponer de un certificado (en el formato x509). El cifrado de EFS se gestiona a través de las políticas de seguridad de Windows.<\/li>\n<\/ul>\n<h3>Bitlocker<\/h3>\n<p>Bitlocker se puede aplicar tanto a volúmenes fijos como a dispositivos extraíbles, estos estarán protegidos mediante una clave, a su vez protegida por una contraseña, cada vez que se inicia el sistema y se quiere utilizar la unidad cifrada es necesario montarla, proporcionando la contraseña.<\/p>\n<p>Por defecto, utiliza un algoritmo AES, aunque si se dispone de un certificado x509 con una clave asimétrica puede utilizarse el algoritmo RSA o ECC, seleccionándolo en las políticas de seguridad de Windows. Bitlocker también admite claves guardadas en tarjetas criptográficas SmartCard (como el DNIe,por ejemplo).<\/p>\n<p>Para los dispositivos extraíbles (pendrives, HDDs y SDDs…) windows incluye en la propia unidad un pequeño programa sin cifrar: Bitlocker On The Go, de tal manera que si se inserta el dispositivo en un sistema compatible, pero sin Bitlocker, se ejecuta ese pequeño programa que permite leer el contenido de la unidad, aunque no escribir en ella.<\/p>\n<h3>Comprimidos encriptados<\/h3>\n<p>Estos algoritmos obtienen una clave a partir de una contraseña suministrada por el usuario en el momento de cifrar, que debe ser también proporcionada al descifrar, por ejemplo los .tar.xz o .tar.gz.<\/p>\n<h3>Copias de seguridad encriptadas<\/h3>\n<p>Todos los sistemas de copia de seguridad permiten que la copia tenga algún tipo de encriptación, por ejemplo Cobian Backup.<\/p>\n<h2>Información en movimiento (red)<\/h2>\n<h3>Wifi (<a href=\"https://ieee802.org/11/\">IEEE802.11<\/a>)<\/h3>\n<p>Es una tecnología para la comunicación de tramas Ethernet a través de conexiones inalámbricas. En su nivel físico y de enlace, admite varios tipos de cifrado:<\/p>\n<ul>\n<li>WEP (Wired Equivalent Privacy)\n<ul>\n<li>Se basa en un cifrado RC4 con claves de 64 o 128 bits. La autenticación de los clientes en el punto de acceso se realiza conociendo esa clave, que se suele representar como un conjunto de dígitos hexadecimales. Hoy en día se considera absolutamente inseguro, y no hay ningún motivo para utilizarlo.<\/li>\n<\/ul>\n<\/li>\n<li>WPA (Wifi Protected Access)\n<ul>\n<li>La base de WPA es seguir utilizando RC4, pero con una serie de mejoras que lo fortalecieron, conocidas como TKIP (Temporal Key Integrity Protocol). Aunque complicadas de explicar a nivel matemático, la idea que subyace es una evolución en la clave que utiliza RC4… es decir, ir variando la clave con el tiempo de manera transparente para los clientes, junto con otros mecanismos de integridad, esto buscaba arreglar el problema de WEP sin actualizar el hardware, aún así a día de hoy tmabién es inseguro<\/li>\n<\/ul>\n<\/li>\n<li>WPA2\n<ul>\n<li>Data de 2004 (<a href=\"https://standards.ieee.org/ieee/802.11i/3127/\">IEEE802.11i<\/a>) Se introduce AES como algoritmo criptográfico. WPA2 es extensible, de tal manera que aceptará facilmente cambios de algoritmo si algún día AES es vulnerado, también admite que se combine AES con la técnica de TKIP, que lo fortalece aún más. Hoy en día, es la única opción sensata.<\/li>\n<li>En WPA2 se introducen dos formas de autenticar a un cliente.<\/li>\n<li>PSK (Pre-Shared-Key): consiste en compartir una clave conocida por todos los usuarios de la red. Esa contraseña es la que se utiliza para generar la clave AES, esto hace que si un intruso la obtiene tenga acceso a la red y a paquetes de otros, por ello solo se usa para:\n<ul>\n<li>para grupos muy pequeños y estables de usuarios (SoHo)<\/li>\n<li>para redes sin información sensible (ej: una red sólo para dar acceso a internet).<\/li>\n<\/ul>\n<\/li>\n<li><a href=\"https://standards.ieee.org/ieee/802.1X/7345/\">IEEE 802.1x<\/a>: Un servidor RADIUS (Remote Access Dial-In User Server) almacena nombres de usuario y contraseña. El punto de acceso preguntará al usuario un nombre de usuario y una contraseña, consultará entonces al servidor y le dejará pasar. La clave que se genera para cifrar es única para ese usuario.<\/li>\n<li>Todos los sistemas servidores de Windows tienen el servicio de RADIUS, que además, puede asociarse a Active Directory. También existen aplicaciones independientes que pueden instalarse por separado, tanto en Windows como en sistemas Unix/Linux como FreeRADIUS.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>El nivel de red / transporte (TLS y SSL)<\/h2>\n<p>En el nivel de red y transporte existe SSL (Secure Socket Layer- Capa de Sockets Seguros), que hoy en día conocemos como TLS (Transport Layer Security).<\/p>\n<p>Está relacionado con el intercambio de certificados x509 y con el sistema de distribución y verificación de claves PKI, y permite que se abran transportes extremo a extremo que están cifrados y pueden estar autenticados. SSL proporciona autenticación y privacidad de la información entre extremos sobre Internet mediante el uso de criptografía, se suiguen los siguientes pasos:<\/p>\n<ol>\n<li>Negociación (HandShaking)\n<ul>\n<li>Elegir un algoritmo asimétrico<\/li>\n<li>Intercambiar claves públicas y autenticación basada en certificados digitales, el servidor siempre debe enviar un certificado.<\/li>\n<li>Se comprueban las firmas de los certificados mediante la PKI hasta llegar al CA<\/li>\n<li>Se negocia un algoritmo simétrico, y una clave, que se transmite utilizando el cifrado asimétrico con las claves públicas de los certificados.<\/li>\n<\/ul>\n<\/li>\n<li>Cifrado del tráfico basado en cifrado simétrico<\/li>\n<\/ol>\n<h2>El nivel de aplicación<\/h2>\n<p>Es muy común que haya aplicaciones que, en vez de definir un nuevo mecanismo de cifrado, sean montadas sobre transportes seguros SSL/TLS, algunos ejemplos podrían ser:<\/p>\n<ul>\n<li>HTTPS, es el protocolo de aplicación HTTP sobre un transporte SSL/TLS<\/li>\n<li>Los clientes de correo de escritorio (Outlook, Mozilla Thunderbird, etc) admiten comunicaciones sobre transportes SSL/TTS<\/li>\n<li>Los protocolos de escritorio remoto, como Remote Desktop de Microsoft (RDP) o VNC (Virtual Network Computing) admiten transportes SSL/TLS.<br />\nTambién existen aplicaciones con su propio mecanismo, en este caso, la aplicación más popular es PGP, y su equivalente GnuPG, bastante orientadas a los mensajes de texto. Aunque tiene bastante difusión en el ámbito del software libre, a nivel de implementación comercial apenas tiene penetración.<\/li>\n<\/ul>\n<h3>HTTPS<\/h3>\n<p>En una conexión https se utiliza el protocolo TLS/SSL sobre HTTP. El servidor debe disponer de un certificado x.509. La conexión siempre está cifrada con un algoritmo simétrico, y a menudo (aunque no es obligatorio) se garantiza la autenticidad del servidor mediante la firma digital del certificado, los pasos son los siguientes:<\/p>\n<ol>\n<li>El servidor envia al navegador un certificado x509 con información de su identidad, una clave pública, y una firma digital.<\/li>\n<li>Si la firma digital corresponde a una CA de la cual tenemos clave pública previamente almacenada en el navegador, entonces se puede comprobar la firma del certificado recibido, y tener seguridad de que el certificado es verdadero. En este punto, el servidor queda autentificado.<\/li>\n<li>Opcionalmente, el servidor puede requerir la autentificación del navegador. Para ello, el usuario puede tener instalados varios certificados en su navegador/sistema operativo.<\/li>\n<li>Ahora se continúa la comunicación cifrada con un algoritmo asimétrico.<\/li>\n<li>El navegador escoge una clave al azar para un algoritmo simétrico, y se la envía al servidor, pero cifra la comunicación con la clave pública del servidor.<\/li>\n<li>El servidor responde ya enviando la página con información cifrada con el algoritmo simétrico y la clave que le ha enviado el navegador.<br />\nPor supuesto, el proceso incluye muchos pasos intermedios no descritos aquí, por ejemplo, la negociación de qué protocolos van a utilizarse.<\/li>\n<\/ol>\n", "k": "<h1>Sistemas de confianza e intercambio de claves: la PKI y PGP<\/h1>\n<p>La criptografía asimétrica, si bien proporciona un cifrado prácticamente imposible de romper, se basa en la difusión de una clave pública, por mecanismos públicos, y que siempre va asociada a una identidad. Es decir, yo puedo generar una clave pública para mi y publicarla donde sea asociada a cualquier dato que me identifique, pero cualquiera puede hacer lo mismo suplantando mi identidad, por esto la criptografía asimétrica necesita un mecanismo para autentificar la identidad de los receptores de los mensajes.<\/p>\n<h2>PGP (Pretty Good Privacy)<\/h2>\n<p>PGP es un programa creado en 1991, para el intercambio de mensajes cifrados utilizando criptografía asimétrica, el grupo GNU tiene un programa parecido GnuPG y en cierto modo, compatible con PGP. Con este programa uno puede generar sus propias claves, y difundir la pública.<\/p>\n<p>Hay servidores con aplicaciones web para intercambiar claves públicas. Estos funcionan bien para pequeñas organizaciones, donde la identidad de cada uno se pueda autenticar por otros medios, cuanto más grande el conjunto de usuarios, también es más fácil la intrusión mediante suplantación de la clave pública en uno de éstos servidores de claves públicas PGP.<\/p>\n<p>La autenticidad de los certificados se basa en el llamado &quot;anillo de confianza&quot; en el cual, cuando una persona puede garantizar que un certificado de otra persona es de confianza, lo fira, si se distribuye el certificado firmado y quien lo recibe confía en el firmante, entonces confía también en el certificado original.<\/p>\n<h1>x509 y la PKI (Public Key Infrastructure)<\/h1>\n<p>En otro ámbito, existe un estándar llamado x509, y propuesto por la ITU (Unión Internacional de Telecomunicaciones), que es el que se utiliza para los certificar la identidad de los sitios web que usan https, y también para la identificación y firma digital de personas en España, mediante el DNIe o el certificado de la FNMT (Fábrica Nacional de Moneda y Timbre), este es un formato de intercambio de claves públicas, en lo que ellos llaman “certificados”.<br />\nUn certificado es un fichero que contiene al menos uno de los siguientes:<\/p>\n<ul>\n<li>Datos de identificación de una persona u organización<\/li>\n<li>Una clave privada<\/li>\n<li>Una clave pública<\/li>\n<li>Una firma digital.<br />\nEn la PKI, algunas entidades son cetificadoras. Generar un certificado es sencillo, se puede realizar de forma particular con una aplicación. Estas entidades firman el certificado que otros generan. A estas entidades que firman se les denomina CAs o Autoridades de Certificación, las claves públicas de las CA están incluídas en las distribuciones de nuestros navegadores y sistemas operativos.<\/li>\n<\/ul>\n<p>Para verificar su identidad, podemos comprobar la firma del certificado. Si quien lo ha emitido no es una CA, su certificado irá a su vez firmado por otra entidad… repetimos el proceso de verificación hasta llegar a la CA creando una ruta de certificación, La PKI consiste en la infraestructura que permite la verificación de la identidad a partir de los certificados x.509 hechos públicos por distintos medios.<\/p>\n<h2>Revocación del certificado<\/h2>\n<p>Cuando un usuario considera que un certificado ya no debe ser válido, ya por razones administrativas, o porque se sospecha se ha perdido el control sobre la clave privada, puede revocar el certificado.<\/p>\n<p>Generalmente, es un formulario web de la entidad que expidió el certificado, que tras la autenticación del usuario permite notificar esta revocación, los certificados suelen incluir una URL de comprobación de vigencia. Los programas que comprueban certificados deben consultar esta URL, que decide si el certificado fue revocado o no.<\/p>\n<p>La operación de revocación de un certificado es irreversible, no puede deshacerse y el usuario necesitará un nuevo certificado.<\/p>\n", "f": "<h1>Introducción<\/h1>\n<h2>Estaciones de Trabajo y Servidores<\/h2>\n<p>Las primeras se consideran clientes ya que es donde la gente se sienta a trabajar, son para el usuario y por ello s econfiguran acordemente, los servidores en camvio se configuran como prestadores de servicios, nadie debería trabajar directamente en ellos.<\/p>\n<p>De está manera se pueden compartir información y recursos aportando:<\/p>\n<ul>\n<li>Control sobre la información.<\/li>\n<li>Facilidad de administración y configuración.<\/li>\n<li>Seguridad centrada en los servidores.<\/li>\n<li>En las estaciones de trabajo que no contienen información solo deberemos de preocuparnos de la confidencialidad.<\/li>\n<\/ul>\n<h2>Grupos de Trabajo<\/h2>\n<p>Las SOHO (Small Office/Home Office) pueden estar en un modelo de grupo de trabajo (workgroup), donde no hay servidores dedicados, todos pueden serlo para otros.<\/p>\n<ul>\n<li>Es un modelo cómodo para infraestructuras muy pequeñas.<\/li>\n<li>Dificulta la administración y la protección, ya que todo se descentraliza.<\/li>\n<\/ul>\n<h1>Acceso Físico de Personas<\/h1>\n<h2>Cerraduras<\/h2>\n<p>Las cerraduras de cierto tipo pueden solucionar el control de acceso o la autenticación, se pueden usar cerraduras que requieran lo siguiente:<\/p>\n<ul>\n<li>Poseer algo.<\/li>\n<li>Saber algo.<\/li>\n<li>Exhibir una característica.<\/li>\n<li>Intercambiar claves, el problema de esto se puede ver <span class=\"wl\">aquí<\/span>.<\/li>\n<\/ul>\n<h2><span class=\"wl\">PGP (Pretty Good Privacy)<\/span><\/h2>\n<h2><span class=\"wl\">x509 y la PKI (Public Key Infrastructure)<\/span><\/h2>\n<h2>Personal de Vigilancia<\/h2>\n<p>Principalmente, sus funciones son activas aunque pueden ser pasivas también y se centran en:<\/p>\n<ol>\n<li>Control de accesos, de infracciones o limitación de la entrada.<\/li>\n<li>Control de sistemas de seguridad contra la comisión de delitos y faltas.<\/li>\n<li>Vigilancia y seguridad de los bienes y las personas que se encuentren en los inmuebles con posibilidad de represión.<\/li>\n<\/ol>\n<h2>Cámaras de Seguridad<\/h2>\n<p>Suele ser una medida pasiva si su función es la grabación de los hechos, si se junta con un vigilante se vuelve una medida activa.<\/p>\n<h2>Alarma Contra Intrusos<\/h2>\n<p>Consta de:<\/p>\n<ul>\n<li>Un módulo central, que es básicamente un ordenador con software.<\/li>\n<li>Una consola con teclas que activa y desactiva el sistema de detectores y que permite una interacción con la central de alarma.<\/li>\n<li>Detectores de presencia, que utilizan microondas, ultrasonidos o sondas de temperatura.<\/li>\n<li>Detectores de apertura de puertas, rotura de ventanas, etc.<\/li>\n<li>Una batería auxiliar.<\/li>\n<li>Puede haber pulsadores de emergencia, normalmente disimulados que disparan la alarma.<\/li>\n<li>Una sirena y luces con intención disuasoria.<br />\nLa alarma está conectada a la línea telefónica, también suele estar conectada de manera redundante a la red de telefonía móvil. La alteración de los sensores dispara la alarma, si una cerradura electrónica está conectada a la central de alarma, su rotura o manipulación abre la puerta, sin disparar primero la alarma. Los sensores suelen estar conectados en estrella y de forma guíada.<\/li>\n<\/ul>\n<h1>Condiciones Climáticas y Ambientales<\/h1>\n<h2>Temperatura<\/h2>\n<p>El rango adecuado suele estar entre 25 y 28º Celsius, lo importante es que está sea conveniente y ecónomica, se ajustará con ayuda de especialistas según el caso (ordenadores aislados, ventanas...).<\/p>\n<h2>Humedad<\/h2>\n<p>La humedad relativa se mide con respecto al máximo de vapor de agua que podría contener a esa temperatura el aire y se expresa con un porcentaje. Para equipos electrónicos se recomienda entre un 40 y un 50% y nunca superar el 80. En ambientes de alta humedad se puede utilizar un deshumidificador, estos condensan el agua para convertirla el un líquido y así expulsarla.<\/p>\n<h2>Polvo<\/h2>\n<p>El polvo se compone de partículas en suspensión y puede interferir con nuestros sistemas porque:<\/p>\n<ul>\n<li>Recubre los circuitos y propicia la acumulación de humedad, provocando óxido o desperfectos relacionados con la electricidad.<\/li>\n<li>Se adhiere a dispositivos lectores.<\/li>\n<li>Se adhiere a piezas móviles.<br />\nSi en nuestras instalaciones el polvo supone un problema, se puede paliar con filtros de partículas, los sistemas de climatización de los CPD, el aire acondicionado ya incluye filtro de partículas y deshumidifica por el propio enfriamiento, también se pueden aislar algunos equipos de forma hermética y filtrar la mayoría de su aire.<\/li>\n<\/ul>\n<h2>Agua<\/h2>\n<ul>\n<li>Los baños y salidas de agua deben situarse a distancia de las salas que alojen hardware. Si no es posible, debe contarse con sistemas de desviación y absorción (Ej: desagües).<\/li>\n<li>El hardware debe estar alejado de ventanas y otras posibles fuentes de filtraciones.<\/li>\n<li>En general, nunca debe apoyarse directamente sobre el suelto, sino elevado sobre éste.<\/li>\n<\/ul>\n<h2>Fuego<\/h2>\n<h3>Barreras<\/h3>\n<p>Algunos muros están construidos con especial resistencia al fuego, para evitar que se propague. Contienen materiales aislantes e incluso refrigerantes. Se sellan sus resquicios con masillas y siliconas ignífugas.<\/p>\n<p>Las puertas cortafuegos son para el paso de personas. Se cierran solas con algún mecanismo de muelle y utilizan palancas para abrirse, suelen estar clasificadas con un rótulo “DF” seguido del número de minutos que resisten un fuego directo.<\/p>\n<p>Las compuertas cortafuegos se colocan en conductos e impiden que el fuego se propague por estos medios, su cierre es automático.<\/p>\n<h3>Detectores<\/h3>\n<p>La central de alarma del edificio puede estar dedicada a la detección y extinción de incendios, o bien puede ser la misma central de alarma que se utilice para la detección de intrusos (en ese caso se llaman sistemas mixtos) y con respecto a un incendio hará una o más de las siguientes:<\/p>\n<ul>\n<li>Disparar una sirena para avisar de la detección del fuego.<\/li>\n<li>Disparar sistemas de extinción automáticos.<\/li>\n<li>Avisar a una empresa de seguridad mediante la línea telefónica fija o móvil.<\/li>\n<li>Avisar a un servicio de emergencia (tipo 112) mediante un sistema pregrabado.<\/li>\n<\/ul>\n<h3>Sistemas de Extinción<\/h3>\n<ul>\n<li>Automáticos:\n<ul>\n<li>Principalmente se basan en esparcir algún agente extintor en el ambiente, como el agua nebulizada,<\/li>\n<li>Puede sustituir el oxígeno del aire por algún otro gas que impida la combustión, como gas inergen (una mezcla de nitrógeno, argón y CO2)<\/li>\n<li>Los gases limpios (HF's, como el FE13 y el FM200) actúan directamente sobre el fuego a concentraciones relativamente bajas. Se almacenan como gases licuados y apagan el fuego por enfriamiento de la llama. Tienen menor toxicidad que el CO2 y no afectan a la capa de ozono.<\/li>\n<li>También son gases de este tipo los hidrocarburos halogenados, derivados del gas halón, utilizados durante mucho tiempo, pero actualmente <em>prohibidos<\/em> por su efecto sobre la capa de ozono.<\/li>\n<\/ul>\n<\/li>\n<li>Manuales (extintores).<\/li>\n<\/ul>\n<h3>Tipos de Fuego<\/h3>\n<p>Hay varios tipos de fuego, según el material que esté ardiendo y cada unto se extingue de una manera, según el estándar <a href=\"https://seguridadproteccioncontraincendios.es/normativa/normas-une/iso-3941-clasificacion-fuegos/\">ISO 3941<\/a>:<\/p>\n<div class=\"sc\"><table>\n<thead>\n<tr>\n<th>Clase<\/th>\n<th>Combustible<\/th>\n<th>Polvo ABC<\/th>\n<th>CO₂<\/th>\n<th>Clase F<\/th>\n<th>Agua<\/th>\n<th>Espuma<\/th>\n<th>Agente litio<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>A<\/strong><\/td>\n<td>Sólidos<\/td>\n<td>✓✓<\/td>\n<td>✓<\/td>\n<td>✓<\/td>\n<td>✓✓<\/td>\n<td>✓✓<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>B<\/strong><\/td>\n<td>Líquidos<\/td>\n<td>✓✓<\/td>\n<td>✓✓<\/td>\n<td>✓<\/td>\n<td>×<\/td>\n<td>✓✓<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>C<\/strong><\/td>\n<td>Gases<\/td>\n<td>✓✓<\/td>\n<td>✓✓<\/td>\n<td>—<\/td>\n<td>×<\/td>\n<td>×<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>D<\/strong><\/td>\n<td>Metales<\/td>\n<td>×<\/td>\n<td>×<\/td>\n<td>×<\/td>\n<td>×<\/td>\n<td>×<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>F<\/strong><\/td>\n<td>Aceites cocina<\/td>\n<td>×<\/td>\n<td>×<\/td>\n<td>✓✓<\/td>\n<td>××<\/td>\n<td>×<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>Litio<\/strong><\/td>\n<td>Baterías Li-ion<\/td>\n<td>✓ (superficial)<\/td>\n<td>✓ (superficial)<\/td>\n<td>—<\/td>\n<td>✓ (grandes cantidades)<\/td>\n<td>—<\/td>\n<td>✓✓<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>✓✓ = Eficaz. ✓ = Eficacia limitada. × = No recomendado. ×× = Contraproducente / peligroso.<\/p>\n<h3>Vías de Evacuación y Señalización<\/h3>\n<p>El estándar europeo es el <a href=\"https://www.en-standard.eu/une-23034-2023-fire-safety-signalling-safety-signs-escape-routes/\">UNE 23034:2023<\/a> pero se trata básicamente de señales verdes que se colocan en partes altas.<\/p>\n<h1>El Entorno Físico de un Centro de Procesamiento de Datos (CPD)<\/h1>\n<p>Es una instalación que alberga un sistema principal de redes, ordenadores y recursos para procesar toda la información de una o varias empresas u organismos. A veces, los datacenter son de uso exclusivo de una única empresa, y en otras ocasiones, se “alquilan” sus servicios.<\/p>\n<p>Los principales factores de riesgo que pueden suponer amenazas a la seguridad física, junto con las medidas de seguridad más habituales.<\/p>\n<ul>\n<li>Electricidad (cortes, inestabilidad)\n<ul>\n<li>Acometidas duplicadas, de distintas compañías.<\/li>\n<li>SAIs.<\/li>\n<li>Grupos electrógenos.<\/li>\n<\/ul>\n<\/li>\n<li>Redes internas (LAN)\n<ul>\n<li>Duplicación de redes<\/li>\n<\/ul>\n<\/li>\n<li>Redes externas (WAN)\n<ul>\n<li>Duplicación de proveedores<\/li>\n<\/ul>\n<\/li>\n<li><span class=\"wl\">Climatización e incendios<\/span><\/li>\n<li><span class=\"wl\">Acceso Físico de Personas<\/span><br />\nCon respecto a la propia construcción:<\/li>\n<li>Suelos con alta capacidad de carga<\/li>\n<li>Doble suelo para evitar electrocución e inundación<\/li>\n<li>Construcción antisísmica<\/li>\n<li>Paredes y puertas con tratamiento ignífugo<\/li>\n<li>Aislamiento térmico en muros y ventanas<\/li>\n<li>Bahías de carga y descarga<br />\nTambién es importante en algunos casos, decidir dónde y cómo ubicar las instalaciones, teniendo en cuenta aspectos como:<\/li>\n<li>Coste del terreno<\/li>\n<li>Servicios<\/li>\n<li>Suministros eléctricos<\/li>\n<li>Poca probabilidad de catástrofes naturales, etc.<\/li>\n<li>Transporte<br />\nPor último, existe la posibilidad de duplicar el centro completo en una ubicación remota.<\/li>\n<\/ul>\n<h2>Niveles Tier<\/h2>\n<h3>Tier I: Centro de Datos Básico: Disponibilidad del 99.671%.<\/h3>\n<ul>\n<li>El servicio puede interrumpirse por actividades planeadas o no planeadas.<\/li>\n<li>No hay componentes redundantes en la distribución eléctrica y de refrigeración.<\/li>\n<li>Puede o no puede tener suelos elevados, generadores auxiliares o UPS.<\/li>\n<li>La infraestructura del datacenter deberá estar fuera de servicio al menos una vez al año por razones de mantenimiento y/o reparaciones.<\/li>\n<\/ul>\n<h3>Tier II: Centro de Datos Redundante: Disponibilidad del 99.741%.<\/h3>\n<ul>\n<li>Menos susceptible a interrupciones por actividades planeadas o no planeadas.<\/li>\n<li>Tiene suelos elevados, generadores auxiliares o UPS.<\/li>\n<li>Conectados a una única línea de distribución eléctrica y de refrigeración.<\/li>\n<li>Componentes redundantes (N+1).\n<ul>\n<li>Una única línea alimenta a dos SAI. Cada SAI es capaz de mantener a todos los equipos.<\/li>\n<\/ul>\n<\/li>\n<li>El mantenimiento de esta línea de distribución o de otras partes de la infraestructura requiere una interrupción del servicio.<\/li>\n<\/ul>\n<h3>Tier III: Centro de Datos Concurrentemente Mantenibles: Disponibilidad del 99.982%.<\/h3>\n<ul>\n<li>Permite planificar actividades de mantenimiento sin afectar al servicio de computación, pero eventos no planeados pueden causar paradas no planificadas.<\/li>\n<li>Componentes redundantes (N+1)<\/li>\n<li>Conectados múltiples líneas de distribución eléctrica y de refrigeración, pero únicamente con una activa.<\/li>\n<li>Hay suficiente capacidad y distribución para poder llevar a cabo tareas de mantenimiento en una línea mientras se da servicio por otras.<\/li>\n<\/ul>\n<h3>Tier IV: Centro de Datos Tolerante a Fallos: Disponibilidad del 99.995%.<\/h3>\n<ul>\n<li>Permite planificar actividades de mantenimiento sin afectar al servicio de computación críticos, y es capaz de soportar por lo menos un evento no planificado del tipo ‘peor escenario’ sin impacto crítico en la carga.<\/li>\n<li>Conectados múltiples líneas de distribución eléctrica y de refrigeración con múltiples componentes redundantes<\/li>\n<li>Componentes redundantes 2(N+1)\n<ul>\n<li>Duplicación de sistemas N+1. Implica que cada uno de los cuatro SAI puede mantener a todos los equipos. Hay dos líneas de alimentación exterior. Cada ordenador se conecta a los dos SAI de forma separada.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h1>Electricidad<\/h1>\n<h2>La Red Eléctrica<\/h2>\n<p>En España se suministra corriente alterna (que es lo más eficaz para largas distancias), esto se hace con los siguientes parámetros:<\/p>\n<ul>\n<li>Tensión: 230 Volts (Con ±7% de oscilaciones permitidas, es decir, entre 213 y 247 Volts)<\/li>\n<li>Frecuencia: 50 Hertz<br />\nEsta luego se transforma en corriente continua para que la puedan usar los dispositivos.<\/li>\n<\/ul>\n<h2>Protección Eléctrica<\/h2>\n<p>La red eléctrica proporciona tensiones nominales de entre 220 y 240V La potencia que suministra la red (kiloWatts – kW) se estipula por contrato.<\/p>\n<h3>El ICP (Interruptor de Control de Potencia)<\/h3>\n<p>Se coloca a la entrada del suministro, después de los contadores para garantizar que no se consume más allá de la potencia contratada. Hay uno a la entrada de cada cliente. Se coloca más para control de consumo que para seguridad.<\/p>\n<h3>Los Interruptores Magnetotérmicos<\/h3>\n<p>Protegen un circuito, cada uno admite una determinada corriente máxima, que se mide en Amperios. Los magnetotérmicos vienen marcados con la letra “C” de <em>Current<\/em>, y una cantidad (no confundir con el conector, que puede ser un IEC C16 por ejemlo), que indica el máximo de corriente que permiten. Saltan ante cortocircuitos y consumo excesivo interumpiendo la corriente. La desconexión magnética protege de los cortocircuitos y la térmica de las sobrecargas. Se pueden colocar varios magnetotérmicos jerárquicamente, saltrá el más cercano.<\/p>\n<h3>El Interruptor Diferencial<\/h3>\n<p>Se coloca en las instalaciones eléctricas con el fin de proteger a las personas de las derivaciones causadas por faltas de aislamiento entre los conductores activos y tierra o masa de los aparatos. Lo distinguirás fácilmente por el botón marcado con una “T” de <em>Test<\/em>.<\/p>\n<h3>La Toma de Tierra<\/h3>\n<p>La fase que siempre es rojo, marrón o negro es el conductor que realmente trae la potencia. El neutro, que siempre es azul es el retorno del circuito. La tierra en amarillo y verde está conectado a un gran clavo en los cimientos del edificio. El enchufe schuko garantiza las fugas a tierra de corrientes descontroladas y estáticas en aquellos aparatos construidos de manera adecuada para ello.<\/p>\n<h3>Doble Aislamiento<\/h3>\n<p>Si un dispositivo tiene esta característica, no necesita toma de tierra, para saber si es el caso  se debe buscar un símbolo de dos cuadrados concéntricos.<\/p>\n<h3>Ladrones<\/h3>\n<p>Solo deben usarse si son estrictamente necesarios, además es necesario tener en cuenta que NUNCA DEBE UTILIZARSE UN ADAPTADOR CON ENTRADA EUROPLUG (plana) Y CONECTOR SCHUKO (redondo), esto que permitiría enchufar aparatos con enchufe Schuko (de hasta 16A), cuando una entrada europlug solo está certificada para 2.5A.<\/p>\n<h2>Cálculo Aproximado del Consumo<\/h2>\n<p>La demanda eléctrica máxima de un dispositivo debe venir indicada por el fabricante del mismo, expresada en Amperios o bien, el consumo expresado en Vatios. En el caso de corriente contínua:<\/p>\n<div class=\"math\">P<sub>Vatios<\/sub> = V × I<\/div>\n<p>Donde:<br />\n<i class=\"math\">P<\/i>: Potencia expresada en Vatios.<br />\n<i class=\"math\">V<\/i>: Tensión expresada en Voltios.<br />\n<i class=\"math\">I<\/i>: Intensidad en Amperios.<br />\nPara corriente alterna será necesario un factor de correción.<\/p>\n<h2>Problemas en el Suministro<\/h2>\n<ul>\n<li>Ausencia.<\/li>\n<li>Microcorte.<\/li>\n<li>Bajadas de tensión.<\/li>\n<li>Subidas de tensión.<\/li>\n<li>Picos de tensión.<\/li>\n<li>Ruido eléctrico (alteración de la forma de la onda de AC, normalmente por un motor que causa inducción).<\/li>\n<li>Alteración de la frecuencia.<\/li>\n<\/ul>\n<h2>AVRs (Reguladores de Voltaje Automáticos)<\/h2>\n<p>También llamados “Estabilizadores de tensión”, es un circuito eléctrico basado en varios bobinados que intenta conseguir siempre una tensión de salida de 230V. tiene un límite, y no puede operar con tensiones de entrada inferiores a 175V ni superiores a 275V (aproximadamente), suelen estar integrados en SAIs.<\/p>\n<h2>SAIs (Sistemas de Alimentación Interrumpida)<\/h2>\n<p>Los SAIs o UPSs (Uninterruptible Power Supplies) son apratos basados en baterías que proporcionan corriente ante la ausencia de ella en el suministro.<\/p>\n<p>El SAI se conecta al suministro de la red eléctrica, y los ordenadores se conectan a él bien mediante un enchufe o bien mediante alguno de los conocidos conectores IEC, en especial el C13/C14.<\/p>\n<p>Casi todos los SAIs disponen de alguna aplicación de monitorización: se conectan al equipo que protegen por un cable serie, usb o por red. El programa de monitorización puede realizar acciones como hibernar el equipo, vaciar cachés de disco, apagar de manera seguro.<\/p>\n<h3>La Batería, el Cargador y el Inversor<\/h3>\n<p>Las baterías de los SAI suelen ser de plomo y ácido, muy similares a los de los coches y las motos.No se suelen utilizar otro tipo de baterías, como las de Níquel e Hidruro Metálico, o las de iones de litio debido a que en general, no son capaces de entregar demasiada energía rápidamente y presentan algunos inconvenientes, aunque algunas sí son ao aptas para su utilización en SAIs, pero encarecen mucho el producto. La batería acumula DC, para que la batería se recargue, el SAI lleva en su interior un circuito llamado cargador, que convierte la AC en DC y la inyecta en la batería hasta que ésta llenarla. Análogamente, se necesita un circuito llamado inversor, que toma la DC de la batería, y la convierte en AC, a este circuito, también se le suele llamar rizador u ondulador.<\/p>\n<h3>Off-Line Pasivos o Stand-by<\/h3>\n<p>Los sai off-line son los más comunes, los más sencillos y también los más económicos. Constan de un cargador y un inversor. Pero el SAI Off-line sólo obtiene energía de la batería cuando hay una ausencia de suministro, un microcorte o una bajada de tensión importante. Para ello, un circuito conmutador está constantemente vigilando el suministro eléctrico, y cuando su tensión cae por debajo de un cierto límite, conmuta la salida a la batería.<\/p>\n<p>El conmutador tarda un cierto tiempo en detectar el problema. A este tiempo, se le llama tiempo de conmutación o de transferencia. Muchos SAIs cuentan con un sencillo filtro en la entrada que elimina los posibles ruídos.<\/p>\n<h3>Off-Line Interactivos, Activos, con Estabilizador o AVR<\/h3>\n<p>Un SAI interactivo dispone de un <span class=\"wl\">AVR<\/span> en la entrada de corriente alterna.<\/p>\n<h3>On-Line o de doble conversión<\/h3>\n<p>Son la &quot;gama alta&quot; de los SAI. En estos SAI no hay conmutador, en su lugar, la batería está constantemente cargándose, y la salida se obtiene siempre de la batería.<\/p>\n<h3>El By-pass de los SAI en línea<\/h3>\n<p>Dado que un SAI online siempre está operando con la batería, ésta no se puede sustituir sin pérdida de suministro. Es un conmutador, que conecta directamente la entrada de AC con la salida de AC en un SAI online, con la única intención de poder realizar tareas de mantenimiento en la batería.<\/p>\n<h3>Mantenimiento<\/h3>\n<p>El cambio de batería se hará cuando pierda carga máxima, hacerlo con el SAI enchufado es una operación delicada.<\/p>\n<h3>Capacidad y Tiempo de Suministro<\/h3>\n<p>La idea de un SAI es mantener la corriente el tiempo necesario para que el equipo pueda salvaguardar los datos, bien manualmente o bien automáticamente. Los fabricantes de SAI nos dan una idea de su capacidad utilizando una unidad de medida poco conocida: el Voltio-Amperio. Esa unidad de medida tiene que ver con la potencia aparente que es capaz de proporcionar el SAI.¿Como saber si un SAI podrá dar corriente a un determinado equipo? aplica estas reglas:<\/p>\n<ul>\n<li>Si expresan la potencia en Vatios, divide ese valor por 0.7 para obtener los Voltio-Amperios.<\/li>\n<li>Si expresan la Intensidad en Amperios, multiplica por 230V (la tensión efectiva AC) para obtener los Voltio-Amperios.<\/li>\n<\/ul>\n<div class=\"math\">P<sub>voltioamperios<\/sub> = V<sub>ef<\/sub> × I<sub>ef<\/sub><\/div>\n<div class=\"math\">P<sub>voltioamperios<\/sub> = (P<sub>watios<\/sub>) / (0.7)<\/div>\n<p>El factor 0.7 es debido al desfase entre la subida de tensión y la subida de intensidad. Cuanto menos desfase haya, más se parecerá a 1, y más caro será el SAI.<\/p>\n<p>Cabe destacar que aunque hay SAIs de todos los tamaños existen equipos de medidas normalizadas para armarios rack. Cuando los SAI se colocan en RACK en general, se hace en la parte inferior, debido a dos motivos: por un lado, en la parte inferior es donde suelen estar las tomas eléctricas, y por el otro, las baterías de plomo pesan mucho, así que colocándolos abajo es donde menos sufre el armario por el peso del SAI.<\/p>\n<h3>Grupos Elctrógenos<\/h3>\n<p>Los SAIs también se pueden usar como un intermedio para pasar a un generador que quema combustible (normalmente gasoil) que tiene un tiempo de conmutación muy grande, además estos requieren mucho mantenimiento.<\/p>\n", "a": "<h1>Introducción<\/h1>\n<p>Hay dos usos para los dispositivos, el guardado de información en uso y el respaldo.<\/p>\n<p>Conceptos importantes:<\/p>\n<ul>\n<li>La redundancia es la técnica por la cual la información se almacena en varios sitios, o de varias formas, de tal manera que ante un fallo en un medio de almacenamiento se pueda seguir trabajando.<\/li>\n<li>El respaldo es el acto por el cual se almacena adrede una copia de información en un medio destinado a reconstruir la información original sólo en caso de pérdida.<\/li>\n<\/ul>\n<h1>Medios de Almacenamiento en Memoria Secundaria<\/h1>\n<h2>Magnéticos<\/h2>\n<p>Actualmente se usan HDDs y cintas magnéticas, pero antiguamente eran populares los discos flexibles, estos guardan los bits usando orientación de moléculas en campos magnéticos<\/p>\n<h3>HDDs<\/h3>\n<p>El dispositivo más utilizado como medio de trabajo, y de almacenamiento de información viva.<br />\nComo dispositivo de copia de seguridad puede utilizarse, pero conviene siempre tener en mente que tienen una duración limitada y que en caso de ser extraíble, sus partes móviles lo hacen relativamente delicado.<\/p>\n<ul>\n<li>Ventajas:\n<ul>\n<li>Rápidos<\/li>\n<li>Gran capacidad<\/li>\n<li>Buen coste/GB<\/li>\n<li>Poca degradación al escribir<\/li>\n<\/ul>\n<\/li>\n<li>Inconvenientes:\n<ul>\n<li>Vida útil de unos años<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h3>Cintas Magnéticas<\/h3>\n<p>Se trata de una simple cinta de material plástico recubierta de material magnético y metida en una carcasa, son un dispositivo de escritura y lectura secuencial.<\/p>\n<p>Se usa casi exclusivamente para el respaldo de la información, siempre es copia de información viva.<\/p>\n<ul>\n<li>Ventajas:\n<ul>\n<li>Mantiene la información durante muchos años<\/li>\n<li>Coste/GB bajo<br />\nEs extraíble<\/li>\n<\/ul>\n<\/li>\n<li>Inconvenientes\n<ul>\n<li>Es secuencial y lento<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>Ópticos<\/h2>\n<p>Se basan en marcas sobre una superficie reflectante, que se escriben y se leen con luz láser, para representar los valores binarios de 1 y 0. Hoy en día nos quedan el CD (Compact Disk), el DVD (Digital Versatile Disk) y el Blu-Ray.<\/p>\n<p>Quedan relegados casi exclusivamente al almacenamiento de contenidos multimedia (en el que una pérdida pueda no ser importante), o de distribución de software (cuyo valor es siempre muy limitado).<\/p>\n<ul>\n<li>Ventajas:\n<ul>\n<li>Coste/GB muy bajo<\/li>\n<li>La información puede durar mucho, pero no suele ser el caso<\/li>\n<\/ul>\n<\/li>\n<li>Inconvenientes:\n<ul>\n<li>Delicados<\/li>\n<li>Sensibles a cambios extremos de temperatura<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>Flash<\/h2>\n<p>Las tecnologías Flash son una evolución de las memorias EEPROM. Se trata de memorias en las que cada bit está construido con transistores modificados, capaces de “almacenar” un campo eléctrico, para representar los valores binarios de 1 y 0.<\/p>\n<p>Principalmente, podemos citar tres tipos de dispositivo: los pendrives, las tarjetas de memoria y los SSDs.<\/p>\n<h3>Pendrives y Tarjetas<\/h3>\n<p>De los pendrives y las tarjetas podemos comentar que su característica principal es la portabilidad, están pensados para ser transportados, y utilizados de manera temporal.<\/p>\n<ul>\n<li>Ventajas\n<ul>\n<li>Transportables<\/li>\n<li>Resistentes<\/li>\n<\/ul>\n<\/li>\n<li>Inconvenientes:\n<ul>\n<li>Lentos<\/li>\n<li>Poca capacidad<\/li>\n<li>Coste por gigabyte alto<\/li>\n<li>La información se degrada si el dispositivo no se utiliza<\/li>\n<li>Admiten un número limitado de ciclos de escritura<\/li>\n<li>Fáciles de extraviar<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h3>SSDs<\/h3>\n<p>Buscan, con el tiempo sustituir a los HDDs.<\/p>\n<ul>\n<li>Ventajas\n<ul>\n<li>Rápidos<\/li>\n<li>Resistentes a golpes, sin partes móviles<\/li>\n<li>Ahorro de energía respecto de discos duros mecánicos<\/li>\n<\/ul>\n<\/li>\n<li>Inconvenientes\n<ul>\n<li>Coste alto por gigabyte<\/li>\n<li>No se conoce con exactitud su tiempo medio de vida antes de un fallo, aunque cada vez es mejor<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h1>Unidades de Medida de la Información<\/h1>\n<p>Las unidades más comúnes son el byte y sus múltiplos.<\/p>\n<div class=\"sc\"><table>\n<thead>\n<tr>\n<th>Sistema métrico<\/th>\n<th>Símbolo<\/th>\n<th>Valor<\/th>\n<th>Sistema binario<\/th>\n<th>Símbolo<\/th>\n<th>Valor<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>kilobyte<\/td>\n<td>kB<\/td>\n<td>10³<\/td>\n<td>kibibyte<\/td>\n<td>KiB<\/td>\n<td>2¹⁰<\/td>\n<\/tr>\n<tr>\n<td>megabyte<\/td>\n<td>MB<\/td>\n<td>10⁶<\/td>\n<td>mebibyte<\/td>\n<td>MiB<\/td>\n<td>2²⁰<\/td>\n<\/tr>\n<tr>\n<td>gigabyte<\/td>\n<td>GB<\/td>\n<td>10⁹<\/td>\n<td>gibibyte<\/td>\n<td>GiB<\/td>\n<td>2³⁰<\/td>\n<\/tr>\n<tr>\n<td>terabyte<\/td>\n<td>TB<\/td>\n<td>10¹²<\/td>\n<td>tebibyte<\/td>\n<td>TiB<\/td>\n<td>2⁴⁰<\/td>\n<\/tr>\n<tr>\n<td>petabyte<\/td>\n<td>PB<\/td>\n<td>10¹⁵<\/td>\n<td>pebibyte<\/td>\n<td>PiB<\/td>\n<td>2⁵⁰<\/td>\n<\/tr>\n<tr>\n<td>exabyte<\/td>\n<td>EB<\/td>\n<td>10¹⁸<\/td>\n<td>exbibyte<\/td>\n<td>EiB<\/td>\n<td>2⁶⁰<\/td>\n<\/tr>\n<tr>\n<td>zettabyte<\/td>\n<td>ZB<\/td>\n<td>10²¹<\/td>\n<td>zebibyte<\/td>\n<td>ZiB<\/td>\n<td>2⁷⁰<\/td>\n<\/tr>\n<tr>\n<td>yottabyte<\/td>\n<td>YB<\/td>\n<td>10²⁴<\/td>\n<td>yobibyte<\/td>\n<td>YiB<\/td>\n<td>2⁸⁰<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h1>Redundancia en Discos: RAID<\/h1>\n<p>La redundancia consiste en utilizar medios de almacenamiento replicados, de tal manera que la información se grabe más de una vez. Cuando uno de los medios de almacenamiento falla debido normalmente al deterioro causado por el uso, un sistema redundante permite que las actividades del sistema informático continúen, aunque sea a costa de una ligera pérdida de rendimiento.<\/p>\n<p>RAID significa Redundant Array of Independent Disks. Es un sistema ideado para discos duros, dado que éstos son dispositivos con muchas ventajas, pero un gran inconveniente: su vida útil limitada.<\/p>\n<h2>Niveles<\/h2>\n<ul>\n<li>El nivel de RAID 0 no proporciona redundancia, ni seguridad de ningún tipo, sino velocidad. Por el contrario, hace el sistema más vulnerable.<\/li>\n<li>Los niveles 1, 5 y 6 sí proporcionan redundancia, y por lo tanto, seguridad pasiva ante un fallo de uno de los discos.<\/li>\n<li>Los niveles combinados, como 0+1, 1+0 o 5+0 intentan combinar seguridad con velocidad, aunque siempre a costa de un número mayor de discos.<\/li>\n<\/ul>\n<h2>Implementación<\/h2>\n<ul>\n<li>En placas base\n<ul>\n<li>Las estaciones de trabajo pueden permitir la implementación de RAID 1 y RAID 0.<\/li>\n<li>En servidores es común encontrar placas que permiten todos los niveles de RAID.<\/li>\n<\/ul>\n<\/li>\n<li>Como dispositivo independiente. Funcionan como un periférico independiente y normalmente externo. Los discos duros no se instalandirectamente atornillados, sino sobre unas bandejas llamadas caddy, que se insertan en el dispositivo.\n<ul>\n<li>De sobremesa, se conectan directamente, quizá por eSATA, Firewire o USB.<\/li>\n<li>De rack, son dispositivos que se instalan en rack, y son utilizados por uno o más servidores simultáneamente, no se suelen conectar directamente a ningún ordenador, sino que utilizan algún interfaz de red para permitir el servicio a varios ordenadores servidores.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p>También existe RAID por software, pero su instalación y mantenimiento son más complicados que las soluciones por hardware, y tienen una penalización en el rendimiento.<\/p>\n<p>Esto puede dificultar la recuperación o el traslado ya que se necesitará &quot;algo&quot; que pueda leer estos RAIDs.<\/p>\n<h2>Modo Provisional de Recuperación de Datos<\/h2>\n<p>Si se produce un fallo en un disco, el sistema RAID lo marcará como inutilizado, y dejará de utilizarlo. El sistema RAID se pone en estado de emergencia. El sistema avisará de alguna manera de éste estado (luces, pitidos, mensajes…) para que el disco inutilizado sea sustituido a la mayor brevedad posible por uno nuevo de igual tamaño (o superior, pero entonces sólo se utiliza el mismo espacio que en el disco inutilizado).<\/p>\n<p>La mayor parte de los sistemas RAID permiten que el disco se cambie sin tener que apagar equipos ni almacenamiento (hot swap). Para ello, los discos no se instalan directamente en bahías de 3.5 pulgadas, sino en bandejas extraíbles llamadas caddies.<\/p>\n<h2>RAID 1 (<em>Mirroring<\/em>)<\/h2>\n<p>Es la implementación más sencilla de RAID. Se utilizan al menos dos discos. Se graba una copia exacta de la información en ambos.<\/p>\n<h2>RAID 5 (<em>Striping with parity<\/em>)<\/h2>\n<p>Este nivel se suele implementar con al menos cuatro discos, y el tamaño de la paridad será el mismo que el espacio de un disco. Utiliza el cálculo de la paridad simple, que además se distribuye entre varios discos.<\/p>\n<h2>RAID 6 (<em>Striping with double parity<\/em>)<\/h2>\n<p>Se creó con una finalidad muy concreta: si en un sistema RAID 5 falla un segundo disco durante el estado de emergencia, se pierde absolutamente todo. Aunque el riesgo de que ésto ocurra es bajo, no es inexistente.<\/p>\n<p>RAID 6 utiliza un sistema similar a las paridades de RAID 5, pero algo más complejo. (En realidad, es un caso de códigos correctores de errores de Reed-Solomon) y distribuye dos bloques de códigos correctores, la paridad ocupará un espacio equivalente al tamaño de dos discos.<\/p>\n<h2>RAID 5E y 6E<\/h2>\n<p>Se añade un disco de reserva, este estará en blanco y solo se usará cuando haya un fallo.<\/p>\n<h2>RAID 0<\/h2>\n<p>Consiste en concatenar la capacidad de varios discos. No proporciona ningún mecanismo de redundancia, por lo que no es realmente un nivel de RAID.<\/p>\n<ul>\n<li>Puede utilizarse para facilitar la administración, ya que un disco grande es más simple de gestionar que varios pequeños en algunos casos.<\/li>\n<li>Se utiliza generalmente para aumentar la velocidad de lectura/escritura de varios discos: cada operación se reparte de forma aleatoria entre cada disco real, por lo que se pueden realizar en paralelo.<\/li>\n<\/ul>\n<h1>La Conexión de los Almacenamientos<\/h1>\n<p>En pequeños ordenadores, los discos se conectan directamente a la placa base mediante conexiones directas, como SATA, sin embargo en grandes almacenamientos suele ser conveniente que éstos puedan ser accedidos por más de un ordenador servidor, para rentabilizar al máximo el espacio y los mecanismos de redundancia.<\/p>\n<h2>DAS (Direct Attached Storage)<\/h2>\n<p>Ésta es la forma tradicional de conectar los almacenamientos: directa a un ordenador… bien a la placa base, a través de conexiones típicas (SATA, SCSI, etc…) o externas (eSATA, FireWire, USB).<\/p>\n<p>El sistema operativo puede suponer que es el único que usa ese disco. Las operaciones más básicas a realizar sobre un disco DAS son relativas a sectores: leer sector y escribir sector.<\/p>\n<h2>NAS (Network Attached Storage)<\/h2>\n<p>Se conecta el almacenamiento a una red de comunicaciones, bien local de tipo Ethernet o cualquier otra, o bien remota. Un dispositivo NAS cuenta en su interior con un pequeño sistema operativo preconfigurado y un software para servir ficheros a través de la red, con uno o más protocolos bien conocidos. Las operaciones básicas que se pueden realizar con un NAS son relativas a ficheros: crear un fichero, listar un directorio, borrar fichero, modificar fichero,…<\/p>\n<p>Suelen disponer de alguna medida de seguridad básica para proteger la confidencialidad, basadas en listas de control de acceso (ACLs - access control lists, un mecanismo de usuarios, contraseñas y permisos…)<\/p>\n<p>Si se hace un uso muy intenso, un dispositivo NAS supone un pequeño cuello de botella, debido a la sobrecarga de trabajo que conllevan los protocolos de servicio de ficheros por un lado y los protocolos de red y transporte por otro, algunos protocolos comunes de servicio de ficheros son:<\/p>\n<ul>\n<li>NFS (Network File System), utilizado tradicionalmente en sistemas Unix y GNU/Linux.<\/li>\n<li>CIFS (Common Internet File System), utilizado para compartir ficheros e impresoras en sistemas Windows. (A éste protocolo se le conocía como SMB Server Message Block con anterioridad a 1998).<\/li>\n<li>FTP (File Transfer Protocol). Se trata del protocolo de aplicación típico para la transferencia de ficheros sobre redes TCP/IP.<\/li>\n<li>SFTP (Secure FTP): Similar al FTP pero encapsulado en una conexión SSH.<\/li>\n<\/ul>\n<h2>SAN (Storage Area Network)<\/h2>\n<p>Una SAN, o red de almacenamiento consiste en conectar un conjunto de grandes almacenamientos con un conjunto de grandes servidores, utilizando enlaces de red, en este tipo de redes de almacenamiento se intenta no utilizar los protocolos de red o transporte habituales (como TCP, IP, UDP), ya que suponen una sobrecarga. Los almacenamientos funcionan a nivel de bloque o sector, que sirven a través de la red con protocolos sencillos, eso significa que los responsables de gestionar un sistema de ficheros son los ordenadores que hacen uso de los almacenamientos. La seguridad en SAN también debe realizarse a nivel de servidor, y no de almacenamiento. Además, las redes suelen ser locales y a cortas distancias, con lo que también se puede prestar atención la seguridad respecto al acceso físico.<\/p>\n<p>Una SAN puede mejorar la disponibilidad y/o la integridad, al alejar físicamente entre sí servidores y discos:<\/p>\n<ul>\n<li>Dos ordenadores pueden utilizar simultáneamente el mismo disco SAN. De esta forma, si un servidor deja de funcionar todos los datos están disponibles a través del otro servidor<\/li>\n<li>Las órdenes que envía un servidor pueden “duplicarse” y enviarse a dos discos SAN simultáneamente.<\/li>\n<\/ul>\n<h3>iSCSI SAN<\/h3>\n<p>Un caso particular de SAN lo forman las redes iSCSI (SCSI over Internet). Básicamente consisten en redes SAN, pero montadas sobre TCP/IP, y que hacen uso del protocolo SCSI para la transmisión de sectores a través de la red.<\/p>\n<ul>\n<li>Ventajas:\n<ul>\n<li>Pueden aprovechar infraestructuras de redes TCP.<\/li>\n<\/ul>\n<\/li>\n<li>Inconvenientes:\n<ul>\n<li>Una ligera sobrecarga con respecto a una SAN local sin protocolos de red y transporte.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h1>Sistemas de Ficheros Distribudos<\/h1>\n<p>Existen sistemas de ficheros pensados desde el principio para:<\/p>\n<ul>\n<li>Ser accedidos desde varios servidores<\/li>\n<li>Poder añadir capacidad según se necesite<\/li>\n<li>Presentar tolerancia a fallos<br />\nEjemplos de esto podrían ser CEPHFS o Hadoop.<\/li>\n<\/ul>\n<h1>El Respaldo de los Datos<\/h1>\n<p>Las copias de seguridad son una medida de seguridad pasiva para restaurar la información a un estado válido y reciente, de tal manera que el impacto de cualquier posible contingencia sea mínimo.<\/p>\n<p>Las copias de seguridad se realizan normalmente mediante aplicaciones especialmente diseñadas para ello. Estas aplicaciones, una vez configuradas funcionan de manera autónoma. Para configurarlas, a éstas aplicaciones se le indica una determinada programación:<\/p>\n<ul>\n<li>Donde<\/li>\n<li>Cuando y cada cuanto<\/li>\n<li>De que tipo<\/li>\n<li>Otros parámetros<\/li>\n<\/ul>\n<h2>Tipos de Copias de Seguridad<\/h2>\n<ul>\n<li>Según la intención con la que se realice la copia, podemos distinguir:\n<ul>\n<li>Back-up: Llamamos así a las copias de los archivos realizadas periódicamente, con intención de poder deshacer una posible pérdida de integridad en los datos originales, y revertir los datos a como estaban en un momento anterior en el tiempo.<\/li>\n<li>Archiving: Copiar los archivos para almacenar por un largo período de tiempo, sea por cuestiones legales como la contabilidad o por motivo de espacio, para retirar información antigua. Si se necesitan, se pueden restaurar.\n<ul>\n<li>Disaster recovery: Recuperar desde una situación en la que el sistema original está fuera de servicio. Se requiere entonces que la copia de seguridad permita restaurar totalmente los datos y el software del sistema.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/li>\n<li>Según la información que se guarde durante una copia, podemos distinguir:\n<ul>\n<li>Backup total: Se almacenan todos los datos. Es un procedimiento lento y requiere mucho espacio.<\/li>\n<li>Back-up diferencial: Se almacenan sólo los datos modificados después del último back-up total realizado.<\/li>\n<li>Back-up incremental: Se almacenan sólo los datos modificados desde el último back-up.<\/li>\n<\/ul>\n<\/li>\n<li>Según el sitio donde se guarde la copia, existen:\n<ul>\n<li>On-Site: La copia se guarda físicamente cerca de la información original.<\/li>\n<li>Off-Site: La copia se guarda físicamente lejos de la información original.<\/li>\n<\/ul>\n<\/li>\n<li>Según la accesibilidad de la copia, tenemos:\n<ul>\n<li>On-line: La copia puede accederse inmediatamente.<\/li>\n<li>Off-Line: La copia debe ser manipulada físicamente para poder leerse.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>Medios en los que se Guardan las Copias<\/h2>\n<p>Hay varios medios posibles para guardar copias de seguridad:<\/p>\n<ul>\n<li>Discos duros: No plantean problemas si rotamos las copias a través de varios discos y contamos con su deterioro con el tiempo.<\/li>\n<li>Dispositivos Flash: Tarjetas y pendrives son poco fiables. Los SSDs son algo más fiables, pero tienen un coste por GB elevado.<\/li>\n<li>Cintas magnéticas: Algo lentas, pero baratas. Mantienen los datos mucho tiempo y son fiables. Al ser un medio extraíble permiten almacenamiento off-site.<\/li>\n<li>Dispositivos ópticos. Son soportes poco fiables.<\/li>\n<li>A menudo se realizan copias de seguridad de los datos de un equipo en otro equipo de la red local, esto es adecuado mientras se produzca la rotación adecuada.<\/li>\n<li>Copias en equipos remotos (off-site) a través de una red:\n<ul>\n<li>Muy adecuadas, se envía una copia de la información lejos de la información original.<\/li>\n<li>Se pueden configurar en los programas de copia de seguridad.<\/li>\n<li>Existen muchas empresas que ofrecen almacenamiento remoto explícitamente diseñado para copias de seguridad. El coste suele ser elevado, pero garantizan el <em>disaster recovery<\/em> al ser copias off-site. Su configuración suele ser sencilla y además ofrecen medidas de seguridad especialmente pensadas para mantener a salvo las copias de seguridad, como la rotación de copias y la encriptación.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h2>Encriptación<\/h2>\n<p>Es necesario hacer notar que es importante almacenar las copias de seguridad cifradas, de tal manera que si alguien no autorizado se hace con una de ellas, la confidencialidad de los datos no se vea comprometida.<\/p>\n<h2>Políticas de respaldo<\/h2>\n<p>Una política de respaldos es una estrategia para realizar las copias de seguridad. Se definen todos los aspectos aquí descritos:<\/p>\n<ul>\n<li>Periodicidad\n<ul>\n<li>Cada cuánto se realiza una copia total<\/li>\n<li>Cuántas copias diferenciales o incrementales se basan en dicha copia<\/li>\n<li>Cuánto tiempo se conservan las copias<\/li>\n<\/ul>\n<\/li>\n<li>Localización: Qué copias se guardan onsite y cuáles offsite<\/li>\n<li>Programación: en qué momentos se realizan las copias<\/li>\n<li>Implementación: Qué programas se utilizan, y en qué medios deja las copias<\/li>\n<li>Configuración: Copias encriptadas, basadas en bit de archivo/fecha/contenidos<br />\nLa política de respaldo forma parte del plan de contingencia.<\/li>\n<li>La ejecución de las copias es parte del plan de respaldo.<\/li>\n<li>La recuperación de las copias es parte del plan de recuperación.<\/li>\n<\/ul>\n<h3>Diseño de las Políticas de Respaldo<\/h3>\n<p>Las tres reglas de oro del diseño de políticas de respaldo. Aplica tu sentido común a la hora de diseñar unas políticas de respaldo con los medios que tengas, pero no te olvides de ellas:<\/p>\n<ol>\n<li>Rotación, no usar el mismo medio para dos copias que vayan seguidas. Si el sistema falla durante un back-up, se perderán los datos originales y los del back-up, y no habrá otra copia para restaurar.<\/li>\n<li>Copias off-site: Siempre hay que asegurarse de guardar un back-up, de no más de una semana de antigüedad, fuera del sitio donde está su sistema.<\/li>\n<li>Back-up diario: Realizar un back-up cada día toma poco tiempo. La mayoría de los datos se vuelven obsoletos rápidamente. Utilice un medio distinto cada día de la semana.<\/li>\n<\/ol>\n"};
const $=s=>document.querySelector(s),sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
let S={done:{},known:{},wrong:{},best:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem('seg_ex1')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('seg_ex1',JSON.stringify(S))}catch(e){}};
let V='th',TP='all',FP=false,FI=0,FL=false,tm=null;
const tops=()=>T.filter(t=>TP==='all'||t.id===TP);
const VS=[['th','Resumen'],['ff','Full Flav'],['fc','Flashcards'],['ts','Test'],['ex','Examen'],['dv','Desarrollo'],['rv','Repaso'],['gl','Glosario'],['ch','Chuleta']];
function prog(){let n=T.length,k=T.filter(t=>S.done[t.id]).length;T.forEach(t=>{n+=t.c.length;t.c.forEach((_,j)=>{if(S.known[t.id+'c'+j]===1)k++})});const p=Math.round(100*k/n);$('#pg').style.width=p+'%';$('#pt').textContent=p+' % completado · '+Object.keys(S.wrong).length+' preguntas por repasar'}
function nav(){$('#nv').innerHTML=VS.map(v=>`<button class="${V===v[0]?'on':''}" onclick="V='${v[0]}';clearInterval(tm);R()">${v[1]}</button>`).join('');$('#tp').innerHTML=[['all','Todos']].concat(T.map(t=>[t.id,t.n])).map(t=>`<button class="${TP===t[0]?'on':''}" onclick="TP='${t[0]}';FI=0;FL=false;clearInterval(tm);R()">${t[1]}</button>`).join('');prog()}
function R(){nav();const m=$('#m');m.innerHTML='';m.classList.toggle('wide',V==='ff');({th,fc,ts,ex,dv,rv,gl,ch,ff})[V](m);window.scrollTo(0,0)}
function th(m){tops().forEach(t=>{m.insertAdjacentHTML('beforeend',`<h2>${t.n}</h2>`+t.th.map(s=>`<details><summary>${s[0]}</summary><div>${s[1]}</div></details>`).join('')+`<button onclick="S.done['${t.id}']=!S.done['${t.id}'];save();R()">${S.done[t.id]?'✓ Tema completado (quitar)':'Marcar tema como completado'}</button>`)});ces();va()}
function ces(){const a=$('#cs');if(!a)return;const n=+$('#cn').value||0;$('#co').textContent=a.value.replace(/[a-zñ]/gi,c=>{const A='abcdefghijklmnñopqrstuvwxyz';const i=A.indexOf(c.toLowerCase());return i<0?c:A[(i+n)%A.length]})}
function va(){const w=$('#w');if(!w)return;$('#vo').textContent=Math.ceil(w.value/0.7);$('#vo2').textContent=Math.round($('#am').value*230)}
function cards(){return tops().flatMap(t=>t.c.map((c,j)=>({k:t.id+'c'+j,t:t.n,q:c[0],a:c[1]}))).filter(c=>!FP||S.known[c.k]!==1)}
function fc(m){const L=cards();if(FI>=L.length)FI=0;m.innerHTML=`<label><input type="checkbox" ${FP?'checked':''} onchange="FP=this.checked;FI=0;R()"> Solo pendientes</label>`;if(!L.length){m.innerHTML+='<div class="card">🎉 ¡Todas dominadas!</div>';return}const c=L[FI];m.innerHTML+=`<p class="tag">${FI+1}/${L.length} · ${c.t}</p><div class="card fc ${FL?'back':''}" tabindex="0" role="button" onclick="FL=!FL;R()" onkeydown="if(event.key==' '||event.key=='Enter'){event.preventDefault();FL=!FL;R()}">${FL?c.a:'<b>'+c.q+'</b>'}</div><div class="row"><button onclick="mk('${c.k}',1)">✓ La sabía</button><button onclick="mk('${c.k}',0)">↻ Repasar</button></div><p class="tag">Pulsa la tarjeta (o Enter) para voltearla.</p>`}
function mk(k,v){S.known[k]=v;save();FI++;FL=false;R()}
function qs(){return tops().flatMap(t=>t.q.map((q,j)=>({k:t.id+j,t:t.n,q})))}
function ts(m){m.innerHTML=`<div class="card"><p>${qs().length} preguntas, con feedback inmediato.</p><button class="on" onclick="quiz(sh(qs()),true)">Empezar test</button></div>`}
function ex(m){m.innerHTML=`<div class="card"><p>Examen aleatorio de los temas seleccionados arriba. Sin feedback hasta el final.</p><label>Nº de preguntas: <input type="number" id="en" value="15" min="3" max="40" style="width:80px"></label> <label><input type="checkbox" id="ec" checked> Cronómetro</label><p><button class="on" onclick="quiz(sh(qs()).slice(0,+$('#en').value||15),false,$('#ec').checked)">Empezar examen</button></p></div>`}
function quiz(L,fb,clock){const m=$('#m');let i=0,res=[],t0=Date.now();clearInterval(tm);
function head(){return `<p class="tag">Pregunta ${i+1}/${L.length}${clock?' · ⏱ <span id="tc"></span>':''}</p>`}
if(clock)tm=setInterval(()=>{const e=$('#tc');if(e){const s=Math.floor((Date.now()-t0)/1000);e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}},500);
function rec(it,ok){res.push({it,ok});if(!ok)S.wrong[it.k]=2;else if(S.wrong[it.k]&&!--S.wrong[it.k])delete S.wrong[it.k];save();prog()}
function nxt(){i++;i<L.length?show():end()}
function show(){const it=L[i],q=it.q;if(q[2]==='o')return ord(it);
m.innerHTML=head()+`<div class="card"><b>${q[0]}</b>`+q[1].map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join('')+'<div id="fb"></div></div>';
m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const j=+b.dataset.j,ok=j===q[2];rec(it,ok);if(!fb)return nxt();m.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.j===q[2])x.classList.add('ok')});if(!ok)b.classList.add('ko');$('#fb').innerHTML=`<div class="fb ${ok?'ok':'ko'}"><b>${ok?'¡Correcto!':'Incorrecto.'}</b> ${q[3]}</div><p><button class="on" id="nx">Siguiente →</button></p>`;$('#nx').onclick=nxt;$('#nx').focus()})}
function ord(it){const q=it.q,pool=sh(q[1]),ch=[];function d(){m.innerHTML=head()+`<div class="card"><b>${q[0]}</b><p class="tag">Pulsa los pasos en el orden correcto.</p><ol>${ch.map(x=>`<li>${x}</li>`).join('')}</ol>`+pool.filter(x=>!ch.includes(x)).map(x=>`<button class="opt" data-v="${x}">${x}</button>`).join('')+'<div id="fb"></div></div>';m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ch.push(b.dataset.v);if(ch.length<pool.length)return d();const ok=ch.join('|')===q[1].join('|');rec(it,ok);if(!fb)return nxt();d();m.querySelectorAll('.opt').forEach(x=>x.disabled=true);$('#fb').innerHTML=`<div class="fb ${ok?'ok':'ko'}"><b>${ok?'¡Correcto!':'Orden incorrecto.'}</b> Orden: ${q[1].join(' → ')}. ${q[3]}</div><p><button class="on" id="nx">Siguiente →</button></p>`;$('#nx').onclick=nxt})}d()}
function end(){clearInterval(tm);const ok=res.filter(r=>r.ok).length,by={};res.forEach(r=>{by[r.it.t]=by[r.it.t]||[0,0];by[r.it.t][1]++;if(r.ok)by[r.it.t][0]++});const n=(10*ok/res.length).toFixed(1);
m.innerHTML=`<div class="card"><div class="big">${n} / 10</div><p>${ok} de ${res.length} aciertos${clock?' · '+Math.round((Date.now()-t0)/1000)+' s':''}.</p><table><tr><th>Tema</th><th>Aciertos</th></tr>${Object.entries(by).map(([k,v])=>`<tr><td>${k}</td><td>${v[0]}/${v[1]}</td></tr>`).join('')}</table></div>`+(res.some(r=>!r.ok)?'<h3>Para repasar</h3>'+res.filter(r=>!r.ok).map(r=>`<div class="card"><b>${r.it.q[0]}</b><p>${r.it.q[2]==='o'?r.it.q[1].join(' → '):'✓ '+r.it.q[1][r.it.q[2]]}</p><p class="tag">${r.it.q[3]}</p></div>`).join(''):'<p>🎉 Sin fallos.</p>');}
show()}
function dv(m){m.innerHTML='<p>La mitad del examen es de desarrollo: escribe tu respuesta y contrasta con los puntos clave.</p>';D.filter(d=>TP==='all'||d[0]===TP).forEach((d,i)=>{m.insertAdjacentHTML('beforeend',`<details><summary>${d[1]}</summary><div><textarea rows="5" placeholder="Escribe aquí tu respuesta…"></textarea><p><b>Puntos clave</b> (marca los que has cubierto):</p>${d[2].map(p=>`<label style="display:block"><input type="checkbox" onchange="dc(this)"> ${p}</label>`).join('')}<p class="tag dr"></p></div></details>`)})}
function dc(e){const d=e.closest('div'),c=d.querySelectorAll('input:checked').length,n=d.querySelectorAll('input').length;d.querySelector('.dr').textContent=`Cubiertos ${c}/${n}`+(c<n?' · repasa los que faltan':' · ¡completo!')}
function rv(m){const w=qs().filter(x=>S.wrong[x.k]),pc=T.flatMap(t=>t.c.map((c,j)=>({k:t.id+'c'+j,q:c[0],a:c[1]}))).filter(c=>S.known[c.k]===0);
m.innerHTML=`<h3>Preguntas falladas (${w.length})</h3>`+(w.length?`<button class="on" onclick="quiz(sh(qs().filter(x=>S.wrong[x.k])),true)">Practicar fallos</button>`+w.map(x=>`<div class="card">${x.q[0]}<p class="tag">${x.t}</p></div>`).join(''):'<p>Ninguna. Se eliminan al acertarlas dos veces.</p>')+`<h3>Flashcards por repasar (${pc.length})</h3>`+pc.map(c=>`<details><summary>${c.q}</summary><div>${c.a}</div></details>`).join('')}
function gl(m){m.innerHTML='<input type="search" id="gq" placeholder="Buscar término…" aria-label="Buscar en el glosario"><div id="gr"></div>';const f=()=>{const q=$('#gq').value.toLowerCase();$('#gr').innerHTML=T.flatMap(t=>t.c.map(c=>[t.n,c[0],c[1]])).filter(c=>(c[1]+c[2]).toLowerCase().includes(q)).map(c=>`<div class="card"><b>${c[1]}</b> <span class="tag">${c[0]}</span><br>${c[2]}</div>`).join('')};$('#gq').oninput=f;f()}
function ff(m){m.insertAdjacentHTML('beforeend','<p class="tag">Texto íntegro de los apuntes de mi queridísimo FLAVIUS (los .md), sin resumir.</p>');tops().forEach(t=>m.insertAdjacentHTML('beforeend',`<h2>${t.n}</h2><div class="md">${FF[t.id]}</div>`))}
function ch(m){tops().forEach(t=>m.insertAdjacentHTML('beforeend',`<div class="card"><h3>${t.n}</h3><ul>${t.s.map(x=>`<li>${x}</li>`).join('')}</ul></div>`))}
$('#th').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'};
$('#rs').onclick=()=>{if(confirm('¿Borrar todo el progreso?')){S={done:{},known:{},wrong:{},best:{}};save();R()}};
R();
</script></body></html>
