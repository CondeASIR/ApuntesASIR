table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{border:1px solid var(--bd);padding:5px 8px;text-align:left}th{background:var(--acs)}.sc{overflow-x:auto}

<script>
const T=[
{id:'p',n:'Privacidad y confidencialidad',
th:[['Autenticación',`<p>La <mark>confidencialidad</mark> es la propiedad por la que quien ve algo debería poder verlo. Para cumplirla hay que <mark>autenticar</mark> al usuario (implica una <i>demostración</i>), que no es lo mismo que <i>identificar</i>.</p><ul><li>Algo que <b>sabes</b> (información que solo conoce el usuario)</li><li>Algo que <b>tienes</b> (objeto que solo posee el usuario)</li><li>Algo que <b>eres</b> (biometría)</li></ul><p>Saber o tener solo indica que posees la credencial; la biometría sí puede autenticar que alguien es quien dice. Además, las dos primeras son “bits” y participan en la criptografía; la biometría no.</p>`],
['Criptografía: conceptos y usos',`<p>Del griego <i>kryptós</i> (oculto) y <i>graphein</i> (estudiar). <mark>Criptoanálisis</mark>: estudio para romper esas protecciones. Con una <b>clave</b> y un <b>algoritmo</b>, los bytes “en claro” pasan a bytes “encriptados”, y un usuario legítimo los restaura con la clave adecuada.</p><ul><li>Información <b>almacenada</b></li><li>Información <b>en movimiento</b>: nivel físico/enlace (proteger la LAN), red/transporte (si atraviesa otras redes), aplicación (extremo a extremo)</li><li><b>Desafío/respuesta</b>: evita que las contraseñas viajen</li><li><b>Firma digital</b>: integridad, autenticación y no repudio</li></ul>`],
['Criptografía simétrica',`<ul><li>Una <mark>única clave</mark> para cifrar y descifrar, comunicada antes de forma segura.</li><li>Algoritmo público; la seguridad exige claves suficientemente grandes. Poca capacidad de cálculo.</li><li><b>César</b>: sustitución desplazando letras (con 3: “En el parque…” → “Hq ho sdutx…”). Se ataca con medios muy básicos.</li><li><b>Sustitución</b>: el alfabeto desordenado es la clave.</li><li><b>DES</b> (1976): débil; el triple DES aún se usa en aplicaciones poco críticas. <b>AES</b> (2002): elegido por concurso, público, simétrico, claves de 128/192/256 bits, software y hardware.</li><li>Otros: Serpent, Twofish (evolución de Blowfish, más lento que AES), RC6 (RSA Security), Camellia, Salsa20, Chacha20…</li></ul>
<div class="card"><b>Prueba el César</b><input type="text" id="cs" value="en el parque a las cinco" oninput="ces()"><label>Desplazamiento: <input type="number" id="cn" value="3" min="1" max="25" style="width:80px" oninput="ces()"></label><p>→ <b id="co"></b></p></div>`],
['Criptografía asimétrica',`<ul><li>Dos claves por participante: <mark>pública</mark> (asociada a la identidad; la usa el otro para cifrar) y <mark>privada</mark> (secreto para descifrar). Se cifra con una y se descifra con la opuesta.</li><li>La seguridad reside en la clave. Es la más moderna (mitad del s. XX), muy segura pero costosa en CPU y memoria.</li><li>Se basa en <b>funciones de un solo sentido</b>: p. ej. <i>n = p × q</i> es fácil de calcular, pero factorizar n es muy lento. En <b>RSA</b> la clave pública contiene n y la privada p y q.</li><li>Firma: se firma con la privada y se comprueba con la pública.</li><li>Algoritmos: <b>RSA</b> (1977, el más usado), <b>Diffie-Hellman</b> (1976), <b>ElGamal</b> (1984, libre de regalías, usado en GnuPG), <b>ECC</b> (1985, curvas elípticas, claves más cortas y más rápido, con patentes).</li></ul>`],
['Desafío/respuesta, híbrida, resumen y firma',`<p><b>Desafío/respuesta</b> (p. ej. cliente Windows–servidor de dominio): A genera un mensaje aleatorio, B lo cifra con la clave y lo envía, A intenta descifrarlo; si puede, B conocía la clave.</p><p><b>Criptografía híbrida</b>: se usa asimétrica para intercambiar la clave simétrica y se sigue con simétrica. Canal seguro inicial sin el coste desmesurado posterior (así funciona HTTPS).</p><p><b>Resumen (hash)</b>: detecta cambios accidentales o deliberados; se envía con los datos y se recalcula. Evolución del CRC. Ejemplos: <b>MD5</b> (128 bits) y familia <b>SHA</b>.</p><p><b>Firma digital</b>: 1) se resume el documento, 2) se cifra el resumen con la clave privada, 3) se envían texto en claro + firma, 4) se verifica con la clave pública.</p>`],
['Aplicaciones: almacenamiento y red',`<ul><li><b>EFS</b>: cifra objetos con clave derivada de la contraseña; soporta AES-256, RSA y ECC (con certificado x509). Comando <i>cipher</i>.</li><li><b>BitLocker</b>: volúmenes fijos y extraíbles; AES por defecto (RSA/ECC con certificado), admite SmartCard como el DNIe. <i>BitLocker To Go</i> permite leer (no escribir) en sistemas sin BitLocker.</li><li>Comprimidos y copias de seguridad cifrados (.tar.gz, Cobian Backup).</li></ul>
<table><tr><th>WiFi</th><th>Cifrado</th><th>Estado</th></tr><tr><td>WEP</td><td>RC4 64/128 bits</td><td>Absolutamente inseguro</td></tr><tr><td>WPA</td><td>RC4 + TKIP</td><td>También inseguro</td></tr><tr><td>WPA2 (802.11i, 2004)</td><td>AES (extensible)</td><td>Única opción sensata</td></tr></table>
<p>WPA2 autentica con <b>PSK</b> (clave compartida; solo SoHo o redes sin información sensible) o con <b>802.1x</b> (servidor <b>RADIUS</b>, usuario y contraseña; clave única por usuario).</p><p><b>TLS/SSL</b> (red/transporte): handshake (algoritmo asimétrico, certificados, comprobación hasta la CA, negociación de clave simétrica) y luego tráfico simétrico. Sobre él van HTTPS, correo, RDP/VNC. PGP/GnuPG tiene su propio mecanismo.</p><p><b>HTTPS</b>: 1) el servidor envía su certificado x509, 2) el navegador comprueba la firma con la CA, 3) opcionalmente autentica al cliente, 4) el navegador elige una clave simétrica aleatoria, 5) la envía cifrada con la clave pública del servidor, 6) el servidor responde con datos cifrados simétricamente.</p>`]],
c:[['Autenticar vs identificar','Autenticar implica una demostración; identificar no.'],['Tres variantes de autenticación','Algo que sabes, algo que tienes y biometría (algo que eres).'],['Criptoanálisis','Práctica y estudio de romper las protecciones criptográficas.'],['Criptografía simétrica','Una única clave para cifrar y descifrar, comunicada previamente de forma segura.'],['Criptografía asimétrica','Dos claves por participante: pública (cifrar hacia ella) y privada (descifrar). Basada en funciones de un solo sentido.'],['AES','2002, sustituyó a DES, simétrico, claves de 128/192/256 bits, dominio público.'],['RSA','1977, el asimétrico más usado; la pública contiene n=p×q y la privada p y q.'],['Criptografía híbrida','Asimétrica para intercambiar la clave simétrica; después simétrica.'],['Firma digital: garantías','Integridad, autenticación y no repudio.'],['Firma digital: mecanismo','Resumir, cifrar el resumen con la privada, enviar texto + firma, verificar con la pública.'],['Algoritmo de resumen','Detecta cambios accidentales o deliberados. MD5 y SHA.'],['WPA2-PSK vs 802.1x','PSK: clave compartida (SoHo). 802.1x: servidor RADIUS y clave única por usuario.'],['TLS/SSL','Transporte cifrado y autenticable extremo a extremo con certificados x509 y PKI.'],['Desafío/respuesta','Evita que la contraseña viaje: se prueba que el otro conoce la clave descifrando un mensaje aleatorio.'],['BitLocker To Go','Programa sin cifrar en la unidad extraíble: permite leer, no escribir, en sistemas sin BitLocker.']],
q:[['¿Qué diferencia a autenticar de identificar?',['Autenticar implica una demostración','Identificar exige biometría','Son sinónimos','Autenticar solo usa contraseñas'],0,'Identificar es decir quién eres; autenticar es demostrarlo.'],
['La biometría se diferencia de saber o tener algo en que…',['Es más barata','Puede autenticar que alguien es quien dice y no participa en la criptografía como bits','Siempre es simétrica','No requiere hardware'],1,'Contraseñas y objetos son bits que participan en la criptografía; la biometría no.'],
['En RSA, la clave pública contiene…',['p y q','El número n','La clave simétrica','El resumen del mensaje'],1,'Pública: n. Privada: p y q por separado.'],
['Verdadero o falso: en criptografía simétrica la clave puede intercambiarse en abierto.',['Verdadero','Falso'],1,'Debe haberse comunicado previamente de forma segura. Ese problema lo resuelve la asimétrica.'],
['¿Por qué se usa criptografía híbrida?',['Porque la simétrica es más insegura','Para evitar el elevado coste de CPU de la asimétrica tras el intercambio inicial','Porque AES no admite claves grandes','Para no usar certificados'],1,'Asimétrica para negociar la clave; simétrica para el resto, que es mucho más ligera.'],
['La firma digital NO garantiza…',['Integridad','No repudio','Confidencialidad del contenido','Autenticación'],2,'Garantiza integridad, autenticación y no repudio; el texto viaja en claro junto a la firma.'],
['Ordena el mecanismo de la firma digital',['Resumir el documento','Cifrar el resumen con la clave privada','Enviar texto en claro y firma','Verificar con la clave pública'],'o','Resumen → cifrado con privada → envío → verificación con pública.'],
['¿Qué cifrado WiFi es “la única opción sensata” según los apuntes?',['WEP','WPA con TKIP','WPA2 con AES','RC4 de 128 bits'],2,'WEP y WPA (RC4) son inseguros; WPA2 introduce AES.'],
['En una conexión HTTPS, ¿con qué se cifra la clave simétrica elegida por el navegador?',['Con la clave privada del navegador','Con la clave pública del servidor','Con la clave pública de la CA','No se cifra'],1,'Solo el servidor, con su clave privada, puede descifrarla.'],
['Verdadero o falso: el servidor siempre debe enviar un certificado en el handshake TLS.',['Verdadero','Falso'],0,'La autenticación del cliente es opcional; la del servidor se basa en su certificado.']],
s:['Autenticar ≠ identificar; sabes / tienes / eres.','Simétrica: 1 clave, rápida (AES). Asimétrica: 2 claves, costosa (RSA, ElGamal, ECC).','Híbrida = asimétrica para la clave + simétrica para los datos (HTTPS/TLS).','Firma = resumen cifrado con la privada → integridad, autenticación, no repudio.','WEP y WPA inseguros; WPA2-AES con PSK (SoHo) o 802.1x/RADIUS.']},
{id:'k',n:'PKI',
th:[['El problema de la identidad',`<p>La asimétrica depende de difundir una clave pública <b>asociada a una identidad</b>. Cualquiera puede publicar una clave suplantando a otro, por eso hace falta un mecanismo para <mark>autenticar la identidad</mark> de los receptores.</p>`],
['PGP y el anillo de confianza',`<ul><li>PGP (1991): intercambio de mensajes cifrados con asimétrica. GnuPG (GNU) es parecido y en cierto modo compatible.</li><li>Servidores de claves públicas: válidos para <b>pequeñas organizaciones</b>; cuanto mayor es el conjunto de usuarios, más fácil es suplantar una clave.</li><li><mark>Anillo de confianza</mark>: si alguien garantiza el certificado de otra persona, lo firma; quien confía en el firmante confía también en el certificado original.</li></ul>`],
['x509 y la PKI',`<ul><li>Estándar de la ITU usado en <b>HTTPS</b>, el <b>DNIe</b> y el certificado de la <b>FNMT</b> (firma digital en España).</li><li>Un <b>certificado</b> contiene al menos uno de: datos de identificación, clave privada, clave pública, firma digital.</li><li>Las <mark>CA</mark> (Autoridades de Certificación) firman los certificados que otros generan; sus claves públicas vienen incluidas en navegadores y sistemas operativos.</li><li><b>Ruta de certificación</b>: si el emisor no es una CA, su certificado va firmado por otra entidad, y así hasta llegar a la CA. La <b>PKI</b> es la infraestructura que permite verificar identidades a partir de estos certificados.</li></ul><div class="extra">Los apuntes dicen que un certificado puede contener “una clave privada”. En la práctica un certificado que se hace público no incluye la privada; conviene aclararlo con el profesor.</div>`],
['Revocación',`<ul><li>Se revoca por razones administrativas o por sospecha de pérdida de control de la clave privada.</li><li>Suele ser un formulario web de la entidad emisora tras autenticar al usuario.</li><li>Los certificados incluyen una <b>URL de comprobación de vigencia</b> que los programas deben consultar.</li><li>La revocación es <mark>irreversible</mark>: hace falta un certificado nuevo.</li></ul>`]],
c:[['PGP','Programa de 1991 para mensajes cifrados con asimétrica. GnuPG es el equivalente GNU, parcialmente compatible.'],['Anillo de confianza','Quien garantiza un certificado lo firma; confiar en el firmante implica confiar en el certificado.'],['x509','Estándar de la ITU para certificados: HTTPS, DNIe, certificado FNMT.'],['Certificado','Fichero con al menos uno de: identidad, clave privada, clave pública, firma digital.'],['CA','Autoridad de Certificación: firma certificados; sus claves públicas vienen en navegadores y SO.'],['Ruta de certificación','Cadena de firmas desde el certificado hasta una CA de confianza.'],['PKI','Infraestructura que permite verificar identidades mediante certificados x509.'],['Revocación','Invalidar un certificado (pérdida de la privada, razones administrativas). Es irreversible.'],['URL de vigencia','Incluida en el certificado; los programas la consultan para saber si fue revocado.']],
q:[['¿Por qué los servidores de claves públicas PGP no escalan bien?',['Son lentos','Cuantos más usuarios, más fácil suplantar una clave','Solo admiten RSA','No permiten firmar'],1,'Sin autenticación externa de identidades, la suplantación se facilita al crecer el conjunto.'],
['Verdadero o falso: en el anillo de confianza, si confío en quien firma un certificado, confío también en ese certificado.',['Verdadero','Falso'],0,'Esa es la base del anillo de confianza de PGP.'],
['¿Quién mantiene el estándar x509?',['IEEE','ITU','FNMT','GNU'],1,'La FNMT emite certificados; el estándar lo propuso la ITU.'],
['¿Cómo se verifica un certificado cuyo emisor no es una CA?',['Se acepta sin más','Se sigue la ruta de certificación hasta llegar a una CA','Se consulta al usuario','Se descifra con la clave privada'],1,'Cada certificado va firmado por otra entidad hasta llegar a una CA.'],
['¿Dónde están las claves públicas de las CA habituales?',['En cada servidor web','En las distribuciones de navegadores y sistemas operativos','En la FNMT únicamente','En el DNIe'],1,'Por eso el navegador puede validar firmas de CA sin preguntar.'],
['Tras revocar un certificado…',['Se puede reactivar','Es irreversible y se necesita uno nuevo','Caduca en 24 horas','Solo se bloquea la clave pública'],1,'La revocación no puede deshacerse.'],
['¿Cómo saben los programas si un certificado fue revocado?',['Preguntan al usuario','Consultan la URL de comprobación de vigencia incluida en el certificado','Comparan el hash con MD5','No pueden saberlo'],1,'La entidad emisora responde si sigue vigente.']],
s:['PGP: anillo de confianza, bueno para organizaciones pequeñas.','x509: HTTPS, DNIe, FNMT. Certificados firmados por CAs.','Ruta de certificación hasta una CA cuya pública ya está en el navegador/SO.','Revocar (irreversible) si se pierde la privada; se comprueba por URL de vigencia.']},
{id:'f',n:'Seguridad física',
th:[['Estaciones de trabajo, servidores y grupos de trabajo',`<ul><li><b>Estaciones</b> = clientes (donde se trabaja); <b>servidores</b> = prestadores de servicios, nadie debería trabajar en ellos. Esto da control de la información, facilidad de administración y seguridad centrada en servidores. En estaciones sin información solo hay que cuidar la confidencialidad.</li><li><b>SOHO</b>: puede usar <i>workgroup</i> (sin servidores dedicados, todos pueden serlo). Cómodo para infraestructuras muy pequeñas, pero dificulta administración y protección.</li></ul>`],
['Acceso físico de personas',`<ul><li><b>Cerraduras</b>: poseer algo, saber algo, exhibir una característica o intercambiar claves.</li><li><b>Vigilantes</b>: control de accesos, control de sistemas de seguridad y vigilancia de bienes y personas (con posibilidad de represión). Funciones activas, a veces pasivas.</li><li><b>Cámaras</b>: medida <i>pasiva</i> si solo graban; <i>activa</i> si hay un vigilante.</li><li><b>Alarma antiintrusos</b>: módulo central, consola, detectores de presencia (microondas, ultrasonidos, temperatura), detectores de apertura/rotura, batería auxiliar, pulsadores de emergencia, sirena y luces disuasorias. Conectada a línea fija y, de forma redundante, a móvil. Sensores en estrella y cableado guiado.</li></ul>`],
['Temperatura, humedad, polvo y agua',`<ul><li><b>Temperatura</b>: rango adecuado 25–28 ºC, conveniente y económica.</li><li><b>Humedad relativa</b>: 40–50 % recomendado, nunca más de 80 %. Deshumidificador: condensa el agua y la expulsa.</li><li><b>Polvo</b>: recubre circuitos (humedad, óxido), se adhiere a lectores y piezas móviles. Soluciones: filtros, aire acondicionado del CPD (filtra y deshumidifica), equipos herméticos.</li><li><b>Agua</b>: baños lejos del hardware (o desagües y absorción), lejos de ventanas, hardware elevado y nunca directamente sobre el suelo.</li></ul><div class="extra">Los 25–28 ºC son los de tus apuntes; es un rango más alto que el habitual en muchas guías. Estudia el de tus apuntes para el examen.</div>`],
['Fuego',`<ul><li><b>Barreras</b>: muros resistentes al fuego (sellados con masillas ignífugas), <b>puertas cortafuegos</b> (se cierran solas, rótulo “DF” + minutos) y <b>compuertas</b> en conductos (cierre automático).</li><li><b>Detectores</b>: la central puede ser de incendios o <b>mixta</b> (con intrusión). Sirena, extinción automática, aviso a empresa de seguridad o al 112.</li><li><b>Extinción automática</b>: agua nebulizada, gas <b>inergen</b> (N₂+Ar+CO₂, desplaza oxígeno), gases limpios HF (FE13, FM200: enfrían la llama, menos tóxicos que el CO₂) y halones (<b>prohibidos</b> por la capa de ozono). <b>Manual</b>: extintores.</li><li><b>Evacuación</b>: UNE 23034:2023, señales verdes en lugares altos.</li></ul>
<div class="sc"><table><tr><th>Clase</th><th>Combustible</th><th>Polvo ABC</th><th>CO₂</th><th>Agua</th><th>Espuma</th></tr><tr><td>A</td><td>Sólidos</td><td>✓✓</td><td>✓</td><td>✓✓</td><td>✓✓</td></tr><tr><td>B</td><td>Líquidos</td><td>✓✓</td><td>✓✓</td><td>×</td><td>✓✓</td></tr><tr><td>C</td><td>Gases</td><td>✓✓</td><td>✓✓</td><td>×</td><td>×</td></tr><tr><td>D</td><td>Metales</td><td>×</td><td>×</td><td>×</td><td>×</td></tr><tr><td>F</td><td>Aceites cocina</td><td>×</td><td>×</td><td>××</td><td>×</td></tr><tr><td>Litio</td><td>Baterías Li-ion</td><td>✓ superf.</td><td>✓ superf.</td><td>✓ grandes cant.</td><td>—</td></tr></table></div><p class="tag">Clase F: eficaz con agente clase F. Litio: eficaz con agente específico de litio. Fuente: ISO 3941.</p>`],
['El CPD y los niveles Tier',`<p>Un <b>CPD</b> aloja redes, ordenadores y recursos de una o varias organizaciones. Riesgos y medidas: electricidad (acometidas duplicadas de distintas compañías, SAI, grupos electrógenos), LAN (duplicar redes), WAN (duplicar proveedores), clima/incendios, acceso físico. Construcción: suelos de alta carga, <b>doble suelo</b> (electrocución e inundación), antisísmica, ignífuga, aislamiento térmico, bahías de carga. Ubicación: coste, servicios, electricidad, pocas catástrofes, transporte. Posible duplicado completo en sede remota.</p>
<div class="sc"><table><tr><th>Tier</th><th>Nombre</th><th>Disp.</th><th>Clave</th></tr><tr><td>I</td><td>Básico</td><td>99,671 %</td><td>Sin redundancia; parada anual por mantenimiento</td></tr><tr><td>II</td><td>Redundante</td><td>99,741 %</td><td>N+1, una única línea; mantener requiere parar</td></tr><tr><td>III</td><td>Concurrentemente mantenible</td><td>99,982 %</td><td>N+1, varias líneas con una activa; mantenimiento sin parar</td></tr><tr><td>IV</td><td>Tolerante a fallos</td><td>99,995 %</td><td>2(N+1), varias líneas activas</td></tr></table></div>`],
['Electricidad y protecciones',`<ul><li>España: corriente alterna, <b>230 V</b> (±7 %: 213–247 V), <b>50 Hz</b>; luego se pasa a continua en los dispositivos.</li><li><b>ICP</b>: tras el contador, controla que no se supere la potencia contratada (más control de consumo que seguridad).</li><li><b>Magnetotérmico</b> (“C” + amperios): magnético contra cortocircuitos, térmico contra sobrecargas; salta el más cercano.</li><li><b>Diferencial</b> (botón “T” de Test): protege a las personas de derivaciones a tierra.</li><li><b>Tierra</b>: fase roja/marrón/negra, neutro azul, tierra amarillo-verde. Schuko garantiza fugas a tierra. <b>Doble aislamiento</b> (dos cuadrados concéntricos): no necesita tierra.</li><li><b>Ladrones</b> solo si es imprescindible. <mark>Nunca</mark> un adaptador de entrada Europlug (2,5 A) con conector Schuko (hasta 16 A).</li><li>Potencia en continua: <i>P = V × I</i>.</li><li>Problemas: ausencia, microcorte, bajada, subida, pico, ruido eléctrico, alteración de frecuencia.</li><li><b>AVR</b>: salida de 230 V, solo trabaja entre ~175 y 275 V de entrada; suele ir dentro de los SAI.</li></ul>`],
['SAI / UPS',`<ul><li>Aparato con baterías (plomo-ácido) que da corriente cuando falta suministro. Pasos: <b>cargador</b> (AC→DC), batería, <b>inversor</b> (DC→AC). Con software de monitorización: hibernar, vaciar cachés, apagar de forma segura.</li><li><b>Off-line (stand-by)</b>: el más común y barato; conmutador vigila la red y pasa a batería (hay <i>tiempo de conmutación</i>).</li><li><b>Interactivo</b>: off-line con <b>AVR</b> en la entrada.</li><li><b>On-line (doble conversión)</b>: gama alta, sin conmutador, la salida sale siempre de la batería. Lleva <b>by-pass</b> para cambiar la batería sin cortar el suministro.</li><li>En rack, abajo: tomas eléctricas y peso de las baterías.</li><li><b>Grupo electrógeno</b>: gasoil, conmutación larga y mucho mantenimiento; el SAI sirve de puente.</li></ul>
<div class="card"><b>Calculadora de VA</b><label>Potencia del equipo (W): <input type="number" id="w" value="500" min="0" oninput="va()"></label><p>VA mínimos ≈ W / 0,7 = <b id="vo"></b> VA</p><label>O intensidad (A): <input type="number" id="am" value="2" min="0" step="0.1" oninput="va()"></label><p>VA = A × 230 = <b id="vo2"></b> VA</p></div>`]],
c:[['Workgroup','Modelo SOHO sin servidores dedicados; todos pueden serlo. Cómodo pero difícil de administrar y proteger.'],['Cámara de seguridad','Medida pasiva si solo graba; activa si hay un vigilante.'],['Rango de humedad para equipos','40–50 % recomendado; nunca superar el 80 %.'],['Puerta cortafuegos','Se cierra sola; rótulo DF + minutos de resistencia.'],['Compuerta cortafuegos','En conductos, cierre automático para que no se propague el fuego.'],['Halones','Hidrocarburos halogenados, prohibidos por su efecto sobre la capa de ozono.'],['Gas inergen','Mezcla de N₂, Ar y CO₂ que sustituye el oxígeno e impide la combustión.'],['Tier III','99,982 %. Mantenimiento sin afectar al servicio, varias líneas con una activa. Aun así, eventos no planeados pueden parar.'],['Tier IV','99,995 %. Tolerante a fallos, 2(N+1), varias líneas activas.'],['Tensión en España','230 V (±7 %) a 50 Hz.'],['ICP','Controla la potencia contratada, tras el contador.'],['Magnetotérmico','Magnético: cortocircuitos. Térmico: sobrecargas.'],['Diferencial','Protege a las personas de derivaciones; botón T de test.'],['AVR','Estabilizador: salida de 230 V con entrada de ~175–275 V.'],['SAI on-line','Doble conversión; salida siempre desde batería; lleva by-pass.'],['VA desde vatios','VA = W / 0,7 (factor por desfase tensión–intensidad).']],

th:[['Medios de almacenamiento',`<p>Dos usos: información en uso y <b>respaldo</b>. <b>Redundancia</b>: guardar en varios sitios/formas para seguir trabajando ante un fallo. <b>Respaldo</b>: copia deliberada para reconstruir solo en caso de pérdida.</p>
<div class="sc"><table><tr><th>Medio</th><th>Pros</th><th>Contras / uso</th></tr><tr><td>HDD</td><td>Rápido, gran capacidad, buen coste/GB, poca degradación al escribir</td><td>Vida útil de unos años; extraíble es delicado</td></tr><tr><td>Cinta</td><td>Años de retención, coste/GB bajo, extraíble</td><td>Secuencial y lenta; casi solo respaldo</td></tr><tr><td>Óptico (CD/DVD/Blu-ray)</td><td>Coste/GB muy bajo</td><td>Delicado, sensible a temperatura; multimedia y distribución</td></tr><tr><td>Pendrive/tarjeta</td><td>Portátil, resistente</td><td>Lento, poca capacidad, caro/GB, se degrada sin uso, ciclos limitados, fácil de perder</td></tr><tr><td>SSD</td><td>Rápido, sin partes móviles, ahorra energía</td><td>Caro/GB, vida media incierta</td></tr></table></div>
<p>Unidades: sistema métrico (kB=10³, MB=10⁶, GB=10⁹, TB=10¹²…) y binario (KiB=2¹⁰, MiB=2²⁰, GiB=2³⁰, TiB=2⁴⁰…).</p>`],
['RAID',`<p>RAID = Redundant Array of Independent Disks. Pensado para HDD por su vida útil limitada.</p><ul><li><b>RAID 0</b>: sin redundancia, solo velocidad (reparte operaciones entre discos); hace el sistema más vulnerable.</li><li><b>RAID 1</b> (mirroring): mínimo 2 discos, copia exacta.</li><li><b>RAID 5</b> (striping con paridad simple distribuida): mínimo 4 discos según los apuntes; la paridad ocupa un disco.</li><li><b>RAID 6</b> (doble paridad, Reed-Solomon): sobrevive a un segundo fallo durante la emergencia; paridad = 2 discos.</li><li><b>5E/6E</b>: disco de reserva en blanco que solo se usa en un fallo.</li><li>Combinados (0+1, 1+0, 5+0): seguridad y velocidad, con más discos.</li></ul>
<p><b>Implementación</b>: en placa base (estaciones: RAID 0/1; servidores: todos), o dispositivo independiente (sobremesa o rack, con <i>caddies</i>). RAID por software: más complejo, penaliza el rendimiento y dificulta la recuperación. <b>Modo de emergencia</b>: el disco fallido se marca inutilizado, el sistema avisa y debe sustituirse cuanto antes por otro igual o mayor; <b>hot swap</b> sin apagar.</p><div class="extra">Regla mnemotécnica: capacidad perdida en paridad: RAID 5 = 1 disco, RAID 6 = 2 discos, RAID 1 = la mitad.</div>`],
['DAS, NAS, SAN',`<ul><li><b>DAS</b>: conectado directamente a un ordenador (SATA, SCSI, eSATA, USB…). Operaciones por <i>sectores</i>.</li><li><b>NAS</b>: almacenamiento en red con mini-SO y servicio de ficheros (NFS, CIFS/SMB, FTP, SFTP). Operaciones por <i>ficheros</i>. Seguridad con ACLs. Puede ser cuello de botella.</li><li><b>SAN</b>: grandes almacenamientos y servidores por enlaces de red, sin TCP/IP habituales para evitar sobrecarga. Trabaja a nivel de <i>bloque</i>: los servidores gestionan el sistema de ficheros y la seguridad. Mejora disponibilidad e integridad (dos servidores sobre el mismo disco, duplicar órdenes en dos discos).</li><li><b>iSCSI</b>: SAN sobre TCP/IP con SCSI. Pro: aprovecha redes TCP. Contra: ligera sobrecarga.</li><li><b>Sistemas de ficheros distribuidos</b> (CephFS, Hadoop): acceso desde varios servidores, ampliables y tolerantes a fallos.</li></ul>`],
['Copias de seguridad',`<p>Son una medida de seguridad <mark>pasiva</mark> para restaurar la información a un estado válido y reciente. Se programan: dónde, cuándo y cada cuánto, de qué tipo y otros parámetros.</p><ul><li><b>Intención</b>: back-up (deshacer pérdida de integridad), archiving (almacenar largo plazo por motivos legales o de espacio), disaster recovery (restaurar totalmente datos y software).</li><li><b>Contenido</b>: <b>total</b> (todo, lento, mucho espacio), <b>diferencial</b> (cambios desde la última total), <b>incremental</b> (cambios desde la última copia).</li><li><b>Lugar</b>: on-site / off-site. <b>Accesibilidad</b>: on-line / off-line.</li><li><b>Medios</b>: HDD rotando, flash poco fiable, cintas (lentas, baratas, fiables, off-site), ópticos poco fiables, otro equipo de la LAN (con rotación), remoto off-site (caro, garantiza disaster recovery, con rotación y cifrado).</li><li><b>Cifrado</b>: las copias deben guardarse cifradas para mantener la confidencialidad si caen en manos no autorizadas.</li></ul>`],
['Políticas de respaldo',`<p>Estrategia que define: <b>periodicidad</b> (cada cuánto total, cuántas diferenciales/incrementales, tiempo de conservación), <b>localización</b> (on/off-site), <b>programación</b>, <b>implementación</b> (programas y medios) y <b>configuración</b> (cifrado, bit de archivo/fecha/contenido). Forma parte del <b>plan de contingencia</b>: ejecutar copias es el <i>plan de respaldo</i>; recuperarlas es el <i>plan de recuperación</i>.</p><p><mark>Tres reglas de oro</mark>:</p><ol><li><b>Rotación</b>: no usar el mismo medio en dos copias seguidas (si falla durante un back-up pierdes original y copia).</li><li><b>Off-site</b>: guardar siempre una copia de no más de una semana fuera del sitio.</li><li><b>Back-up diario</b>, con un medio distinto cada día de la semana.</li></ol>`]],
c:[['Redundancia','Almacenar la información en varios sitios o formas para seguir trabajando ante un fallo.'],['Respaldo','Copia deliberada para reconstruir la información original solo en caso de pérdida.'],['RAID 0','No redundante: solo velocidad; hace el sistema más vulnerable.'],['RAID 1','Mirroring: copia exacta en al menos dos discos.'],['RAID 5','Striping con paridad simple distribuida; la paridad ocupa un disco.'],['RAID 6','Doble paridad (Reed-Solomon); tolera un segundo fallo en emergencia.'],['RAID 5E/6E','Añaden disco de reserva en blanco usado solo al fallar.'],['Hot swap','Cambiar el disco fallido sin apagar equipos ni almacenamiento (caddies).'],['DAS','Almacenamiento conectado directamente a un ordenador; opera por sectores.'],['NAS','Almacenamiento en red con servicio de ficheros (NFS, CIFS, FTP, SFTP).'],['SAN','Red de almacenamiento a nivel de bloque; el servidor gestiona el sistema de ficheros y la seguridad.'],['iSCSI','SAN sobre TCP/IP usando SCSI.'],['Back-up diferencial','Datos modificados desde el último back-up total.'],['Back-up incremental','Datos modificados desde el último back-up (de cualquier tipo).'],['Off-site','Copia guardada físicamente lejos de la información original.'],['Reglas de oro del respaldo','Rotación, copia off-site (≤ 1 semana) y back-up diario.']],

try{Object.assign(S,JSON.parse(localStorage.getItem('seg_ex1')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('seg_ex1',JSON.stringify(S))}catch(e){}};
let V='th',TP='all',FP=false,FI=0,FL=false,tm=null;
const tops=()=>T.filter(t=>TP==='all'||t.id===TP);
const VS=[['th','Teoría'],['fc','Flashcards'],['ts','Test'],['ex','Examen'],['dv','Desarrollo'],['rv','Repaso'],['gl','Glosario'],['ch','Chuleta']];
function prog(){let n=T.length,k=T.filter(t=>S.done[t.id]).length;T.forEach(t=>{n+=t.c.length;t.c.forEach((_,j)=>{if(S.known[t.id+'c'+j]===1)k++})});const p=Math.round(100*k/n);$('#pg').style.width=p+'%';$('#pt').textContent=p+' % completado · '+Object.keys(S.wrong).length+' preguntas por repasar'}
function nav(){$('#nv').innerHTML=VS.map(v=>`<button class="${V===v[0]?'on':''}" onclick="V='${v[0]}';clearInterval(tm);R()">${v[1]}</button>`).join('');$('#tp').innerHTML=[['all','Todos']].concat(T.map(t=>[t.id,t.n])).map(t=>`<button class="${TP===t[0]?'on':''}" onclick="TP='${t[0]}';FI=0;FL=false;clearInterval(tm);R()">${t[1]}</button>`).join('');prog()}
function R(){nav();const m=$('#m');m.innerHTML='';({th,fc,ts,ex,dv,rv,gl,ch})[V](m);window.scrollTo(0,0)}
function th(m){tops().forEach(t=>{m.insertAdjacentHTML('beforeend',`<h2>${t.n}</h2>`+t.th.map(s=>`<details><summary>${s[0]}</summary><div>${s[1]}</div></details>`).join('')+`<button onclick="S.done['${t.id}']=!S.done['${t.id}'];save();R()">${S.done[t.id]?'✓ Tema completado (quitar)':'Marcar tema como completado'}</button>`)});ces();va()}
function ces(){const a=$('#cs');if(!a)return;const n=+$('#cn').value||0;$('#co').textContent=a.value.replace(/[a-zñ]/gi,c=>{const A='abcdefghijklmnñopqrstuvwxyz';const i=A.indexOf(c.toLowerCase());return i<0?c:A[(i+n)%A.length]})}
function va(){const w=$('#w');if(!w)return;$('#vo').textContent=Math.ceil(w.value/0.7);$('#vo2').textContent=Math.round($('#am').value*230)}
function cards(){return tops().flatMap(t=>t.c.map((c,j)=>({k:t.id+'c'+j,t:t.n,q:c[0],a:c[1]}))).filter(c=>!FP||S.known[c.k]!==1)}
function fc(m){const L=cards();if(FI>=L.length)FI=0;m.innerHTML=`<label><input type="checkbox" ${FP?'checked':''} onchange="FP=this.checked;FI=0;R()"> Solo pendientes</label>`;if(!L.length){m.innerHTML+='<div class="card">🎉 ¡Todas dominadas!</div>';return}const c=L[FI];m.innerHTML+=`<p class="tag">${FI+1}/${L.length} · ${c.t}</p><div class="card fc ${FL?'back':''}" tabindex="0" role="button" onclick="FL=!FL;R()" onkeydown="if(event.key==' '||event.key=='Enter'){event.preventDefault();FL=!FL;R()}">${FL?c.a:'<b>'+c.q+'</b>'}</div><div class="row"><button onclick="mk('${c.k}',1)">✓ La sabía</button><button onclick="mk('${c.k}',0)">↻ Repasar</button></div><p class="tag">Pulsa la tarjeta (o Enter) para voltearla.</p>`}
function mk(k,v){S.known[k]=v;save();FI++;FL=false;R()}
function qs(){return tops().flatMap(t=>t.q.map((q,j)=>({k:t.id+j,t:t.n,q})))}
function ts(m){m.innerHTML=`<div class="card"><p>${qs().length} preguntas, con feedback inmediato.</p><button class="on" onclick="quiz(sh(qs()),true)">Empezar test</button></div>`}
function ex(m){m.innerHTML=`<div class="card"><p>Examen aleatorio de los temas seleccionados arriba. Sin feedback hasta el final.</p><label>Nº de preguntas: <input type="number" id="en" value="15" min="3" max="40" style="width:80px"></label> <label><input type="checkbox" id="ec" checked> Cronómetro</label><p><button class="on" onclick="quiz(sh(qs()).slice(0,+$('#en').value||15),false,$('#ec').checked)">Empezar examen</button></p></div>`}
function quiz(L,fb,clock){const m=$('#m');let i=0,res=[],t0=Date.now();clearInterval(tm);
function head(){return `<p class="tag">Pregunta ${i+1}/${L.length}${clock?' · ⏱ <span id="tc"></span>':''}</p>`}
if(clock)tm=setInterval(()=>{const e=$('#tc');if(e){const s=Math.floor((Date.now()-t0)/1000);e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}},500);
function rec(it,ok){res.push({it,ok});if(!ok)S.wrong[it.k]=2;else if(S.wrong[it.k]&&!--S.wrong[it.k])delete S.wrong[it.k];save();prog()}
function nxt(){i++;i<L.length?show():end()}
function show(){const it=L[i],q=it.q;if(q[2]==='o')return ord(it);
m.innerHTML=head()+`<div class="card"><b>${q[0]}</b>`+q[1].map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join('')+'<div id="fb"></div></div>';
m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const j=+b.dataset.j,ok=j===q[2];rec(it,ok);if(!fb)return nxt();m.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.j===q[2])x.classList.add('ok')});if(!ok)b.classList.add('ko');$('#fb').innerHTML=`<div class="fb ${ok?'ok':'ko'}"><b>${ok?'¡Correcto!':'Incorrecto.'}</b> ${q[3]}</div><p><button class="on" id="nx">Siguiente →</button></p>`;$('#nx').onclick=nxt;$('#nx').focus()})}
function ord(it){const q=it.q,pool=sh(q[1]),ch=[];function d(){m.innerHTML=head()+`<div class="card"><b>${q[0]}</b><p class="tag">Pulsa los pasos en el orden correcto.</p><ol>${ch.map(x=>`<li>${x}</li>`).join('')}</ol>`+pool.filter(x=>!ch.includes(x)).map(x=>`<button class="opt" data-v="${x}">${x}</button>`).join('')+'<div id="fb"></div></div>';m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ch.push(b.dataset.v);if(ch.length<pool.length)return d();const ok=ch.join('|')===q[1].join('|');rec(it,ok);if(!fb)return nxt();d();m.querySelectorAll('.opt').forEach(x=>x.disabled=true);$('#fb').innerHTML=`<div class="fb ${ok?'ok':'ko'}"><b>${ok?'¡Correcto!':'Orden incorrecto.'}</b> Orden: ${q[1].join(' → ')}. ${q[3]}</div><p><button class="on" id="nx">Siguiente →</button></p>`;$('#nx').onclick=nxt})}d()}
function end(){clearInterval(tm);const ok=res.filter(r=>r.ok).length,by={};res.forEach(r=>{by[r.it.t]=by[r.it.t]||[0,0];by[r.it.t][1]++;if(r.ok)by[r.it.t][0]++});const n=(10*ok/res.length).toFixed(1);
m.innerHTML=`<div class="card"><div class="big">${n} / 10</div><p>${ok} de ${res.length} aciertos${clock?' · '+Math.round((Date.now()-t0)/1000)+' s':''}.</p><table><tr><th>Tema</th><th>Aciertos</th></tr>${Object.entries(by).map(([k,v])=>`<tr><td>${k}</td><td>${v[0]}/${v[1]}</td></tr>`).join('')}</table></div>`+(res.some(r=>!r.ok)?'<h3>Para repasar</h3>'+res.filter(r=>!r.ok).map(r=>`<div class="card"><b>${r.it.q[0]}</b><p>${r.it.q[2]==='o'?r.it.q[1].join(' → '):'✓ '+r.it.q[1][r.it.q[2]]}</p><p class="tag">${r.it.q[3]}</p></div>`).join(''):'<p>🎉 Sin fallos.</p>');}
show()}
function dv(m){m.innerHTML='<p>La mitad del examen es de desarrollo: escribe tu respuesta y contrasta con los puntos clave.</p>';D.filter(d=>TP==='all'||d[0]===TP).forEach((d,i)=>{m.insertAdjacentHTML('beforeend',`<details><summary>${d[1]}</summary><div><textarea rows="5" placeholder="Escribe aquí tu respuesta…"></textarea><p><b>Puntos clave</b> (marca los que has cubierto):</p>${d[2].map(p=>`<label style="display:block"><input type="checkbox" onchange="dc(this)"> ${p}</label>`).join('')}<p class="tag dr"></p></div></details>`)})}
function dc(e){const d=e.closest('div'),c=d.querySelectorAll('input:checked').length,n=d.querySelectorAll('input').length;d.querySelector('.dr').textContent=`Cubiertos ${c}/${n}`+(c<n?' · repasa los que faltan':' · ¡completo!')}
function rv(m){const w=qs().filter(x=>S.wrong[x.k]),pc=T.flatMap(t=>t.c.map((c,j)=>({k:t.id+'c'+j,q:c[0],a:c[1]}))).filter(c=>S.known[c.k]===0);
m.innerHTML=`<h3>Preguntas falladas (${w.length})</h3>`+(w.length?`<button class="on" onclick="quiz(sh(qs().filter(x=>S.wrong[x.k])),true)">Practicar fallos</button>`+w.map(x=>`<div class="card">${x.q[0]}<p class="tag">${x.t}</p></div>`).join(''):'<p>Ninguna. Se eliminan al acertarlas dos veces.</p>')+`<h3>Flashcards por repasar (${pc.length})</h3>`+pc.map(c=>`<details><summary>${c.q}</summary><div>${c.a}</div></details>`).join('')}
function gl(m){m.innerHTML='<input type="search" id="gq" placeholder="Buscar término…" aria-label="Buscar en el glosario"><div id="gr"></div>';const f=()=>{const q=$('#gq').value.toLowerCase();$('#gr').innerHTML=T.flatMap(t=>t.c.map(c=>[t.n,c[0],c[1]])).filter(c=>(c[1]+c[2]).toLowerCase().includes(q)).map(c=>`<div class="card"><b>${c[1]}</b> <span class="tag">${c[0]}</span><br>${c[2]}</div>`).join('')};$('#gq').oninput=f;f()}
function ch(m){tops().forEach(t=>m.insertAdjacentHTML('beforeend',`<div class="card"><h3>${t.n}</h3><ul>${t.s.map(x=>`<li>${x}</li>`).join('')}</ul></div>`))}
$('#th').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'};
$('#rs').onclick=()=>{if(confirm('¿Borrar todo el progreso?')){S={done:{},known:{},wrong:{},best:{}};save();R()}};
R();
</script></body></html>
