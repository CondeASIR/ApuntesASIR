const RAW={"d": "<h1 id=\"módulo-profesional-digitalización-aplicada-a-los-sectores-productivos-2º-asir\">Módulo Profesional: Digitalización Aplicada a los Sectores Productivos (2º ASIR)<\/h1>\n<h2 id=\"unidad-formativa-1-digitalización-y-convergencia-de-entornos-it-ot\">Unidad Formativa 1: Digitalización y Convergencia de Entornos IT / OT<\/h2>\n<h3 id=\"resultado-de-aprendizaje-1-ra1\">Resultado de Aprendizaje 1 (RA1)<\/h3>\n<p><em>Analiza el concepto de digitalización y su repercusión en los sectores productivos teniendo en cuenta la actividad de la empresa e identificando entornos IT (Information Technology) y OT (Operational Technology) característicos.<\/em><\/p>\n<h2 id=\"introducción-y-marco-conceptual\">1. Introducción y Marco Conceptual<\/h2>\n<p>En el contexto actual de la Industria 4.0, las empresas de todos los sectores productivos (manufactura, energía, logística, agroalimentación o tratamiento de aguas) están inmersas en un proceso de transformación digital. Para el técnico en <strong>Administración de Sistemas Informáticos en Red (ASIR)<\/strong>, este escenario implica dejar de considerar la red corporativa como una isla aislada y asumir la integración, el mantenimiento y la securización de los sistemas que controlan el mundo físico.<\/p>\n<h3 id=\"los-tres-niveles-de-evolución-tecnológica\">1.1. Los tres niveles de evolución tecnológica<\/h3>\n<p>Es habitual confundir términos que representan distintos grados de madurez tecnológica. En el diseño y despliegue de infraestructuras corporativas, distinguimos con precisión:<\/p>\n<ol type=\"1\">\n<li><p><strong>Digitación (<em>Digitization<\/em>):<\/strong><\/p>\n<ul>\n<li><p><em>Definición:<\/em> Transformación de datos, variables o documentos en formato físico/analógico a representaciones digitales binarias.<\/p><\/li>\n<li><p><em>Ejemplo industrial:<\/em> Convertir la lectura de presión analógica de un manómetro de aguja (4-20 mA) en un valor digital accesible desde un microcontrolador, o digitalizar los albaranes de entrega en papel mediante escáneres OCR.<\/p><\/li>\n<\/ul><\/li>\n<li><p><strong>Digitalización (<em>Digitalization<\/em>):<\/strong><\/p>\n<ul>\n<li><p><em>Definición:<\/em> Uso de tecnologías digitales para rediseñar y automatizar procesos operativos existentes, mejorando su eficiencia, velocidad y trazabilidad.<\/p><\/li>\n<li><p><em>Ejemplo industrial:<\/em> Desplegar un sistema de lectura por código de barras o RFID conectado directamente a la base de datos del inventario para que el stock se descuente en tiempo real.<\/p><\/li>\n<\/ul><\/li>\n<li><p><strong>Transformación Digital (<em>Digital Transformation<\/em>):<\/strong><\/p>\n<ul>\n<li><p><em>Definición:<\/em> Cambio estratégico y cultural global de la organización donde los datos y las tecnologías habilitadoras digitales (THD) modifican el modelo de negocio o la toma de decisiones.<\/p><\/li>\n<li><p><em>Ejemplo industrial:<\/em> Pasar de vender compresores industriales a vender \"aire comprimido como servicio\", monitorizando en remoto las horas de uso y el desgaste mecánico mediante algoritmos de mantenimiento predictivo.<\/p><\/li>\n<\/ul><\/li>\n<\/ol>\n<h2 id=\"caracterización-de-los-entornos-it-y-ot\">2. Caracterización de los Entornos IT y OT<\/h2>\n<p>En cualquier organización del sector secundario o logístico coexisten dos ecosistemas computacionales concebidos con metas dispares:<\/p>\n<p class=\"asc\">┌──────────────────────────────────────────────┐<br />\n│ ENTORNO IT │<br />\n│ (Information Technology / Oficina) │<br />\n│ Servidores x86, Cloud, ERP, Bases de Datos │<br />\n│ Prioridad: Confidencialidad (C-I-A) │<br />\n└──────────────────────┬───────────────────────┘<br />\n│<br />\n¿CONVERGENCIA DIRECTA?<br />\n(Riesgo Crítico de Red)<br />\n│<br />\n┌──────────────────────┴───────────────────────┐<br />\n│ ENTORNO OT │<br />\n│ (Operational Technology / Planta) │<br />\n│ PLCs, SCADA, HMI, Sensores y Actuadores │<br />\n│ Prioridad: Disponibilidad (A-I-C) │<br />\n└──────────────────────────────────────────────┘<\/p>\n<h3 id=\"entorno-it-information-technology\">2.1. Entorno IT (Information Technology)<\/h3>\n<p>Comprende los equipos, protocolos y software encargados de procesar, almacenar, proteger y transportar información empresarial.<\/p>\n<ul>\n<li><p><strong>Propósito:<\/strong> Gestión transaccional y financiera del negocio.<\/p><\/li>\n<li><p><strong>Equipos característicos:<\/strong> Servidores blade/rack x86, hipervisores (Proxmox, VMware, Hyper-V), cabinas de almacenamiento NAS/SAN, conmutadores gestionados, firewalls corporativos y estaciones de trabajo.<\/p><\/li>\n<li><p><strong>Ciclo de vida:<\/strong> 3 a 5 años. Se asume una rápida amortización y obsolescencia del hardware.<\/p><\/li>\n<li><p><strong>Gestión de cambios y parches:<\/strong> Automatizada o programada en ventanas periódicas semanales/mensuales. El reinicio de un servidor de correo un domingo de madrugada es una práctica estándar y asumible.<\/p><\/li>\n<\/ul>\n<h3 id=\"entorno-ot-operational-technology\">2.2. Entorno OT (Operational Technology)<\/h3>\n<p>Comprende el hardware y software embebido diseñado para detectar o provocar cambios en el estado físico del mundo real mediante la monitorización y el control directo de máquinas e instalaciones.<\/p>\n<ul>\n<li><p><strong>Propósito:<\/strong> Operación ininterrumpida de procesos físicos (presión, corte, temperatura, mezcla química, movimiento robótico).<\/p><\/li>\n<li><p><strong>Equipos característicos:<\/strong><\/p>\n<ul>\n<li><p><strong>PLC (Programmable Logic Controller):<\/strong> Computadoras industriales robustecidas que ejecutan programas cíclicos deterministas en tiempo real.<\/p><\/li>\n<li><p><strong>RTU (Remote Terminal Unit):<\/strong> Unidades terminales remotas para telemetría a larga distancia (ej. en oleoductos o presas).<\/p><\/li>\n<li><p><strong>HMI (Human-Machine Interface):<\/strong> Paneles táctiles en planta para que los operarios visualicen y modifiquen consignas locales.<\/p><\/li>\n<li><p><strong>SCADA (Supervisory Control and Data Acquisition):<\/strong> Software centralizado de supervisión y control de planta completa.<\/p><\/li>\n<\/ul><\/li>\n<li><p><strong>Ciclo de vida:<\/strong> De 10 a 25 años. Las máquinas de control industrial conviven con múltiples generaciones tecnológicas.<\/p><\/li>\n<li><p><strong>Gestión de cambios y parches:<\/strong> Extremadamente restrictiva. Un reinicio imprevisto detiene la cadena de montaje, arruina lotes de producción o puede ocasionar roturas mecánicas catastróficas.<\/p><\/li>\n<\/ul>\n<h2 id=\"matriz-comparativa-detallada-it-vs.-ot\">3. Matriz Comparativa Detallada: IT vs. OT<\/h2>\n<div class=\"sc\"><table style=\"width:100%;\">\n<colgroup>\n<col style=\"width: 6%\" />\n<col style=\"width: 44%\" />\n<col style=\"width: 48%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\"><strong>Dimensión de Análisis<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Entorno IT (Oficina)<\/strong><\/th>\n<th style=\"text-align: left;\"><strong>Entorno OT (Planta de Producción)<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Objeto de control<\/strong><\/td>\n<td style=\"text-align: left;\">Datos, transacciones e información digital<\/td>\n<td style=\"text-align: left;\">Procesos electromecánicos y energía física<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Tríada de Ciberseguridad<\/strong><\/td>\n<td style=\"text-align: left;\"><strong>C<\/strong>onfidencialidad &lt;img src=“data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACQAAAAsCAYAAAANUxr1AAACGklEQVR4AeyWMUgjQRSGs8kFUhxHDpLijlwSLo0IVgELW7URRBFExEqwEQSxUEFrQQURBRGxsBAREUQQLCwsBZGACNpFdiNokYAiFoGQrN9sIZHsuhbysJjw/zuzOyHv4583S4KBb/bRQH4bohPSCfkl4Leue0<\/td>\n<td style=\"text-align: left;\">gn5JeA37ruIZ2QVwKJRKIllUq1sW5gT4n1UCgUGodiJZlMRhk9JQZkGMYFFM34P/aUGJBt2ydQPAaDwW5GT4kBWZZlQnEI2FAmk/nH3FViQFSHxV5njFYqlRnGH7hBkkCBQqFwDcE8/TTC TSTtN3OUDcBEzTfLIs60HC9NAzCc1Rd4idmabRW6l7yn31DYgbEakGpoeWKTaA+0llUTU6c0efAXK++EUXg/ZQJ2yY3xsklQPGdxIFommb6dVJtmnNDUaRSQLBYqhT9RQOh5cobuMGiQHxfktTvReqnXw+f8fcVWJAVFf/Fn/XarUj5p6SAjLomw4obvAt9pQUUICt2sRjHPNHTxoWpIBsTtWZaZrn1PxQUkAfQtQvaqD6NNzmOiG3VOqf6YTq03Cbf7uEXgEAAP//ksAfZAAAAAZJREFUAwBw5Q9otoUsHAAAAABJRU5ErkJggg==\" alt=\"\"> <strong>I<\/strong>ntegridad <img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACQAAAAsCAYAAAANUxr1AAACGklEQVR4AeyWMUgjQRSGs8kFUhxHDpLijlwSLo0IVgELW7URRBFExEqwEQSxUEFrQQURBRGxsBAREUQQLCwsBZGACNpFdiNokYAiFoGQrN9sIZHsuhbysJjw/zuzOyHv4583S4KBb/bRQH4bohPSCfkl4Leue0gn5JeA37ruIZ2QVwKJRKIllUq1sW5gT4n1UCgUGodiJZlMRhk9JQZkGMYFFM34P/aUGJBt2ydQPAaDwW5GT4kBWZZlQnEI2FAmk/nH3FViQFSHxV5njFYqlRnGH7hBkkCBQqFwDcE8/TTCieth3iBRIFU9FoutMm7hXaD6GN9JHCiXy1XK5fIEFHt4n9fAVDabDTN39AaUTqejEP+RcCQS+cV7aRaCDbZvoVQqXQHWyX3IAYrH4z/puEMe3Eu5Wq1a1BrFSk2AnQB17AAVi8UXHvSy8lfKJJSi1jZWuuTSTtN3OUDcBEzTfLIs60HC9NAzCc1Rd4idmabRW6l7yn31DYgbEakGpoeWKTaA+0llUTU6c0efAXK++EUXg/ZQJ2yY3xsklQPGdxIFommb6dVJtmnNDUaRSQLBYqhT9RQOh5cobuMGiQHxfktTvReqnXw+f8fcVWJAVFf/Fn/XarUj5p6SAjLomw4obvAt9pQUUICt2sRjHPNHTxoWpIBsTtWZaZrn1PxQUkAfQtQvaqD6NNzmOiG3VOqf6YTq03Cbf7uEXgEAAP//ksAfZAAAAAZJREFUAwBw5Q9otoUsHAAAAABJRU5ErkJggg==\" alt=\"\"> <strong>C<\/strong>onfidencialidad<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Sensibilidad temporal (Latencia)<\/strong><\/td>\n<td style=\"text-align: left;\">Tolerante a retrasos (de cientos de milisegundos a minutos)<\/td>\n<td style=\"text-align: left;\">Tiempo real determinista (latencias fijas sub-milisegundo, jitter = 0)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Requisitos de disponibilidad<\/strong><\/td>\n<td style=\"text-align: left;\">Alta disponibilidad tolerando paradas planificadas (99.9%)<\/td>\n<td style=\"text-align: left;\">24/7/365 sin paradas no planificadas (99.999% o disponibilidad continua)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Protocolos predominantes<\/strong><\/td>\n<td style=\"text-align: left;\">TCP/IP, Ethernet IEEE 802.3 estándar, HTTP/S, DNS, LDAP, SMB<\/td>\n<td style=\"text-align: left;\">Modbus RTU/TCP, Profinet, EtherNet/IP, EtherCAT, BACnet, DNP3<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Cifrado y autenticación nativos<\/strong><\/td>\n<td style=\"text-align: left;\">Estándar en la mayoría de servicios (TLS 1.3, SSH, Kerberos)<\/td>\n<td style=\"text-align: left;\">Históricamente ausente (comandos en texto plano sin autenticar)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Consecuencia de una parada<\/strong><\/td>\n<td style=\"text-align: left;\">Pérdida de productividad ofimática y costes administrativos<\/td>\n<td style=\"text-align: left;\">Parada de planta, daño irreparable a maquinaria, peligro vital<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"arquitectura-de-referencia-el-modelo-purdue-e-isa-95\">4. Arquitectura de Referencia: El Modelo Purdue e ISA-95<\/h2>\n<p>Para que la convergencia entre ambos mundos no destruya la seguridad ni la disponibilidad de la planta, se implementa la segmentación jerárquica descrita en el estándar <strong>ANSI/ISA-95<\/strong> (basado en el Modelo Purdue de Manufactura Integrada por Computador).<\/p>\n<p class=\"asc\">========================================================================<br />\nZONA DE EMPRESA (IT)<br />\n========================================================================<br />\n[Nivel 5] Red Externa y Cloud: Servicios SaaS, acceso remoto, analítica Big Data.<br />\n[Nivel 4] Red Corporativa: ERP (SAP, Navision), CRM, correo, estaciones de administración.<br />\n<br />\n========================================================================<br />\nZONA DESMILITARIZADA INDUSTRIAL (iDMZ - Nivel 3.5)<br />\n¡BARRERA OBLIGATORIA! Sin enrutamiento directo entre Nivel 4 y Nivel 3.<br />\n========================================================================<br />\n- Servidores Jump Host / Bastión (Acceso RDP/SSH solo con MFA).<br />\n- Data Historian Espejo (Replicación de telemetría de planta a IT).<br />\n- Servidores de parches locales (WSUS industrial desconectado de Internet).<br />\n<br />\n========================================================================<br />\nZONA DE FABRICACIÓN Y CONTROL (OT)<br />\n========================================================================<br />\n[Nivel 3] Control de Operaciones de Fabricación (MOM / MES):<br />\nPlanificación de órdenes de trabajo, SCADA central, trazabilidad de lote.<br />\n[Nivel 2] Supervisión de Área / Célula:<br />\nPaneles HMI de línea, consolas SCADA locales, alarmas de proceso.<br />\n[Nivel 1] Control Básico en Tiempo Real:<br />\nAutómatas programables (PLCs), sistemas de seguridad física (SIS), variadores de frecuencia.<br />\n[Nivel 0] Proceso Físico:<br />\nSensores de temperatura/presión, electroválvulas, motores trifásicos, cintas transportadoras.<\/p>\n<h3 id=\"reglas-de-oro-de-diseño-de-red-para-el-técnico-asir\">Reglas de Oro de Diseño de Red para el Técnico ASIR:<\/h3>\n<ol type=\"1\">\n<li><p><strong>Nunca enrutar directamente IT con OT:<\/strong> Todo flujo de información que viaje de la oficina a la planta debe terminar en un servicio intermediario alojado en la <strong>iDMZ (Nivel 3.5)<\/strong>.<\/p><\/li>\n<li><p><strong>Inspección Profunda de Paquetes (DPI):<\/strong> Los cortafuegos industriales deben entender sintaxis OT (por ejemplo, permitir la función Modbus 03 Read Holding Registers para leer métricas, pero bloquear tajantemente la función 06 Write Single Register desde zonas externas).<\/p><\/li>\n<li><p><strong>Microsegmentación por células:<\/strong> Cada línea de fabricación debe residir en una VLAN independiente con cortafuegos dedicados para evitar que un ransomware propague lateralmente por toda la fábrica.<\/p><\/li>\n<\/ol>\n<h2 id=\"el-rol-del-administrador-de-sistemas-en-la-convergencia-itot\">5. El Rol del Administrador de Sistemas en la Convergencia IT/OT<\/h2>\n<p>El perfil tradicional de ASIR solía centrarse en el dominio IT. Hoy en día, la digitalización de la industria demanda competencias híbridas indispensables:<\/p>\n<ul>\n<li><p><strong>Inventariado pasivo de activos OT:<\/strong> Los escáneres de puertos agresivos (como nmap -sS -A) pueden saturar la pila TCP de un autómata antiguo y provocar un bloqueo en la maquinaria. En OT se utilizan herramientas de escucha pasiva en puertos espejo (<em>SPAN/Mirroring<\/em>) como Claroty, Nozomi o Zeek.<\/p><\/li>\n<li><p><strong>Gestión de identidades centralizada:<\/strong> Conexión de consolas SCADA modernas con directorios activos (Active Directory / FreeIPA) mediante protocolos seguros (LDAPS).<\/p><\/li>\n<li><p><strong>Migración hacia estándares modernos (OPC-UA y MQTT):<\/strong> Sustitución progresiva de protocolos serie o planos por OPC-UA con perfiles de cifrado y certificados digitales X.509.<\/p><\/li>\n<\/ul>\n<h2 id=\"actividad-práctica-de-laboratorio-guía-para-el-alumno\">6. Actividad Práctica de Laboratorio (Guía para el Alumno)<\/h2>\n<h3 id=\"título-detección-y-análisis-de-infiltración-cruzada-itot-en-wireshark\">Título: Detección y Análisis de Infiltración Cruzada IT/OT en Wireshark<\/h3>\n<ul>\n<li><p><strong>Duración:<\/strong> 2 horas de sesión práctica.<\/p><\/li>\n<li><p><strong>Objetivo:<\/strong> Analizar una captura de tráfico .pcap en una red de una planta de embotellado y detectar vulneraciones de la arquitectura Purdue.<\/p><\/li>\n<\/ul>\n<h4 id=\"tareas-a-desarrollar\">Tareas a Desarrollar:<\/h4>\n<ol type=\"1\">\n<li><p><strong>Filtrado de tráfico industrial:<\/strong> Aplica el filtro modbus || s7comm || enip en Wireshark para identificar qué dispositivos están enviando órdenes de control.<\/p><\/li>\n<li><p><strong>Identificación de direcciones IP anómalas:<\/strong> Localiza si existen direcciones IP pertenecientes al rango de oficina (192.168.10.0/24) comunicándose directamente con autómatas PLC situados en la subred de control (10.10.50.0/24).<\/p><\/li>\n<li><p><strong>Auditoría de comandos inseguros:<\/strong> Localiza dentro del tráfico Modbus si se han ejecutado códigos de escritura sin autorización que hayan forzado la modificación de consignas de temperatura.<\/p><\/li>\n<li><p><strong>Propuesta técnica de mitigación:<\/strong> Diseña sobre el papel las reglas de cortafuegos (iptables o pfSense) necesarias para confinar los autómatas e implementar una pasarela intermedia en la iDMZ.<\/p><\/li>\n<\/ol>\n", "p": "<h2 id=\"diapositiva-1\">Diapositiva 1<\/h2>\n<p>FP ASIR · MÓDULO DIGITALIZACIÓN · RA1 Convergencia IT / OT en la Empresa Moderna Integración segura entre las redes corporativas y la planta de producción.<\/p>\n<h2 id=\"diapositiva-2\">Diapositiva 2<\/h2>\n<p>CONTEXTO DE SEGURIDAD Vulnerabilidad en la Integración Industrial 74% Plantas industriales con incidentes de seguridad vinculados a conexiones IT/OT.<\/p>\n<h2 id=\"diapositiva-3\">Diapositiva 3<\/h2>\n<p>MARCO TEÓRICO Tres Fases de la Evolución Tecnológica<\/p>\n<p>Digitación Digitalización Transformación Conversión analógico a soporte binario. Automatización eficiente de procesos operativos. Reinvención estratégica del negocio productivo.<\/p>\n<h2 id=\"diapositiva-4\">Diapositiva 4<\/h2>\n<p>INFRAESTRUCTURA DE DATOS Dominio IT: Gestión de la Información<\/p>\n<p>Alcance Operativo<\/p>\n<p>Servidores corporativos, ERP, CRM y bases de datos. Ciclo Tecnológico<\/p>\n<p>Renovación periódica cada 3 a 5 años. Prioridad Clave<\/p>\n<p>Confidencialidad rigurosa del dato corporativo.<\/p>\n<h2 id=\"diapositiva-5\">Diapositiva 5<\/h2>\n<p>PLANTA INDUSTRIAL Dominio OT: Tecnología de Operación<\/p>\n<p>Alcance Físico<\/p>\n<p>Control de autómatas, actuadores, válvulas y robots. Vida Útil Extensa<\/p>\n<p>Maquinaria operativa activa durante 10 a 25 años. Prioridad Absoluta<\/p>\n<p>Disponibilidad continua e integridad física humana.<\/p>\n<h2 id=\"diapositiva-6\">Diapositiva 6<\/h2>\n<p>CONVERGENCIA Y DISPARIDAD Choque Operativo: IT frente a OT<\/p>\n<p>Entorno IT (Oficina)<\/p>\n<p>Entorno OT (Planta)<\/p>\n<p>Tríada: Confidencialidad &gt; Integridad &gt; Disponibilidad. Tríada: Disponibilidad &gt; Integridad &gt; Confidencialidad. Latencia: Retardos tolerables en segundos. Latencia: Tiempo real estricto en milisegundos. Actualizaciones: Parches habituales y reinicios nocturnos. Actualizaciones: Paradas críticas planificadas al año. Impacto: Daño mecánico, riesgo vital y ambiental. Impacto: Daño económico o administrativo.<\/p>\n<h2 id=\"diapositiva-7\">Diapositiva 7<\/h2>\n<p>SEGMENTACIÓN ESTÁNDAR Arquitectura Jerárquica: Modelo Purdue<\/p>\n<p>Nivel 4 / 5: Corporativo Planificación empresarial, ERP, logística y acceso Cloud<\/p>\n<p>Nivel 3.5: iDMZ Industrial Zona neutra, servidores de salto y replicación segura<\/p>\n<p>Nivel 3: Operaciones (MOM/MES) Supervisión global de producción y servidores SCADA<\/p>\n<p>Nivel 2 / 1: Control de Proceso Autómatas PLC, control local HMI y lazos PID<\/p>\n<p>Nivel 0: Proceso Físico Sensores mecánicos, variadores y actuadores directos<\/p>\n<h2 id=\"diapositiva-8\">Diapositiva 8<\/h2>\n<p>DESAFÍOS TÉCNICOS Parámetros Críticos en Planta 0 ms 15+ 90% Margen de jitter admitido en comunicaciones de bus de campo. Años de antigüedad media del equipamiento activo en fábrica. Protocolos industriales históricos que carecen de cifrado de fábrica.<\/p>\n<h2 id=\"diapositiva-9\">Diapositiva 9<\/h2>\n<p>DEFENSA EN PROFUNDIDAD La Frontera Segura: Nivel 3.5 (iDMZ)<\/p>\n<p>Aislamiento Estricto Prohibición absoluta de enrutamiento directo entre IT y niveles de planta.<\/p>\n<p>Puntos de Salto y Proxies Túneles VPN terminados en iDMZ con autenticación multifactor.<\/p>\n<p>Historiador Espejo Replicación unidireccional de métricas hacia los servidores del ERP.<\/p>\n<h2 id=\"diapositiva-10\">Diapositiva 10<\/h2>\n<p>COMUNICACIONES INDUSTRIALES Ecosistema de Protocolos en Red<\/p>\n<p>Pila IT Estándar Buses de Campo Interconexión IIoT TCP/IP, HTTP/S, DNS y SSH. Modbus TCP, Profinet y EtherCAT. OPC-UA unificado y MQTT con TLS.<\/p>\n<h2 id=\"diapositiva-11\">Diapositiva 11<\/h2>\n<p>ACTIVIDAD DE CLASE Caso Práctico: Auditoría de Fábrica<\/p>\n<p>El Escenario El director de planta conecta un router Wi-Fi doméstico a un switch de autómatas para revisar telemetría desde su teléfono móvil. Solución del Técnico ASIR<\/p>\n<h2 id=\"diapositiva-12\">Diapositiva 12<\/h2>\n<p>CONCLUSIONES Y DEBATE ¿Preguntas o Dudas sobre la Convergencia? “En IT la prioridad es proteger los datos; en OT, salvaguardar la vida y la maquinaria.”<\/p>\n"};

['d','¿Por qué es peligroso ejecutar nmap -sS -A en una red OT?',['Porque no detecta nada','Puede saturar la pila TCP de un autómata antiguo y bloquear la maquinaria','Porque requiere MFA','Porque solo funciona en IPv6'],1,'En OT se usa escucha pasiva en puertos espejo (SPAN) con Claroty, Nozomi o Zeek.'],

['d','En el laboratorio, ¿qué filtro de Wireshark identifica tráfico de control industrial?',['http || dns','modbus || s7comm || enip','arp || icmp','ssh && tls'],1,'Permite ver qué dispositivos envían órdenes de control.'],
['d','En la captura de la planta de embotellado, un equipo 192.168.10.x hablando directamente con un PLC en 10.10.50.x indica…',['Funcionamiento normal','Una violación de la arquitectura Purdue (IT con OT sin iDMZ)','Un fallo del DNS','Una VLAN de invitados'],1,'Todo flujo oficina → planta debe terminar en un servicio intermedio de la iDMZ.'],
['p','¿Qué porcentaje de plantas con incidentes vinculados a conexiones IT/OT cita la presentación?',['47 %','74 %','90 %','15 %'],1,'Diapositiva 2: Vulnerabilidad en la Integración Industrial.'],
['p','Según la presentación, la Digitación es…',['Automatización eficiente de procesos','Conversión de analógico a soporte binario','Reinvención estratégica del negocio','Replicación unidireccional de datos'],1,'Digitalización = automatizar procesos; Transformación = reinventar el negocio.'],
['p','Dominio IT en la presentación: alcance, ciclo y prioridad.',['PLC y robots · 10-25 años · disponibilidad','Servidores, ERP, CRM y BBDD · 3-5 años · confidencialidad','Sensores · 3-5 años · integridad física','Autómatas · 15 años · latencia'],1,'Diapositiva 4.'],
['p','Dominio OT: vida útil y prioridad.',['3 a 5 años y confidencialidad','10 a 25 años, disponibilidad continua e integridad física humana','1 año y rendimiento','Indefinida y confidencialidad'],1,'Diapositiva 5.'],
['p','En el choque IT/OT, la latencia es…',['IT: tiempo real estricto en ms · OT: segundos','IT: segundos tolerables · OT: tiempo real estricto en ms','Igual en ambos','Irrelevante en OT'],1,'El texto de la diapositiva 6 aparece mezclado; esta es la asignación lógica.'],
['p','Nivel 3.5 del Modelo Purdue en la presentación:',['Zona neutra con servidores de salto y replicación segura','Sensores y actuadores','Ofimática y Cloud','Autómatas PLC'],0,'iDMZ industrial.'],
['p','Nivel 2/1 del modelo:',['Autómatas PLC, control local HMI y lazos PID','ERP y logística','Sensores mecánicos y variadores','Servidores SCADA'],0,'Los servidores SCADA van en el Nivel 3. Ojo: aquí los variadores están en el Nivel 0, mientras que el DOCX los sitúa en el Nivel 1.'],
['p','Parámetros críticos en planta: 0 ms, 15+ y 90 %. Corresponden a…',['Jitter admitido, años de antigüedad media y % de protocolos históricos sin cifrado','Latencia IT, número de PLC y % de disponibilidad','Tiempo de parche, nº de VLAN y % de ransomware','Jitter, nº de usuarios y % de CPU'],0,'Diapositiva 8.'],
['p','¿Qué hace el historiador espejo en la iDMZ?',['Escribe órdenes en los PLC','Replica de forma unidireccional métricas hacia los servidores del ERP','Sustituye al SCADA','Cifra el bus de campo'],1,'Diapositiva 9.'],
['p','Los túneles VPN de acceso remoto deben…',['Llegar directamente al PLC','Terminar en la iDMZ con autenticación multifactor','Pasar por el Nivel 0','No usar autenticación'],1,'Junto al aislamiento estricto: prohibido enrutar directamente IT con planta.'],
['p','Ecosistema de protocolos: IIoT.',['Modbus TCP, Profinet y EtherCAT','TCP/IP, HTTP/S, DNS y SSH','OPC-UA unificado y MQTT con TLS','Solo Wi-Fi'],2,'Pila IT: TCP/IP...; buses de campo: Modbus TCP, Profinet, EtherCAT.'],
['p','Caso práctico: el director conecta un router Wi-Fi doméstico a un switch de autómatas para ver la telemetría en su móvil. El problema principal es…',['Que el Wi-Fi es lento','Que crea un acceso directo IT/OT sin pasar por la iDMZ ni autenticación, rompiendo la segmentación','Que el switch no tiene puertos','Que no usa IPv6'],1,'La diapositiva deja la solución en blanco. Aplicando la diapositiva 9: telemetría vía historiador espejo y accesos por la iDMZ con MFA.'],
['p','Frase final de la presentación:',['“En IT se protegen los datos; en OT, la vida y la maquinaria”','“Todo debe estar en la nube”','“OT es más seguro que IT”','“La disponibilidad es secundaria”'],0,'Resume el contraste de prioridades.']];
const PU=`<div class="lv"><b>N5</b>Red externa y Cloud: SaaS, acceso remoto, analítica Big Data</div><div class="lv"><b>N4</b>Red corporativa: ERP (SAP, Navision), CRM, correo, administración</div><div class="lv z"><b>N3.5</b><span><b style="min-width:0">iDMZ</b>: barrera obligatoria. Jump host, historiador espejo, WSUS industrial</span></div><div class="lv o"><b>N3</b>MOM / MES: órdenes de trabajo, SCADA central, trazabilidad de lote</div><div class="lv o"><b>N2</b>Supervisión de área: HMI de línea, SCADA local, alarmas</div><div class="lv o"><b>N1</b>Control básico: PLC, SIS, variadores (según el DOCX)</div><div class="lv o"><b>N0</b>Proceso físico: sensores, electroválvulas, motores, cintas</div>`;
const T=[
{id:'d',n:'DOCX · Apuntes',
th:[['1. Digitación, digitalización y transformación digital',`<p>Tres grados de madurez que se suelen confundir:</p><table><tr><th>Nivel</th><th>Definición</th><th>Ejemplo</th></tr><tr><td><mark>Digitación</mark></td><td>Datos físicos/analógicos → representación digital binaria</td><td>Lectura 4-20 mA de un manómetro a un microcontrolador; albaranes en papel con OCR</td></tr><tr><td><mark>Digitalización</mark></td><td>Tecnología digital para rediseñar y automatizar procesos existentes (eficiencia, velocidad, trazabilidad)</td><td>Código de barras/RFID conectado al inventario: el stock se descuenta en tiempo real</td></tr><tr><td><mark>Transformación digital</mark></td><td>Cambio estratégico y cultural: datos y tecnologías habilitadoras digitales (THD) modifican el modelo de negocio</td><td>Vender “aire comprimido como servicio” con mantenimiento predictivo</td></tr></table><div class="extra">Regla mnemotécnica: <b>dato</b> → <b>proceso</b> → <b>negocio</b>.</div>`],
['2. Entornos IT y OT',`<p>Para el técnico ASIR la red corporativa deja de ser una isla: hay que integrar y asegurar sistemas que controlan el mundo físico.</p><ul><li><b>IT</b>: procesa, almacena, protege y transporta información. Servidores x86, hipervisores (Proxmox, VMware, Hyper-V), NAS/SAN, switches, firewalls. Ciclo de vida <mark>3-5 años</mark>. Parches programados semanal/mensual: reiniciar el correo un domingo de madrugada es asumible.</li><li><b>OT</b>: detecta o provoca cambios en el mundo físico. Ciclo de vida <mark>10-25 años</mark>. Cambios extremadamente restrictivos: un reinicio imprevisto para la cadena, arruina lotes o rompe maquinaria.</li></ul><p><b>Equipos OT</b>:</p><ul><li><b>PLC</b>: computadora industrial robustecida, programas cíclicos deterministas en tiempo real</li><li><b>RTU</b>: telemetría a larga distancia (oleoductos, presas)</li><li><b>HMI</b>: paneles táctiles en planta para ver y modificar consignas locales</li><li><b>SCADA</b>: software centralizado de supervisión y control de toda la planta</li></ul>`],
['3. Matriz IT vs OT',`<div class="sc"><table><tr><th>Dimensión</th><th>IT (oficina)</th><th>OT (planta)</th></tr><tr><td>Objeto de control</td><td>Datos y transacciones</td><td>Procesos electromecánicos y energía</td></tr><tr><td>Tríada</td><td>C → I → D</td><td>D / seguridad física → I → C</td></tr><tr><td>Latencia</td><td>Tolerante (cientos de ms a minutos)</td><td>Tiempo real determinista, sub-ms, jitter 0</td></tr><tr><td>Disponibilidad</td><td>99,9 % con paradas planificadas</td><td>24/7/365 (99,999 %)</td></tr><tr><td>Protocolos</td><td>TCP/IP, Ethernet 802.3, HTTP/S, DNS, LDAP, SMB</td><td>Modbus RTU/TCP, Profinet, EtherNet/IP, EtherCAT, BACnet, DNP3</td></tr><tr><td>Cifrado y autenticación</td><td>Estándar (TLS 1.3, SSH, Kerberos)</td><td>Históricamente ausente: texto plano sin autenticar</td></tr><tr><td>Consecuencia de una parada</td><td>Pérdida de productividad y costes administrativos</td><td>Parada de planta, daño a maquinaria, peligro vital</td></tr></table></div><div class="extra">Idea clave: IT protege el dato; OT protege la vida y la máquina, por eso la disponibilidad pasa al primer puesto.</div>`],
['4. Modelo Purdue / ISA-95',`<p>La convergencia no debe destruir la seguridad ni la disponibilidad. Se segmenta jerárquicamente según <mark>ANSI/ISA-95</mark> (basado en el Modelo Purdue). Naranja = zona IT, rojo = iDMZ, amarillo = zona OT.</p>${PU}<p>Sin enrutamiento directo entre el Nivel 4 y el Nivel 3.</p><div class="extra">El DOCX sitúa los variadores en el Nivel 1; el PPTX los pone en el Nivel 0. Para el examen, ten presentes las dos versiones.</div>`],
['5. Reglas de oro de diseño de red',`<ol><li><b>Nunca enrutar directamente IT con OT</b>: todo flujo oficina → planta termina en un servicio intermedio de la iDMZ (Nivel 3.5).</li><li><b>Inspección profunda de paquetes (DPI)</b>: los firewalls industriales entienden OT. Ejemplo: permitir Modbus función 03 (Read Holding Registers) y bloquear la 06 (Write Single Register) desde zonas externas.</li><li><b>Microsegmentación por células</b>: cada línea en su VLAN con cortafuegos dedicado, para que un ransomware no se propague lateralmente.</li></ol>`],
['6. El rol del administrador en la convergencia',`<ul><li><b>Inventariado pasivo</b>: un escáner agresivo (nmap -sS -A) puede saturar la pila TCP de un autómata viejo y bloquear la maquinaria. En OT se escucha en puertos espejo (SPAN/mirroring) con Claroty, Nozomi o Zeek.</li><li><b>Identidades centralizadas</b>: SCADA con Active Directory/FreeIPA mediante LDAPS.</li><li><b>Migración a OPC-UA y MQTT</b>: sustituir protocolos serie o planos por OPC-UA con perfiles de cifrado y certificados X.509.</li></ul>`],
['7. Laboratorio: infiltración IT/OT en Wireshark',`<p>2 horas. Se analiza un .pcap de una planta de embotellado para detectar vulneraciones de Purdue.</p><ol><li>Filtrar tráfico industrial: <code>modbus || s7comm || enip</code></li><li>Buscar IPs de oficina (192.168.10.0/24) hablando directamente con PLC (10.10.50.0/24)</li><li>Auditar escrituras Modbus no autorizadas que hayan cambiado consignas de temperatura</li><li>Diseñar reglas de cortafuegos (iptables o pfSense) que confinen los PLC y una pasarela en la iDMZ</li></ol>`]],
c:[['Digitación','Transformar datos o documentos analógicos/físicos en representaciones digitales binarias.'],['Digitalización','Usar tecnología digital para rediseñar y automatizar procesos existentes: eficiencia, velocidad y trazabilidad.'],['Transformación digital','Cambio estratégico y cultural donde los datos y las THD modifican el modelo de negocio o la toma de decisiones.'],['Ciclo de vida IT / OT','IT: 3 a 5 años. OT: 10 a 25 años.'],['Tríada en IT y en OT','IT: Confidencialidad, Integridad, Disponibilidad. OT: Disponibilidad/seguridad física, Integridad, Confidencialidad.'],['PLC','Computadora industrial robustecida que ejecuta programas cíclicos deterministas en tiempo real.'],['RTU','Unidad terminal remota para telemetría a larga distancia (oleoductos, presas).'],['HMI','Panel táctil en planta para visualizar y modificar consignas locales.'],['SCADA','Software centralizado de supervisión y control de la planta completa.'],['Latencia y disponibilidad en OT','Tiempo real determinista sub-ms con jitter 0; disponibilidad 24/7/365 (99,999 %).'],['Protocolos OT','Modbus RTU/TCP, Profinet, EtherNet/IP, EtherCAT, BACnet, DNP3. Históricamente sin cifrado ni autenticación.'],['ANSI/ISA-95','Estándar de segmentación jerárquica basado en el Modelo Purdue.'],['iDMZ (Nivel 3.5)','Barrera obligatoria entre IT y OT: jump host con MFA, historiador espejo y WSUS industrial.'],['Nivel 0 y Nivel 1','N0: proceso físico (sensores, electroválvulas, motores). N1: control básico (PLC, SIS, variadores).'],['DPI industrial','Los firewalls entienden OT: permiten Modbus 03 (lectura) y bloquean la 06 (escritura) desde fuera.'],['Microsegmentación','Una VLAN y un cortafuegos por línea de fabricación para frenar el ransomware lateral.'],['Inventariado pasivo','Escucha en puertos SPAN con Claroty, Nozomi o Zeek; evita nmap agresivo, que puede bloquear un autómata.'],['LDAPS / OPC-UA / MQTT','LDAPS: identidades con AD. OPC-UA y MQTT: estándares modernos con cifrado y certificados X.509.']],
s:['Digitación (dato) → digitalización (proceso) → transformación (negocio).','IT: 3-5 años, C-I-D, tolera retrasos. OT: 10-25 años, D-I-C, tiempo real y parches muy restrictivos.','PLC (control), RTU (remoto), HMI (panel local), SCADA (supervisión central).','Purdue: N5/N4 IT · N3.5 iDMZ · N3 MOM/MES · N2 supervisión · N1 PLC · N0 proceso.','Reglas: sin enrutado IT-OT directo, DPI (Modbus 03 sí / 06 no), microsegmentación, inventario pasivo.']},
{id:'p',n:'PPTX · Presentación',
th:[['Contexto y tres fases de evolución',`<p>Título: <b>Convergencia IT/OT en la empresa moderna</b>, integración segura entre las redes corporativas y la planta de producción.</p><p>Dato de contexto: <mark>74 %</mark> de las plantas industriales ha tenido incidentes de seguridad vinculados a conexiones IT/OT.</p><ul><li><b>Digitación</b>: conversión de analógico a soporte binario</li><li><b>Digitalización</b>: automatización eficiente de procesos operativos</li><li><b>Transformación</b>: reinvención estratégica del negocio productivo</li></ul>`],
['Dominio IT y dominio OT',`<table><tr><th></th><th>IT: gestión de la información</th><th>OT: tecnología de operación</th></tr><tr><td>Alcance</td><td>Servidores corporativos, ERP, CRM y bases de datos</td><td>Autómatas, actuadores, válvulas y robots</td></tr><tr><td>Ciclo</td><td>Renovación cada 3 a 5 años</td><td>Maquinaria activa 10 a 25 años</td></tr><tr><td>Prioridad</td><td>Confidencialidad rigurosa del dato corporativo</td><td>Disponibilidad continua e integridad física humana</td></tr></table>`],
['Choque operativo IT frente a OT',`<table><tr><th></th><th>IT (oficina)</th><th>OT (planta)</th></tr><tr><td>Tríada</td><td>C &gt; I &gt; D</td><td>D &gt; I &gt; C</td></tr><tr><td>Latencia</td><td>Retardos tolerables en segundos</td><td>Tiempo real estricto en milisegundos</td></tr><tr><td>Actualizaciones</td><td>Parches habituales y reinicios nocturnos</td><td>Paradas críticas planificadas al año</td></tr><tr><td>Impacto</td><td>Daño económico o administrativo</td><td>Daño mecánico, riesgo vital y ambiental</td></tr></table><div class="extra">En la diapositiva original las frases de las dos columnas salen mezcladas al extraer el texto. Esta tabla es la asignación lógica.</div>`],
['Arquitectura jerárquica: Modelo Purdue',`<div class="lv"><b>N4 / 5</b>Corporativo: planificación empresarial, ERP, logística y acceso Cloud</div><div class="lv z"><b>N3.5</b>iDMZ industrial: zona neutra, servidores de salto y replicación segura</div><div class="lv o"><b>N3</b>Operaciones (MOM/MES): supervisión global y servidores SCADA</div><div class="lv o"><b>N2 / 1</b>Control de proceso: PLC, HMI local y lazos PID</div><div class="lv o"><b>N0</b>Proceso físico: sensores mecánicos, variadores y actuadores directos</div>`],
['Parámetros críticos en planta',`<ul><li><mark>0 ms</mark>: margen de jitter admitido en comunicaciones de bus de campo</li><li><mark>15+</mark>: años de antigüedad media del equipamiento activo</li><li><mark>90 %</mark>: protocolos industriales históricos sin cifrado de fábrica</li></ul>`],
['Defensa en profundidad: la iDMZ y los protocolos',`<ul><li><b>Aislamiento estricto</b>: prohibido el enrutamiento directo entre IT y los niveles de planta</li><li><b>Puntos de salto y proxies</b>: túneles VPN terminados en la iDMZ con autenticación multifactor</li><li><b>Historiador espejo</b>: replicación unidireccional de métricas hacia los servidores del ERP</li></ul><p><b>Protocolos</b>: pila IT estándar (TCP/IP, HTTP/S, DNS, SSH) · buses de campo (Modbus TCP, Profinet, EtherCAT) · interconexión IIoT (OPC-UA unificado y MQTT con TLS).</p>`],
['Caso práctico y conclusión',`<p><b>Escenario</b>: el director de planta conecta un router Wi-Fi doméstico a un switch de autómatas para ver la telemetría desde su móvil.</p><div class="extra">La diapositiva deja la solución del técnico ASIR en blanco. Aplicando la regla de la iDMZ: es un acceso directo IT/OT sin segmentar ni autenticar. Se retira, y la telemetría se consulta vía historiador espejo y accesos por la iDMZ con MFA.</div><p>Frase final: “En IT la prioridad es proteger los datos; en OT, salvaguardar la vida y la maquinaria.”</p>`]],
c:[['74 %','Plantas industriales con incidentes de seguridad vinculados a conexiones IT/OT.'],['Tres fases (PPTX)','Digitación: analógico a binario. Digitalización: automatizar procesos. Transformación: reinventar el negocio.'],['Dominio IT (PPTX)','Servidores, ERP, CRM y BBDD. Ciclo de 3 a 5 años. Prioridad: confidencialidad.'],['Dominio OT (PPTX)','Autómatas, actuadores, válvulas y robots. 10 a 25 años. Prioridad: disponibilidad e integridad física.'],['Latencia IT frente a OT (PPTX)','IT: segundos. OT: tiempo real estricto en milisegundos.'],['Nivel 3.5 (PPTX)','iDMZ: zona neutra con servidores de salto y replicación segura.'],['Nivel 2 / 1 (PPTX)','Autómatas PLC, control local HMI y lazos PID.'],['Nivel 0 (PPTX)','Sensores mecánicos, variadores y actuadores directos.'],['0 ms, 15+, 90 %','Jitter admitido, años de antigüedad media del equipamiento y % de protocolos históricos sin cifrado.'],['Historiador espejo','Replicación unidireccional de métricas hacia los servidores del ERP.'],['Túneles VPN','Terminados en la iDMZ con autenticación multifactor.'],['Protocolos del PPTX','IT: TCP/IP, HTTP/S, DNS, SSH. Buses: Modbus TCP, Profinet, EtherCAT. IIoT: OPC-UA y MQTT con TLS.']],
s:['74 % de plantas con incidentes por conexiones IT/OT.','IT: 3-5 años, confidencialidad. OT: 10-25 años, disponibilidad e integridad física.','Purdue: N4/5 corporativo · N3.5 iDMZ · N3 MOM/MES · N2/1 PLC y HMI · N0 sensores.','Parámetros: 0 ms jitter, 15+ años, 90 % sin cifrado.','iDMZ: aislamiento, VPN con MFA, historiador espejo. IIoT: OPC-UA y MQTT con TLS.']}];
T.forEach(t=>t.q=Q.filter(x=>x[0]===t.id).map(x=>x.slice(1)));
let S={done:{},known:{},wrong:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem('dig_ex1b')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('dig_ex1b',JSON.stringify(S))}catch(e){}};
let V='th',TP='all',FP=false,FI=0,FL=false,tm=null;
const tops=()=>T.filter(t=>TP==='all'||t.id===TP);
const VS=[['th','Resumen'],['ff','En Bruto'],['fc','Flashcards'],['ts','Test'],['ex','Examen'],['rv','Repaso'],['gl','Glosario'],['ch','Chuleta']];
function prog(){let n=T.length,k=T.filter(t=>S.done[t.id]).length;T.forEach(t=>{n+=t.c.length;t.c.forEach((_,j)=>{if(S.known[t.id+'c'+j]===1)k++})});const p=Math.round(100*k/n);$('#pg').style.width=p+'%';$('#pt').textContent=p+' % completado · '+Object.keys(S.wrong).length+' preguntas por repasar'}
function nav(){$('#nv').innerHTML=VS.map(v=>`<button class="${V===v[0]?'on':''}" onclick="V='${v[0]}';R()">${v[1]}</button>`).join('');$('#tp').innerHTML=[['all','Todos']].concat(T.map(t=>[t.id,t.n])).map(t=>`<button class="${TP===t[0]?'on':''}" onclick="TP='${t[0]}';FI=0;FL=false;R()">${t[1]}</button>`).join('');prog()}
function R(){clearInterval(tm);nav();const m=$('#m');m.innerHTML='';m.classList.toggle('wide',V==='ff');({th,fc,ts,ex,rv,gl,ch,ff})[V](m);window.scrollTo(0,0)}
function th(m){tops().forEach(t=>m.insertAdjacentHTML('beforeend',`<h2>${t.n}</h2>`+t.th.map(s=>`<details><summary>${s[0]}</summary><div>${s[1]}</div></details>`).join('')+`<button onclick="S.done['${t.id}']=!S.done['${t.id}'];save();R()">${S.done[t.id]?'✓ Completado (quitar)':'Marcar como completado'}</button>`))}
function cards(){return tops().flatMap(t=>t.c.map((c,j)=>({k:t.id+'c'+j,t:t.n,q:c[0],a:c[1]}))).filter(c=>!FP||S.known[c.k]!==1)}
function fc(m){const L=cards();if(FI>=L.length)FI=0;m.innerHTML=`<label><input type="checkbox" ${FP?'checked':''} onchange="FP=this.checked;FI=0;R()"> Solo pendientes</label>`;if(!L.length){m.innerHTML+='<div class="card">🎉 ¡Todas dominadas!</div>';return}const c=L[FI];m.innerHTML+=`<p class="tag">${FI+1}/${L.length} · ${c.t}</p><div class="card fc ${FL?'back':''}" tabindex="0" role="button" onclick="FL=!FL;R()" onkeydown="if(event.key==' '||event.key=='Enter'){event.preventDefault();FL=!FL;R()}">${FL?c.a:'<b>'+c.q+'</b>'}</div><div class="row"><button onclick="mk('${c.k}',1)">✓ La sabía</button><button onclick="mk('${c.k}',0)">↻ Repasar</button></div><p class="tag">Pulsa la tarjeta (o Enter) para voltearla.</p>`}
function mk(k,v){S.known[k]=v;save();FI++;FL=false;R()}
function qs(){return tops().flatMap(t=>t.q.map((q,j)=>({k:t.id+j,t:t.n,q})))}
function ts(m){m.innerHTML=`<div class="card"><p>${qs().length} preguntas, con feedback inmediato.</p><button class="on" onclick="quiz(sh(qs()),true)">Empezar test</button></div>`}
function ex(m){m.innerHTML=`<div class="card"><p>Examen aleatorio de los temas seleccionados arriba. Sin feedback hasta el final.</p><label>Nº de preguntas: <input type="number" id="en" value="20" min="3" max="40"></label> <label><input type="checkbox" id="ec" checked> Cronómetro</label><p><button class="on" onclick="quiz(sh(qs()).slice(0,+$('#en').value||20),false,$('#ec').checked)">Empezar examen</button></p></div>`}
function quiz(L,fb,clock){const m=$('#m');let i=0,res=[],t0=Date.now();clearInterval(tm);
if(clock)tm=setInterval(()=>{const e=$('#tc');if(e){const s=Math.floor((Date.now()-t0)/1000);e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}},500);
function rec(it,ok){res.push({it,ok});if(!ok)S.wrong[it.k]=2;else if(S.wrong[it.k]&&!--S.wrong[it.k])delete S.wrong[it.k];save();prog()}
const nxt=()=>{i++;i<L.length?show():end()};
function show(){const it=L[i],q=it.q,o=q[1].map((t,j)=>[t,j===q[2]]),O=o.length>2?sh(o):o;
m.innerHTML=`<p class="tag">Pregunta ${i+1}/${L.length} · ${it.t}${clock?' · ⏱ <span id="tc"></span>':''}</p><div class="card"><b>${q[0]}</b>`+O.map((x,j)=>`<button class="opt" data-j="${j}">${x[0]}</button>`).join('')+'<div id="fb"></div></div>';
m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=O[+b.dataset.j][1];rec(it,ok);if(!fb)return nxt();m.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(O[+x.dataset.j][1])x.classList.add('ok')});if(!ok)b.classList.add('ko');$('#fb').innerHTML=`<div class="fb ${ok?'ok':'ko'}"><b>${ok?'¡Correcto!':'Incorrecto.'}</b> ${q[3]}</div><p><button class="on" id="nx">${i+1<L.length?'Siguiente →':'Ver resultado'}</button></p>`;$('#nx').onclick=nxt;$('#nx').focus()})}
function end(){clearInterval(tm);const ok=res.filter(r=>r.ok).length,by={};res.forEach(r=>{by[r.it.t]=by[r.it.t]||[0,0];by[r.it.t][1]++;if(r.ok)by[r.it.t][0]++});
m.innerHTML=`<div class="card"><div class="big">${(10*ok/res.length).toFixed(1)} / 10</div><p>${ok} de ${res.length} aciertos${clock?' · '+Math.round((Date.now()-t0)/1000)+' s':''}.</p><table><tr><th>Tema</th><th>Aciertos</th></tr>${Object.entries(by).map(([k,v])=>`<tr><td>${k}</td><td>${v[0]}/${v[1]}</td></tr>`).join('')}</table></div>`+(res.some(r=>!r.ok)?'<h3>Para repasar</h3>'+res.filter(r=>!r.ok).map(r=>`<div class="card"><b>${r.it.q[0]}</b><p>✓ ${r.it.q[1][r.it.q[2]]}</p><p class="tag">${r.it.q[3]}</p></div>`).join(''):'<p>🎉 Sin fallos.</p>')}
show()}
function rv(m){const w=qs().filter(x=>S.wrong[x.k]),pc=T.flatMap(t=>t.c.map((c,j)=>({k:t.id+'c'+j,q:c[0],a:c[1]}))).filter(c=>S.known[c.k]===0);
m.innerHTML=`<h3>Preguntas falladas (${w.length})</h3>`+(w.length?`<button class="on" onclick="quiz(sh(qs().filter(x=>S.wrong[x.k])),true)">Practicar fallos</button>`+w.map(x=>`<div class="card">${x.q[0]}<p class="tag">${x.t}</p></div>`).join(''):'<p>Ninguna. Se eliminan al acertarlas dos veces.</p>')+`<h3>Flashcards por repasar (${pc.length})</h3>`+pc.map(c=>`<details><summary>${c.q}</summary><div>${c.a}</div></details>`).join('')}
function gl(m){m.innerHTML='<input type="search" id="gq" placeholder="Buscar término…" aria-label="Buscar en el glosario"><div id="gr"></div>';const f=()=>{const q=$('#gq').value.toLowerCase();$('#gr').innerHTML=T.flatMap(t=>t.c.map(c=>[t.n,c[0],c[1]])).filter(c=>(c[1]+c[2]).toLowerCase().includes(q)).map(c=>`<div class="card"><b>${c[1]}</b> <span class="tag">${c[0]}</span><br>${c[2]}</div>`).join('')};$('#gq').oninput=f;f()}
function ff(m){m.insertAdjacentHTML('beforeend','<p class="tag">Texto íntegro del DOCX y de la presentación PPTX, sin resumir.</p>');tops().forEach(t=>m.insertAdjacentHTML('beforeend',`<h2>${t.n}</h2><div class="raw">${RAW[t.id]}</div>`))}
function ch(m){tops().forEach(t=>m.insertAdjacentHTML('beforeend',`<div class="card"><h3>${t.n}</h3><ul>${t.s.map(x=>`<li>${x}</li>`).join('')}</ul></div>`))}
$('#th').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'};
$('#rs').onclick=()=>{if(confirm('¿Borrar todo el progreso?')){S={done:{},known:{},wrong:{}};save();R()}};
R();
</script></body></html>
