table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{border:1px solid var(--bd);padding:5px 8px;text-align:left}th{background:var(--acs)}.sc{overflow-x:auto}

<script>
const T=[
{id:'i',n:'SO y Multitenant',
th:[['Integración en el SO (Oracle Linux)',`<ul><li><b>Mínimo privilegio</b>: el motor <mark>nunca corre como root</mark>; propietario de la instalación = usuario <code>alumno</code>.</li><li><b>Grupos OSDBA/OSOPER/OSBACKUPDBA…</b>: se vinculan en <code>runInstaller</code> a un grupo Linux (<code>wheel</code> en clase, o <code>oinstall</code>/<code>dba</code>).</li><li><b><code>sqlplus / as sysdba</code></b>: la <mark>/</mark> delega la autenticación en el SO (¿pertenece al grupo OSDBA?). Permite conectar con la BD apagada para arrancarla.</li><li><b>Fichero de contraseñas</b> <code>orapw&lt;SID&gt;</code> (<code>$ORACLE_HOME/dbs/orapwasir</code>, herramienta <code>orapwd</code>): para conexiones administrativas <mark>remotas</mark>.</li></ul>`],
['OFA y variables de entorno',`<div class="sc"><table><tr><th>Variable / fichero</th><th>Valor en la VM</th><th>Función</th></tr><tr><td>ORACLE_BASE</td><td>/opt/app/alumno</td><td>Raíz OFA: admin, diag, oradata</td></tr><tr><td>ORACLE_HOME</td><td>/opt/oracle-install</td><td>Binarios (sqlplus, dbca, netca, lsnrctl), dbs, network/admin</td></tr><tr><td>ORACLE_SID</td><td>asir</td><td>Qué instancia (segmento de RAM) usan los binarios locales</td></tr><tr><td>PATH</td><td>$PATH:$ORACLE_HOME/bin</td><td>Usar los comandos desde cualquier carpeta</td></tr><tr><td>/etc/oratab</td><td>SID:HOME:[Y|N]</td><td>Lo crea root.sh; instancias y arranque con dbstart/dbshut</td></tr><tr><td>~/.bashrc</td><td>/home/alumno</td><td>Los <code>export</code> persisten tras reiniciar</td></tr></table></div><div class="extra"><b>ORA-12162</b> al hacer <code>sqlplus / as sysdba</code> = ORACLE_SID vacío. Solución: <code>export ORACLE_SID=asir</code>, <code>source ~/.bashrc</code> o <code>source oraenv</code>.</div>`],
['Instancia vs. base de datos',`<div class="sc"><table><tr><th></th><th>Instancia</th><th>Base de datos</th></tr><tr><td>Dónde</td><td>RAM + CPU (volátil)</td><td>Disco (persistente)</td></tr><tr><td>Componentes</td><td>SGA + procesos background</td><td>Datafiles .dbf, Control files .ctl, Redo logs .log</td></tr><tr><td>Identificador</td><td>ORACLE_SID (asir)</td><td>DB_NAME / SERVICE_NAME</td></tr><tr><td>Relación</td><td>1 instancia abre 1 BD (single instance); en <b>RAC</b> varias instancias abren la misma BD</td><td>Contiene diccionario de datos y esquemas de usuario</td></tr></table></div><div class="card" id="ib"></div>`],
['Multitenant: CDB y PDB (21c)',`<p>Desde 21c toda BD es <mark>multitenant</mark>: varias BD bajo <b>una sola instancia</b>.</p><ul><li><b>CDB$ROOT</b> (<code>asir</code>, "el edificio"): diccionario maestro y usuarios comunes (<code>C##</code>, SYS, SYSTEM). <mark>Nunca</mark> crear tablas de aplicación aquí.</li><li><b>PDB$SEED</b>: plantilla <mark>READ ONLY</mark> para clonar PDBs en segundos.</li><li><b>PDB</b> (<code>pdasir</code>, "el apartamento"): BD conectable de trabajo (usuarios locales, tablespaces, tablas). <b>Sin SGA ni procesos propios</b>; se expone por un servicio (<code>pdasir</code>).</li></ul>`]],
c:[['Principio de mínimo privilegio','El motor Oracle nunca se ejecuta como root; el propietario de la instalación es "alumno".'],['sqlplus / as sysdba','La "/" delega la autenticación en el SO: si el usuario está en el grupo OSDBA (wheel), entra sin contraseña, incluso con la BD apagada.'],['orapw<SID>','Fichero de contraseñas (orapwd) en $ORACLE_HOME/dbs para conexiones administrativas remotas.'],['ORACLE_BASE / ORACLE_HOME','/opt/app/alumno (raíz OFA: diag, oradata) / /opt/oracle-install (binarios, dbs, network/admin).'],['ORACLE_SID','Identifica la instancia local (asir). Vacío → ORA-12162.'],['/etc/oratab','Formato SID:ORACLE_HOME:[Y|N]; lo crea root.sh; indica qué instancias arrancan con dbstart/dbshut.'],['Instancia vs. BD','Instancia = SGA + procesos (RAM, volátil). BD = ficheros en disco (persistente).'],['CDB$ROOT','Contenedor raíz: diccionario maestro y usuarios comunes (C##, SYS, SYSTEM). No crear objetos de aplicación.'],['PDB$SEED','Plantilla READ ONLY para clonar nuevas PDBs en segundos.'],['PDB (pdasir)','BD conectable de trabajo; comparte instancia y SGA de la CDB; se accede por servicio.']],
q:[['¿Qué indica la barra "/" en "sqlplus / as sysdba"?',['Que no hay contraseña definida','Que se delega la autenticación en el SO (grupo OSDBA)','Que se conecta a la PDB','Que se usa el fichero orapw'],1,'Oracle pregunta al kernel Linux si el usuario pertenece al grupo OSDBA (wheel).'],
['El error ORA-12162 al conectar como sysdba indica que…',['El listener está caído','ORACLE_SID está vacío','Falta el SPFILE','La PDB está cerrada'],1,'Se soluciona con export ORACLE_SID=asir o source oraenv.'],
['¿Dónde residen los binarios del motor?',['ORACLE_BASE','ORACLE_SID','ORACLE_HOME','/etc/oratab'],2,'ORACLE_HOME = /opt/oracle-install (bin, dbs, network/admin).'],
['¿Qué contiene /etc/oratab?',['Contraseñas SYS','SID:ORACLE_HOME:[Y|N]','Los datafiles','El listener.ora'],1,'Lo crea root.sh e indica qué instancias arrancan con dbstart/dbshut.'],
['¿Cuál es volátil y solo existe con el motor encendido?',['Base de datos','Datafile','Instancia','Control file'],2,'La instancia es memoria + procesos; la BD es persistente en disco.'],
['¿Qué es PDB$SEED?',['Una PDB de usuario','Plantilla READ ONLY para clonar PDBs','El diccionario de datos','Un tablespace'],1,'Se usa como molde para crear nuevas PDBs en segundos.'],
['¿Dónde NO deben crearse tablas de aplicación?',['En una PDB','En CDB$ROOT','En un tablespace de usuario','En el esquema local'],1,'CDB$ROOT es solo administrativa (usuarios comunes C##, SYS, SYSTEM).'],
['¿Cuántas SGA tiene una PDB como pdasir?',['Una propia','Dos','Ninguna: comparte la de la CDB','Depende del SID'],2,'No tiene procesos ni SGA propios; se expone mediante un servicio.'],
['¿Para qué sirve el fichero orapw<SID>?',['Guardar el SPFILE','Conexiones administrativas remotas','Registrar el listener','Almacenar redo logs'],1,'Credenciales cifradas de SYSDBA/SYSOPER; se gestiona con orapwd.'],
['En una arquitectura RAC…',['Una instancia abre varias BD','Varias instancias abren una misma BD compartida','No hay instancia','Solo hay PDBs'],1,'Single Instance: 1 instancia = 1 BD. RAC: varias instancias, 1 BD.']],
s:['Nunca root. sqlplus / as sysdba = autenticación delegada en el SO (OSDBA/wheel).','ORACLE_BASE=/opt/app/alumno · ORACLE_HOME=/opt/oracle-install · ORACLE_SID=asir.','ORA-12162 → ORACLE_SID vacío.','Instancia (RAM, volátil) vs BD (disco). CDB$ROOT (no tablas) · PDB$SEED (RO) · PDB pdasir (trabajo, sin SGA propia).']},
{id:'m',n:'Memoria, procesos y ficheros',
th:[['SGA y PGA',`<ul><li><b>SGA</b> (compartida, se reserva al arrancar):<ul><li><mark>Database Buffer Cache</mark>: copias de bloques de datafiles; los modificados sin bajar a disco = <b>bloques sucios</b>.</li><li><mark>Redo Log Buffer</mark>: registra cada cambio antes de volcarlo a los redo logs.</li><li><mark>Shared Pool</mark>: Library Cache (planes SQL/PL-SQL compilados) + Data Dictionary Cache.</li><li>Large Pool / Java Pool: RMAN, paralelo, Java (opcionales).</li></ul></li><li><b>PGA</b> (privada por Server Process): SQL Work Area (ORDER BY, GROUP BY, Hash Join) y variables de sesión.</li></ul>`],
['Procesos en segundo plano',`<p>En Linux: <code>ora_&lt;proceso&gt;_&lt;SID&gt;</code> (<code>ps -ef | grep ora_</code> o <code>v$bgprocess</code>).</p><div class="sc"><table><tr><th>Proceso</th><th>Misión</th></tr><tr><td>DBWn</td><td>Escribe bloques sucios del Buffer Cache a los datafiles (lazy write; cache llena o checkpoint)</td></tr><tr><td>LGWR</td><td>Redo Log Buffer → redo logs; <mark>en cada COMMIT</mark> → Durabilidad (ACID)</td></tr><tr><td>CKPT</td><td>Ordena a DBWn volcar y actualiza el SCN en datafiles y control files</td></tr><tr><td>SMON</td><td>Instance Recovery al arrancar: roll forward (redo) + rollback (undo)</td></tr><tr><td>PMON</td><td>Cliente caído: revierte su transacción, libera bloqueos y limpia PGA</td></tr><tr><td>LREG</td><td>Registra instancia y servicios de PDBs abiertas en el listener (1521)</td></tr></table></div><div class="card" id="pr"></div>`],
['Los 6 tipos de ficheros',`<div class="sc"><table><tr><th>Fichero</th><th>Ruta</th><th>Clave</th></tr><tr><td>SPFILE/PFILE</td><td>$ORACLE_HOME/dbs (spfileasir.ora / initasir.ora)</td><td>Fase NOMOUNT: sga_target, control_files, processes</td></tr><tr><td>Control files</td><td>oradata/ASIR/control01.ctl…</td><td>Fase MOUNT: mapa físico + SCN; multiplexar. <code>V$CONTROLFILE</code></td></tr><tr><td>Datafiles/Tempfiles</td><td>oradata/ASIR/system01.dbf…</td><td>Fase OPEN: tablas e índices en tablespaces. <code>V$DATAFILE</code>, <code>CDB_DATA_FILES</code></td></tr><tr><td>Online Redo Logs</td><td>oradata/ASIR/redo01.log…</td><td>Circular (escribe LGWR); mínimo 2 grupos. <code>V$LOG</code>, <code>V$LOGFILE</code></td></tr><tr><td>Password file</td><td>$ORACLE_HOME/dbs/orapwasir</td><td>SYSDBA/SYSOPER remotos. <code>V$PWFILE_USERS</code></td></tr><tr><td>Alert log</td><td>$ORACLE_BASE/diag/rdbms/asir/asir/trace/alert_asir.log</td><td>Texto plano: arranques, paradas, errores ORA-. <code>V$DIAG_INFO</code></td></tr></table></div>`],
['PFILE vs. SPFILE y ALTER SYSTEM',`<ul><li><b>PFILE</b>: texto plano, editable con nano/vi; todo cambio exige reiniciar.</li><li><b>SPFILE</b>: binario (por defecto). <mark>Nunca editarlo con nano</mark> (se corrompe).</li></ul><p><code>ALTER SYSTEM SET parametro = valor SCOPE = MEMORY | SPFILE | BOTH;</code></p><ul><li><b>MEMORY</b>: solo RAM, se pierde al reiniciar.</li><li><b>SPFILE</b>: para el próximo arranque (obligatorio en parámetros estáticos como <code>processes</code>).</li><li><b>BOTH</b>: en caliente y persistente.</li></ul>`]],
c:[['SGA','System Global Area: memoria compartida reservada al arrancar la instancia (Buffer Cache, Redo Log Buffer, Shared Pool, Large/Java Pool).'],['PGA','Memoria privada por Server Process: SQL Work Area (ORDER BY, GROUP BY, Hash Join) y variables de sesión.'],['Bloque sucio','Bloque modificado en el Buffer Cache aún no escrito a los datafiles.'],['Shared Pool','Library Cache (planes de ejecución compilados) + Data Dictionary Cache.'],['DBWn','Escribe bloques sucios a los datafiles de forma diferida (lazy write).'],['LGWR','Vuelca el Redo Log Buffer a los redo logs; se dispara en cada COMMIT (Durabilidad).'],['CKPT','Sincroniza BD: pide a DBWn volcar y actualiza el SCN en datafiles y control files.'],['SMON','Instance Recovery en el arranque tras caída o SHUTDOWN ABORT (roll forward + rollback).'],['PMON','Limpia procesos de usuario caídos: rollback, libera bloqueos y PGA.'],['LREG','Registra instancia y servicios de PDBs abiertas en el Listener (1521).'],['SPFILE vs PFILE','SPFILE binario (ALTER SYSTEM, nunca nano); PFILE texto plano (requiere reinicio).'],['SCOPE','MEMORY solo RAM · SPFILE próximo arranque (estáticos) · BOTH ambos.']],
q:[['¿Qué proceso escribe los bloques sucios a los datafiles?',['LGWR','DBWn','CKPT','PMON'],1,'DBWn hace escritura diferida desde el Buffer Cache.'],
['¿Qué proceso se dispara de forma síncrona en cada COMMIT?',['DBWn','SMON','LGWR','LREG'],2,'LGWR garantiza la Durabilidad (ACID) escribiendo el redo.'],
['Un cliente se cuelga bruscamente. ¿Quién revierte su transacción y libera bloqueos?',['SMON','PMON','CKPT','LREG'],1,'PMON limpia procesos de usuario caídos y su PGA.'],
['¿Qué proceso hace Instance Recovery al arrancar tras un SHUTDOWN ABORT?',['SMON','PMON','DBWn','CKPT'],0,'SMON aplica roll forward (redo) y rollback (undo).'],
['¿Dónde se guardan compilados los planes de ejecución SQL?',['Buffer Cache','Redo Log Buffer','Library Cache (Shared Pool)','PGA'],2,'La Library Cache evita recalcular los planes.'],
['¿Qué zona contiene el SQL Work Area para ordenaciones?',['SGA','PGA','Large Pool','Control file'],1,'La PGA es privada de cada Server Process.'],
['¿Qué fichero guarda el mapa físico de la BD y el SCN actual?',['Datafile','Alert log','Control file','Password file'],2,'Se lee en la fase MOUNT y se multiplexa.'],
['¿Cuántos grupos de redo log como mínimo?',['1','2','3','4'],1,'Bitácora circular con mínimo 2 grupos.'],
['¿Qué SCOPE es obligatorio para un parámetro estático como "processes"?',['MEMORY','SPFILE','BOTH','Ninguno'],1,'Los estáticos solo se aplican en el siguiente arranque.'],
['¿Por qué no se debe editar el SPFILE con nano?',['Es de solo lectura','Es binario y se corrompe','Está cifrado','Pertenece a root'],1,'Se modifica con ALTER SYSTEM SET.'],
['¿Qué proceso registra los servicios de las PDBs en el listener?',['LREG','PMON','SMON','LGWR'],0,'LREG se registra dinámicamente en el puerto 1521.']],
s:['SGA compartida (Buffer Cache, Redo Buffer, Shared Pool) · PGA privada (SQL Work Area).','DBWn → datafiles (lazy) · LGWR → redo (en COMMIT) · CKPT → SCN · SMON → recovery · PMON → limpia · LREG → listener.','6 ficheros: SPFILE/PFILE, control, datafiles, redo (mín. 2 grupos), password, alert log.','ALTER SYSTEM SET … SCOPE=MEMORY|SPFILE|BOTH. SPFILE nunca con nano.']},
{id:'a',n:'Arranque, red y diccionario',
th:[['Fases de STARTUP',`<ol><li><b>NOMOUNT</b> ("instance started"): lee SPFILE/PFILE, reserva SGA, lanza procesos. Solo vistas en memoria (<code>V$INSTANCE</code>, <code>V$PARAMETER</code>). Uso: <code>CREATE DATABASE</code>, recrear control files.</li><li><b>MOUNT</b> ("database mounted"): abre los control files; conoce datafiles y redo pero no los abre. Permite <code>V$DATAFILE</code>/<code>V$LOGFILE</code>, no <code>DBA_USERS</code>. Uso: ARCHIVELOG, renombrar ficheros, recuperaciones.</li><li><b>OPEN</b> ("database opened"): abre y verifica SCN de datafiles y redo; SMON recupera si hizo falta. CDB$ROOT abierto.</li></ol><div class="card"><b>PDBs</b>: tras abrir la raíz quedan en <mark>MOUNTED</mark>.<br><code>ALTER PLUGGABLE DATABASE pdasir OPEN;</code><br><code>ALTER PLUGGABLE DATABASE pdasir SAVE STATE;</code> (recuerda el estado)</div><div class="card" id="sd"></div>`],
['Modos de SHUTDOWN',`<div class="sc"><table><tr><th>Modo</th><th>Sesiones activas</th><th>Resultado</th></tr><tr><td>NORMAL (defecto)</td><td>Espera a que todos hagan EXIT</td><td>Limpia; rara vez usado</td></tr><tr><td>TRANSACTIONAL</td><td>Espera a que acaben las transacciones y desconecta</td><td>Limpia</td></tr><tr><td><b>IMMEDIATE</b> (estándar DBA)</td><td>Cancela sentencias, ROLLBACK automático y desconecta</td><td>Limpia y consistente (checkpoint completo)</td></tr><tr><td>ABORT (emergencia)</td><td>Mata procesos sin rollback ni volcado</td><td><mark>Inconsistente</mark>: SMON hace Instance Recovery en el siguiente STARTUP</td></tr></table></div><p>En los tres primeros las nuevas conexiones se bloquean; en ABORT se cortan en el acto.</p>`],
['Listener y tnsnames',`<ul><li><b>Listener</b> (<code>tnslsnr</code>, servidor, <code>$ORACLE_HOME/network/admin/listener.ora</code>, configurado con <code>netca</code>): escucha en el <mark>puerto 1521</mark> y deriva a un Server Process. <code>lsnrctl start|stop|status|reload</code>.</li><li><b>tnsnames.ora</b> (cliente): "agenda" que traduce un alias (<code>PDASIR</code>) a protocolo, HOST, puerto y SERVICE_NAME. Se prueba con <code>tnsping PDASIR</code>.</li><li>Conexión: <code>sqlplus usuario/clave@PDASIR</code> o Easy Connect <code>sqlplus system@localhost:1521/pdasir</code>.</li></ul>`],
['Diccionario de datos',`<p>Catálogo interno de metadatos; reside en los tablespaces <b>SYSTEM y SYSAUX</b>, esquema <b>SYS</b>; se crea con <code>catalog.sql</code> y <code>catproc.sql</code>.</p><div class="sc"><table><tr><th>Familia</th><th>Muestra</th><th>Ejemplos</th></tr><tr><td>USER_*</td><td>Solo objetos del usuario actual</td><td>USER_TABLES, USER_OBJECTS</td></tr><tr><td>ALL_*</td><td>Propios + los de otros con privilegios</td><td>ALL_TABLES, ALL_VIEWS</td></tr><tr><td>DBA_*</td><td>Todo el contenedor (rol DBA/SYSDBA)</td><td>DBA_USERS, DBA_DATA_FILES</td></tr><tr><td>CDB_*</td><td>Todos los contenedores (desde CDB$ROOT, col. CON_ID)</td><td>CDB_PDBS, CDB_USERS</td></tr><tr><td>V$</td><td>RAM y control files; disponibles en NOMOUNT/MOUNT/OPEN</td><td>V$INSTANCE, V$SESSION, V$DATAFILE</td></tr></table></div><p>Todas menos <code>V$</code> requieren BD en <b>OPEN</b>.</p><div class="extra"><code>SHOW CON_NAME; SHOW PDBS; ALTER SESSION SET CONTAINER = pdasir;</code><br><code>SELECT tablespace_name, file_name, bytes/1024/1024 AS tamano_mb FROM dba_data_files;</code><br><code>SELECT sid, serial#, username, status, machine, program FROM v$session WHERE username IS NOT NULL;</code></div>`]],
c:[['NOMOUNT','Lee SPFILE, reserva SGA, lanza procesos; solo vistas V$ en memoria. Para CREATE DATABASE o recrear control files.'],['MOUNT','Abre control files; conoce datafiles y redo. Para ARCHIVELOG, renombrar ficheros, recuperaciones.'],['OPEN','Abre datafiles y redo verificando SCN; SMON recupera si hace falta.'],['SAVE STATE','ALTER PLUGGABLE DATABASE pdasir SAVE STATE: la PDB recuerda su estado abierto tras reiniciar.'],['SHUTDOWN IMMEDIATE','Rollback automático, checkpoint completo; BD consistente. Estándar del DBA.'],['SHUTDOWN ABORT','Equivale a un corte eléctrico; BD inconsistente; Instance Recovery al arrancar.'],['Listener','tnslsnr en el servidor, puerto 1521, listener.ora; se gestiona con lsnrctl.'],['tnsnames.ora','Fichero cliente que traduce alias → HOST, puerto, SERVICE_NAME; se prueba con tnsping.'],['Easy Connect','sqlplus system@localhost:1521/pdasir (sin tnsnames.ora).'],['USER_ / ALL_ / DBA_ / CDB_','Del alcance más estrecho al más amplio; CDB_ abarca todos los contenedores (CON_ID).'],['V$','Vistas dinámicas desde RAM y control files; sirven en NOMOUNT/MOUNT/OPEN.'],['Dónde reside el diccionario','Tablespaces SYSTEM y SYSAUX, esquema SYS; creado por catalog.sql y catproc.sql.']],
q:[['¿Qué fase del STARTUP reserva la SGA y lanza los procesos?',['MOUNT','NOMOUNT','OPEN','SHUTDOWN'],1,'En NOMOUNT aún no se abre ningún fichero de la BD.'],

['¿En qué fase se activa el modo ARCHIVELOG?',['NOMOUNT','MOUNT','OPEN','Cualquiera'],1,'También se renombran ficheros y se hacen recuperaciones completas.'],
['Tras abrir CDB$ROOT, la PDB pdasir queda en…',['OPEN','MOUNTED','Borrada','READ ONLY'],1,'Hay que hacer ALTER PLUGGABLE DATABASE pdasir OPEN.'],
['¿Qué modo de parada es el estándar del DBA?',['NORMAL','TRANSACTIONAL','IMMEDIATE','ABORT'],2,'Hace rollback y checkpoint completo; BD consistente.'],
['¿Qué modo deja la BD inconsistente?',['NORMAL','IMMEDIATE','TRANSACTIONAL','ABORT'],3,'Obliga a SMON a hacer Instance Recovery en el próximo STARTUP.'],
['¿Qué fichero del cliente traduce un alias en HOST, puerto y servicio?',['listener.ora','tnsnames.ora','oratab','orapwasir'],1,'Se verifica con tnsping.'],
['¿Puerto por defecto del listener?',['1433','3306','1521','5432'],2,'Lo gestiona lsnrctl.'],
['¿Qué vista muestra TODOS los objetos del contenedor actual?',['USER_TABLES','ALL_TABLES','DBA_TABLES','V$SESSION'],2,'Requiere rol DBA o SYSDBA.'],
['¿Qué familia usa CON_ID para identificar contenedores?',['USER_*','ALL_*','CDB_*','V$'],2,'Desde CDB$ROOT muestra raíz y PDBs abiertas.'],

s:['STARTUP: NOMOUNT (SGA+procesos) → MOUNT (control files) → OPEN (datafiles+redo). PDB: OPEN + SAVE STATE.','SHUTDOWN: NORMAL / TRANSACTIONAL / IMMEDIATE (estándar) / ABORT (inconsistente).','Listener 1521 (listener.ora) ↔ tnsnames.ora + tnsping.','USER_ < ALL_ < DBA_ < CDB_; V$ desde RAM. Diccionario en SYSTEM/SYSAUX (SYS).']}];

const FF={i:`<div class="raw md"><div class="sc"><table class="box">

<thead>
<tr class="header">
<th><p><strong>2º CFGS ASIR | MÓDULO PROFESIONAL: ADMINISTRACIÓN DE SGBD (CÓDIGO 0377) — RA2 (10%)</strong></p>
<p><strong>APUNTES TEÓRICOS — UNIDAD DE TRABAJO 2 (UT2):<br/>
CONFIGURACIÓN Y ARQUITECTURA DE ORACLE DATABASE</strong></p>
<p><em>Integración del SGBD en el sistema operativo Linux, Instancia vs Base de Datos (Multitenant CDB/PDB), Arquitectura de Memoria (SGA/PGA), Procesos en Segundo Plano, Archivos en Disco, Arranque/Parada y Estructura del Diccionario de Datos.</em></p></th>
</tr>
</thead>
<tbody>
</tbody>
</table></div><p><strong>1. Integración del SGBD en el Sistema Operativo (Oracle Linux)</strong></p><p>Un Sistema Gestor de Bases de Datos (SGBD) empresarial como Oracle Database 21c no funciona de forma aislada: se apoya directamente en el kernel de Linux, en su sistema de ficheros y en su modelo de seguridad de usuarios y grupos. Comprender esta integración es esencial para cualquier Administrador de Bases de Datos (DBA).</p><p><strong>1.1. Control de Usuarios, Grupos del SO y Autenticación OSDBA</strong></p><ul>
<li><p><strong>Principio de mínimo privilegio:</strong> Por razones de seguridad, los procesos del motor Oracle jamás se ejecutan bajo el superusuario root de Linux. En nuestra máquina virtual de laboratorio, el propietario de la instalación es el usuario 'alumno'.</p></li>
<li><p><strong>Grupos administrativos del SGBD:</strong> Durante la instalación con runInstaller se vinculan los privilegios internos del motor (OSDBA, OSOPER, OSBACKUPDBA, OSDGDBA, OSKMDBA) con un grupo del sistema operativo Linux. En distribuciones empresariales Red Hat / Oracle Linux se utiliza el grupo 'wheel' (como hicimos en la instalación de clase) o los grupos específicos 'oinstall' y 'dba'.</p></li>
<li><p><strong>Autenticación delegada en el Sistema Operativo (sqlplus / as sysdba):</strong> Cuando ejecutamos el comando 'sqlplus / as sysdba', la barra inclinada (/) indica a Oracle que no verifique usuario y contraseña contra el diccionario de datos, sino que pregunte al kernel de Linux si el usuario actual pertenece al grupo OSDBA (wheel). Gracias a ello, podemos conectarnos incluso cuando la base de datos está completamente apagada para poder encenderla.</p></li>
<li><p><strong>Fichero externo de contraseñas (orapw&lt;SID&gt;):</strong> Para conexiones administrativas remotas por red donde no se puede validar el usuario de Linux, Oracle utiliza un fichero binario cifrado ubicado en $ORACLE_HOME/dbs/orapwasir, gestionado con la herramienta orapwd.</p></li>
</ul><p><strong>1.2. Sistema de Ficheros (Arquitectura OFA) y Variables de Entorno</strong></p><p>Oracle organiza sus directorios siguiendo el estándar OFA (Optimal Flexible Architecture), que separa el software ejecutable de los archivos de datos y diagnóstico:</p><div class="sc"><table>

<thead>
<tr class="header">
<th><strong>Variable / Fichero</strong></th>
<th><strong>Ruta en nuestra VM de Aula</strong></th>
<th><strong>Función Técnica en el Sistema Operativo</strong></th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td><strong>ORACLE_BASE</strong></td>
<td>/opt/app/alumno</td>
<td>Directorio raíz de la jerarquía OFA. Aloja subcarpetas de administración, trazas (diag) y los ficheros físicos de datos (oradata).</td>
</tr>
<tr class="even">
<td><strong>ORACLE_HOME</strong></td>
<td>/opt/oracle-install</td>
<td>Directorio donde residen los binarios ejecutables del motor (bin/sqlplus, dbca, netca, lsnrctl), librerías y ficheros de configuración (dbs, network/admin).</td>
</tr>
<tr class="odd">
<td><strong>ORACLE_SID</strong></td>
<td>asir</td>
<td>System Identifier. Variable crítica que indica a los binarios locales a qué segmento de memoria RAM (Instancia) deben conectarse.</td>
</tr>
<tr class="even">
<td><strong>PATH</strong></td>
<td>$PATH:$ORACLE_HOME/bin</td>
<td>Permite invocar sqlplus, lsnrctl, dbca, netca o tnsping desde cualquier carpeta de la terminal de Linux.</td>
</tr>
<tr class="odd">
<td><strong>/etc/oratab</strong></td>
<td>/etc/oratab</td>
<td>Fichero creado por root.sh con el formato 'SID:ORACLE_HOME:[Y|N]'. Indica qué instancias existen en el servidor y cuáles arrancan con dbstart/dbshut.</td>
</tr>
<tr class="even">
<td><strong>~/.bashrc</strong></td>
<td>/home/alumno/.bashrc</td>
<td>Script de inicio de la shell Bash donde se declaran las sentencias 'export' para que persistan tras cada reinicio.</td>
</tr>
</tbody>
</table></div><div class="sc"><table class="box">

<thead>
<tr class="header">
<th><strong>⚠️ Error Clásico de Laboratorio: ORA-12162<br/>
</strong>Si al ejecutar 'sqlplus / as sysdba' aparece el error 'ORA-12162: TNS:net service name is incorrectly specified', significa que la variable de entorno ORACLE_SID está vacía en tu terminal actual. Solución inmediata: ejecutar 'export ORACLE_SID=asir' o cargar el perfil con 'source ~/.bashrc' (o usar el script oficial 'source oraenv').</th>
</tr>
</thead>
<tbody>
</tbody>
</table></div><p><strong>2. Relación entre el SGBD y la Base de Datos: Instancias y Multitenant</strong></p><p>A diferencia de otros motores más ligeros (como MySQL o SQLite), en Oracle existe una separación radical entre el concepto de Base de Datos y el concepto de Instancia, conectando directamente con el Nivel Interno o Físico de la arquitectura ANSI/SPARC.</p><div class="sc"><table>

<thead>
<tr class="header">
<th><strong>Criterio</strong></th>
<th><strong>Instancia de Base de Datos (Memoria + CPU)</strong></th>
<th><strong>Base de Datos (Almacenamiento en Disco)</strong></th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td><strong>Naturaleza</strong></td>
<td>Volátil y temporal: solo existe mientras el motor está encendido.</td>
<td>Persistente y física: permanece grabada aunque se apague el servidor.</td>
</tr>
<tr class="even">
<td><strong>Componentes</strong></td>
<td>Área de memoria compartida (SGA) + Procesos en segundo plano (Background Processes).</td>
<td>Ficheros físicos en el sistema de archivos: Datafiles (.dbf), Control Files (.ctl) y Redo Logs (.log).</td>
</tr>
<tr class="odd">
<td><strong>Identificador</strong></td>
<td>Se identifica mediante ORACLE_SID (en nuestra VM: 'asir').</td>
<td>Se identifica por el parámetro DB_NAME y expone servicios de red (SERVICE_NAME).</td>
</tr>
<tr class="even">
<td><strong>Relación</strong></td>
<td>Una instancia monta y abre una única base de datos (en arquitectura Single Instance). En sistemas en clúster (Oracle RAC), varias instancias en distintos servidores pueden abrir simultáneamente una misma base de datos compartida.</td>
<td>Contiene tanto los metadatos del sistema (Diccionario de Datos) como los esquemas y tablas de los usuarios.</td>
</tr>
</tbody>
</table></div><p><strong>2.1. Arquitectura Multitenant (CDB y PDB en Oracle 21c)</strong></p><p>Desde Oracle Database 21c, toda base de datos creada es obligatoriamente una base de datos multitenant (multitenencia). Esta arquitectura consolida múltiples bases de datos independientes bajo una única instancia en memoria:</p><ul>
<li><p><strong>CDB$ROOT (Contenedor Raíz — 'asir'):</strong> Es la estructura administrativa central ('el edificio'). Contiene el diccionario de datos maestro de Oracle y los usuarios comunes (cuyo nombre empieza por C##, además de SYS y SYSTEM). Regla de oro: nunca se deben crear tablas de aplicaciones ni esquemas de usuario dentro de CDB$ROOT.</p></li>
<li><p><strong>PDB$SEED (Plantilla Semilla):</strong> Es un contenedor modelo en modo de solo lectura (READ ONLY) que Oracle utiliza internamente como molde para clonar nuevas bases de datos conectables en cuestión de segundos.</p></li>
<li><p><strong>PDB (Pluggable Database — 'pdasir'):</strong> Es la base de datos conectable de trabajo ('el apartamento'). Para un desarrollador o aplicación cliente se comporta como una base de datos completa e independiente, donde creamos usuarios locales, tablespaces y tablas. Sin embargo, no tiene procesos ni SGA propios: comparte la instancia de la CDB y se expone en la red mediante un Servicio (pdasir).</p></li>
</ul></div>`,m:`<div class="raw md"><p><strong>3. Arquitectura del SGBD: Memoria, Procesos y Archivos en Disco</strong></p><p><strong>3.1. Espacios de Memoria (SGA y PGA)</strong></p><p>Para alcanzar un alto rendimiento y garantizar las propiedades ACID, Oracle nunca lee ni modifica datos directamente sobre el disco duro cuando un usuario ejecuta una consulta; todo se procesa primero en memoria RAM, que se divide en dos grandes áreas:</p><ul>
<li><p><strong>SGA (System Global Area — Memoria Compartida):</strong> Se reserva en Linux al arrancar la instancia y es compartida por todos los procesos del servidor y sesiones. Sus estructuras clave son:<br/>
• Database Buffer Cache: Almacena en RAM copias de los bloques de datos leídos de los Datafiles (.dbf). Los bloques modificados por un UPDATE o INSERT que aún no se han bajado a disco se denominan 'bloques sucios' (Dirty Buffers).<br/>
• Redo Log Buffer: Buffer circular de altísima velocidad que registra cronológicamente cada cambio realizado en la base de datos antes de ser volcado a los archivos Online Redo Log.<br/>
• Shared Pool: Contiene la Library Cache (donde se guardan compilados los planes de ejecución de las sentencias SQL y bloques PL/SQL para no recalcularlos) y la Data Dictionary Cache (metadatos de tablas, usuarios y permisos en caché).<br/>
• Large Pool / Java Pool: Áreas opcionales para copias de seguridad con RMAN, procesos paralelos y código Java.</p></li>
<li><p><strong>PGA (Program Global Area — Memoria Privada):</strong> Zona de memoria exclusiva y no compartida asignada a cada proceso de servidor (Server Process) cuando un usuario se conecta. Contiene el SQL Work Area (donde se realizan ordenaciones con ORDER BY, agrupaciones GROUP BY y cruces Hash Join) y las variables privadas de sesión.</p></li>
</ul><p><strong>3.2. Procesos en Segundo Plano (Background Processes)</strong></p><p>En el sistema operativo Linux, la instancia de Oracle se materializa como una colección de procesos demonios cuyos nombres siguen el patrón 'ora_&lt;proceso&gt;_&lt;SID&gt;' (visibles con el comando 'ps -ef | grep ora_'; o desde BBDD: SELECT name, description FROM v$bgprocess WHERE paddr != '00' ORDER BY name;):</p><div class="sc"><table>

<thead>
<tr class="header">
<th><strong>Proceso</strong></th>
<th><strong>Nombre en Linux</strong></th>
<th><strong>Misión Crítica dentro de la Arquitectura Oracle</strong></th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td><strong>DBWn<br/>
(Database Writer)</strong></td>
<td>ora_dbw0_asir</td>
<td>Escribe de forma asíncrona y diferida (lazy write) los bloques modificados ('sucios') desde el Database Buffer Cache (SGA) hacia los Datafiles (.dbf) en disco cuando la caché se llena o ocurre un Checkpoint.</td>
</tr>
<tr class="even">
<td><strong>LGWR<br/>
(Log Writer)</strong></td>
<td>ora_lgwr_asir</td>
<td>Escribe secuencialmente el contenido del Redo Log Buffer hacia los Online Redo Log Files (.log) en disco. Se dispara síncronamente en cada COMMIT: garantiza la Durabilidad (ACID).</td>
</tr>
<tr class="odd">
<td><strong>CKPT<br/>
(Checkpoint)</strong></td>
<td>ora_ckpt_asir</td>
<td>Sincroniza la base de datos: ordena a DBWn volcar bloques a disco y actualiza el número de cambio del sistema (SCN) en las cabeceras de todos los Datafiles y en los Control Files.</td>
</tr>
<tr class="even">
<td><strong>SMON<br/>
(System Monitor)</strong></td>
<td>ora_smon_asir</td>
<td>Responsable de la Recuperación Automática de la Instancia (Instance Recovery) al arrancar tras un corte eléctrico o SHUTDOWN ABORT: aplica Roll Forward (con los Redo Logs) y Rollback (con el espacio UNDO).</td>
</tr>
<tr class="odd">
<td><strong>PMON<br/>
(Process Monitor)</strong></td>
<td>ora_pmon_asir</td>
<td>Vigila los procesos de usuario. Si un cliente se desconecta bruscamente o se cuelga, PMON revierte su transacción activa, libera los bloqueos de filas y limpia su memoria PGA.</td>
</tr>
<tr class="even">
<td><strong>LREG<br/>
(Listener Reg.)</strong></td>
<td>ora_lreg_asir</td>
<td>Registra dinámicamente y de forma automática la instancia ('asir') y los servicios de las PDBs abiertas ('pdasir') ante el proceso Listener de red en el puerto TCP 1521.</td>
</tr>
</tbody>
</table></div><p>Más información en:</p><p><a href="https://docs.oracle.com/cd/B19306_01/server.102/b14220/process.htm%20">https://docs.oracle.com/cd/B19306_01/server.102/b14220/process.htm</a> <a href="https://docs.oracle.com/en/database/oracle/oracle-database/19/refrn/background-processes.html">https://docs.oracle.com/en/database/oracle/oracle-database/19/refrn/background-processes.html</a></p><p><strong>3.3. Archivos en Disco y Gestión de Parámetros (SPFILE vs PFILE)</strong></p><p>En el sistema de ficheros de Linux, Oracle distribuye su información en seis tipos de archivos físicos:</p><div class="sc"><table>

<thead>
<tr class="header">
<th><strong>Tipo de Archivo</strong></th>
<th><strong>Ubicación / Extensión</strong></th>
<th><strong>Descripción y Consulta en el Diccionario</strong></th>
</tr>
</thead>
<tbody>
<tr class="odd">
<td><strong>1. Ficheros de Parámetros<br/>
(SPFILE / PFILE)</strong></td>
<td>$ORACLE_HOME/dbs/<br/>
spfileasir.ora / initasir.ora</td>
<td>Se leen en la fase NOMOUNT. Definen el tamaño de la SGA (sga_target), ruta de los control files, límite de procesos (processes) y cursores (open_cursors).</td>
</tr>
<tr class="even">
<td><strong>2. Archivos de Control<br/>
(Control Files)</strong></td>
<td>$ORACLE_BASE/oradata/ASIR/<br/>
control01.ctl, control02.ctl</td>
