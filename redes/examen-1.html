const T=[
{id:'d',n:'DHCP y enrutamiento',
th:[['Xubuntu2 como router',`<p>Se añade un <b>segundo adaptador</b> (puente) a Xubuntu2: <code>enp0s3</code> 172.16.35.155/16 y <code>enp0s8</code> 192.168.1.155/24. Xubuntu1 pasa a <code>192.168.1.105/24</code> con gateway <code>192.168.1.155</code>; Xubuntu3 usa como gateway <code>172.16.35.155</code>. Así 1 y 3 solo ven a la máquina 2.</p><p>Para que 2 <mark>enrute</mark> hay que activar el reenvío de paquetes:</p><ul><li>Temporal: <code>echo 1 &gt; /proc/sys/net/ipv4/ip_forward</code> (se pierde al apagar).</li><li>Permanente: descomentar <code>net.ipv4.ip_forward=1</code> en <code>/etc/sysctl.conf</code>.</li></ul>`],
['Router hacia un Windows',`<p>Xubuntu3 tiene <code>enp0s8</code> 172.16.35.205/16 (gateway 172.16.35.155) y <code>enp0s3</code> 10.0.0.205/8, con forwarding permanente. Windows 10: <code>10.0.0.55/8</code>, gateway <code>10.0.0.205</code> y firewall desactivado para poder hacerle ping. En Xubuntu2 la ruta por defecto pasa a <code>via 172.16.35.205</code>.</p>`],
['isc-dhcp-server: instalación y puertos',`<ul><li>En <code>/etc/dhcp</code> aparece <code>dhcpd.conf</code> (el importante), <code>dhclient.conf</code>, etc.</li><li><mark>Puerto 67</mark> servidor, <mark>puerto 68</mark> cliente.</li><li>Recién instalado está <b>enabled</b> pero <b>failed</b> (<code>is-active</code>) y <code>ss -tulpn</code> no muestra el 67. Al definir una <code>subnet</code> con rango y reiniciar, el 67 aparece escuchando.</li></ul><div class="extra">enabled = arranca con el sistema; active = está funcionando ahora. Pueden no coincidir.</div>`],
['Cliente y proceso DORA',`<p>Cliente: netplan con <code>dhcp4: yes</code>. <code>sudo dhclient -r</code> libera la IP y <code>sudo dhclient -4 -v</code> pide otra y muestra quién la da. <code>/var/lib/dhcp/dhclient.leases</code> guarda el servidor concedente.</p><ol><li><b>DISCOVER</b> (broadcast a 255.255.255.255:67)</li><li><b>OFFER</b></li><li><b>REQUEST</b></li><li><b>ACK</b> (queda <i>bound</i>, con tiempo de renovación)</li></ol><p><mark>Examen: ¿qué números están relacionados?</mark></p><div class="sc"><table><tr><th>Bytes</th><th>Opción</th></tr><tr><td>0x350101</td><td>53: 1 (DHCP Discover)</td></tr><tr><td>0x3204c0a00164</td><td>50: IP solicitada 192.168.1.100</td></tr><tr><td>0x370401030f06</td><td>55 (Parameter Request List): 1 máscara, 3 router, 15 nombre de dominio, 6 servidor DNS</td></tr><tr><td>0xff</td><td>255 (Endmark)</td></tr></table></div>`],
['Configurar dhcpd.conf',`<pre>subnet 172.16.0.0 netmask 255.255.0.0 {
  range 172.16.135.126 172.16.135.129;
  option routers 172.16.0.1;
  option domain-name-servers 8.8.8.8, 1.1.1.1;
}
host andres3 {
  hardware ethernet 08:00:27:b9:b9:1c;
  fixed-address 172.16.135.130;
}
host pablo {
  hardware ethernet 08:00:27:d4:16:cb;
  deny booting;
}</pre><ul><li><mark>Siempre</mark> que se modifique <code>dhcpd.conf</code> hay que reiniciar: <code>sudo systemctl restart isc-dhcp-server</code>.</li><li><b>Reserva</b>: host + MAC + <code>fixed-address</code>; la IP reservada se quita del rango.</li><li><b>Denegar cliente</b>: <code>deny booting</code>. Las concesiones se ven en <code>/var/lib/dhcp/dhcpd.leases</code>.</li><li><b>Rechazar servidor desde el cliente</b>: en <code>/etc/dhcp/dhclient.conf</code>, <code>reject 172.16.0.1;</code>.</li></ul>`],
['Windows Server 2022 como DHCP',`<ol><li>IP fija: 172.16.235.105/16, gateway 172.16.0.1, DNS 8.8.8.8 y 1.1.1.1.</li><li><i>Administrador del servidor → Agregar roles y características</i> → rol <b>Servidor DHCP</b>.</li><li><i>Herramientas → DHCP</i>: aparecen IPv4 e IPv6.</li><li><b>Ámbito</b>: IPv4 → Ámbito nuevo (nombre, IP inicial y final, máscara, concesión de 8 días). <mark>Hay que activarlo</mark>.</li><li><b>Reserva</b>: Ámbito → Reservas → Reserva nueva (IP + MAC sin separadores). Se quita del rango.</li><li><b>Denegar</b>: Filtros → Denegar → Nuevo filtro (MAC) y habilitarlo. El cliente queda con <mark>APIPA</mark> 169.254.x.x.</li></ol>`]],
c:[['Puertos DHCP','67 servidor, 68 cliente.'],['IP forwarding','Permite a una máquina enrutar entre redes. Temporal: echo 1 > /proc/sys/net/ipv4/ip_forward. Permanente: net.ipv4.ip_forward=1 en /etc/sysctl.conf.'],['enabled vs active','enabled: arranca con el sistema. active: funcionando ahora (el servicio estaba enabled pero failed).'],['DORA','Discover, Offer, Request, Ack.'],['Opción 55','Parameter Request List: 1 máscara, 3 router, 15 dominio, 6 DNS.'],['Opción 53','Tipo de mensaje DHCP (1 = Discover).'],['option routers / domain-name-servers','Directivas de dhcpd.conf que dan la puerta de enlace y los DNS a los clientes.'],['Reserva en isc-dhcp-server','host + hardware ethernet + fixed-address.'],['deny booting','Deniega a un host (por MAC) en dhcpd.conf.'],['reject (cliente)','En dhclient.conf, ignora ofertas de un servidor concreto.'],['dhcpd.leases','Concesiones del servidor isc en /var/lib/dhcp.'],['Ámbito (Windows)','Rango de IPs a repartir; debe activarse.'],['APIPA','169.254.x.x: IP automática cuando no se obtiene respuesta DHCP.']],
q:[['¿Qué puertos usan servidor y cliente DHCP?',['Servidor 68, cliente 67','Servidor 67, cliente 68','Ambos el 53','Servidor 67/TCP y cliente 68/TCP'],1,'Servidor 67, cliente 68.'],
['isc-dhcp-server está enabled pero is-active da failed y el 67 no escucha. ¿Qué faltaba?',['Una subnet con rango en dhcpd.conf','Activar ip_forward','Parar systemd-resolved','Instalar dhclient'],0,'Tras configurar el rango y reiniciar, el 67 aparece en ss -tulpn.'],
['Opción 55 con los valores 1, 3, 15 y 6 pide…',['Máscara, router, nombre de dominio y servidor DNS','La IP solicitada','El tipo de mensaje','El fin de opciones'],0,'Es la Parameter Request List. La 50 es la IP solicitada y la 53 el tipo.'],
['Ordena el intercambio DHCP',['DHCPDISCOVER','DHCPOFFER','DHCPREQUEST','DHCPACK'],'o','D-O-R-A.'],
['Verdadero o falso: tras editar dhcpd.conf basta con guardarlo.',['Verdadero','Falso'],1,'Hay que reiniciar isc-dhcp-server siempre.'],
['¿Cómo se reserva una IP para un equipo en isc-dhcp-server?',['host con hardware ethernet y fixed-address','option routers','deny booting','reject en dhclient.conf'],0,'Se identifica por MAC y se quita la IP del rango.'],
['¿Cómo rechaza un cliente a un servidor DHCP concreto?',['deny booting en el servidor','reject IP; en dhclient.conf','Quitando el range','Con ip_forward'],1,'deny booting lo hace el servidor contra un cliente; reject lo hace el cliente contra un servidor.'],
['Un Windows 10 denegado por filtro MAC en el servidor obtiene…',['Una IP del rango','Una IP APIPA 169.254.x.x','10.0.0.x','Ninguna interfaz'],1,'Sin respuesta DHCP se autoasigna APIPA.'],
['Creado un ámbito en Windows Server, ¿qué falta para que reparta?',['Activarlo','Reiniciar Windows','Instalar Active Directory','Nada'],0,'El ámbito debe activarse.']],
s:['Router: 2 interfaces + ip_forward (temporal /proc, permanente sysctl.conf).','isc: dhcpd.conf (subnet, range, routers, domain-name-servers, host, deny booting) + reiniciar siempre.','Puertos 67 servidor / 68 cliente; DORA; opción 55 = lista de parámetros.','Windows: rol DHCP, ámbito (activar), reserva por MAC, filtro Denegar → APIPA.']},
{id:'m',n:'DNSMASQ',
th:[['Instalación y puerto 53',`<p>En Xubuntu2 <code>apt install dnsmasq</code> falla al arrancar: <i>failed to create listening socket for port 53</i>. El puerto lo usa <mark>systemd-resolved</mark> (<code>netstat -tulpn</code>; con sudo se vería el proceso). Solución: <code>sudo systemctl disable --now systemd-resolved</code> y <code>restart dnsmasq</code>. Configuración en <code>/etc/dnsmasq.conf</code>.</p>`],
['DNS: resolver y reenviar',`<p>Sin configurar, <code>ping www.google.es</code> falla. Se añade:</p><pre>no-resolv
server=8.8.8.8
server=1.1.1.1</pre><p><code>no-resolv</code> ignora <code>/etc/resolv.conf</code>; <code>server=</code> indica a qué DNS reenvía. Xubuntu3 lo usa poniendo en netplan <code>nameservers: addresses: [IP de Xubuntu2]</code>.</p>`],
['DHCP con dnsmasq',`<pre>dhcp-range=172.16.40.126,172.16.40.130,255.255.0.0,100m
dhcp-option=option:router,172.16.0.1
dhcp-host=08:00:27:b9:b9:1c,172.16.40.127
dhcp-host=08:00:27:8a:7a:9c,ignore
dhcp-host=garbanzos,172.16.40.128</pre><div class="sc"><table><tr><th>Línea</th><th>Efecto</th></tr><tr><td>dhcp-range=ini,fin,máscara,tiempo</td><td>Rango y concesión (100m)</td></tr><tr><td>dhcp-option=option:router,IP</td><td>Puerta de enlace</td></tr><tr><td>dhcp-host=MAC,IP</td><td>IP fija para esa MAC</td></tr><tr><td>dhcp-host=MAC,ignore</td><td>Ignora esa MAC</td></tr><tr><td>dhcp-host=nombre,IP</td><td>IP para ese nombre de host</td></tr></table></div><p>Concesiones: <code>/var/lib/misc/dnsmasq.leases</code>. Reiniciar el servicio tras cambios.</p>`],
['/etc/hosts y nsswitch.conf',`<p><code>/etc/hosts</code> asocia nombres de referencia a IPs (<code>172.16.35.150 manolo2 profe2 profe2.asir2.com</code>) para usar nombres en vez de IPs. En <code>/etc/nsswitch.conf</code>, la línea <mark>hosts:</mark> fija el orden de resolución; aquí <code>files mdns4_minimal [NOTFOUND=return] dns</code>: primero <code>files</code> (/etc/hosts), luego DNS.</p>`]],
c:[['systemd-resolved','Servicio que ocupa el puerto 53 e impide arrancar dnsmasq; se para con disable --now.'],['no-resolv','dnsmasq ignora /etc/resolv.conf.'],['server=','DNS a los que dnsmasq reenvía las consultas.'],['dhcp-range','ini,fin,máscara,tiempo de concesión.'],['dhcp-option=option:router','Puerta de enlace que entrega dnsmasq.'],['dhcp-host=MAC,IP','Reserva de IP por MAC.'],['dhcp-host=MAC,ignore','Ignora las peticiones de esa MAC.'],['dnsmasq.leases','Concesiones en /var/lib/misc.'],['/etc/hosts','Nombres de referencia para IPs, usables en vez de la IP.'],['nsswitch.conf','Orden de resolución de la línea hosts: (files antes que dns).']],
q:[['dnsmasq no arranca por «puerto 53 ya en uso». ¿Qué servicio lo ocupa?',['systemd-resolved','isc-dhcp-server','bind9','apache2'],0,'Se para con systemctl disable --now systemd-resolved.'],
['¿Qué hace no-resolv?',['Ignora /etc/resolv.conf','Desactiva DHCP','Reserva una IP','Bloquea una MAC'],0,'Se usa junto a server= para fijar los DNS de reenvío.'],
['En dhcp-range=...,255.255.0.0,100m, «100m» es…',['El número de equipos','La concesión: 100 minutos','Un puerto','La máscara'],1,'Es la duración de la concesión.'],
['dhcp-host=08:00:27:8a:7a:9c,ignore…',['Reserva una IP','Ignora las peticiones de esa MAC','Cambia el gateway','Borra su lease'],1,'Ese equipo no recibe IP.'],
['¿Dónde se ven las concesiones de dnsmasq?',['/var/lib/dhcp/dhcpd.leases','/var/lib/misc/dnsmasq.leases','/etc/hosts','/etc/dnsmasq.conf'],1,'dhcpd.leases es de isc-dhcp-server.'],
['Con hosts: files mdns4_minimal [NOTFOUND=return] dns, ¿qué se consulta primero?',['El DNS','/etc/hosts (files)','Nada','El router'],1,'files va antes que dns.'],
['Verdadero o falso: dnsmasq puede dar DHCP y DNS.',['Verdadero','Falso'],0,'Es un servidor ligero DHCP y DNS con caché.']],
s:['Puerto 53 ocupado → disable --now systemd-resolved.','DNS: no-resolv + server=. DHCP: dhcp-range, dhcp-option, dhcp-host.','Leases en /var/lib/misc/dnsmasq.leases.','nsswitch.conf decide orden hosts: files antes que dns.']},
{id:'n',n:'DNS con BIND9',
th:[['Zona directa',`<ol><li><code>apt install bind9</code> (Xubuntu1).</li><li>Declarar la zona en <code>/etc/bind/named.conf.local</code>:<pre>zone "asir2.com" {
    type master;
    file "/etc/bind/asir2.db";
};</pre></li><li>Crear <code>asir2.db</code> a partir de <code>db.local</code>.</li><li>Comprobar: <code>named-checkzone asir2.com asir2.db</code>.</li><li><code>systemctl reload named</code>.</li></ol><pre>$TTL    604800
@   IN  SOA  asir2.com. root.asir2.com. ( 2 604800 86400 2419200 604800 )
@   IN  NS   ns1.asir2.com.
@   IN  MX 10 mail.asir2.com.
ns1 IN  A    172.16.35.105
manolo IN A  172.16.35.100</pre><p>Cliente: netplan con <code>nameservers: addresses: [172.16.35.105]</code>; <code>ping -c 2 manolo</code> resuelve a manolo.asir2.com.</p><div class="extra">En el SOA los apuntes tienen los campos Serial, Refresh, Retry, Expire y Negative Cache TTL como comentarios.</div>`],
['Zona inversa',`<pre>zone "16.172.in-addr.arpa" {
    type master;
    file "/etc/bind/172.16.rev";
};</pre><p>El archivo <code>172.16.rev</code> se crea desde <code>db.127</code>. Los registros son <mark>PTR</mark> con los dos últimos octetos <b>invertidos</b>: 172.16.35.105 → <code>105.35 IN PTR ns1</code>. Comprobar con <code>named-checkzone 16.172.in-addr.arpa 172.16.rev</code>, recargar y probar desde el cliente con <code>nslookup 172.16.35.116</code>.</p><div class="extra">Los apuntes tienen erratas: «mastar» por master, «asi2.com» en el SOA y la zona «asir2pc05.com» frente a asir2.com. Y el nslookup devuelve fabian1.16.172.in-addr.arpa. porque los nombres PTR no acaban en punto (se les añade el origen de la zona).</div>`],
['Resolver persistente',`<p>Para que la configuración no se pierda al apagar: borrar a la fuerza <code>/etc/resolv.conf</code>, desactivar <code>systemd-resolved</code> y crear un nuevo <code>resolv.conf</code> con <code>nameserver 172.16.35.105</code> y <code>search asir2.com</code>.</p>`]],
c:[['bind9 / named','Servidor DNS autoritativo; se recarga con systemctl reload named.'],['named.conf.local','Aquí se declaran las zonas (type master, file).'],['Archivo de zona','Se crea copiando db.local (directa) o db.127 (inversa).'],['SOA','Inicio de autoridad: serial, refresh, retry, expire, negative cache TTL.'],['Registro NS / MX / A','NS: servidor de nombres. MX: correo (con prioridad). A: nombre → IPv4.'],['named-checkzone','Comprueba que el archivo de zona es correcto.'],['Zona inversa','16.172.in-addr.arpa para 172.16.0.0/16.'],['Registro PTR','IP → nombre; 172.16.35.105 se escribe 105.35.'],['search','Línea de resolv.conf con el dominio que se añade a los nombres cortos.']],
q:[['¿En qué archivo se declara una zona en BIND?',['named.conf.local','asir2.db','resolv.conf','nsswitch.conf'],0,'Allí van type master y file.'],
['¿Con qué se valida un archivo de zona?',['named-checkzone','nslookup','dhclient','ss -tulpn'],0,'Debe responder OK con el serial cargado.'],
['El registro que asocia nombre con IPv4 es…',['PTR','MX','A','NS'],2,'PTR hace el camino inverso.'],
['¿Zona inversa de 172.16.0.0/16?',['172.16.in-addr.arpa','16.172.in-addr.arpa','16.172.arpa','asir2.com'],1,'Octetos invertidos.'],
['En 172.16.rev, 172.16.35.105 se escribe…',['35.105','105.35','105','172.16.35.105'],1,'Se completa con 16.172.in-addr.arpa.'],
['Ordena la puesta en marcha de la zona directa',['Instalar bind9','Declarar la zona en named.conf.local','Crear el archivo de zona desde db.local','Comprobar con named-checkzone y recargar named'],'o','Primero se instala y declara, luego se crea el archivo y finalmente se valida.'],
['Para que el DNS persista tras apagar, hay que…',['Crear un resolv.conf nuevo con nameserver y search tras desactivar systemd-resolved','Reiniciar el router','Usar echo en /proc','Nada'],0,'Se borra el resolv.conf, se desactiva systemd-resolved y se crea uno nuevo.']],

const FF={"_i": "<h1>Apuntes SRI – 2º ASIR<\/h1>\n<p>Apuntes de la asignatura <strong>Servicios de Red e Internet<\/strong> (2º ASIR): enrutamiento entre máquinas, servidores DHCP (isc-dhcp-server y Windows Server) y DNSMASQ.<\/p>\n<h2>Leyenda de colores en los bloques de consola<\/h2>\n<p>GitHub no permite colorear texto libremente dentro de un bloque de código, así que se usa el resaltado de <code>diff<\/code> para diferenciar la máquina en cada línea de comandos:<\/p>\n<table>\n<thead>\n<tr>\n<th>Máquina<\/th>\n<th>Color<\/th>\n<th>Prefijo usado en el bloque<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>🔴 <strong>Xubuntu1<\/strong> (<code>xubuntu1pc05<\/code>)<\/td>\n<td>Rojo<\/td>\n<td><code>-<\/code><\/td>\n<\/tr>\n<tr>\n<td>🟣 <strong>Xubuntu2<\/strong> (<code>xubuntu2pc05<\/code>)<\/td>\n<td>Morado/azulado<\/td>\n<td><code>!<\/code><\/td>\n<\/tr>\n<tr>\n<td>🟢 <strong>Xubuntu3<\/strong> (<code>xubuntu3pc05<\/code>)<\/td>\n<td>Verde<\/td>\n<td><code>+<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>⚠️ Si copias un comando, recuerda quitar el prefijo (<code>-<\/code>, <code>!<\/code> o <code>+<\/code>) y el prompt <code>andres@xubuntuXpc05:~$<\/code>.<\/p>\n<\/blockquote>", "d": "<h2>14/09/2026<\/h2>\n<p>Configuración de red inicial de <strong>Xubuntu1<\/strong>:<\/p>\n<pre><code><b class=\"m1\">andres@xubuntu1pc05:~$ cat /etc/netplan/01-network-manager-all.yaml<\/b>\n# Let NetworkManager manage all devices on this system\nnetwork:\n  version: 2\n  renderer: NetworkManager\n  ethernets:\n    enp0s3:\n      dhcp4: no\n      addresses: [172.16.35.105/16]\n      routes:\n        - to: default\n          via: 172.16.0.1\n      nameservers:\n        addresses: [8.8.8.8]<\/code><\/pre>\n<h2>16/09/2026<\/h2>\n<p>Configuración de red inicial de <strong>Xubuntu2<\/strong>:<\/p>\n<pre><code><b class=\"m2\">andres@xubuntu2pc05:~$ cat /etc/netplan/01-network-manager-all.yaml<\/b>\n# Let NetworkManager manage all devices on this system\nnetwork:\n  version: 2\n  renderer: NetworkManager\n  ethernets:\n    enp0s3:\n      dhcp4: no\n      addresses: [172.16.35.155/16]\n      routes:\n        - to: default\n          via: 172.16.0.1\n      nameservers:\n        addresses: [8.8.8.8]<\/code><\/pre>\n<p>Configuración de red inicial de <strong>Xubuntu3<\/strong>:<\/p>\n<pre><code><b class=\"m3\">andres@xubuntu3pc05:~$ cat /etc/netplan/01-network-manager-all.yaml<\/b>\n# Let NetworkManager manage all devices on this system\nnetwork:\n  version: 2\n  renderer: NetworkManager\n  ethernets:\n    enp0s3:\n      dhcp4: no\n      addresses: [172.16.35.205/16]\n      routes:\n        - to: default\n          via: 172.16.0.1\n      nameservers:\n        addresses: [8.8.8.8]<\/code><\/pre>\n<h2>17/09/2026<\/h2>\n<h3>Xubuntu2 como router<\/h3>\n<p>Añadimos un segundo adaptador de red (adaptador puente) a Xubuntu2:<\/p>\n<p class=\"img\">🖼 <b>Imagen 1<\/b> (no incluida en el .md): ajustes de VirtualBox de Xubuntu2 → Red → Adaptador 2 (Adaptador puente)<\/p>\n\n<p>Configuración de red de <strong>Xubuntu2<\/strong> con las dos interfaces:<\/p>\n<pre><code><b class=\"m2\">andres@xubuntu2pc05:~$ cat /etc/netplan/01-network-manager-all.yaml<\/b>\n# Let NetworkManager manage all devices on this system\nnetwork:\n  version: 2\n  renderer: NetworkManager\n\n  ethernets:\n    enp0s3:\n      dhcp4: no\n      addresses: [172.16.35.155/16]\n      routes:\n        - to: default\n          via: 172.16.0.1\n      nameservers:\n        addresses: [8.8.8.8]\n    enp0s8:\n      dhcp4: no\n      addresses: [192.168.1.155/24]<\/code><\/pre>\n<p><strong>Xubuntu1<\/strong> pasa a la red <code>192.168.1.0/24<\/code>, usando Xubuntu2 como puerta de enlace:<\/p>\n<pre><code><b class=\"m1\">root@xubuntu1pc05:/home/andres# cat /etc/netplan/01-network-manager-all.yaml<\/b>\n# Let NetworkManager manage all devices on this system\nnetwork:\n  version: 2\n  renderer: NetworkManager\n  ethernets:\n    enp0s3:\n      dhcp4: no\n      addresses: [192.168.1.105/24]\n      routes:\n        - to: default\n          via: 192.168.1.155\n#     nameservers:\n#       addresses: [8.8.8.8]<\/code><\/pre>\n<p><strong>Xubuntu3<\/strong> usa Xubuntu2 como puerta de enlace en la red <code>172.16.0.0/16<\/code>:<\/p>\n<pre><code><b class=\"m3\">andres@xubuntu3pc05:~$ cat /etc/netplan/01-network-manager-all.yaml<\/b>\n# Let NetworkManager manage all devices on this system\nnetwork:\n  version: 2\n  renderer: NetworkManager\n  ethernets:\n    enp0s3:\n      dhcp4: no\n      addresses: [172.16.35.205/16]\n      routes:\n        - to: default\n          via: 172.16.35.155\n#     nameservers:\n#       addresses: [8.8.8.8]<\/code><\/pre>\n<p>Ahora las máquinas 1 y 3 <strong>no tienen salida<\/strong>: solo pueden hacer ping a la máquina 2, que ahora actúa como router.<\/p>\n<h3>Activar el reenvío de paquetes (IP forwarding)<\/h3>\n<p>Hacemos que la máquina 2 enrute y permita la conexión entre la máquina 1 y la 3:<\/p>\n<pre><code><b class=\"m2\">root@xubuntu2pc05:/home/andres# echo 1 &gt; /proc/sys/net/ipv4/ip_forward<\/b>\n<b class=\"m2\">root@xubuntu2pc05:/home/andres# cat /proc/sys/net/ipv4/ip_forward<\/b>\n1\n<b class=\"m2\">root@xubuntu2pc05:/home/andres# systemctl restart NetworkManager<\/b><\/code><\/pre>\n<p>Esto permite el enrutamiento entre la máquina 1 y la 3, pero <strong>se pierde al apagar la máquina<\/strong>. Para hacerlo permanente, descomentamos la línea <code>net.ipv4.ip_forward=1<\/code> en <code>/etc/sysctl.conf<\/code>:<\/p>\n<p class=\"img\">🖼 <b>Imagen 2<\/b> (no incluida en el .md): nano /etc/sysctl.conf con la línea net.ipv4.ip_forward=1 descomentada<\/p>\n\n<h2>21/09/2026<\/h2>\n<h3>Xubuntu3 como router hacia un Windows<\/h3>\n<p>Añadimos una red a Xubuntu3 para convertirlo en router hacia un Windows:<\/p>\n<pre><code><b class=\"m3\">andres@xubuntu3pc05:~$ cat /etc/netplan/01-network-manager-all.yaml<\/b>\n# Let NetworkManager manage all devices on this system\nnetwork:\n  version: 2\n  renderer: NetworkManager\n\n  ethernets:\n    enp0s8:\n      dhcp4: no\n      addresses: [172.16.35.205/16]\n      routes:\n        - to: default\n          via: 172.16.35.155\n#     nameservers:\n#       addresses: [8.8.8.8]\n    enp0s3:\n      dhcp4: no\n      addresses: [10.0.0.205/8]<\/code><\/pre>\n<p>Hacemos permanente el enrutamiento de Xubuntu3 (<code>net.ipv4.ip_forward=1<\/code> en <code>/etc/sysctl.conf<\/code>):<\/p>\n<p class=\"img\">🖼 <b>Imagen 3<\/b> (no incluida en el .md): nano /etc/sysctl.conf en Xubuntu3 con net.ipv4.ip_forward=1<\/p>\n\n<h3>Windows 10<\/h3>\n<p>Instalamos un Windows 10 y configuramos la red (<code>10.0.0.55/8<\/code>, puerta de enlace <code>10.0.0.205<\/code>):<\/p>\n<p class=\"img\">🖼 <b>Imagen 4<\/b> (no incluida en el .md): Propiedades del protocolo TCP/IPv4 de Windows 10 (IP 10.0.0.55, máscara 255.0.0.0, puerta de enlace 10.0.0.205)<\/p>\n\n<p>Y desactivamos el firewall de Windows para permitir el ping hacia el Windows desde fuera:<\/p>\n<p class=\"img\">🖼 <b>Imagen 5<\/b> (no incluida en el .md): Firewall de Windows Defender desactivado en red privada y pública<\/p>\n\n<h3>Cambio de ruta en Xubuntu2<\/h3>\n<p>En Xubuntu2 cambiamos la ruta por defecto para que pueda ver el Windows (ahora sale por Xubuntu3):<\/p>\n<pre><code><b class=\"m2\">andres@xubuntu2pc05:~$ cat /etc/netplan/01-network-manager-all.yaml<\/b>\n# Let NetworkManager manage all devices on this system\nnetwork:\n  version: 2\n  renderer: NetworkManager\n  ethernets:\n    enp0s3:\n      dhcp4: no\n      addresses: [172.16.35.155/16]\n      routes:\n        - to: default\n          via: 172.16.35.205\n      nameservers:\n        addresses: [8.8.8.8]\n    enp0s8:\n      dhcp4: no\n      addresses: [192.168.1.155/24]<\/code><\/pre>\n<h2>23/09/2026<\/h2>\n<h3>Vuelta a la configuración inicial e instalación de isc-dhcp-server<\/h3>\n<p>Volvemos a la configuración de red inicial:<\/p>\n<pre><code><b class=\"m1\">andres@xubuntu1pc05:~$ cat /etc/netplan/01-network-manager-all.yaml<\/b>\n# Let NetworkManager manage all devices on this system\nnetwork:\n  version: 2\n  renderer: NetworkManager\n  ethernets:\n    enp0s3:\n      dhcp4: no\n      addresses: [172.16.35.105/16]\n      routes:\n        - to: default\n          via: 172.16.0.1\n      nameservers:\n        addresses: [8.8.8.8]<\/code><\/pre>\n<p>Ahora instalamos el servicio <code>isc-dhcp-server<\/code>:<\/p>\n<pre><code><b class=\"m1\">andres@xubuntu1pc05:~$ sudo apt install isc-dhcp-server<\/b>\nLeyendo lista de paquetes... Hecho\nCreando árbol de dependencias... Hecho\nLeyendo la información de estado... Hecho\nisc-dhcp-server ya está en su versión más reciente (4.4.1-2.3ubuntu2.4).\n0 actualizados, 0 nuevos se instalarán, 0 para eliminar y 97 no actualizados.<\/code><\/pre>\n<p>Después de instalarlo, en <code>/etc/dhcp<\/code> aparecen los siguientes archivos:<\/p>\n<p class=\"img\">🖼 <b>Imagen 6<\/b> (no incluida en el .md): salida de \"ls\" en /etc/dhcp (ddns-keys, debug, dhclient.conf, dhclient-enter-hooks.d, dhclient-exit-hooks.d, dhcpd.conf, dhcpd6.conf)<\/p>\n\n<pre><code>ddns-keys   dhclient.conf             dhclient-exit-hooks.d   dhcpd.conf\ndebug       dhclient-enter-hooks.d    dhcpd6.conf<\/code><\/pre>\n<p>Un archivo importante es <strong><code>dhcpd.conf<\/code><\/strong>.<\/p>\n<blockquote>\n<p>📌 <strong>Puerto 67<\/strong> para el servidor y <strong>puerto 68<\/strong> para el cliente.<\/p>\n<\/blockquote>\n<h3>Comprobar que el servicio no arranca<\/h3>\n<pre><code><b class=\"m1\">andres@xubuntu1pc05:/etc/dhcp$ ss -tulpn<\/b>\nNetid State  Recv-Q Send-Q Local Address:Port  Peer Address:Port Process\nudp   UNCONN 0      0      0.0.0.0:48995       0.0.0.0:*\nudp   UNCONN 0      0      127.0.0.53%lo:53    0.0.0.0:*\nudp   UNCONN 0      0      0.0.0.0:5353        0.0.0.0:*\nudp   UNCONN 0      0      [::]:44713          [::]:*\nudp   UNCONN 0      0      [::]:5353           [::]:*\ntcp   LISTEN 0      128    127.0.0.1:631       0.0.0.0:*\ntcp   LISTEN 0      4096   127.0.0.53%lo:53    0.0.0.0:*\ntcp   LISTEN 0      128    [::1]:631           [::]:*<\/code><\/pre>\n<p>Vemos los puertos abiertos, pero <strong>el puerto 67 no lo está<\/strong>. Comprobamos si el servicio está habilitado:<\/p>\n<pre><code><b class=\"m1\">andres@xubuntu1pc05:/etc/dhcp$ sudo systemctl is-enabled isc-dhcp-server<\/b>\nenabled<\/code><\/pre>\n<p>Está habilitado (arranca con el sistema), pero si comprobamos si está <strong>activo<\/strong>, vemos que ha fallado:<\/p>\n<pre><code><b class=\"m1\">andres@xubuntu1pc05:/etc/dhcp$ sudo systemctl is-active isc-dhcp-server<\/b>\nfailed\n<b class=\"m1\">andres@xubuntu1pc05:/etc/dhcp$ sudo systemctl status isc-dhcp-server<\/b>\n× isc-dhcp-server.service - ISC DHCP IPv4 server\n     Loaded: loaded (/lib/systemd/system/isc-dhcp-server.service; enabled; vendor&gt;\n     Active: failed (Result: exit-code) since Wed 2026-09-23 09:57:09 CEST; 1 day&gt;\n       Docs: man:dhcpd(8)\n    Main PID: 4241 (code=exited, status=1/FAILURE)\n        CPU: 4ms\n\nsep 23 09:57:09 xubuntu1pc05 dhcpd[4241]: \nsep 23 09:57:09 xubuntu1pc05 dhcpd[4241]: If you think you have received this mes&gt;\nsep 23 09:57:09 xubuntu1pc05 dhcpd[4241]: than a configuration issue please read &gt;\nsep 23 09:57:09 xubuntu1pc05 dhcpd[4241]: bugs on either our web page at www.isc.&gt;\nsep 23 09:57:09 xubuntu1pc05 dhcpd[4241]: before submitting a bug.  These pages e&gt;\nsep 23 09:57:09 xubuntu1pc05 dhcpd[4241]: process and the information we find hel&gt;\nsep 23 09:57:09 xubuntu1pc05 dhcpd[4241]: \nsep 23 09:57:09 xubuntu1pc05 dhcpd[4241]: exiting.\nsep 23 09:57:09 xubuntu1pc05 systemd[1]: isc-dhcp-server.service: Main process ex&gt;\nsep 23 09:57:09 xubuntu1pc05 systemd[1]: isc-dhcp-server.service: Failed with res&gt;<\/code><\/pre>\n<h3>Configurar el rango<\/h3>\n<p>Para configurar el rango modificamos el archivo <code>dhcpd.conf<\/code> para que el servicio DHCP pueda escuchar en esos rangos (archivo <code>dhcpd.conf<\/code> modificado). Reiniciamos el servicio y volvemos a comprobar los puertos:<\/p>\n<pre><code><b class=\"m1\">andres@xubuntu1pc05:/etc/dhcp$ sudo systemctl restart isc-dhcp-server<\/b>\n<b class=\"m1\">andres@xubuntu1pc05:/etc/dhcp$ ss -tulpn<\/b>\nNetid State  Recv-Q Send-Q Local Address:Port  Peer Address:Port Process\nudp   UNCONN 0      0      0.0.0.0:48995       0.0.0.0:*\nudp   UNCONN 0      0      127.0.0.53%lo:53    0.0.0.0:*\nudp   UNCONN 0      0      0.0.0.0:67          0.0.0.0:*\nudp   UNCONN 0      0      0.0.0.0:5353        0.0.0.0:*\nudp   UNCONN 0      0      [::]:44713          [::]:*\nudp   UNCONN 0      0      [::]:5353           [::]:*\ntcp   LISTEN 0      128    127.0.0.1:631       0.0.0.0:*\ntcp   LISTEN 0      4096   127.0.0.53%lo:53    0.0.0.0:*\ntcp   LISTEN 0      128    [::1]:631           [::]:*<\/code><\/pre>\n<p>Ahora ya aparece el <strong>puerto 67<\/strong> escuchando en toda la subred que hemos marcado, no en ningún sitio en específico.<\/p>\n<blockquote>\n<p>🎯 <strong>En este punto queremos que todas las máquinas estén en la misma red del principio, y que cada máquina solo tenga una conexión de red.<\/strong><\/p>\n<\/blockquote>\n<h3>Cliente DHCP en Xubuntu3<\/h3>\n<p>En Xubuntu3 modificamos la configuración de red para ponerlo en DHCP y que Xubuntu1 nos dé la IP usando el servicio instalado anteriormente:<\/p>\n<pre><code><b class=\"m3\">andres@xubuntu3pc05:/etc/dhcp$ cat /etc/netplan/01-network-manager-all.yaml<\/b>\n# Let NetworkManager manage all devices on this system\nnetwork:\n  version: 2\n  renderer: NetworkManager\n  ethernets:\n    enp0s3:\n      dhcp4: yes<\/code><\/pre>\n<p>Con estos comandos quitamos la IP de la máquina y pedimos una nueva:<\/p>\n<pre><code><b class=\"m3\">andres@xubuntu3pc05:/var/lib/dhcp$ sudo dhclient -r<\/b>\nKilled old client process\n<b class=\"m3\">andres@xubuntu3pc05:/var/lib/dhcp$ sudo dhclient -4<\/b><\/code><\/pre>\n<p>Se puede ver quién te da la IP en el archivo de leases del cliente:<\/p>\n<pre><code><b class=\"m3\">andres@xubuntu3pc05:/var/lib/dhcp$ cat dhclient.leases<\/b><\/code><\/pre>\n<h3>Añadir un rango en dhcpd.conf<\/h3>\n<p>Ahora añadimos un rango en el archivo <code>dhcpd.conf<\/code> de Xubuntu1 para que reparta IPs en ese rango:<\/p>\n<pre><code><b class=\"m1\">andres@xubuntu1pc05:/etc/dhcp$ cat -n dhcpd.conf<\/b>\n    35\n    36  ##############################################################\n    37\n    38  subnet 172.16.0.0 netmask 255.255.0.0 {\n    39          range 172.16.135.126 172.16.135.130;\n    40  }\n    41\n    42  ##############################################################\n    43\n<b class=\"m1\">andres@xubuntu1pc05:/etc/dhcp$ sudo systemctl restart isc-dhcp-server<\/b><\/code><\/pre>\n<p>Ahora intentamos que Xubuntu3 cambie a una IP de nuestro Xubuntu1 o de alguno de nuestros compañeros:<\/p>\n<pre><code><b class=\"m3\">andres@xubuntu3pc05:/var/lib/dhcp$ sudo dhclient -r<\/b>\nKilled old client process\n<b class=\"m3\">andres@xubuntu3pc05:/var/lib/dhcp$ sudo dhclient -4 -v<\/b>\nInternet Systems Consortium DHCP Client 4.4.1\nCopyright 2004-2018 Internet Systems Consortium.\nAll rights reserved.\nFor info, please visit https://www.isc.org/software/dhcp/\n\nListening on LPF/enp0s3/08:00:27:b9:b9:1c\nSending on   LPF/enp0s3/08:00:27:b9:b9:1c\nSending on   Socket/fallback\nDHCPDISCOVER on enp0s3 to 255.255.255.255 port 67 interval 3 (xid=0xeb64740c)\nDHCPOFFER of 172.16.135.127 from 172.16.35.105\nDHCPREQUEST for 172.16.135.127 on enp0s3 to 255.255.255.255 port 67 (xid=0xc7464eb)\nDHCPACK of 172.16.135.127 from 172.16.35.105 (xid=0xeb64740c)\nbound to 172.16.135.127 -- renewal in 274 seconds.<\/code><\/pre>\n<p>Aquí podemos ver qué IP nos han dado y qué servidor nos la ha dado. En este caso hemos tenido suerte y nos la ha concedido nuestro Xubuntu1.<\/p>\n<h3>Teoría: DHCP Discovery<\/h3>\n<blockquote>\n<p>❓ <strong>Examen:<\/strong> ¿Qué números están relacionados?<\/p>\n<\/blockquote>\n<p>Opciones DHCP de un paquete <em>DHCP Discover<\/em> (imagen de la página de Wikipedia, <a href=\"https://es.wikipedia.org/wiki/Protocolo_de_configuraci%C3%B3n_din%C3%A1mica_de_host#Descubrimiento_DHCP\">DHCP Discovery<\/a>):<\/p>\n<p class=\"img\">🖼 <b>Imagen 7<\/b> (no incluida en el .md): tabla \"DHCP options\" de la página de Wikipedia<\/p>\n\n<table>\n<thead>\n<tr>\n<th>Bytes (hex)<\/th>\n<th>Opción<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>0x350101<\/code><\/td>\n<td>53: 1 (DHCP Discover)<\/td>\n<\/tr>\n<tr>\n<td><code>0x3204c0a00164<\/code><\/td>\n<td>50: 192.168.1.100 requested<\/td>\n<\/tr>\n<tr>\n<td><code>0x370401030f06<\/code><\/td>\n<td>55 (Parameter Request List): 1 (Request Subnet Mask), 3 (Router), 15 (Domain Name) y 6 (Domain Name Server)<\/td>\n<\/tr>\n<tr>\n<td><code>0xff<\/code><\/td>\n<td>255 (Endmark)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Puerta de enlace y servidores DNS<\/h3>\n<p>Agregamos <code>option routers<\/code> para marcar cuál es la puerta de enlace que tiene que dar, y <code>option domain-name-servers<\/code> para dar los nameservers:<\/p>\n<pre><code><b class=\"m1\">andres@xubuntu1pc05:/etc/dhcp$ cat -n dhcpd.conf<\/b>\n    35\n    36  ##############################################################\n    37\n    38  subnet 172.16.0.0 netmask 255.255.0.0 {\n    39          range 172.16.135.126 172.16.135.130;\n    40          option routers 172.16.0.1;\n    41          option domain-name-servers 8.8.8.8, 1.1.1.1;\n    42  }\n    43\n    44  ##############################################################<\/code><\/pre>\n<blockquote>\n<p>⚠️ <strong>SIEMPRE QUE SE MODIFIQUE EL ARCHIVO <code>dhcpd.conf<\/code> hay que reiniciar el servicio:<\/strong><\/p>\n<\/blockquote>\n<pre><code><b class=\"m1\">andres@xubuntu1pc05:/etc/dhcp$ sudo systemctl restart isc-dhcp-server<\/b><\/code><\/pre>\n<h2>28/09/2026<\/h2>\n<h3>Reservar una IP para un equipo concreto<\/h3>\n<p>Modificamos <code>dhcpd.conf<\/code> para reservar una IP de nuestro rango, de forma que siempre que demos IP a un ordenador concreto (identificado por su MAC) le demos siempre la IP que nosotros digamos:<\/p>\n<pre><code><b class=\"m1\">andres@xubuntu1pc05:/etc/dhcp$ cat -n dhcpd.conf<\/b>\n    36  ##############################################################\n    37\n    38  subnet 172.16.0.0 netmask 255.255.0.0 {\n    39          range 172.16.135.126 172.16.135.129;\n    40          option routers 172.16.0.1;\n    41          option domain-name-servers 8.8.8.8, 1.1.1.1;\n    42  }\n    43\n    44  host andres3 {\n    45          hardware ethernet 08:00:27:b9:b9:1c;\n    46          fixed-address 172.16.135.130;\n    47  }\n    48\n    49  ##############################################################<\/code><\/pre>\n<p>Y reiniciamos el servicio. Ahora cada vez que demos IP a Xubuntu3 siempre le dará la <code>172.16.135.130<\/code>, y en el rango de arriba hemos quitado la IP reservada para esa máquina.<\/p>\n<h3>Rechazar un servidor DHCP desde el cliente<\/h3>\n<p>Modificando <code>dhclient.conf<\/code> en el cliente podemos indicar qué servidor DHCP queremos rechazar si quiere darnos IP. En este caso rechazamos al router de la propia clase:<\/p>\n<pre><code><b class=\"m3\">andres@xubuntu3pc05:~$ cat -n /etc/dhcp/dhclient.conf<\/b>\n    35\n    36  reject 172.16.0.1;\n    37<\/code><\/pre>\n<p>Volvemos a pedir IP y vemos que, cuando el router <code>172.16.0.1<\/code> nos quiso dar IP, lo rechazamos:<\/p>\n<pre><code><b class=\"m3\">andres@xubuntu3pc05:~$ sudo dhclient -4 -v<\/b>\n[sudo] contraseña para andres:\nInternet Systems Consortium DHCP Client 4.4.1\nCopyright 2004-2018 Internet Systems Consortium.\nAll rights reserved.\nFor info, please visit https://www.isc.org/software/dhcp/\n\nListening on LPF/enp0s3/08:00:27:b9:b9:1c\nSending on   LPF/enp0s3/08:00:27:b9:b9:1c\nSending on   Socket/fallback\nDHCPDISCOVER on enp0s3 to 255.255.255.255 port 67 interval 3 (xid=0x582e7210)\nDHCPOFFER from 172.16.0.1 rejected by rule 172.16.0.1 mask 255.255.255.255.\nDHCPOFFER of 172.16.135.169 from 172.16.1.113\nDHCPREQUEST for 172.16.135.169 on enp0s3 to 255.255.255.255 port 67 (xid=0x10722e58)\nDHCPACK of 172.16.135.169 from 172.16.1.113 (xid=0x582e7210)\nbound to 172.16.135.169 -- renewal in 241 seconds.<\/code><\/pre>\n<h3>Denegar un cliente desde el servidor<\/h3>\n<p>En <code>dhcpd.conf<\/code> configuramos el servidor para negar un cliente (en este caso nuestro compañero Pablo) usando <code>deny booting<\/code>:<\/p>\n<pre><code><b class=\"m1\">andres@xubuntu1pc05:/etc/dhcp$ cat -n dhcpd.conf<\/b>\n    35\n    36  ##############################################################\n    37\n    38  subnet 172.16.0.0 netmask 255.255.0.0 {\n    39          range 172.16.135.126 172.16.135.129;\n    40          option routers 172.16.0.1;\n    41          option domain-name-servers 8.8.8.8, 1.1.1.1;\n    42  }\n    43\n    44  host andres3 {\n    45          hardware ethernet 08:00:27:b9:b9:1c;\n    46          fixed-address 172.16.135.130;\n    47  }\n    48\n    49  host pablo {\n    50          hardware ethernet 08:00:27:d4:16:cb;\n    51          deny booting;\n    52  }\n    53\n    54  ##############################################################<\/code><\/pre>\n<p>En <code>dhcpd.leases<\/code> podemos ver a quién hemos dado dirección DHCP:<\/p>\n<pre><code><b class=\"m1\">andres@xubuntu1pc05:/var/lib/dhcp$ cat dhcpd.leases<\/b><\/code><\/pre>\n<h2>30/09/2026<\/h2>\n<p>En un <strong>Windows Server 2022<\/strong> ponemos en la configuración de red lo siguiente:<\/p>\n<p class=\"img\">🖼 <b>Imagen 8<\/b> (no incluida en el .md): TCP/IPv4 de Windows Server 2022 (IP 172.16.235.105, máscara 255.255.0.0, puerta de enlace 172.16.0.1, DNS 8.8.8.8 y 1.1.1.1)<\/p>\n\n<table>\n<thead>\n<tr>\n<th>Parámetro<\/th>\n<th>Valor<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Dirección IP<\/td>\n<td><code>172.16.235.105<\/code><\/td>\n<\/tr>\n<tr>\n<td>Máscara de subred<\/td>\n<td><code>255.255.0.0<\/code><\/td>\n<\/tr>\n<tr>\n<td>Puerta de enlace predeterminada<\/td>\n<td><code>172.16.0.1<\/code><\/td>\n<\/tr>\n<tr>\n<td>DNS preferido<\/td>\n<td><code>8.8.8.8<\/code><\/td>\n<\/tr>\n<tr>\n<td>DNS alternativo<\/td>\n<td><code>1.1.1.1<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>01/10/2026<\/h2>\n<h3>Windows Server como servidor DHCP<\/h3>\n<p>Ponemos la IP del servidor:<\/p>\n<p class=\"img\">🖼 <b>Imagen 9<\/b> (no incluida en el .md): TCP/IPv4 del servidor (IP 172.16.235.105)<\/p>\n\n<p><strong>1.<\/strong> Primero instalamos la herramienta DHCP desde <em>Administrador del servidor → Agregar roles y características<\/em>:<\/p>\n<p class=\"img\">🖼 <b>Imagen 10<\/b> (no incluida en el .md): Administrador del servidor → \"Agregar roles y características\" y asistente \"Seleccionar tipo de instalación\"<\/p>\n\n<p><strong>2.<\/strong> Seleccionamos el rol <strong>Servidor DHCP<\/strong>:<\/p>\n<p class=\"img\">🖼 <b>Imagen 11<\/b> (no incluida en el .md): asistente \"Seleccionar roles de servidor\" con \"Servidor DHCP (Instalado)\" marcado<\/p>\n\n<p><strong>3.<\/strong> Después de instalarla, abrimos la herramienta desde <em>Herramientas → DHCP<\/em>:<\/p>\n<p class=\"img\">🖼 <b>Imagen 12<\/b> (no incluida en el .md): menú Herramientas → DHCP<\/p>\n\n<p><strong>4.<\/strong> Nos sale una carpeta con el servidor y sus apartados IPv4 e IPv6:<\/p>\n<p class=\"img\">🖼 <b>Imagen 13<\/b> (no incluida en el .md): consola DHCP con w2022-1-pc05, IPv4 e IPv6<\/p>\n\n<h2>05/10/2026<\/h2>\n<h3>Crear un ámbito<\/h3>\n<p>Para que nuestro servidor reparta IPs tenemos que crear un <strong>ámbito<\/strong> con el rango de IPs que queremos que reparta (<em>IPv4 → botón derecho → Ámbito nuevo…<\/em>):<\/p>\n<p class=\"img\">🖼 <b>Imagen 14<\/b> (no incluida en el .md): menú contextual de IPv4 → \"Ámbito nuevo…\"<\/p>\n\n<p>Nos saldrá una pestaña donde tendremos que poner el nombre del ámbito, seguido de la IP inicial y final del rango de IPs que queremos dar. En este caso: <code>172.16.235.126<\/code> – <code>172.16.235.130<\/code>.<\/p>\n<p class=\"img\">🖼 <b>Imagen 15<\/b> (no incluida en el .md): propiedades del ámbito \"andres1\" (IP inicial 172.16.235.126, final 172.16.235.130, máscara 255.255.0.0, concesión de 8 días)<\/p>\n\n<blockquote>\n<p>⚠️ Tenemos que <strong>activar el ámbito<\/strong> para que funcione.<\/p>\n<\/blockquote>\n<p>Ahora vemos en nuestra máquina cliente Windows 10 que el servidor DHCP le da una IP de nuestro rango:<\/p>\n<p class=\"img\">🖼 <b>Imagen 16<\/b> (no incluida en el .md): salida de ipconfig en Windows 10 con IPv4 172.16.235.128, máscara 255.255.0.0 y puerta de enlace 172.16.0.1<\/p>\n\n<h3>Reservar una IP para Xubuntu3<\/h3>\n<p>Ahora reservaremos una IP para el cliente Xubuntu3 (<em>Ámbito → Reservas → Reserva nueva…<\/em>):<\/p>\n<p class=\"img\">🖼 <b>Imagen 17<\/b> (no incluida en el .md): menú contextual de Reservas → \"Reserva nueva…\"<\/p>\n\n<p>Tendremos que indicar qué IP de nuestro rango queremos dar a Xubuntu3 y poner su <strong>MAC<\/strong> para que dé esa IP a esa máquina en concreto:<\/p>\n<p class=\"img\">🖼 <b>Imagen 18<\/b> (no incluida en el .md): formulario de reserva \"andres3\" (IP 172.16.235.126, MAC 080027b9b91c, tipos compatibles: Ambos)<\/p>\n\n<p>Y ahora eliminamos del rango del ámbito la IP que hemos reservado para Xubuntu3.<\/p>\n<h3>Denegar un equipo<\/h3>\n<p>En el servidor DHCP podemos denegar ordenadores a los que no queremos dar IP. En este caso usaremos el Windows 10 cliente como ejemplo (<em>Filtros → Denegar<\/em>):<\/p>\n<p class=\"img\">🖼 <b>Imagen 19<\/b> (no incluida en el .md): árbol del ámbito con Filtros → Permitir / Denegar<\/p>\n\n<p>En <em>Denegar<\/em> le damos a <strong>Nuevo filtro…<\/strong>:<\/p>\n<p class=\"img\">🖼 <b>Imagen 20<\/b> (no incluida en el .md): menú contextual de Denegar → \"Nuevo filtro…\"<\/p>\n\n<p>Ponemos la MAC del ordenador que queremos denegar:<\/p>\n<p class=\"img\">🖼 <b>Imagen 21<\/b> (no incluida en el .md): ventana \"Nuevo filtro\" con los campos Dirección MAC y Descripción<\/p>\n\n<p>Ahora habilitamos el filtro de denegar:<\/p>\n<p class=\"img\">🖼 <b>Imagen 22<\/b> (no incluida en el .md): menú contextual de Denegar con las opciones Nuevo filtro / Deshabilitar / Ver / Actualizar<\/p>\n\n<p>Ahora el Windows 10 no cogerá IP y se le pondrá una <strong>APIPA<\/strong> (<code>169.254.x.x<\/code>) por defecto:<\/p>\n<p class=\"img\">🖼 <b>Imagen 23<\/b> (no incluida en el .md): ipconfig /renew con error de tiempo de espera y ipconfig mostrando IPv4 automática 169.254.192.225<\/p>\n\n<hr />", "m": "<h2>07/10/2026<\/h2>\n<h3>Instalación<\/h3>\n<p>En la máquina <strong>Xubuntu2<\/strong> instalamos el servicio DNSMASQ:<\/p>\n<pre><code><b class=\"m2\">andres@xubuntu2pc05:~$ sudo apt install dnsmasq<\/b>\nLeyendo lista de paquetes... Hecho\nCreando árbol de dependencias... Hecho\nLeyendo la información de estado... Hecho\nPaquetes sugeridos:\n  resolvconf\nSe instalarán los siguientes paquetes NUEVOS:\n  dnsmasq\n0 actualizados, 1 nuevos se instalarán, 0 para eliminar y 128 no actualizados.\nSe necesita descargar 20,5 kB de archivos.\nSe utilizarán 98,3 kB de espacio de disco adicional después de esta operación.\nDes:1 http://gb.archive.ubuntu.com/ubuntu jammy-updates/universe amd64 dnsmasq all 2.91-0ubuntu0.22.04.2 [20,5 kB]\nDescargados 20,5 kB en 2s (9.222 B/s)\nSeleccionando el paquete dnsmasq previamente no seleccionado.\n(Leyendo la base de datos ... 198848 ficheros o directorios instalados actualmente.)\nPreparando para desempaquetar .../dnsmasq_2.91-0ubuntu0.22.04.2_all.deb ...\nDesempaquetando dnsmasq (2.91-0ubuntu0.22.04.2) ...\nConfigurando dnsmasq (2.91-0ubuntu0.22.04.2) ...\nCreated symlink /etc/systemd/system/multi-user.target.wants/dnsmasq.service → /lib/systemd/system/dnsmasq.service.\nJob for dnsmasq.service failed because the control process exited with error code.\nSee \"systemctl status dnsmasq.service\" and \"journalctl -xeu dnsmasq.service\" for details.\ninvoke-rc.d: initscript dnsmasq, action \"start\" failed.\n× dnsmasq.service - dnsmasq - A lightweight DHCP and caching DNS server\n     Loaded: loaded (/lib/systemd/system/dnsmasq.service; enabled; vendor preset: enabled)\n     Active: failed (Result: exit-code) since Wed 2026-10-07 09:41:40 CEST; 3ms ago\n    Process: 3849 ExecStartPre=/etc/init.d/dnsmasq checkconfig (code=exited, status=0/SUCCESS)\n    Process: 3857 ExecStart=/etc/init.d/dnsmasq systemd-exec (code=exited, status=2)\n        CPU: 12ms\n\noct 07 09:41:40 xubuntu2pc05 systemd[1]: Starting dnsmasq - A lightweight DHCP and caching DNS server...\noct 07 09:41:40 xubuntu2pc05 dnsmasq[3857]: dnsmasq: failed to create listening socket for port 53: La dirección ya se está usando\noct 07 09:41:40 xubuntu2pc05 dnsmasq[3857]: failed to create listening socket for port 53: La dirección ya se está usando\noct 07 09:41:40 xubuntu2pc05 dnsmasq[3857]: FALLO al iniciar\noct 07 09:41:40 xubuntu2pc05 systemd[1]: dnsmasq.service: Control process exited, code=exited, status=2/INVALIDARGUMENT\noct 07 09:41:40 xubuntu2pc05 systemd[1]: dnsmasq.service: Failed with result 'exit-code'.\noct 07 09:41:40 xubuntu2pc05 systemd[1]: Failed to start dnsmasq - A lightweight DHCP and caching DNS server.<\/code><\/pre>\n<p>Al intentar iniciar el servicio da error porque <strong>ya hay un servicio usando el puerto 53<\/strong>.<\/p>\n<h3>Averiguar qué usa el puerto 53<\/h3>\n<pre><code><b class=\"m2\">andres@xubuntu2pc05:~$ netstat -tulpn<\/b>\n(No todos los procesos pueden ser identificados, no hay información de propiedad del\nproceso no se mostrarán, necesita ser superusuario para verlos todos.)\nConexiones activas de Internet (solo servidores)\nProto  Recib Enviad Dirección local     Dirección remota   Estado     PID/Program name\ntcp        0      0 127.0.0.53:53       0.0.0.0:*          ESCUCHAR   -\ntcp        0      0 127.0.0.1:631       0.0.0.0:*          ESCUCHAR   -\ntcp6       0      0 ::1:631             :::*               ESCUCHAR   -\nudp        0      0 0.0.0.0:5353        0.0.0.0:*                     -\nudp        0      0 0.0.0.0:48648       0.0.0.0:*                     -\nudp        0      0 127.0.0.53:53       0.0.0.0:*                     -\nudp6       0      0 :::5353             :::*                          -\nudp6       0      0 :::38471            :::*                          -<\/code><\/pre>\n<p>Aquí no aparece el proceso (porque se ha ejecutado sin ser root), pero el servicio que usa el puerto 53 es <strong><code>systemd-resolved<\/code><\/strong>. Tenemos que pararlo y deshabilitarlo:<\/p>\n<pre><code><b class=\"m2\">andres@xubuntu2pc05:~$ sudo systemctl disable --now systemd-resolved<\/b>\nRemoved /etc/systemd/system/multi-user.target.wants/systemd-resolved.service.\nRemoved /etc/systemd/system/dbus-org.freedesktop.resolve1.service.<\/code><\/pre>\n<p>Y reiniciamos el servicio <code>dnsmasq<\/code>:<\/p>\n<pre><code><b class=\"m2\">andres@xubuntu2pc05:~$ sudo systemctl restart dnsmasq.service<\/b>\n<b class=\"m2\">andres@xubuntu2pc05:~$ sudo systemctl status dnsmasq.service<\/b>\n● dnsmasq.service - dnsmasq - A lightweight DHCP and caching DNS server\n     Loaded: loaded (/lib/systemd/system/dnsmasq.service; enabled; vendor preset: enabled)\n     Active: active (running) since Wed 2026-10-07 10:02:05 CEST; 6s ago\n    Process: 4049 ExecStartPre=/etc/init.d/dnsmasq checkconfig (code=exited, status=0/SUCCESS)\n    Process: 4057 ExecStart=/etc/init.d/dnsmasq systemd-exec (code=exited, status=0/SUCCESS)\n    Process: 4067 ExecStartPost=/etc/init.d/dnsmasq systemd-start-resolvconf (code=exited, status=0/SUCCESS)\n   Main PID: 4066 (dnsmasq)\n      Tasks: 1 (limit: 4598)\n     Memory: 600.0K\n        CPU: 21ms\n     CGroup: /system.slice/dnsmasq.service\n             └─4066 /usr/sbin/dnsmasq -x /run/dnsmasq/dnsmasq.pid -u dnsmasq -7 /etc/dnsmasq.d,.dpkg-dist,.dpkg-old,.&gt;\n\noct 07 10:02:05 xubuntu2pc05 systemd[1]: Starting dnsmasq - A lightweight DHCP and caching DNS server...\noct 07 10:02:05 xubuntu2pc05 dnsmasq[4066]: iniciado, versión 2.90 tamaño de caché 150\noct 07 10:02:05 xubuntu2pc05 dnsmasq[4066]: DNS service limited to local subnets\noct 07 10:02:05 xubuntu2pc05 dnsmasq[4066]: opciones al compilar: IPv6 GNU-getopt DBus no-UBus i18n IDN2 DHCP DHCPv6 &gt;\noct 07 10:02:05 xubuntu2pc05 dnsmasq[4066]: leyendo /etc/resolv.conf\noct 07 10:02:05 xubuntu2pc05 dnsmasq[4066]: se usa el servidor 127.0.0.53#53\noct 07 10:02:05 xubuntu2pc05 dnsmasq[4066]: read /etc/hosts - 9 names\noct 07 10:02:05 xubuntu2pc05 systemd[1]: Started dnsmasq - A lightweight DHCP and caching DNS server.<\/code><\/pre>\n<p>Y ya está activo. Ahora podemos acceder al archivo de configuración del servicio:<\/p>\n<pre><code><b class=\"m2\">andres@xubuntu2pc05:~$ sudo nano -l /etc/dnsmasq.conf<\/b><\/code><\/pre>\n<h2>08/10/2026<\/h2>\n<h3>Resolución de nombres<\/h3>\n<p>Si intentamos hacer ping a <code>www.google.es<\/code> no resuelve:<\/p>\n<pre><code><b class=\"m2\">andres@xubuntu2pc05:~$ ping www.google.es<\/b>\nping: www.google.es: Fallo temporal en la resolución del nombre<\/code><\/pre>\n<p>Para que pueda resolver tenemos que añadir lo siguiente en <code>/etc/dnsmasq.conf<\/code>:<\/p>\n<pre><code><b class=\"m2\">andres@xubuntu2pc05:~$ cat -n /etc/dnsmasq.conf<\/b>\n    59\n    60  #############################################\n    61\n    62  no-resolv\n    63  server=8.8.8.8\n    64  server=1.1.1.1\n    65\n    66  #############################################\n    67<\/code><\/pre>\n<p>Reiniciamos el servicio:<\/p>\n<pre><code><b class=\"m2\">andres@xubuntu2pc05:~$ sudo systemctl restart dnsmasq.service<\/b><\/code><\/pre>\n<p>Y ahora nos debería dejar resolver:<\/p>\n<pre><code><b class=\"m2\">andres@xubuntu2pc05:~$ ping www.google.es<\/b><\/code><\/pre>\n<pre><code>PING www.google.es (172.217.20.227) 56(84) bytes of data.\n64 bytes from lcmada-ah-in-f3.1e100.net (172.217.20.227): icmp_seq=1 ttl=115 time=7.67 ms\n64 bytes from lcmada-ah-in-f3.1e100.net (172.217.20.227): icmp_seq=2 ttl=115 time=3.71 ms\n64 bytes from lcmada-ah-in-f3.1e100.net (172.217.20.227): icmp_seq=3 ttl=115 time=3.84 ms\n^C\n--- www.google.es ping statistics ---\n3 packets transmitted, 3 received, 0% packet loss, time 2003ms\nrtt min/avg/max/mdev = 3.711/5.074/7.670/1.835 ms<\/code><\/pre>\n<h3>Xubuntu3 usa Xubuntu2 como DNS<\/h3>\n<p>En la máquina Xubuntu3 cambiamos la configuración de red que teníamos para DHCP, indicando como servidor DNS el de Xubuntu2:<\/p>\n<pre><code><b class=\"m3\">andres@xubuntu3pc05:/etc$ cat /etc/netplan/01-network-manager-all.yaml<\/b>\n# Let NetworkManager manage all devices on this system\nnetwork:\n  version: 2\n  renderer: NetworkManager\n  ethernets:\n    enp0s3:\n      dhcp4: no\n      addresses: [172.16.2.200/16]\n      routes:\n        - to: default\n          via: 172.16.0.1\n      nameservers:\n        addresses: [172.16.35.150]<\/code><\/pre>\n<p>Ahora el cliente Xubuntu3 puede resolver a través de la máquina Xubuntu2:<\/p>\n<pre><code><b class=\"m3\">andres@xubuntu3pc05:/etc$ ping www.idealista.com<\/b><\/code><\/pre>\n<pre><code>PING n.sni.us-eu.fastly.net (199.232.197.91) 56(84) bytes of data.\n64 bytes from 199.232.197.91 (199.232.197.91): icmp_seq=1 ttl=56 time=25.0 ms\n64 bytes from 199.232.197.91 (199.232.197.91): icmp_seq=2 ttl=56 time=36.5 ms\n64 bytes from 199.232.197.91 (199.232.197.91): icmp_seq=3 ttl=56 time=3.57 ms\n^C\n--- n.sni.us-eu.fastly.net ping statistics ---\n3 packets transmitted, 3 received, 0% packet loss, time 2025ms\nrtt min/avg/max/mdev = 3.571/21.689/36.460/13.634 ms<\/code><\/pre>\n<h3>Xubuntu3 vuelve a DHCP<\/h3>\n<p>Cambiamos la red de Xubuntu3 para usar DHCP:<\/p>\n<pre><code><b class=\"m3\">andres@xubuntu3pc05:~$ cat /etc/netplan/01-network-manager-all.yaml<\/b>\n# Let NetworkManager manage all devices on this system\nnetwork:\n  version: 2\n  renderer: NetworkManager\n  ethernets:\n    enp0s3:\n      dhcp4: yes\n#     addresses: [172.16.2.200/16]\n#     routes:\n#       - to: default\n#         via: 172.16.0.1\n#     nameservers:\n#       addresses: [172.16.35.150]<\/code><\/pre>\n<h3>DHCP con dnsmasq<\/h3>\n<p>Editamos <code>dnsmasq.conf<\/code> creando un rango de IPs:<\/p>\n<pre><code><b class=\"m2\">andres@xubuntu2pc05:~$ cat -n /etc/dnsmasq.conf<\/b>\n   176\n   177  ###########################################\n   178\n   179  dhcp-range=172.16.40.126,172.16.40.130,255.255.0.0,100m\n   180\n   181  ###########################################\n   182\n<b class=\"m2\">andres@xubuntu2pc05:~$ sudo systemctl restart dnsmasq.service<\/b><\/code><\/pre>\n<p>Ahora intentamos coger IP con el cliente Xubuntu3:<\/p>\n<pre><code><b class=\"m3\">andres@xubuntu3pc05:~$ sudo dhclient -v -4<\/b>\n[sudo] contraseña para andres:\nInternet Systems Consortium DHCP Client 4.4.1\nCopyright 2004-2018 Internet Systems Consortium.\nAll rights reserved.\nFor info, please visit https://www.isc.org/software/dhcp/\n\n/var/lib/dhcp/dhclient.leases line 44: no option named dhcp-rebindlease in space dhcp\noption dhcp-rebindlease {\n       ^\n/var/lib/dhcp/dhclient.leases line 65: unterminated lease declaration.\n}\n^\nListening on LPF/enp0s3/08:00:27:b9:b9:1c\nSending on   LPF/enp0s3/08:00:27:b9:b9:1c\nSending on   Socket/fallback\nDHCPDISCOVER on enp0s3 to 255.255.255.255 port 67 interval 3 (xid=0xf7b3e721)\nDHCPOFFER of 172.16.40.130 from 172.16.35.155\nDHCPREQUEST for 172.16.40.130 on enp0s3 to 255.255.255.255 port 67 (xid=0x21e7b3f7)\nDHCPACK of 172.16.40.130 from 172.16.35.155 (xid=0xf7b3e721)\nbound to 172.16.40.130 -- renewal in 2334 seconds.<\/code><\/pre>\n<p>En este caso nos la da nuestra propia máquina 2 (<code>172.16.35.155<\/code>).<\/p>\n<h2>19/10/2026<\/h2>\n<h3>Asignar una IP fija a una MAC<\/h3>\n<p>Añadimos la línea 182 para asignar una IP a una MAC concreta (en este caso la máquina Xubuntu3), además de la puerta de enlace:<\/p>\n<pre><code><b class=\"m2\">andres@xubuntu2pc05:~$ cat -n /etc/dnsmasq.conf<\/b>\n   176\n   177  ###########################################\n   178\n   179  dhcp-range=172.16.40.126,172.16.40.130,255.255.0.0,100m\n   180  dhcp-option=option:router,172.16.0.1\n   181\n   182  dhcp-host=08:00:27:b9:b9:1c,172.16.40.127\n   183\n   184  ###########################################\n   185<\/code><\/pre>\n<p>Reiniciamos el servicio, liberamos la IP que teníamos y solicitamos otra:<\/p>\n<pre><code><b class=\"m3\">andres@xubuntu3pc05:~$ sudo dhclient -r<\/b>\nKilled old client process\n<b class=\"m3\">andres@xubuntu3pc05:~$ sudo dhclient -v -4<\/b>\nInternet Systems Consortium DHCP Client 4.4.1\nCopyright 2004-2018 Internet Systems Consortium.\nAll rights reserved.\nFor info, please visit https://www.isc.org/software/dhcp/\n\nListening on LPF/enp0s3/08:00:27:b9:b9:1c\nSending on   LPF/enp0s3/08:00:27:b9:b9:1c\nSending on   Socket/fallback\nDHCPDISCOVER on enp0s3 to 255.255.255.255 port 67 interval 3 (xid=0xa08fec5c)\nDHCPOFFER of 172.16.40.127 from 172.16.35.155\nDHCPREQUEST for 172.16.40.127 on enp0s3 to 255.255.255.255 port 67 (xid=0x5cec8fa0)\nDHCPACK of 172.16.40.127 from 172.16.35.155 (xid=0xa08fec5c)\nbound to 172.16.40.127 -- renewal in 2731 seconds.<\/code><\/pre>\n<p>Y ahora, en vez de darnos la IP <code>172.16.40.130<\/code>, nos da la <code>172.16.40.127<\/code>, que es la IP que nosotros pusimos para forzarla.<\/p>\n<h3>El archivo <code>/etc/hosts<\/code><\/h3>\n<pre><code><b class=\"m2\">andres@xubuntu2pc05:~$ cat /etc/hosts<\/b>\n127.0.0.1 localhost\n127.0.1.1 xubuntu2pc05.asir.com xubuntu2pc05\n172.16.35.155 xubuntu2 andres2 andres2.asir2.com\n172.16.35.150 manolo2 profe2 profe2.asir2.com\n172.16.35.152 christian2 christian2.asir2.com\n172.16.35.153 juan2 juan2.asir2.com\n172.16.35.157 flavius2 flavio flavio2.asir2.com\n\n# The following lines are desirable for IPv6 capable hosts\n::1 ip6-localhost ip6-loopback\nfe00::0 ip6-localnet\nff00::0 ip6-mcastprefix\nff02::1 ip6-allnodes\nff02::2 ip6-allrouters<\/code><\/pre>\n<p>En el archivo <code>hosts<\/code> podemos poner un <strong>nombre de referencia a las IPs<\/strong>, pudiendo usar ese nombre en lugar de la IP, para que las máquinas a las que les demos IP puedan usar los nombres en vez de las IPs.<\/p>\n<pre><code><b class=\"m2\">andres@xubuntu2pc05:~$ ping profe2<\/b><\/code><\/pre>\n<pre><code>PING manolo2 (172.16.35.150) 56(84) bytes of data.\n64 bytes from manolo2 (172.16.35.150): icmp_seq=1 ttl=64 time=1.10 ms\n64 bytes from manolo2 (172.16.35.150): icmp_seq=2 ttl=64 time=1.11 ms\n^C\n--- manolo2 ping statistics ---\n2 packets transmitted, 2 received, 0% packet loss, time 1001ms\nrtt min/avg/max/mdev = 1.097/1.102/1.108/0.005 ms<\/code><\/pre>\n<pre><code><b class=\"m2\">andres@xubuntu2pc05:~$ ping juan2<\/b><\/code><\/pre>\n<pre><code>PING juan2 (172.16.35.153) 56(84) bytes of data.\n64 bytes from juan2 (172.16.35.153): icmp_seq=1 ttl=64 time=1.29 ms\n64 bytes from juan2 (172.16.35.153): icmp_seq=2 ttl=64 time=1.17 ms\n^C\n--- juan2 ping statistics ---\n2 packets transmitted, 2 received, 0% packet loss, time 1001ms\nrtt min/avg/max/mdev = 1.173/1.232/1.292/0.059 ms<\/code><\/pre>\n<h2>21/10/2026<\/h2>\n<p>Ampliamos <code>dnsmasq.conf<\/code> ignorando un cliente por su MAC y reservando una IP por nombre de host:<\/p>\n<pre><code><b class=\"m2\">andres@xubuntu2pc05:~$ cat -n /etc/dnsmasq.conf<\/b>\n   176\n   177  ###########################################\n   178\n   179  dhcp-range=172.16.40.126,172.16.40.130,255.255.0.0,100m\n   180  dhcp-option=option:router,172.16.0.1\n   181\n   182  dhcp-host=08:00:27:b9:b9:1c,172.16.40.127\n   183  dhcp-host=08:00:27:8a:7a:9c,ignore\n   184  dhcp-host=garbanzos, 172.16.40.128\n   185\n   186  ###########################################\n   187<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th>Línea<\/th>\n<th>Efecto<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>dhcp-host=&lt;MAC&gt;,&lt;IP&gt;<\/code><\/td>\n<td>Asigna siempre esa IP a esa MAC<\/td>\n<\/tr>\n<tr>\n<td><code>dhcp-host=&lt;MAC&gt;,ignore<\/code><\/td>\n<td>Ignora las peticiones DHCP de esa MAC<\/td>\n<\/tr>\n<tr>\n<td><code>dhcp-host=&lt;nombre&gt;,&lt;IP&gt;<\/code><\/td>\n<td>Asigna esa IP al equipo con ese nombre de host<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>22/10/2026<\/h2>\n<h3>Concesiones de dnsmasq<\/h3>\n<p>En el archivo <code>dnsmasq.leases<\/code> se puede ver a quién damos IP:<\/p>\n<pre><code><b class=\"m2\">andres@xubuntu2pc05:/var/lib/misc$ cat dnsmasq.leases<\/b>\n1792670672 08:00:27:b9:b9:1c 172.16.40.127 andres3 *<\/code><\/pre>\n<h3>Orden de resolución: <code>nsswitch.conf<\/code><\/h3>\n<p>En el archivo <code>nsswitch.conf<\/code> se puede configurar a qué se da prioridad, según si ponemos primero <code>dns<\/code> o <code>files<\/code> en la línea <strong><code>hosts:<\/code><\/strong>:<\/p>\n<pre><code><b class=\"m2\">andres@xubuntu2pc05:~$ cat /etc/nsswitch.conf<\/b>\n# /etc/nsswitch.conf\n#\n# Example configuration of GNU Name Service Switch functionality.\n# If you have the `glibc-doc-reference' and `info' packages installed, try:\n# `info libc \"Name Service Switch\"' for information about this file.\n\npasswd:         files systemd\ngroup:          files systemd\nshadow:         files\ngshadow:        files\n\nhosts:          files mdns4_minimal [NOTFOUND=return] dns\nnetworks:       files\n\nprotocols:      db files\nservices:       db files\nethers:         db files\nrpc:            db files\n\nnetgroup:       nis<\/code><\/pre>", "n": "<h2>26/10/2026<\/h2>\n<p>Instalamos bind9 en Xubuntu1<\/p>\n<pre><code><b class=\"m1\">andres@xubuntu1pc05:~$ sudo apt install bind9<\/b>\nLeyendo lista de paquetes... Hecho\nCreando árbol de dependencias... Hecho\nLeyendo la información de estado... Hecho\nbind9 ya está en su versión más reciente (1:9.18.39-0ubuntu0.22.04.7).\n0 actualizados, 0 nuevos se instalarán, 0 para eliminar y 153 no actualizados.<\/code><\/pre>\n<p>Creamos una zona en el archivo named.config.local<\/p>\n<pre><code><b class=\"m1\">andres@xubuntu1pc05:/etc/bind$ cat named.conf.local <\/b>\n//\n// Do any local configuration here\n//\n\n// Consider adding the 1918 zones here, if they are not used in your\n// organization\n//include \"/etc/bind/zones.rfc1918\";\n\nzone \"asir2.com\" {\n    type master;\n    file \"/etc/bind/asir2.db\";\n};<\/code><\/pre>\n<p>Creamos el archivo asir2.db a partir del db.local <\/p>\n<h2>29/10/2026<\/h2>\n<p>Ahora modificamos el asir.db para que use el dominio que hemos puesto en la zona del archivo “named.conf.local” y ponemos nombre a las distintas ips que queremos que nuestros clientes puedan hacer ping directamente con el nombre.<\/p>\n<pre><code><b class=\"m1\">andres@xubuntu1pc05:~$ sudo cat /etc/bind/asir2.db <\/b>\n;\n; BIND data file for local loopback interface\n;\n$TTL    604800\n@       IN      SOA      asir2.com. root.asir2.com. (\n                               2        ; Serial\n                          604800        ; Refresh\n                           86400        ; Retry\n                         2419200        ; Expire\n                          604800 )      ; Negative Cache TTL\n;\n@      IN       NS       ns1.asir2.com.\n@      IN       MX 10    mail.asir2.com.\n\nns1    IN       A        172.16.35.105\nmail   IN       A        172.16.35.105\nxubuntu1pc05 IN A        172.16.35.105\nxubuntu2pc05 IN A        172.16.35.150\nxubuntu3pc05 IN A        172.16.35.205\nmanolo IN       A        172.16.35.100\nalejadro IN     A        172.16.35.115\noscar1 IN       A        172.16.35.119<\/code><\/pre>\n<p>Ahora vemos si esta tood bien con named-checkzone<\/p>\n<pre><code>andres@xubuntu1pc05:/etc/bind$ sudo named-checkzone asir2.com asir2.db\nzone asir2.com/IN: loaded serial 2\nOK<\/code><\/pre>\n<p>Y recargamos el servicio<\/p>\n<pre><code><b class=\"m1\">andres@xubuntu1pc05:/etc/bind$ sudo systemctl reload named<\/b><\/code><\/pre>\n<p>Cambiamos la configuracion de red del Xubuntu3<\/p>\n<pre><code><b class=\"m3\">andres@xubuntu3pc05:~$ sudo cat /etc/netplan/01-network-manager-all.yaml <\/b>\n# Let NetworkManager manage all devices on this system\nnetwork:\n  version: 2\n  renderer: NetworkManager\n\n  ethernets:\n     enp0s3:\n       dhcp4: no\n       addresses: [172.16.35.205/16]\n       routes:\n         - to: default\n           via: 172.16.0.1\n       nameservers:\n          addresses: [172.16.35.105]<\/code><\/pre>\n<p>Ahora hacemos con xubuntu3 ping a alguno de los nombre y deberia funcionar<\/p>\n<pre><code><b class=\"m3\">andres@xubuntu3pc05:~$ ping -c 2 manolo<\/b>\nPING manolo.asir2.com (172.16.35.100) 56(84) bytes of data.\n64 bytes from 172.16.35.100: icmp_seq=1 ttl=64 time=1.40 ms\n64 bytes from 172.16.35.100: icmp_seq=2 ttl=64 time=1.57 ms\n\n--- manolo.asir2.com ping statistics ---\n2 packets transmitted, 2 received, 0% packet loss, time 1001ms\nrtt min/avg/max/mdev = 1.398/1.486/1.574/0.088 ms<\/code><\/pre>\n<p>Creamos una zona de resolución inversa.<\/p>\n<pre><code><b class=\"m1\">andres@xubuntu1pc05:/etc/bind$ sudo cat named.conf.local <\/b>\n//\n// Do any local configuration here\n//\n\n// Consider adding the 1918 zones here, if they are not used in your\n// organization\n//include \"/etc/bind/zones.rfc1918\";\n\nzone \"asir2pc05.com\" {\n    type master;\n    file \"/etc/bind/asir2.db\";\n};\n\n//ZOna de resolucion inversa\nzone \"16.172.in-addr.arpa\" {\n    type mastar;\n    file \"/etc/bind/172.16.rev\";\n};<\/code><\/pre>\n<p>Ahora creamos el archivo 172.16.rev a partir del db.127, lo modificamos para que encaje en nuestra zona de resolución inversa y añadimos las ips junto con sus nombres para la resolucion.<\/p>\n<pre><code><b class=\"m1\">andres@xubuntu1pc05:/etc/bind$ sudo cat 172.16.rev <\/b>\n;\n; BIND reverse data file for local loopback interface\n;\n$TTL     604800\n@        IN      SOA    asi2.com. root.asir2.com. (\n                              1        ; Serial\n                         604800        ; Refresh\n                          86400        ; Retry\n                        2419200        ; Expire\n                         604800 )      ; Negative Cache TTL\n;\n@        IN      NS     ns1.asir2.com.\n105.35   IN      PTR    ns1\n105.35   IN      PTR    xubuntu1\n155.35   IN      PTR    xubuntu2\n205.35   IN      PTR    xubuntu3\n100.35   IN      PTR    manolo\n115.35   IN      PTR    alejandro1\n116.35   IN      PTR    fabian1\n166.35   IN      PTR    fabian2<\/code><\/pre>\n<p>Comprobamos que es archivo esta bien<\/p>\n<pre><code><b class=\"m1\">andres@xubuntu1pc05:/etc/bind$ sudo named-checkzone 16.172.in-addr.arpa 172.16.rev<\/b>\nzone 16.172.in-addr.arpa/IN: loaded serial 1\nOK<\/code><\/pre>\n<p>Recargamos<\/p>\n<pre><code><b class=\"m1\">andres@xubuntu1pc05:/etc/bind$ sudo systemctl reload named<\/b><\/code><\/pre>\n<p>Ahora desde el xubuntu3 hacemos nslookup y deberia conectar<\/p>\n<pre><code><b class=\"m3\">andres@xubuntu3pc05:~$ nslookup 172.16.35.116<\/b>\n116.35.16.172.in-addr.arpa    name = fabian1.16.172.in-addr.arpa.\n\nAuthoritative answers can be found from:\n\nPara que no se pierda la conexion si la maquina se apaga hay que modificar el archivo resolv.conf<\/code><\/pre>\n<p>Para que no se pierda la conexion si la maquina se apaga hay que modificar el archivo resolv.conf, primero eliminar de forma forzada el archivo, luego desactivar el servicio de systemd-resolved y crear un nuevo archivo resolv.conf en la mismo direccion con el nameserver y el search.<\/p>\n<pre><code><b class=\"m1\">andres@xubuntu1pc05:/etc/bind$ cat /etc/resolv.conf<\/b>\nnameserver 172.16.35.105\nsearch asir2.com<\/code><\/pre>"};

const VS=[['th','Resumen'],['ff','Full Lucas'],['fc','Flashcards'],['ts','Test'],['ex','Examen'],['dv','Desarrollo'],['rv','Repaso'],['gl','Glosario'],['ch','Chuleta']];
function prog(){let n=T.length,k=T.filter(t=>S.done[t.id]).length;T.forEach(t=>{n+=t.c.length;t.c.forEach((_,j)=>{if(S.known[t.id+'c'+j]===1)k++})});const p=Math.round(100*k/n);$('#pg').style.width=p+'%';$('#pt').textContent=p+' % completado · '+Object.keys(S.wrong).length+' preguntas por repasar'}
function nav(){$('#nv').innerHTML=VS.map(v=>`<button class="${V===v[0]?'on':''}" onclick="V='${v[0]}';clearInterval(tm);R()">${v[1]}</button>`).join('');$('#tp').innerHTML=[['all','Todos']].concat(T.map(t=>[t.id,t.n])).map(t=>`<button class="${TP===t[0]?'on':''}" onclick="TP='${t[0]}';FI=0;FL=false;clearInterval(tm);R()">${t[1]}</button>`).join('');prog()}
function R(){nav();const m=$('#m');m.innerHTML='';m.classList.toggle('wide',V==='ff');({th,fc,ts,ex,dv,rv,gl,ch,ff})[V](m);window.scrollTo(0,0)}
function th(m){tops().forEach(t=>{m.insertAdjacentHTML('beforeend',`<h2>${t.n}</h2>`+t.th.map(s=>`<details><summary>${s[0]}</summary><div>${s[1]}</div></details>`).join('')+`<button onclick="S.done['${t.id}']=!S.done['${t.id}'];save();R()">${S.done[t.id]?'✓ Tema completado (quitar)':'Marcar tema como completado'}</button>`)})}
function cards(){return tops().flatMap(t=>t.c.map((c,j)=>({k:t.id+'c'+j,t:t.n,q:c[0],a:c[1]}))).filter(c=>!FP||S.known[c.k]!==1)}
function fc(m){const L=cards();if(FI>=L.length)FI=0;m.innerHTML=`<label><input type="checkbox" ${FP?'checked':''} onchange="FP=this.checked;FI=0;R()"> Solo pendientes</label>`;if(!L.length){m.innerHTML+='<div class="card">🎉 ¡Todas dominadas!</div>';return}const c=L[FI];m.innerHTML+=`<p class="tag">${FI+1}/${L.length} · ${c.t}</p><div class="card fc ${FL?'back':''}" tabindex="0" role="button" onclick="FL=!FL;R()" onkeydown="if(event.key==' '||event.key=='Enter'){event.preventDefault();FL=!FL;R()}">${FL?c.a:'<b>'+c.q+'</b>'}</div><div class="row"><button onclick="mk('${c.k}',1)">✓ La sabía</button><button onclick="mk('${c.k}',0)">↻ Repasar</button></div><p class="tag">Pulsa la tarjeta (o Enter) para voltearla.</p>`}
function mk(k,v){S.known[k]=v;save();FI++;FL=false;R()}
function qs(){return tops().flatMap(t=>t.q.map((q,j)=>({k:t.id+j,t:t.n,q})))}
function ts(m){m.innerHTML=`<div class="card"><p>${qs().length} preguntas, con feedback inmediato.</p><button class="on" onclick="quiz(sh(qs()),true)">Empezar test</button></div>`}
function ex(m){m.innerHTML=`<div class="card"><p>Examen aleatorio de los temas seleccionados arriba. Sin feedback hasta el final.</p><label>Nº de preguntas: <input type="number" id="en" value="15" min="3" max="40" style="width:80px"></label> <label><input type="checkbox" id="ec" checked> Cronómetro</label><p><button class="on" onclick="quiz(sh(qs()).slice(0,+$('#en').value||15),false,$('#ec').checked)">Empezar examen</button></p></div>`}
function quiz(L,fb,clock){const m=$('#m');let i=0,res=[],t0=Date.now();clearInterval(tm);
function head(){return `<p class="tag">Pregunta ${i+1}/${L.length}${clock?' · ⏱ <span id="tc"></span>':''}</p>`}
if(clock)tm=setInterval(()=>{const e=$('#tc');if(e){const s=Math.floor((Date.now()-t0)/1000);e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}},500);
function rec(it,ok){res.push({it,ok});if(!ok)S.wrong[it.k]=2;else if(S.wrong[it.k]&&!--S.wrong[it.k])delete S.wrong[it.k];save();prog()}
function nxt(){i++;i<L.length?show():end()}
function show(){const it=L[i],q=it.q;if(q[2]==='o')return ord(it);
m.innerHTML=head()+`<div class="card"><b>${q[0]}</b>`+q[1].map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join('')+'<div id="fb"></div></div>';
m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const j=+b.dataset.j,ok=j===q[2];rec(it,ok);if(!fb)return nxt();m.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.j===q[2])x.classList.add('ok')});if(!ok)b.classList.add('ko');$('#fb').innerHTML=`<div class="fb ${ok?'ok':'ko'}"><b>${ok?'¡Correcto!':'Incorrecto.'}</b> ${q[3]}</div><p><button class="on" id="nx">Siguiente →</button></p>`;$('#nx').onclick=nxt;$('#nx').focus()})}
function ord(it){const q=it.q,pool=sh(q[1]),ch=[];function d(){m.innerHTML=head()+`<div class="card"><b>${q[0]}</b><p class="tag">Pulsa los pasos en el orden correcto.</p><ol>${ch.map(x=>`<li>${x}</li>`).join('')}</ol>`+pool.filter(x=>!ch.includes(x)).map(x=>`<button class="opt" data-v="${x}">${x}</button>`).join('')+'<div id="fb"></div></div>';m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ch.push(b.dataset.v);if(ch.length<pool.length)return d();const ok=ch.join('|')===q[1].join('|');rec(it,ok);if(!fb)return nxt();d();m.querySelectorAll('.opt').forEach(x=>x.disabled=true);$('#fb').innerHTML=`<div class="fb ${ok?'ok':'ko'}"><b>${ok?'¡Correcto!':'Orden incorrecto.'}</b> Orden: ${q[1].join(' → ')}. ${q[3]}</div><p><button class="on" id="nx">Siguiente →</button></p>`;$('#nx').onclick=nxt})}d()}
function end(){clearInterval(tm);const ok=res.filter(r=>r.ok).length,by={};res.forEach(r=>{by[r.it.t]=by[r.it.t]||[0,0];by[r.it.t][1]++;if(r.ok)by[r.it.t][0]++});const n=(10*ok/res.length).toFixed(1);
m.innerHTML=`<div class="card"><div class="big">${n} / 10</div><p>${ok} de ${res.length} aciertos${clock?' · '+Math.round((Date.now()-t0)/1000)+' s':''}.</p><table><tr><th>Tema</th><th>Aciertos</th></tr>${Object.entries(by).map(([k,v])=>`<tr><td>${k}</td><td>${v[0]}/${v[1]}</td></tr>`).join('')}</table></div>`+(res.some(r=>!r.ok)?'<h3>Para repasar</h3>'+res.filter(r=>!r.ok).map(r=>`<div class="card"><b>${r.it.q[0]}</b><p>${r.it.q[2]==='o'?r.it.q[1].join(' → '):'✓ '+r.it.q[1][r.it.q[2]]}</p><p class="tag">${r.it.q[3]}</p></div>`).join(''):'<p>🎉 Sin fallos.</p>');}
show()}
function dv(m){m.innerHTML='<p>Escribe tu respuesta y contrasta con los puntos clave.</p>';D.filter(d=>TP==='all'||d[0]===TP).forEach(d=>{m.insertAdjacentHTML('beforeend',`<details><summary>${d[1]}</summary><div><textarea rows="5" placeholder="Escribe aquí tu respuesta…"></textarea><p><b>Puntos clave</b> (marca los que has cubierto):</p>${d[2].map(p=>`<label style="display:block"><input type="checkbox" onchange="dc(this)"> ${p}</label>`).join('')}<p class="tag dr"></p></div></details>`)})}
function dc(e){const d=e.closest('div'),c=d.querySelectorAll('input:checked').length,n=d.querySelectorAll('input').length;d.querySelector('.dr').textContent=`Cubiertos ${c}/${n}`+(c<n?' · repasa los que faltan':' · ¡completo!')}
function rv(m){const w=qs().filter(x=>S.wrong[x.k]),pc=T.flatMap(t=>t.c.map((c,j)=>({k:t.id+'c'+j,q:c[0],a:c[1]}))).filter(c=>S.known[c.k]===0);
m.innerHTML=`<h3>Preguntas falladas (${w.length})</h3>`+(w.length?`<button class="on" onclick="quiz(sh(qs().filter(x=>S.wrong[x.k])),true)">Practicar fallos</button>`+w.map(x=>`<div class="card">${x.q[0]}<p class="tag">${x.t}</p></div>`).join(''):'<p>Ninguna. Se eliminan al acertarlas dos veces.</p>')+`<h3>Flashcards por repasar (${pc.length})</h3>`+pc.map(c=>`<details><summary>${c.q}</summary><div>${c.a}</div></details>`).join('')}
function gl(m){m.innerHTML='<input type="search" id="gq" placeholder="Buscar término…" aria-label="Buscar en el glosario"><div id="gr"></div>';const f=()=>{const q=$('#gq').value.toLowerCase();$('#gr').innerHTML=T.flatMap(t=>t.c.map(c=>[t.n,c[0],c[1]])).filter(c=>(c[1]+c[2]).toLowerCase().includes(q)).map(c=>`<div class="card"><b>${c[1]}</b> <span class="tag">${c[0]}</span><br>${c[2]}</div>`).join('')};$('#gq').oninput=f;f()}
function ff(m){m.insertAdjacentHTML('beforeend','<p class="tag">Texto íntegro de los apuntes de LUCAS (el .md), sin resumir. Las imágenes no vienen en el .md y se indican con su descripción.</p><div class="md">'+FF._i+'</div>');tops().forEach(t=>m.insertAdjacentHTML('beforeend',`<h2>${t.n}</h2><div class="md">${FF[t.id]}</div>`))}
function ch(m){tops().forEach(t=>m.insertAdjacentHTML('beforeend',`<div class="card"><h3>${t.n}</h3><ul>${t.s.map(x=>`<li>${x}</li>`).join('')}</ul></div>`))}
(function(){
  const r=document.documentElement;
  let t=null;try{t=localStorage.getItem('asir_theme')}catch(e){}
  r.dataset.theme=t==='dark'?'dark':'light';
  $('#th').onclick=()=>{
    const n=r.dataset.theme==='dark'?'light':'dark';
    r.dataset.theme=n;
    try{localStorage.setItem('asir_theme',n)}catch(e){}
  };
})();
$('#rs').onclick=()=>{if(confirm('¿Borrar todo el progreso?')){S={done:{},known:{},wrong:{},best:{}};save();R()}};
R();
</script></body></html>
