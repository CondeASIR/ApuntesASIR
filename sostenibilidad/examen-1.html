<style>
:root{--bg:#faf8f7;--sf:#fff;--tx:#241a19;--mu:#6b5d5b;--bd:#e6dcda;--ac:#3d8b25;--acs:#e8f4e0;--ok:#1b7a3a;--oks:#e3f4e8;--ko:#b3261e;--kos:#fde7e5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}html{scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

.opt{display:block;width:100%;text-align:left;margin:6px 0}.opt.ok{background:var(--oks);border-color:var(--ok)}.opt.ko{background:var(--kos);border-color:var(--ko);animation:sh .3s}

.fc{min-height:170px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.1rem;cursor:pointer;perspective:600px}
.fc.back{background:var(--acs);border-color:var(--ac)}
.tag{font-size:.75rem;color:var(--mu)}input[type=text],input[type=search],input[type=number],textarea{width:100%;font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);color:var(--tx)}
.fb{padding:8px 12px;border-radius:8px;margin-top:8px}.fb.ok{background:var(--oks)}.fb.ko{background:var(--kos)}
.big{font-size:2rem;font-weight:700;color:var(--ac)}
.md{line-height:1.65}.md h1{font-size:1.4rem;margin:1.6em 0 .5em;flex:none}.md h2{font-size:1.2rem;margin:1.4em 0 .4em}.md h3{font-size:1.05rem;margin:1.2em 0 .3em}.md h4{font-size:1rem;margin:1em 0 .3em;color:var(--mu)}.md p{margin:.6em 0}.md ul,.md ol{padding-left:1.4em}.md li{margin:.2em 0}.md img{max-width:100%;height:auto;background:#fff;padding:6px;border-radius:8px;display:block;margin:8px 0}.md table{margin:10px 0}.md blockquote{border-left:4px solid var(--bd);margin:8px 0;padding:2px 12px;color:var(--mu)}.md code{background:var(--acs);padding:0 4px;border-radius:4px;font-size:.9em}.md .math{font-family:Georgia,"Times New Roman",serif;font-style:italic}.md div.math{background:var(--acs);border-radius:8px;padding:6px 12px;margin:10px 0;text-align:center}.slides figure{margin:12px 0}.slides img{width:100%;height:auto;border:1px solid var(--bd);border-radius:8px;background:#fff}.slides figcaption{font-size:.75rem;color:var(--mu)}.md table{width:100%}.md th{background:var(--acs)}.wl{color:var(--ac);border-bottom:1px dotted var(--ac)}
</style></head><body>

<script>
const T=[{"id": "c", "n": "Concepto y evolución", "th": [["Informe Brundtland y desarrollo sostenible", "<p>El concepto moderno se formalizó en <mark>1987</mark> con el informe <i>Nuestro Futuro Común</i> (<mark>Informe Brundtland</mark>), de la Comisión Mundial sobre el Medio Ambiente y el Desarrollo de la ONU.</p><p><b>Desarrollo sostenible</b>: el que satisface las necesidades del presente sin comprometer la capacidad de las generaciones futuras para satisfacer las suyas.</p>"], ["Triple Resultado (Triple Bottom Line)", "<p>En la empresa se supera la óptica solo económica: <mark>People, Planet, Profit</mark>. La viabilidad a largo plazo depende del equilibrio entre tres dimensiones:</p><ul><li><b>Económica</b>: rentabilidad y generación de valor sostenible (en la presentación: viabilidad financiera y eficiencia operativa).</li><li><b>Social</b>: impacto en trabajadores, comunidad y sociedad (bienestar y equidad laboral).</li><li><b>Ambiental</b>: conservación de recursos, gestión de residuos y mitigación del cambio climático (minimizar el impacto directo).</li></ul><div class=\"extra\">Regla: People = Social, Planet = Ambiental, Profit = Económica.</div>"], ["La huella invisible del dato", "<p>Según la presentación, los centros de datos demandan el <mark>2 %</mark> de la electricidad mundial. Cada arquitectura desplegada tiene impacto energético directo y genera residuos electrónicos constantemente: el diseño de sistemas determina la eficiencia ecológica del negocio.</p>"]], "c": [["Informe Brundtland", "1987, <i>Nuestro Futuro Común</i>, Comisión Mundial sobre el Medio Ambiente y el Desarrollo (ONU)."], ["Desarrollo sostenible", "Satisface las necesidades del presente sin comprometer la capacidad de las generaciones futuras de satisfacer las suyas."], ["Triple Bottom Line", "Triple Resultado: People, Planet, Profit. Equilibrio económico, social y ambiental."], ["Dimensión económica", "Rentabilidad y generación de valor sostenible."], ["Dimensión social", "Impacto en trabajadores, comunidad y sociedad."], ["Dimensión ambiental", "Conservación de recursos, gestión de residuos y mitigación del cambio climático."], ["Consumo de los CPD", "Demandan el 2 % de la electricidad mundial (presentación)."]], "q": [["¿En qué año se formalizó el concepto moderno de sostenibilidad con el Informe Brundtland?", ["1972", "1987", "1992", "2015"], 1, "El informe <i>Nuestro Futuro Común</i> es de 1987. 2015 es la Agenda 2030."], ["¿Qué organismo elaboró el Informe Brundtland?", ["La Comisión Europea", "El Foro de Davos", "La Comisión Mundial sobre el Medio Ambiente y el Desarrollo de la ONU", "The Green Grid"], 2, "The Green Grid creó el PUE, no el informe."], ["El modelo «People, Planet, Profit» se corresponde con…", ["Ambiental, Social, Gobernanza", "Social, Ambiental, Económica", "Económica, Legal, Social", "Producción, Consumo, Residuos"], 1, "People=Social, Planet=Ambiental, Profit=Económica. Ambiental, Social y Gobernanza son los criterios ASG, otro concepto."], ["Verdadero o falso: el Triple Resultado defiende que basta con la rentabilidad económica para la viabilidad a largo plazo.", ["Verdadero", "Falso"], 1, "Defiende el equilibrio entre las tres dimensiones."], ["¿Qué dimensión incluye la gestión de residuos y la mitigación del cambio climático?", ["Económica", "Social", "Ambiental", "Gobernanza"], 2, "Es la dimensión ambiental."], ["¿Qué porcentaje de la electricidad mundial demandan los centros de datos según la presentación?", ["0,2 %", "2 %", "20 %", "50 %"], 1, "Slide 2: «La huella invisible del dato»."]], "s": ["Brundtland 1987: necesidades presentes sin comprometer las futuras.", "Triple Resultado = People (social), Planet (ambiental), Profit (económica).", "CPD = 2 % de la electricidad mundial."]}, {"id": "a", "n": "Criterios ASG", "th": [["Qué son los ASG (ESG)", "<p><mark>ASG</mark> = Ambiental, Social y Gobernanza (<i>ESG</i>). Son las tres dimensiones <b>no financieras</b> fundamentales para evaluar desempeño, responsabilidad y riesgo operativo de una infraestructura corporativa.</p>"], ["A · Ambiental", "<p>Impacto directo e indirecto de las actividades sobre el medio ambiente, ecosistemas y biosfera. En ASIR:</p><ul><li><b>Eficiencia energética</b>: monitorizar el <mark>PUE</mark> en salas de servidores y CPD.</li><li><b>Virtualización y consolidación</b>: menos máquinas físicas, menos vatios y refrigeración.</li><li><b>Gestión de RAEE</b>: tratamiento certificado de hardware obsoleto (RD 110/2015).</li><li><b>Políticas de energía</b>: apagado e hibernación automáticos en equipos periféricos y laboratorios.</li></ul>"], ["S · Social", "<p>Relación e impacto en personas: empleados, clientes, colaboradores y sociedad. En ASIR:</p><ul><li><b>Salud y desconexión digital</b>: regular guardias de soporte y respetar descansos.</li><li><b>Ergonomía</b>: puestos, iluminación y pantallas antirreflejo en salas de operaciones.</li><li><b>Accesibilidad</b>: estándares de usabilidad en portales internos y servicios de red.</li><li><b>Protección de usuarios</b>: privacidad e integridad de datos de empleados y clientes.</li></ul>"], ["G · Gobernanza", "<p>Estructura de gestión, control interno, ética, legalidad y toma de decisiones. En ASIR:</p><ul><li><b>Seguridad de la información</b>: <mark>RGPD</mark>, directiva <mark>NIS2</mark> y <mark>ENS</mark>.</li><li><b>Continuidad de negocio</b>: planes de contingencia, DRP y copias de seguridad auditadas.</li><li><b>Destrucción de soportes</b>: borrado seguro y trazabilidad (norma <mark>DIN 66399</mark>).</li><li><b>Auditoría y control</b>: accesos mínimos necesarios y custodia de logs.</li></ul>"], ["Resumen de la presentación (slide 5)", "<div class=\"sc\"><table><tr><th>A</th><th>S</th><th>G</th></tr><tr><td>Climatización optimizada del CPD</td><td>Ergonomía en puestos técnicos</td><td>Cumplimiento riguroso del RGPD</td></tr><tr><td>Tratamiento regulado de RAEE</td><td>Políticas de desconexión digital</td><td>Auditorías de ciberseguridad ENS</td></tr></table></div>"]], "c": [["ASG / ESG", "Ambiental, Social y Gobernanza: dimensiones no financieras para evaluar desempeño, responsabilidad y riesgo operativo."], ["Pilar A", "Impacto sobre medio ambiente, ecosistemas y biosfera: PUE, virtualización, RAEE, políticas de energía."], ["Pilar S", "Impacto en personas: desconexión digital, ergonomía, accesibilidad, protección de usuarios."], ["Pilar G", "Gestión, control interno, ética y legalidad: RGPD, NIS2, ENS, continuidad, DIN 66399, logs."], ["Virtualización y consolidación", "Reducir máquinas físicas para minimizar vatios y refrigeración."], ["RD 110/2015", "Normativa española de RAEE."], ["DIN 66399", "Norma de destrucción de soportes: borrado seguro y trazabilidad en la baja."], ["RGPD, NIS2 y ENS", "Marco de seguridad de la información (pilar G)."], ["DRP", "Plan de recuperación ante desastres, junto a la continuidad de negocio (G)."], ["Desconexión digital", "Regular guardias de soporte y respetar turnos de descanso (S)."]], "q": [["¿Qué significa ASG?", ["Administración, Seguridad y Gestión", "Ambiental, Social y Gobernanza", "Auditoría, Sostenibilidad y Garantía", "Ambiental, Seguridad y Gobierno"], 1, "En inglés ESG: Environmental, Social, Governance."], ["La monitorización del PUE en CPD pertenece al pilar…", ["Ambiental", "Social", "Gobernanza", "Económico"], 0, "Es eficiencia energética: pilar A."], ["¿A qué pilar corresponde el cumplimiento del RGPD, NIS2 y ENS?", ["Ambiental", "Social", "Gobernanza", "Ninguno, son financieros"], 2, "Seguridad de la información: gobernanza."], ["La ergonomía de puestos y las pantallas antirreflejo en salas de operaciones son…", ["Ambiental", "Social", "Gobernanza", "Económico"], 1, "Pilar S, junto a desconexión digital y accesibilidad."], ["La norma DIN 66399 se refiere a…", ["Eficiencia energética", "Destrucción de soportes", "Emisiones de CO₂", "Ergonomía"], 1, "Borrado seguro y trazabilidad en la baja de soportes (G)."], ["Verdadero o falso: la gestión de RAEE con tratamiento certificado se enmarca en el pilar Ambiental.", ["Verdadero", "Falso"], 0, "Es una de las aplicaciones técnicas del pilar A."], ["Las guardias de soporte técnico y el respeto a los turnos de descanso se relacionan con…", ["Salud y desconexión digital (S)", "Continuidad de negocio (G)", "Virtualización (A)", "PPA (A)"], 0, "Es el pilar social."], ["¿Cuál de estos NO es un ejemplo de gobernanza?", ["Copias de seguridad auditadas", "Gestión de accesos mínimos necesarios", "Custodia de logs", "Apagado automático de equipos de laboratorio"], 3, "El apagado e hibernación son políticas de energía (A)."], ["Los factores ASG son dimensiones…", ["Financieras", "No financieras", "Solo legales", "Solo técnicas"], 1, "Dimensiones no financieras para evaluar desempeño y riesgo."]], "s": ["A = PUE, virtualización, RAEE (RD 110/2015), apagado automático.", "S = desconexión digital, ergonomía, accesibilidad, protección de usuarios.", "G = RGPD, NIS2, ENS, DRP, DIN 66399, logs y accesos mínimos."]}, {"id": "m", "n": "Marcos internacionales", "th": [["Agenda 2030 y ODS", "<p>Aprobada por la Asamblea General de la ONU en <mark>septiembre de 2015</mark>: <b>17 ODS</b> universales (erradicar la pobreza, proteger el planeta, asegurar la prosperidad). Cuatro destacan en administración de sistemas:</p><div class=\"sc\"><table><tr><th>ODS</th><th>Nombre</th><th>Aplicación</th></tr><tr><td>7</td><td>Energía asequible y no contaminante</td><td>CPD con acuerdos PPA de energía renovable; optimizar cargas según horarios de menor coste energético</td></tr><tr><td>9</td><td>Industria, innovación e infraestructura</td><td>Redes resilientes y tolerantes a fallos; trabajo remoto seguro para reducir desplazamientos</td></tr><tr><td>12</td><td>Producción y consumo responsables</td><td>Economía circular: reutilizar, mantenimiento preventivo, donación o despiece regulado</td></tr><tr><td>13</td><td>Acción por el clima</td><td>Contabilizar y reducir emisiones GEI de la infraestructura</td></tr></table></div><div class=\"extra\">PPA = <i>Power Purchase Agreement</i> (contrato de compra de energía). Los apuntes solo lo desarrollan como «acuerdos de compra de energía renovable».</div>"], ["Marco regulatorio europeo", "<ul><li><mark>Pacto Verde Europeo</mark> (<i>European Green Deal</i>): hoja de ruta hacia la <b>neutralidad climática en 2050</b>, con directivas de diseño ecológico para servidores y almacenamiento.</li><li><mark>Directiva CSRD</mark>: obliga a medianas y grandes corporaciones a auditar y reportar públicamente impactos ambientales y sociales. Traslada al administrador de sistemas la medición y certificación de consumos energéticos y métricas de ciberseguridad.</li></ul>"], ["CSRD: antes y ahora (presentación)", "<div class=\"sc\"><table><tr><th>Modelo previo</th><th>Directiva CSRD obligatoria</th></tr><tr><td>Memorias no normalizadas, voluntarias</td><td>Auditorías estandarizadas según normas <b>ESRS</b></td></tr><tr><td>Falta de métricas computacionales directas</td><td>Obligación de reportar consumos y seguridad técnica</td></tr></table></div>"], ["CPD sostenibles (presentación)", "<ul><li><b>Pasillos confinados</b>: separación estricta de flujos térmicos.</li><li><b>Contratos PPA</b>: suministro eléctrico con garantías renovables.</li><li><b>Virtualización</b>: reducción de la huella física de servidores.</li></ul>"]], "c": [["Agenda 2030", "Aprobada por la ONU en septiembre de 2015, con 17 ODS."], ["ODS 7", "Energía asequible y no contaminante: PPA renovables y optimizar cargas según coste energético."], ["ODS 9", "Industria, innovación e infraestructura: redes resilientes y trabajo remoto seguro."], ["ODS 12", "Producción y consumo responsables: economía circular informática."], ["ODS 13", "Acción por el clima: contabilizar y reducir emisiones GEI."], ["Pacto Verde Europeo", "Hoja de ruta de neutralidad climática en 2050, con diseño ecológico para servidores y almacenamiento."], ["CSRD", "Directiva que obliga a medianas y grandes empresas a auditar y reportar impactos ambientales y sociales."], ["ESRS", "Normas con las que se estandarizan las auditorías CSRD (presentación)."], ["PPA", "Contrato de suministro eléctrico con garantías renovables."], ["Pasillos confinados", "Separación estricta de flujos térmicos en el CPD."]], "q": [["¿Cuántos ODS establece la Agenda 2030?", ["7", "12", "17", "30"], 2, "17 metas universales, aprobadas en septiembre de 2015."], ["¿Qué ODS se asocia con la economía circular informática (reutilizar, prolongar vida útil, despiece regulado)?", ["ODS 7", "ODS 9", "ODS 12", "ODS 13"], 2, "Producción y consumo responsables."], ["Contabilizar y reducir emisiones de gases de efecto invernadero de la infraestructura TI corresponde al…", ["ODS 7", "ODS 9", "ODS 12", "ODS 13"], 3, "Acción por el clima."], ["Redes resilientes y tolerantes a fallos, y trabajo remoto seguro, se vinculan al…", ["ODS 7", "ODS 9", "ODS 12", "ODS 13"], 1, "Industria, innovación e infraestructura."], ["¿Qué objetivo de neutralidad climática fija el Pacto Verde Europeo?", ["2030", "2040", "2050", "2100"], 2, "Neutralidad climática en la UE en 2050."], ["La directiva CSRD obliga a…", ["Solo a pymes a donar equipos", "Medianas y grandes empresas a auditar y reportar sus impactos ambientales y sociales", "A los CPD a usar solo diésel", "A los empleados a teletrabajar"], 1, "Y traslada al administrador de sistemas la medición de consumos y métricas de ciberseguridad."], ["Verdadero o falso: antes de la CSRD las memorias eran voluntarias y no normalizadas.", ["Verdadero", "Falso"], 0, "Con la CSRD pasan a auditorías estandarizadas según normas ESRS."], ["Los contratos PPA en un CPD sirven para…", ["Reducir el PUE directamente", "Garantizar suministro eléctrico con garantías renovables", "Destruir soportes", "Cumplir el RGPD"], 1, "Se vinculan al ODS 7."], ["¿Qué ODS fomenta usar fuentes energéticas no contaminantes en servidores?", ["ODS 7", "ODS 9", "ODS 12", "ODS 13"], 0, "Energía asequible y no contaminante."]], "s": ["ODS clave: 7 energía, 9 infraestructura, 12 consumo responsable, 13 clima.", "Pacto Verde: neutralidad climática 2050. CSRD: reportar, normas ESRS.", "CPD sostenible: pasillos confinados, PPA, virtualización."]}, {"id": "k", "n": "Métricas clave", "th": [["PUE (Power Usage Effectiveness)", "<p>Métrica internacional desarrollada por <b>The Green Grid</b>.</p><div class=\"math\">PUE = Energía total del CPD / Energía del equipamiento IT</div><ul><li>Valor <mark>ideal teórico: 1,0</mark> (toda la energía llega a servidores, switches y almacenamiento).</li><li>PUE elevado (p. ej. &gt; 2,0): la mayor parte se pierde en sistemas auxiliares, sobre todo refrigeración y pérdidas de transformación.</li></ul><div class=\"card\"><b>Calculadora PUE</b><label>Energía total (kWh): <input type=\"number\" id=\"pet\" value=\"1500\" min=\"0\" oninput=\"pue()\"></label><br><label>Energía IT (kWh): <input type=\"number\" id=\"pei\" value=\"1000\" min=\"1\" oninput=\"pue()\"></label><p>PUE = <b id=\"po\"></b> <span id=\"pv\" class=\"tag\"></span></p></div>"], ["RAEE", "<p>Residuos de Aparatos Eléctricos y Electrónicos, regulados en España por el <mark>Real Decreto 110/2015</mark>. No pueden ir a vertederos ordinarios por sus metales pesados y sustancias tóxicas (<b>plomo, mercurio, cadmio</b>). Es obligatorio entregarlos a un <b>gestor autorizado</b> que emita el <i>justificante de trazabilidad</i>.</p>"], ["Alcances de emisión (GHG Protocol)", "<div class=\"sc\"><table><tr><th>Alcance</th><th>Origen</th><th>Ejemplo / acción</th></tr><tr><td>1 · Directas</td><td>Fuentes que controla la empresa</td><td>Generadores diésel de emergencia en el CPD; acción: biocombustibles</td></tr><tr><td>2 · Indirectas por energía</td><td>Generación de la electricidad comprada y consumida</td><td>Acción: contratos de energía verde</td></tr><tr><td>3 · Otras indirectas</td><td>Toda la cadena de valor: minerales, fabricación, transporte y fin de vida del hardware</td><td>Acción: ampliar el ciclo útil</td></tr></table></div>"], ["Fases de una auditoría de CPD", "<ol><li><b>Inventario</b>: cálculo del gasto nominal total.</li><li><b>Métricas</b>: medición in situ del PUE real.</li><li><b>Mejora</b>: consolidación por virtualización.</li><li><b>Residuos</b>: cadena certificada de RAEE.</li></ol><div class=\"extra\">Mnemotecnia: I-M-M-R (Inventario, Métricas, Mejora, Residuos).</div>"]], "c": [["PUE", "Energía total del CPD / energía del equipamiento IT. Creado por The Green Grid."], ["PUE ideal", "1,0: toda la energía llega al equipamiento IT."], ["PUE alto (> 2,0)", "La mayor parte de la energía se pierde en auxiliares: refrigeración y transformación."], ["RAEE", "Residuos de Aparatos Eléctricos y Electrónicos. RD 110/2015."], ["Sustancias tóxicas en RAEE", "Plomo, mercurio y cadmio (metales pesados)."], ["Justificante de trazabilidad", "Lo emite el gestor autorizado de residuos al recibir los RAEE."], ["Alcance 1", "Emisiones directas de fuentes controladas: generadores diésel del CPD."], ["Alcance 2", "Emisiones indirectas de la electricidad adquirida."], ["Alcance 3", "Resto de la cadena de valor: fabricación, transporte y fin de vida del hardware."], ["Fases de auditoría de CPD", "1 Inventario, 2 Métricas, 3 Mejora, 4 Residuos."], ["GHG Protocol", "Estándar que define los alcances de emisión."], ["The Green Grid", "Desarrolló el PUE."]], "q": [["¿Cómo se calcula el PUE?", ["Energía IT / Energía total", "Energía total del CPD / Energía del equipamiento IT", "Energía de refrigeración / Energía IT", "Emisiones / Energía"], 1, "El inverso (IT/total) daría un valor menor que 1; el PUE es siempre ≥ 1."], ["¿Cuál es el valor ideal teórico del PUE?", ["0", "0,5", "1,0", "2,0"], 2, "Toda la energía llega al equipamiento IT."], ["Un CPD con PUE de 2,2 indica que…", ["Es muy eficiente", "Gran parte de la energía se pierde en refrigeración y transformación", "Solo usa energía renovable", "No tiene RAEE"], 1, "Un PUE alto implica mucho consumo auxiliar."], ["Un CPD consume 1500 kWh en total y 1000 kWh en equipamiento IT. ¿Su PUE?", ["0,67", "1,5", "2,5", "1000"], 1, "1500 / 1000 = 1,5."], ["¿Qué entidad desarrolló el PUE?", ["La ONU", "La Comisión Europea", "The Green Grid", "El GHG Protocol"], 2, "El GHG Protocol define los alcances de emisión."], ["¿Qué real decreto regula los RAEE en España?", ["RD 110/2015", "RD 311/2022", "RD 1720/2007", "RD 66399"], 0, "RD 110/2015. DIN 66399 es la norma de destrucción de soportes."], ["¿Qué documento debe emitir el gestor autorizado de RAEE?", ["Certificado de PUE", "Justificante de trazabilidad", "Informe ESRS", "Memoria CSRD"], 1, "Es obligatorio entregarlos a un gestor que lo emita."], ["Los generadores diésel de emergencia de un CPD son emisiones de…", ["Alcance 1", "Alcance 2", "Alcance 3", "Ninguno"], 0, "Fuentes directas controladas por la empresa."], ["La electricidad comprada y consumida por los sistemas informáticos corresponde al…", ["Alcance 1", "Alcance 2", "Alcance 3", "Alcance 0"], 1, "Emisiones indirectas por energía."], ["La fabricación y transporte del hardware adquirido se encuadran en el…", ["Alcance 1", "Alcance 2", "Alcance 3", "Ninguno"], 2, "Cadena de valor: alcance 3."], ["Verdadero o falso: los RAEE informáticos pueden depositarse en vertederos ordinarios si se trituran.", ["Verdadero", "Falso"], 1, "Contienen plomo, mercurio y cadmio; solo vía gestor autorizado."], ["Ordena las fases de una auditoría de CPD", ["Inventario", "Métricas", "Mejora", "Residuos"], "o", "Inventario → Métricas (PUE real) → Mejora (virtualización) → Residuos (RAEE)."]], "s": ["PUE = total / IT; ideal 1,0; > 2,0 es ineficiente.", "RAEE: RD 110/2015; plomo, mercurio, cadmio; gestor autorizado + trazabilidad.", "Alcance 1 directas (diésel), 2 electricidad, 3 cadena de valor.", "Auditoría: Inventario → Métricas → Mejora → Residuos."]}];
const BR={"doc": "<blockquote>\n<p><strong>Módulo:</strong> Sostenibilidad aplicada al sistema\nproductivo</p>\n<p><strong>Ciclo Formativo:</strong> 2º de Administración de Sistemas\nInformáticos en Red (ASIR)</p>\n<p><strong>Resultado de Aprendizaje:</strong> RA1 - Aspectos\nambientales, sociales y de gobernanza (ASG) y marcos de\nsostenibilidad</p>\n</blockquote>\n<h1\nid=\"apuntes-desarrollo-sostenible-criterios-asg-y-marcos-internacionales\">Apuntes:\nDesarrollo Sostenible, Criterios ASG y Marcos Internacionales</h1>\n<h2 id=\"concepto-y-evolución-de-la-sostenibilidad\">1. Concepto y\nEvolución de la Sostenibilidad</h2>\n<p>El concepto moderno de sostenibilidad se formalizó en 1987 a través\ndel informe <em>Nuestro Futuro Común</em> (conocido como el\n<strong>Informe Brundtland</strong>), elaborado por la Comisión Mundial\nsobre el Medio Ambiente y el Desarrollo de la ONU.</p>\n<p>Se define formalmente el <strong>desarrollo sostenible</strong>\ncomo:</p>\n<p><em>«Aquel que satisface las necesidades del presente sin comprometer\nla capacidad de las generaciones futuras para satisfacer sus propias\nnecesidades.»</em></p>\n<p>En el tejido productivo y empresarial actual, este paradigma supera\nla óptica estrictamente económica mediante el modelo del <strong>Triple\nResultado</strong> (<em>Triple Bottom Line: People, Planet,\nProfit</em>), que defiende que la viabilidad a largo plazo de cualquier\norganización depende de su equilibrio en tres dimensiones:</p>\n<ul>\n<li><p><strong>Económica:</strong> Rentabilidad y generación de valor\nsostenible.</p></li>\n<li><p><strong>Social:</strong> Impacto en trabajadores, comunidad y\nsociedad.</p></li>\n<li><p><strong>Ambiental:</strong> Conservación de recursos, gestión de\nresiduos y mitigación del cambio climático.</p></li>\n</ul>\n<h2 id=\"los-criterios-asg-esg-aplicados-a-sistemas-informáticos\">2. Los\nCriterios ASG (ESG) aplicados a Sistemas Informáticos</h2>\n<p>Los factores <strong>ASG</strong> (Ambiental, Social y Gobernanza; en\ninglés <em>ESG - Environmental, Social, and Governance</em>) constituyen\nlas tres dimensiones no financieras fundamentales para evaluar el\ndesempeño, la responsabilidad y el riesgo operativo de una\ninfraestructura corporativa.</p>\n<div class=\"sc\"><table>\n<colgroup>\n<col style=\"width: 20%\" />\n<col style=\"width: 35%\" />\n<col style=\"width: 45%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Pilar</th>\n<th>Definición General</th>\n<th>Aplicación Técnica Directa en ASIR</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><p><strong>A</strong></p>\n<p><strong>(Ambiental)</strong></p></td>\n<td>Impacto directo e indirecto de las actividades operativas de la\nentidad sobre el medio ambiente, los ecosistemas y la biosfera.</td>\n<td><ul>\n<li><p><strong>Eficiencia energética:</strong> Monitorización del ratio\nPUE en salas de servidores y centros de procesamiento de datos\n(CPD).</p></li>\n<li><p><strong>Virtualización y consolidación:</strong> Reducción de\nmáquinas físicas para minimizar el consumo de vatios y\nrefrigeración.</p></li>\n<li><p><strong>Gestión de RAEE:</strong> Tratamiento certificado de\nhardware obsoleto (normativa RD 110/2015).</p></li>\n<li><p><strong>Políticas de energía:</strong> Automatización de apagado\ne hibernación en equipos periféricos y laboratorios.</p></li>\n</ul></td>\n</tr>\n<tr class=\"even\">\n<td><p><strong>S</strong></p>\n<p><strong>(Social)</strong></p></td>\n<td>Relación e impacto de la organización en las personas: empleados,\nclientes, colaboradores y la sociedad en general.</td>\n<td><ul>\n<li><p><strong>Salud y desconexión digital:</strong> Regulación de\nguardias de soporte técnico y respeto a los turnos de descanso.</p></li>\n<li><p><strong>Ergonomía:</strong> Disposición de puestos técnicos,\niluminación y pantallas antirreflejo en salas de operaciones.</p></li>\n<li><p><strong>Accesibilidad:</strong> Cumplimiento de estándares de\nusabilidad en portales internos y servicios de red\ncorporativos.</p></li>\n<li><p><strong>Protección de usuarios:</strong> Preservación de la\nprivacidad e integridad de los datos de empleados y clientes.</p></li>\n</ul></td>\n</tr>\n<tr class=\"odd\">\n<td><p><strong>G</strong></p>\n<p><strong>(Gobernanza)</strong></p></td>\n<td>Estructura de gestión, control interno, ética empresarial, legalidad\ny toma de decisiones corporativas.</td>\n<td><ul>\n<li><p><strong>Seguridad de la información:</strong> Cumplimiento del\nRGPD, directiva NIS2 y el Esquema Nacional de Seguridad (ENS).</p></li>\n<li><p><strong>Continuidad de negocio:</strong> Mantenimiento de planes\nde contingencia, recuperación ante desastres (DRP) y copias de seguridad\nauditadas.</p></li>\n<li><p><strong>Destrucción de soportes:</strong> Borrado seguro y\ntrazabilidad en la baja de soportes magnéticos y de estado sólido (norma\nDIN 66399).</p></li>\n<li><p><strong>Auditoría y control:</strong> Gestión rigurosa de accesos\nmínimos necesarios y custodia de registros (logs).</p></li>\n</ul></td>\n</tr>\n</tbody>\n</table></div>\n<h2 id=\"marcos-internacionales-de-referencia\">3. Marcos Internacionales\nde Referencia</h2>\n<h3\nid=\"a-agenda-2030-y-los-17-objetivos-de-desarrollo-sostenible-ods\">A)\nAgenda 2030 y los 17 Objetivos de Desarrollo Sostenible (ODS)</h3>\n<p>Aprobada por la Asamblea General de la ONU en septiembre de 2015,\nestablece 17 metas universales orientadas a erradicar la pobreza,\nproteger el planeta y asegurar la prosperidad global. En el ámbito\ntécnico de la administración de sistemas y redes destacan cuatro ODS\nestratégicos:</p>\n<ul>\n<li><p><strong>ODS 7 (Energía asequible y no contaminante):</strong>\nEmpleo preferente de centros de datos que funcionen mediante acuerdos de\ncompra de energía renovable (PPA) y optimización de cargas de trabajo\nsegún horarios de menor coste energético.</p></li>\n<li><p><strong>ODS 9 (Industria, innovación e infraestructura):</strong>\nDiseño de arquitecturas de red resilientes y con alta tolerancia a\nfallos, habilitando el trabajo remoto seguro y eficiente para reducir\ndesplazamientos.</p></li>\n<li><p><strong>ODS 12 (Producción y consumo responsables):</strong>\nFomento de la economía circular informática: reutilización de\ncomponentes, mantenimiento preventivo para extender el ciclo de vida de\nlos equipos y donación o despiece regulado de hardware.</p></li>\n<li><p><strong>ODS 13 (Acción por el clima):</strong> Contabilidad y\nreducción continuada de las emisiones de gases de efecto invernadero\nproducidas por la infraestructura tecnológica.</p></li>\n</ul>\n<h3 id=\"b-marco-regulatorio-europeo\">B) Marco Regulatorio Europeo</h3>\n<ul>\n<li><p><strong>Pacto Verde Europeo (European Green Deal):</strong> Hoja\nde ruta para alcanzar la neutralidad climática en la Unión Europea en el\naño 2050, con directivas concretas de diseño ecológico para servidores y\nalmacenamiento.</p></li>\n<li><p><strong>Directiva CSRD (Corporate Sustainability Reporting\nDirective):</strong> Normativa europea que obliga a medianas y grandes\ncorporaciones a auditar y reportar públicamente sus impactos ambientales\ny sociales. Esto traslada al administrador de sistemas la\nresponsabilidad de medir y certificar los consumos energéticos y las\nmétricas de ciberseguridad del área tecnológica.</p></li>\n</ul>\n<h2 id=\"métricas-y-conceptos-técnicos-clave-para-examen\">4. Métricas y\nConceptos Técnicos Clave para Examen</h2>\n<h3 id=\"power-usage-effectiveness-pue\">Power Usage Effectiveness\n(PUE)</h3>\n<p>Métrica estándar internacional desarrollada por <em>The Green\nGrid</em> para evaluar la eficiencia energética de un centro de\ndatos.</p>\n<blockquote>\n<p>PUE = Energía Total consumida por el Centro de Datos / Energía\nconsumida estrictamente por el equipamiento IT</p>\n</blockquote>\n<ul>\n<li><p>El <strong>valor ideal teórico es 1.0</strong> (toda la energía\nsuministrada llega exclusivamente a los servidores, switches y\nalmacenamiento).</p></li>\n<li><p>Un PUE elevado (ej. &gt; 2.0) indica que la mayor parte de la\nenergía se pierde en sistemas auxiliares, fundamentalmente en\nrefrigeración y pérdidas de transformación.</p></li>\n</ul>\n<h3 id=\"residuos-de-aparatos-eléctricos-y-electrónicos-raee\">Residuos de\nAparatos Eléctricos y Electrónicos (RAEE)</h3>\n<p>Regulados en España por el <strong>Real Decreto 110/2015</strong>.\nLos componentes informáticos no pueden eliminarse en vertederos\nordinarios debido a los metales pesados y sustancias tóxicas que\ncontienen (plomo, mercurio, cadmio). Es obligatoria su entrega a un\ngestor de residuos autorizado que emita el correspondiente\n<em>justificante de trazabilidad</em>.</p>\n<h3 id=\"alcances-de-emisión-ghg-protocol\">Alcances de Emisión (GHG\nProtocol)</h3>\n<ul>\n<li><p><strong>Alcance 1 (Emisiones directas):</strong> Emisiones\noriginadas directamente por las fuentes que controla la empresa (ej.\ngeneradores electrógenos diésel de emergencia en el CPD).</p></li>\n<li><p><strong>Alcance 2 (Emisiones indirectas por energía):</strong>\nEmisiones derivadas de la generación de la electricidad adquirida y\nconsumida por los sistemas informáticos.</p></li>\n<li><p><strong>Alcance 3 (Otras emisiones indirectas):</strong> Toda la\ncadena de valor: extracción de minerales y fabricación del hardware\nadquirido, transporte y fin de vida del equipamiento.</p></li>\n</ul>\n", "ppt": "<figure><img alt=\"Diapositiva 1\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAUABQAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/2wBDAQkJCQwLDBgNDRgyIRwhMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjL/wAARCAJYBCsDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQF const $=s=>document.querySelector(s),sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
let S={done:{},known:{},wrong:{},best:{}};

let V='th',TP='all',FP=false,FI=0,FL=false,tm=null;
const tops=()=>T.filter(t=>TP==='all'||t.id===TP);
const VS=[['th','Resumen'],['br','En Bruto'],['fc','Flashcards'],['ts','Test'],['ex','Examen'],['rv','Repaso'],['gl','Glosario'],['ch','Chuleta']];
function prog(){let n=T.length,k=T.filter(t=>S.done[t.id]).length;T.forEach(t=>{n+=t.c.length;t.c.forEach((_,j)=>{if(S.known[t.id+'c'+j]===1)k++})});const p=Math.round(100*k/n);$('#pg').style.width=p+'%';$('#pt').textContent=p+' % completado · '+Object.keys(S.wrong).length+' preguntas por repasar'}
function nav(){$('#nv').innerHTML=VS.map(v=>`<button class="${V===v[0]?'on':''}" onclick="V='${v[0]}';clearInterval(tm);R()">${v[1]}</button>`).join('');$('#tp').innerHTML=[['all','Todos']].concat(T.map(t=>[t.id,t.n])).map(t=>`<button class="${TP===t[0]?'on':''}" onclick="TP='${t[0]}';FI=0;FL=false;clearInterval(tm);R()">${t[1]}</button>`).join('');prog()}

function th(m){tops().forEach(t=>{m.insertAdjacentHTML('beforeend',`<h2>${t.n}</h2>`+t.th.map(s=>`<details><summary>${s[0]}</summary><div>${s[1]}</div></details>`).join('')+`<button onclick="S.done['${t.id}']=!S.done['${t.id}'];save();R()">${S.done[t.id]?'✓ Tema completado (quitar)':'Marcar tema como completado'}</button>`)});pue()}
function pue(){const a=$('#pet');if(!a)return;const p=+a.value/(+$('#pei').value||1);$('#po').textContent=p.toFixed(2);$('#pv').textContent=p<1?'(imposible: el PUE es ≥ 1)':p<=1.2?'· muy eficiente':p<=2?'· mejorable':'· ineficiente (> 2,0)'}
function _x(){const a=$('#cs');if(!a)return;const n=+$('#cn').value||0;$('#co').textContent=a.value.replace(/[a-zñ]/gi,c=>{const A='abcdefghijklmnñopqrstuvwxyz';const i=A.indexOf(c.toLowerCase());return i<0?c:A[(i+n)%A.length]})}
function va(){const w=$('#w');if(!w)return;$('#vo').textContent=Math.ceil(w.value/0.7);$('#vo2').textContent=Math.round($('#am').value*230)}
function cards(){return tops().flatMap(t=>t.c.map((c,j)=>({k:t.id+'c'+j,t:t.n,q:c[0],a:c[1]}))).filter(c=>!FP||S.known[c.k]!==1)}
function fc(m){const L=cards();if(FI>=L.length)FI=0;m.innerHTML=`<label><input type="checkbox" ${FP?'checked':''} onchange="FP=this.checked;FI=0;R()"> Solo pendientes</label>`;if(!L.length){m.innerHTML+='<div class="card">🎉 ¡Todas dominadas!</div>';return}const c=L[FI];m.innerHTML+=`<p class="tag">${FI+1}/${L.length} · ${c.t}</p><div class="card fc ${FL?'back':''}" tabindex="0" role="button" onclick="FL=!FL;R()" onkeydown="if(event.key==' '||event.key=='Enter'){event.preventDefault();FL=!FL;R()}">${FL?c.a:'<b>'+c.q+'</b>'}</div><div class="row"><button onclick="mk('${c.k}',1)">✓ La sabía</button><button onclick="mk('${c.k}',0)">↻ Repasar</button></div><p class="tag">Pulsa la tarjeta (o Enter) para voltearla.</p>`}
function mk(k,v){S.known[k]=v;save();FI++;FL=false;R()}
function qs(x){return tops().flatMap(t=>t.q.map((q,j)=>({k:t.id+j,t:t.n,q}))).filter(i=>!x||i.q[2]!=='o')}
function ts(m){m.innerHTML=`<div class="card"><p>${qs().length} preguntas, con feedback inmediato.</p><button class="on" onclick="quiz(sh(qs()),true)">Empezar test</button></div>`}
function ex(m){m.innerHTML=`<div class="card"><p>Examen tipo test de los temas seleccionados arriba. Sin feedback hasta el final.</p><label>Nº de preguntas: <input type="number" id="en" value="15" min="3" max="40" style="width:80px"></label> <label><input type="checkbox" id="ec" checked> Cronómetro</label><p><button class="on" onclick="quiz(sh(qs(1)).slice(0,+$('#en').value||15),false,$('#ec').checked)">Empezar examen</button></p></div>`}
function quiz(L,fb,clock){const m=$('#m');let i=0,res=[],t0=Date.now();clearInterval(tm);

function rec(it,ok){res.push({it,ok});if(!ok)S.wrong[it.k]=2;else if(S.wrong[it.k]&&!--S.wrong[it.k])delete S.wrong[it.k];save();prog()}
function nxt(){i++;i<L.length?show():end()}
function show(){const it=L[i],q=it.q;if(q[2]==='o')return ord(it);
m.innerHTML=head()+`<div class="card"><b>${q[0]}</b>`+q[1].map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join('')+'<div id="fb"></div></div>';
m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const j=+b.dataset.j,ok=j===q[2];rec(it,ok);if(!fb)return nxt();m.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.j===q[2])x.classList.add('ok')});if(!ok)b.classList.add('ko');$('#fb').innerHTML=`<div class="fb ${ok?'ok':'ko'}"><b>${ok?'¡Correcto!':'Incorrecto.'}</b> ${q[3]}</div><p><button class="on" id="nx">Siguiente →</button></p>`;$('#nx').onclick=nxt;$('#nx').focus()})}
function ord(it){const q=it.q,pool=sh(q[1]),ch=[];function d(){m.innerHTML=head()+`<div class="card"><b>${q[0]}</b><p class="tag">Pulsa los pasos en el orden correcto.</p><ol>${ch.map(x=>`<li>${x}</li>`).join('')}</ol>`+pool.filter(x=>!ch.includes(x)).map(x=>`<button class="opt" data-v="${x}">${x}</button>`).join('')+'<div id="fb"></div></div>';m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ch.push(b.dataset.v);if(ch.length<pool.length)return d();const ok=ch.join('|')===q[1].join('|');rec(it,ok);if(!fb)return nxt();d();m.querySelectorAll('.opt').forEach(x=>x.disabled=true);$('#fb').innerHTML=`<div class="fb ${ok?'ok':'ko'}"><b>${ok?'¡Correcto!':'Orden incorrecto.'}</b> Orden: ${q[1].join(' → ')}. ${q[3]}</div><p><button class="on" id="nx">Siguiente →</button></p>`;$('#nx').onclick=nxt})}d()}
function end(){clearInterval(tm);const ok=res.filter(r=>r.ok).length,by={};res.forEach(r=>{by[r.it.t]=by[r.it.t]||[0,0];by[r.it.t][1]++;if(r.ok)by[r.it.t][0]++});const n=(10*ok/res.length).toFixed(1);
m.innerHTML=`<div class="card"><div class="big">${n} / 10</div><p>${ok} de ${res.length} aciertos${clock?' · '+Math.round((Date.now()-t0)/1000)+' s':''}.</p><table><tr><th>Tema</th><th>Aciertos</th></tr>${Object.entries(by).map(([k,v])=>`<tr><td>${k}</td><td>${v[0]}/${v[1]}</td></tr>`).join('')}</table></div>`+(res.some(r=>!r.ok)?'<h3>Para repasar</h3>'+res.filter(r=>!r.ok).map(r=>`<div class="card"><b>${r.it.q[0]}</b><p>${r.it.q[2]==='o'?r.it.q[1].join(' → '):'✓ '+r.it.q[1][r.it.q[2]]}</p><p class="tag">${r.it.q[3]}</p></div>`).join(''):'<p>🎉 Sin fallos.</p>');}
show()}
function dv(m){m.innerHTML='<p>La mitad del examen es de desarrollo: escribe tu respuesta y contrasta con los puntos clave.</p>';D.filter(d=>TP==='all'||d[0]===TP).forEach((d,i)=>{m.insertAdjacentHTML('beforeend',`<details><summary>${d[1]}</summary><div><textarea rows="5" placeholder="Escribe aquí tu respuesta…"></textarea><p><b>Puntos clave</b> (marca los que has cubierto):</p>${d[2].map(p=>`<label style="display:block"><input type="checkbox" onchange="dc(this)"> ${p}</label>`).join('')}<p class="tag dr"></p></div></details>`)})}
function dc(e){const d=e.closest('div'),c=d.querySelectorAll('input:checked').length,n=d.querySelectorAll('input').length;d.querySelector('.dr').textContent=`Cubiertos ${c}/${n}`+(c<n?' · repasa los que faltan':' · ¡completo!')}
function rv(m){const w=qs().filter(x=>S.wrong[x.k]),pc=T.flatMap(t=>t.c.map((c,j)=>({k:t.id+'c'+j,q:c[0],a:c[1]}))).filter(c=>S.known[c.k]===0);
m.innerHTML=`<h3>Preguntas falladas (${w.length})</h3>`+(w.length?`<button class="on" onclick="quiz(sh(qs().filter(x=>S.wrong[x.k])),true)">Practicar fallos</button>`+w.map(x=>`<div class="card">${x.q[0]}<p class="tag">${x.t}</p></div>`).join(''):'<p>Ninguna. Se eliminan al acertarlas dos veces.</p>')+`<h3>Flashcards por repasar (${pc.length})</h3>`+pc.map(c=>`<details><summary>${c.q}</summary><div>${c.a}</div></details>`).join('')}
function gl(m){m.innerHTML='<input type="search" id="gq" placeholder="Buscar término…" aria-label="Buscar en el glosario"><div id="gr"></div>';const f=()=>{const q=$('#gq').value.toLowerCase();$('#gr').innerHTML=T.flatMap(t=>t.c.map(c=>[t.n,c[0],c[1]])).filter(c=>(c[1]+c[2]).toLowerCase().includes(q)).map(c=>`<div class="card"><b>${c[1]}</b> <span class="tag">${c[0]}</span><br>${c[2]}</div>`).join('')};$('#gq').oninput=f;f()}
function br(m){m.innerHTML='<p class="tag">Documento y presentación originales, sin resumir.</p><h2>Apuntes (Word)</h2><div class="md">'+BR.doc+'</div><h2>Presentación (PowerPoint)</h2><div class="slides">'+BR.ppt+'</div>'}
function ch(m){tops().forEach(t=>m.insertAdjacentHTML('beforeend',`<div class="card"><h3>${t.n}</h3><ul>${t.s.map(x=>`<li>${x}</li>`).join('')}</ul></div>`))}
$('#th').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'};
$('#rs').onclick=()=>{if(confirm('¿Borrar todo el progreso?')){S={done:{},known:{},wrong:{},best:{}};save();R()}};
R();
</script></body></html>
