<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apuntes ASIR · Pablo Conde</title>
<style>
:root{
  --bg:#faf8f7;--bar:#ffffff;--sf:#ffffff;--tx:#161616;--mu:#65656a;--bd:#dcdcd8;
  --mono:ui-monospace,"JetBrains Mono","SF Mono","Cascadia Code",Menlo,Consolas,monospace;
  color-scheme:light;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)
}
:root[data-theme="dark"]{--bg:#111111;--bar:#171717;--sf:#171717;--tx:#ececec;--mu:#9a9a9f;--bd:#2c2c2c;color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 var(--mono);-webkit-font-smoothing:antialiased}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;background:var(--bar);border-bottom:1px solid var(--bd);font-size:.85rem}
.bar a{color:var(--mu);text-decoration:none}.bar a:hover{color:var(--tx)}
.crumb{display:flex;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.crumb b{color:var(--tx);font-weight:600}
#th{display:grid;place-items:center;width:32px;height:32px;background:transparent;color:var(--mu);border:1px solid var(--bd);border-radius:10px;cursor:pointer;transition:color .15s,border-color .15s}
#th:hover{color:var(--tx);border-color:var(--mu)}#th svg{width:16px;height:16px}
main{max-width:720px;margin:0 auto;padding:clamp(32px,9vh,88px) 20px 64px}
header{text-align:center;margin-bottom:40px}
h1{margin:0;font-size:clamp(1.7rem,6.4vw,2.6rem);line-height:1.15;font-weight:700;letter-spacing:.14em}
.sub{margin:10px 0 0;color:var(--mu);font-size:1rem;letter-spacing:.04em}
.view{animation:in .22s ease-out}.view[hidden]{display:none}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{--k:var(--c);display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px 12px 18px;background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:18px;text-decoration:none;text-align:center;transition:border-color .15s,transform .15s,background .15s}
:root[data-theme="dark"] .tile{--k:var(--cd)}
.chip{display:grid;place-items:center;width:60px;height:60px;border-radius:18px;background:color-mix(in srgb,var(--k) 16%,transparent);color:var(--k);transition:background .15s,color .15s,transform .15s}
.chip svg{width:28px;height:28px}
.chip .num{font-size:1.7rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.name{font-size:.92rem;font-weight:600;line-height:1.3}
.hint{display:block;margin-top:2px;font-size:.75rem;font-weight:400;color:var(--mu)}
.tile:hover{border-color:var(--k);transform:translateY(-2px)}
.tile:hover .chip{background:var(--k);color:var(--on,var(--sf))}
.tile:active{transform:translateY(0)}
.tile.off{background:transparent;border-style:dashed;pointer-events:none;opacity:.6}
.tile.off .chip{background:transparent;color:var(--mu);border:1px dashed var(--bd)}
a:focus-visible,button:focus-visible{outline:2px solid var(--tx);outline-offset:3px}
h2{margin:0;text-align:center;font-size:clamp(1.2rem,4.4vw,1.6rem);line-height:1.3;font-weight:700}
.sline{display:flex;justify-content:center;margin:14px 0 32px}
.sline i{display:block;width:44px;height:4px;border-radius:2px;background:var(--c)}
:root[data-theme="dark"] .sline i{background:var(--cd)}
.back{display:block;width:max-content;margin:32px auto 0;color:var(--mu);text-decoration:none;font-size:.88rem}
.back:hover{color:var(--tx);text-decoration:underline;text-underline-offset:3px}
@media (prefers-reduced-motion:reduce){.view{animation:none}.tile,.chip{transition:none}}
</style>
</head>
<body>
<div class="bar">
  <div class="crumb" id="crumb"></div>
  <button id="th" type="button" aria-label="Cambiar entre modo claro y oscuro"></button>
</div>
<main>
  <section class="view" id="home">
    <header>
      <h1>APUNTES ASIR</h1>
      <p class="sub">Pablo Conde</p>
    </header>
    <nav class="grid" id="subjects" aria-label="Asignaturas"></nav>
  </section>
  <section class="view" id="subject" hidden>
    <h2 id="sname"></h2>
    <div class="sline"><i></i></div>
    <nav class="grid" id="exams" aria-label="Exámenes"></nav>
    <a class="back" href="#">← Volver a las asignaturas</a>
  </section>
</main>
<script>
/* ===== CONFIGURACIÓN =====
   c = color en claro, cd = color en oscuro, g = glifo SVG, short = etiqueta corta.
   href:null = "Próximamente". Para añadir apuntes pon la ruta del HTML (sin espacios ni tildes). */
const G={
  shield:'<path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/>',
  net:'<circle cx="12" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/><path d="M12 7v5M12 12l-6 5M12 12l6 5"/>',
  code:'<path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/>',
  term:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 10l3 2-3 2M13 15h4"/>',
  db:'<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/>',
  leaf:'<path d="M5 19c0-8 5-14 14-14 0 9-6 14-14 14z"/><path d="M5 19l8-8"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>'
};
const ex3=()=>[{n:'Examen 1',href:null},{n:'Examen 2',href:null},{n:'Examen 3',href:null}];
const SUBJECTS=[
  {id:'seguridad',n:'Seguridad',short:'Seguridad',g:'shield',c:'#b3261e',cd:'#ff7066',exams:[
    {n:'Examen 1',href:'seguridad/examen-1.html'},{n:'Examen 2',href:null},{n:'Examen 3',href:null}]},
  {id:'redes',n:'Redes',short:'Redes',g:'net',c:'#d9640a',cd:'#ff9a4d',exams:ex3()},
  {id:'python',n:'Python',short:'Python',g:'code',c:'#1e5b34',cd:'#5fd085',exams:ex3()},
  {id:'aso',n:'Administración de Sistemas Operativos',short:'ASO',g:'term',c:'#1a5fb4',cd:'#6aa6ff',exams:ex3()},
    {n:'Examen 1',href:'aso/examen-1.html'},
  {id:'bbdd',n:'Bases de Datos',short:'Bases de Datos',g:'db',c:'#d4a200',cd:'#f2c200',exams:[
    {n:'Examen 1',href:'bbdd/examen-1.html'},{n:'Examen 2',href:null},{n:'Examen 3',href:null}]},
  {id:'web',n:'Aplicaciones Web',short:'Aplicaciones Web',g:'globe',c:'#2f9a4c',cd:'#9be28f',on:'#161616',exams:[
    {n:'Examen 1',href:'web/examen-1.html'},{n:'Examen 2',href:null},{n:'Examen 3',href:null}]},
  {id:'sostenibilidad',n:'Sostenibilidad',short:'Sostenibilidad',g:'leaf',c:'#5cb860',cd:'#c8f2a8',on:'#161616',exams:[
    {n:'Examen 1',href:'sostenibilidad/examen-1.html'},{n:'Examen 2',href:null},{n:'Examen 3',href:null}]}
];
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const svg=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const sty=s=>`style="--c:${s.c};--cd:${s.cd}${s.on?`;--on:${s.on}`:''}"`;
$('#subjects').innerHTML=SUBJECTS.map(s=>`<a class="tile" ${sty(s)} href="#${s.id}" aria-label="${esc(s.n)}"><span class="chip">${svg(G[s.g])}</span><span class="name">${esc(s.short)}</span></a>`).join('');
function route(){
  const s=SUBJECTS.find(x=>x.id===location.hash.slice(1));
  $('#home').hidden=!!s;$('#subject').hidden=!s;
  $('#crumb').innerHTML=s?`<a href="#">~/apuntes</a><span>/</span><b>${esc(s.id)}</b>`:'<b>~/apuntes</b>';
  if(!s){document.title='Apuntes ASIR · Pablo Conde';return}
  document.title=s.n+' · Apuntes ASIR';
  const sub=$('#subject');sub.style.setProperty('--c',s.c);sub.style.setProperty('--cd',s.cd);
  $('#sname').textContent=s.n;
  $('#exams').innerHTML=s.exams.filter(e => e.href).map((e,i)=>{
    const num=`<span class="chip"><span class="num">${String(i+1).padStart(2,'0')}</span></span>`;
    return `<a class="tile" ${sty(s)} href="${e.href}">${num}<span class="name">${esc(e.n)}</span></a>`;
  }).join('');
  window.scrollTo(0,0);
}
addEventListener('hashchange',route);
const root=document.documentElement,tb=$('#th');
const SUN='<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>',MOON='<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>';
function setTheme(t,store){root.dataset.theme=t;tb.innerHTML=svg(t==='dark'?SUN:MOON);if(store){try{localStorage.setItem('asir_theme',t)}catch(e){}}}
let saved=null;try{saved=localStorage.getItem('asir_theme')}catch(e){}
setTheme(saved==='dark'?'dark':'light',false);
tb.onclick=()=>setTheme(root.dataset.theme==='dark'?'light':'dark',true);
route();
</script>
</body>
</html>
