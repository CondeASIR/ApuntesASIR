<script>
const $=s=>document.querySelector(s),sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;'),P=x=>'<pre>'+esc(x)+'</pre>';
const TH=[
['¿Qué es un array?',`<p>Un <mark>array</mark> es una lista de valores, de cualquier tipo, que se identifican individualmente por la <b>posición</b> que ocupan. Las posiciones se numeran <mark>a partir de cero</mark>.</p>`],
['Crear un array',`<p>En PowerShell <b>no hay que definir la variable de forma especial</b>: basta con asignarle un grupo de valores. Hay varias formas válidas: formato explícito, sintaxis reducida y rango de valores. Se puede <b>restringir el tipo</b> escribiéndolo delante del nombre de la variable (vale también con la sintaxis reducida) y crear un <b>array vacío</b> al que añadir elementos después.</p>
<div class="extra">Las líneas de código de la página son imágenes que no he podido leer. Estos ejemplos son la sintaxis estándar de PowerShell, no copia literal.</div>${P(`$a = @(10, 20, 30, 40)   # explícito
$a = 10, 20, 30, 40      # reducido
$a = 1..10               # rango
[int[]]$n = @(1, 2, 3)   # tipado
[int[]]$n = 1, 2, 3      # tipado, reducido
$v = @()                 # vacío`)}`],
['Mostrar y usar elementos',`<ul><li><b>Todo el array</b>: se escribe el nombre de la variable, como con una variable simple.</li><li><b>Un elemento</b>: nombre seguido de la posición entre corchetes. Se usa en expresiones como una variable simple.</li></ul>${P(`$a            # muestra todo
$a[0]         # primer elemento
$a[0]++       # incrementar en uno
$a[0] = $a[0] + 1`)}<div class="extra">Los dos ejemplos de incremento de la página están en imagen; estas son dos formas equivalentes habituales.</div>`],
['Arrays como objetos',`<p>PowerShell trata todas las variables como <b>objetos</b>, lo que da herramientas para crear, manipular, buscar y ordenar arrays. Por ejemplo, el número de elementos se obtiene con una propiedad del objeto (en el ejemplo de la página, un array de 4 elementos devuelve 4).</p>${P(`$a.Count    # o $a.Length`)}<div class="extra">La propiedad exacta de la imagen no se ve; <code>Count</code> y <code>Length</code> funcionan en PowerShell.</div>`],
['Recorrer con for',`<p>Se usa una variable índice (<code>$i</code>) que empieza en <b>0</b> y sube de uno en uno hasta la <b>última posición</b>. Dentro del bloque, <code>$i</code> identifica el elemento. Para recorrerlo en <b>orden inverso</b> basta con cambiar los valores del <code>for</code>. Vale cualquier estructura repetitiva equivalente.</p>${P(`for ($i = 0; $i -lt $a.Count; $i++) { $a[$i] = $a[$i] * 2 }   # multiplicar por 2
for ($i = $a.Count - 1; $i -ge 0; $i--) { Write-Host $a[$i] }  # inverso`)}<div class="extra">Ejemplo ilustrativo; el código de la página es una imagen.</div>`],
['Recorrer con foreach',`<ul><li>Diseñado para <b>colecciones</b>; no necesita variable índice.</li><li><mark>foreach copia</mark> el elemento en la variable (<code>$elem</code>): cambiarla <b>no modifica</b> el array original. Con <code>for</code> sí accedes al elemento real.</li><li>Siempre recorre <b>todo</b> el array y en su orden. Para recorrer solo algunas posiciones o en otro orden, es mejor otra estructura.</li><li>Ejemplo de la página: array con nombres de productos en posiciones impares y su precio en las pares; para aplicar un <b>10 % de descuento</b> a los precios conviene <code>for</code>, no <code>foreach</code>.</li></ul>
${P(`foreach ($elem in $a) { $elem = $elem * 2 }   # $a no cambia`)}
<p><b>Write-Host</b>: <code>-NoNewline</code> evita el salto de línea tras ejecutarlo; el carácter especial <code>\`n</code> lo produce.</p><div class="extra">La página cuenta las posiciones "impares/pares" empezando en 1, pero los índices reales empiezan en 0 (nombres en 0, 2, 4… y precios en 1, 3, 5…). Aclarar con el profesor.</div>`],
['Añadir y quitar valores',`<ul><li><b>Añadir</b>: operador <code>+</code> (<code>$var += 4</code>). Sirve para ir ampliando un array vacío con lo que escribe el usuario, para <b>unir dos arrays</b> y para añadir una lista a otra.</li><li>La salida de un cmdlet puede ser un array: <code>Get-ChildItem</code> devuelve un <b>array de objetos</b>, uno por archivo, y su propiedad <code>name</code> da el nombre.</li><li><b>Quitar</b>: <mark>no hay un procedimiento sencillo</mark>. Lo mejor es crear un <b>array nuevo</b> con solo los valores que interesa mantener (ej.: archivos cuyo nombre empieza por «D»).</li></ul>${P(`$var = @(1, 2, 3)
$var += 4                       # 1, 2, 3, 4
$todos = $lista1 + $lista2
$archivos = Get-ChildItem
foreach ($f in $archivos) { Write-Host $f.name }
$nuevo = @()
foreach ($f in $archivos) { if ($f.name.StartsWith("D")) { $nuevo += $f.name } }`)}<div class="extra">Ejemplo ilustrativo. La página muestra además una versión simplificada (imagen) que invita a analizar; una opción habitual es <code>Where-Object</code>.</div>`]];
const AC=[
['Crea un script que pida la lista de nombres de una clase. La lista acaba cuando se deja un nombre vacío. Al terminar, muestra los nombres en <b>orden inverso</b>.<br><span class="tag">Pista: para añadir un elemento se suma: <code>$var += 4</code>.</span>',`[string[]]$nombres = @()
[string]$nombre = Read-Host "Escribe un nombre"

while ($nombre -ne "") {
    $nombres = $nombres + $nombre
    $nombre = Read-Host "Escribe un nombre"
}

$i = $nombres.Length - 1

while ($i -ge 0) {
    Write-Host $nombres[$i]
    $i--
}`],
['Pide la lista de nombres de una clase (termina con un nombre vacío). Calcula la <b>longitud media</b> de los nombres (total de caracteres / nº de nombres) y muestra los nombres con <b>más caracteres que la media</b>.<br><span class="tag">Pista: <code>$texto.Length</code> da el nº de caracteres.</span>',`[string[]]$nombres = @()
[int]$elementos = 0
[int]$longitud = 0
[float]$media
[string]$nombre = Read-Host "Escribe un nombre"

while ($nombre -ne "") {
    $nombres = $nombres + $nombre
    $elementos++
    $longitud += $nombre.Length

    $nombre = Read-Host "Escribe un nombre"
}

$media = $longitud / $elementos

for ($i = 0; $i -lt $nombres.Length; $i++) {
    if ($nombres[$i].Length -gt $media) {
        Write-Host $nombres[$i]
    }
}`],
['Escribe un script con dos arrays: los dígitos romanos y sus valores. El usuario escribe un dígito y el script responde con su valor; avisa si no existe.<br><code>$dígitos = @("I","V","X","L","C","D","M")</code><br><code>$valor = @(1,5,10,50,100,500,1000)</code>',`[string[]]$dígitos = @("I", "V", "X", "L", "C", "D", "M")
[int[]]$valores = @(1, 5, 10, 50, 100, 500, 1000)

[string]$dígitoUsuario = Read-Host "Introduce un dígito romano"

[int]$valorEncontrado = -1

for ($i = 0; $i -lt $dígitos.Length; $i++) {
    if ($dígitos[$i] -eq $dígitoUsuario.ToUpper()) {
        $valorEncontrado = $valores[$i]
        break
    }
}

# Mostrar el resultado
if ($valorEncontrado -eq -1) {
    Write-Host "El dígito romano no es válido."
} else {
    Write-Host "El valor del dígito romano \`"$dígitoUsuario\`" es: $valorEncontrado"
}`],
['Partiendo de la idea anterior, escribe un script que pida un <b>valor</b> y responda con el dígito romano correspondiente. Avisa si no se encuentra.',`[string[]]$dígitos = @("I", "V", "X", "L", "C", "D", "M")
[int[]]$valores = @(1, 5, 10, 50, 100, 500, 1000)

[int]$valorUsuario = Read-Host "Introduce un valor en decimal"

[string]$dígitoEncontrado = ""

for ($i = 0; $i -lt $valores.Length; $i++) {
    if ($valores[$i] -eq $valorUsuario) {
        $dígitoEncontrado = $dígitos[$i]
        break
    }
}

# Mostrar el resultado
if ($dígitoEncontrado -eq "") {
    Write-Host "El valor $valorUsuario no no tiene equivalencia con un dígito romano."
} else {
    Write-Host "El dígito romano del valor $valorUsuario es: $dígitoEncontrado"
}`]];
const C=[['Array','Lista de valores de cualquier tipo, identificados por su posición, que empieza en 0.'],['Crear un array en PowerShell','Basta asignar un grupo de valores; no hay declaración especial. Formatos: explícito, reducido y rango.'],['Array tipado','Se escribe el tipo delante del nombre de la variable para restringir lo que puede guardar (ej. enteros).'],['Acceder a un elemento','Nombre de la variable + posición entre corchetes.'],['Array como objeto','PowerShell trata las variables como objetos; ofrecen propiedades y métodos (p. ej. contar elementos).'],['for con índice','Índice desde 0 hasta la última posición; accede al elemento real. Permite recorrido parcial o inverso.'],['foreach','Recorre toda la colección sin índice; trabaja con una copia, no modifica el original.'],['-NoNewline','Argumento de Write-Host que evita el salto de línea.'],['Carácter de nueva línea','Carácter especial de PowerShell (acento grave + n) que produce un salto de línea.'],['Añadir a un array','Operador +. Sirve también para unir dos listas.'],['Quitar de un array','Sin procedimiento sencillo: crear un array nuevo con los valores que se mantienen.'],['Get-ChildItem','Devuelve un array de objetos, uno por archivo; la propiedad name da el nombre.']];
const Q=[['¿Qué posición ocupa el primer elemento de un array?',['0','1','-1','Depende del tipo de dato'],0,'Las posiciones se numeran a partir de cero.'],
['Verdadero o falso: en PowerShell hay que declarar la variable de forma especial para que sea un array.',['Verdadero','Falso'],1,'Basta con asignarle un grupo de valores.'],
['¿Qué efecto tiene escribir el tipo delante del nombre de la variable (p. ej. enteros)?',['Convierte el array en vacío','Restringe el tipo de dato que se puede almacenar','Lo ordena automáticamente','Lo hace de solo lectura'],1,'Por defecto cada elemento puede ser de un tipo diferente; el tipo explícito lo restringe.'],
['Dentro de un foreach modificas la variable $elem. ¿Qué ocurre con el array original?',['Se modifica también','No cambia, porque foreach trabaja con una copia','Da un error','Se vacía'],1,'Con for sí accedes a cada elemento real.'],
['Necesitas aplicar un descuento solo a los precios, que ocupan posiciones alternas. ¿Qué estructura conviene?',['foreach, porque es más corta','for con índice, que permite elegir posiciones','Ninguna, no se puede','do while sin variable'],1,'foreach recorre siempre todo el array en su orden.'],
['¿Cómo se añade un elemento a un array?',['Con el operador + (suma)','Con el método Delete','Reasignando solo la posición nueva','No se puede'],0,'$var += 4 añade un elemento; + también une dos arrays.'],
['¿Cómo se elimina un elemento de un array según los apuntes?',['Con un cmdlet Remove sencillo','Creando un array nuevo solo con los valores que interesa mantener','Poniendo su posición a $null','Con foreach'],1,'No hay procedimiento sencillo.'],
['Get-ChildItem devuelve…',['Una cadena de texto','Un array de objetos, uno por archivo','Un entero','Un array de cadenas con las rutas'],1,'Cada objeto tiene propiedades como name.'],
['¿Para qué sirve -NoNewline en Write-Host?',['Para escribir en rojo','Para evitar el cambio de línea tras escribir','Para no mostrar nada','Para borrar la pantalla'],1,'Permite que varios valores salgan en la misma línea.'],
['Verdadero o falso: para conocer el nº de caracteres de una variable de texto se usa su propiedad Length.',['Verdadero','Falso'],0,'Con $texto = "Hola", $texto.Length vale 4.'],
['Ordena los pasos para mostrar nombres en orden inverso',['Crear un array vacío','Pedir un nombre y sumarlo al array si no está vacío','Repetir hasta que el nombre sea vacío','Recorrer el array desde la última posición hasta la 0'],'o','Es el esquema de la primera actividad.']];
const S0=()=>({done:false,known:{},wrong:{}});let S=S0();
try{Object.assign(S,JSON.parse(localStorage.getItem('aso_ex1')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('aso_ex1',JSON.stringify(S))}catch(e){}};
let V='th',FP=false,FI=0,FL=false,tm=null;
const VS=[['th','Resumen'],['ac','Actividades'],['fc','Flashcards'],['ts','Test'],['ex','Examen'],['rv','Repaso'],['gl','Glosario'],['ch','Chuleta']];
function prog(){const n=C.length+1,k=(S.done?1:0)+C.filter((_,j)=>S.known['c'+j]===1).length;$('#pg').style.width=Math.round(100*k/n)+'%';$('#pt').textContent=Math.round(100*k/n)+' % completado · '+Object.keys(S.wrong).length+' preguntas por repasar'}
function nav(){$('#nv').innerHTML=VS.map(v=>`<button class="${V===v[0]?'on':''}" onclick="V='${v[0]}';clearInterval(tm);R()">${v[1]}</button>`).join('');prog()}
function R(){nav();const m=$('#m');m.innerHTML='';({th,ac,fc,ts,ex,rv,gl,ch})[V](m);window.scrollTo(0,0)}
function th(m){m.innerHTML='<h2>Arrays en PowerShell</h2>'+TH.map(s=>`<details><summary>${s[0]}</summary><div>${s[1]}</div></details>`).join('')+`<p><button onclick="S.done=!S.done;save();R()">${S.done?'✓ Tema completado (quitar)':'Marcar tema como completado'}</button></p><p class="tag">Fuente: somebooks.es, «Capítulo 7: Variables que guardan múltiples valores» (Arrays).</p>`}
function ac(m){m.innerHTML='<h2>Actividades resueltas</h2><p class="tag">Intenta resolverlas antes de abrir la solución.</p><p class="tag">Soluciones tal como aparecen en la página de somebooks.es.</p>'+AC.map((a,i)=>`<details><summary>Actividad ${i+1}</summary><div><p>${a[0]}</p><textarea rows="4" placeholder="Escribe tu solución…"></textarea><details><summary>Ver solución</summary><div>${P(a[1])}</div></details></div></details>`).join('')}
function fc(m){const L=C.map((c,j)=>({k:'c'+j,q:c[0],a:c[1]})).filter(c=>!FP||S.known[c.k]!==1);if(FI>=L.length)FI=0;m.innerHTML=`<label><input type="checkbox" ${FP?'checked':''} onchange="FP=this.checked;FI=0;R()"> Solo pendientes</label>`;if(!L.length){m.innerHTML+='<div class="card">🎉 ¡Todas dominadas!</div>';return}const c=L[FI];m.innerHTML+=`<p class="tag">${FI+1}/${L.length}</p><div class="card fc ${FL?'back':''}" tabindex="0" role="button" onclick="FL=!FL;R()" onkeydown="if(event.key==' '||event.key=='Enter'){event.preventDefault();FL=!FL;R()}">${FL?c.a:'<b>'+c.q+'</b>'}</div><div class="row"><button onclick="mk('${c.k}',1)">✓ La sabía</button><button onclick="mk('${c.k}',0)">↻ Repasar</button></div><p class="tag">Pulsa la tarjeta (o Enter) para voltearla.</p>`}
function mk(k,v){S.known[k]=v;save();FI++;FL=false;R()}
const qs=()=>Q.map((q,j)=>({k:'q'+j,q}));
function ts(m){m.innerHTML=`<div class="card"><p>${Q.length} preguntas con feedback inmediato.</p><button class="on" onclick="quiz(sh(qs()),true)">Empezar test</button></div>`}
function ex(m){m.innerHTML=`<div class="card"><p>Examen aleatorio sin feedback hasta el final.</p><label>Nº de preguntas: <input type="number" id="en" value="8" min="3" max="${Q.length}" style="width:80px"></label> <label><input type="checkbox" id="ec" checked> Cronómetro</label><p><button class="on" onclick="quiz(sh(qs()).slice(0,+$('#en').value||8),false,$('#ec').checked)">Empezar examen</button></p></div>`}
function quiz(L,fb,clock){const m=$('#m');let i=0,res=[],t0=Date.now();clearInterval(tm);
const head=()=>`<p class="tag">Pregunta ${i+1}/${L.length}${clock?' · ⏱ <span id="tc"></span>':''}</p>`;
if(clock)tm=setInterval(()=>{const e=$('#tc');if(e){const s=Math.floor((Date.now()-t0)/1000);e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}},500);
function rec(it,ok){res.push({it,ok});if(!ok)S.wrong[it.k]=2;else if(S.wrong[it.k]&&!--S.wrong[it.k])delete S.wrong[it.k];save();prog()}
const nxt=()=>{i++;i<L.length?show():end()};
function show(){const it=L[i],q=it.q;if(q[2]==='o')return ord(it);
m.innerHTML=head()+`<div class="card"><b>${q[0]}</b>`+q[1].map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join('')+'<div id="fb"></div></div>';
m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const j=+b.dataset.j,ok=j===q[2];rec(it,ok);if(!fb)return nxt();m.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.j===q[2])x.classList.add('ok')});if(!ok)b.classList.add('ko');$('#fb').innerHTML=`<div class="fb ${ok?'ok':'ko'}"><b>${ok?'¡Correcto!':'Incorrecto.'}</b> ${q[3]}</div><p><button class="on" id="nx">Siguiente →</button></p>`;$('#nx').onclick=nxt;$('#nx').focus()})}
