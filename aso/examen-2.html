<script>
const $=s=>document.querySelector(s),sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;'),P=x=>'<pre>'+esc(x)+'</pre>';
const TH=[
['1. Fundamentos: Bash vs Python',`<ul><li><b>Funciones</b>: en Bash los parámetros se leen con <code>$1, $2…</code> (sin declararlos); en Python se declaran en la cabecera.</li><li><b>Valor devuelto</b>: <code>return</code> en Bash solo da un <mark>código de salida (0-255)</mark>; para devolver datos se usa <code>echo</code> y se captura con <code>$(...)</code>. Python devuelve cualquier objeto.</li><li><b>Ámbito</b>: en Bash las variables son <mark>globales por defecto</mark> (<code>local</code> las limita a la función); en Python son locales por defecto (<code>global</code> para modificar una global).</li><li><b>Casting</b>: Python lo hace explícito (<code>int("5")</code>); Bash trata todo como texto y la aritmética interpreta los números.</li></ul>${P(`suma() { echo $(( $1 + $2 )); }\nr=$(suma 3 4)      # r vale 7\n\ndef suma(a, b):\n    return a + b`)}`],
['2. Bash: variables, redirecciones y filtros',`<ul><li><b>Predefinidas</b>: <code>$0</code> nombre del script, <code>$1..$9</code> parámetros, <code>$#</code> nº de parámetros, <code>$@</code>/<code>$*</code> todos, <code>$?</code> código de salida del último comando, <code>$$</code> PID del shell, <code>$!</code> PID del último proceso en segundo plano.</li><li><b>Entorno</b>: <code>HOME, USER, PWD, PATH</code>; <code>export VAR</code> la hereda a los procesos hijos.</li><li><b>Redirecciones</b>: <code>&gt;</code> sobrescribe, <code>&gt;&gt;</code> añade, <code>&lt;</code> entrada, <code>2&gt;</code> errores, <code>2&gt;&amp;1</code> errores a la misma salida. <b>Tubería</b> <code>|</code>: la salida de uno es la entrada del siguiente.</li><li><b>Comodines</b>: <code>*</code> cualquier cadena, <code>?</code> un carácter, <code>[abc]</code> uno del conjunto.</li><li><b>Filtros</b>: <code>find</code> busca ficheros; <code>sort</code> ordena (<code>-n</code> numérico, <code>-r</code> inverso); <code>grep</code> filtra líneas (<code>-i, -v, -n, -c</code>); <code>cut</code> extrae campos.</li></ul>${P(`find /etc -name "*.conf" 2>/dev/null\ncut -d: -f1 /etc/passwd | sort\ngrep -i error log.txt | wc -l`)}`],
['3. Bash: scripts, entrada y aritmética',`<ul><li><b>Script ejecutable</b>: primera línea <code>#!/bin/bash</code>, permiso con <code>chmod +x</code> y ejecución con <code>./script.sh</code>.</li><li><b>read</b>: <code>read -p "Texto: " var</code> (<code>-s</code> sin eco).</li><li><b>Aritmética</b>: <code>expr</code> (espacios entre operandos; el <code>*</code> se escapa o se entrecomilla), <code>$((a+b))</code>, y <code>bc</code> para decimales.</li><li><b>Códigos de salida</b>: <mark>0 = éxito</mark>, distinto de 0 = error. <code>exit n</code> termina el script; <code>$?</code> lo consulta.</li><li><b>Sustitución de comandos</b>: <code>$(comando)</code> inserta su salida.</li></ul>${P(`#!/bin/bash\nread -p "Número: " n\ndoble=$(expr $n '*' 2)\necho "scale=2; $n / 3" | bc\nfecha=$(date +%F)\nexit 0`)}`],
['4. Bash: test y estructuras',`<ul><li><b>Enteros</b>: <code>-eq -ne -lt -le -gt -ge</code>. <b>Cadenas</b>: <code>= != -z</code> (vacía) <code>-n</code> (no vacía). <b>Ficheros</b>: <code>-e</code> existe, <code>-f</code> fichero, <code>-d</code> directorio, <code>-r -w -x</code> permisos, <code>-s</code> no vacío.</li><li><b>Lógicos</b>: <code>!</code>, <code>-a</code>, <code>-o</code> (dentro de test) y <code>&amp;&amp;</code>, <code>||</code> entre comandos.</li><li><b>Estructuras</b>: <code>if/elif/else/fi</code>, <code>for</code>, <code>while</code> (mientras se cumple), <code>until</code> (hasta que se cumple), <code>case…esac</code>.</li><li><b>break</b> sale del bucle; <b>continue</b> salta a la siguiente iteración. <code>pass</code> es de Python (no hace nada); en Bash equivale a <code>:</code>.</li></ul>${P(`if [ -d "$1" ] && [ -r "$1" ]; then echo "ok"; fi\nfor f in *.txt; do echo "$f"; done\nwhile [ $i -le 5 ]; do i=$((i+1)); done\ncase $op in\n  s) echo suma ;;\n  *) echo desconocido ;;\nesac`)}<div class="extra">Los corchetes <code>[ ]</code> son el comando <code>test</code>: necesitan espacios dentro y alrededor.</div>`],
['5. Windows: ficheros por lotes (CMD)',`<ul><li>Ficheros de <b>texto ASCII</b> con extensión <mark>.bat</mark>.</li><li><b>Comandos</b>: <code>echo</code> (mostrar; <code>@echo off</code> oculta los comandos), <code>rem</code> (comentario), <code>pause</code>, <code>goto</code>, <code>if</code>, <code>choice</code>, <code>for</code>, <code>call</code>, <code>shift</code>.</li><li><b>Parámetros</b>: <code>%1..%9</code>; <code>shift</code> desplaza para leer más de nueve.</li><li><b>Variables</b>: <code>set x=5</code>, uso <code>%x%</code>. <b>Código de salida</b>: <code>%ERRORLEVEL%</code>; <code>if errorlevel n</code> es cierto si el código es <b>mayor o igual</b> que n.</li><li><b>Simular una función</b>: etiqueta + <code>call :etiqueta</code>, y <code>goto :eof</code> para volver.</li></ul>${P(`@echo off\ncall :saluda %1\nexit /b 0\n:saluda\necho Hola %1\ngoto :eof\n\nchoice /c SN /m "Continuar"\nif errorlevel 2 goto fin`)}`],
['6. PowerShell: bases',`<ul><li><b>Ayuda</b>: <code>Get-Help Get-Service -Examples</code>. <b>Navegar</b>: <code>Get-Location</code>, <code>Set-Location</code>.</li><li><b>Política de ejecución</b>: <code>Get-ExecutionPolicy</code> / <code>Set-ExecutionPolicy</code>. Valores: <code>Restricted</code> (por defecto en cliente, no permite scripts), <code>AllSigned</code>, <code>RemoteSigned</code>, <code>Unrestricted</code>.</li><li><b>Cmdlets</b>: formato <mark>Verbo-Nombre</mark>. <code>Get-Item, Get-ChildItem, Get-Content, Remove-Item, Get-Service</code>.</li><li><b>Filtrado</b>: <code>Where-Object</code> filtra y <code>ForEach-Object</code> procesa; <code>$_</code> es el objeto actual de la tubería.</li><li><b>Variables</b>: se declaran con <code>$</code>; se puede <b>tipar</b> (<code>[int]$n</code>) y convertir explícitamente (<code>[int]"5"</code>). Automáticas: <code>$_, $?, $true, $false, $null, $args</code>. Entorno: <code>$env:PATH</code>.</li></ul>${P(`Get-ChildItem C:/temp | Where-Object { $_.Length -gt 1KB }\nGet-Service | Where-Object Status -eq "Running" | ForEach-Object { $_.Name }\n[int]$edad = "20"`)}`],
['7. PowerShell: operadores, control, objetos y errores',`<ul><li><b>Comparación</b>: <code>-eq -ne -gt -lt -ge -le -like -match -contains</code>. <b>Lógicos</b>: <code>-and -or -not</code>. <b>Asignación</b>: <code>= += -= *=</code>.</li><li><b>Otros</b>: índice <code>$a[0]</code>, intervalo <code>1..5</code>, subexpresión <code>$( )</code> dentro de cadenas.</li><li><b>Control</b>: <code>if/elseif/else, switch, for, foreach, while, do…while</code>. <b>Funciones</b>: <code>function Nombre { param($x) … }</code>.</li><li><b>Objetos</b>: todo es un objeto con propiedades y métodos; se inspeccionan con <code>Get-Member</code>.</li><li><b>Errores</b>: <code>try / catch / finally</code>; para que un error no terminante sea capturable se usa <code>-ErrorAction Stop</code>.</li><li><b>Visor de eventos</b>: <code>New-EventLog</code> crea el origen y <code>Write-EventLog</code> escribe el evento.</li></ul>${P(`try {\n    Get-Content "x.txt" -ErrorAction Stop\n} catch {\n    Write-Host "Error: $($_.Exception.Message)"\n    Write-EventLog -LogName Application -Source "MiScript" -EventId 100 -EntryType Error -Message "Fallo"\n}`)}`],
['8. Ensamblador, código máquina y sistema operativo',`<ul><li><b>Lenguaje ensamblador</b>: lenguaje de bajo nivel con <b>mnemónicos</b> (<code>MOV, ADD</code>). Cada instrucción corresponde, casi uno a uno, con una <mark>instrucción en código máquina</mark>; un <b>ensamblador</b> las traduce.</li><li><b>Código máquina</b>: instrucciones en binario (código de operación + operandos) que se guardan en <b>memoria principal</b> como secuencia de bytes; la CPU las lee, decodifica y ejecuta.</li><li><b>ISA</b> (conjunto de instrucciones): las instrucciones que una CPU entiende (x86-64, ARM).</li><li><b>Software de sistema</b>: gestiona el hardware y da servicios (SO, controladores, utilidades). <b>De aplicación</b>: resuelve tareas del usuario (ofimática, navegador).</li><li><b>Funciones del SO</b>: gestión de procesos, de memoria, de ficheros, de entrada/salida, seguridad y usuarios, e interfaz con el usuario.</li></ul>`],
['9. Procesos en Linux',`<ul><li><b>PCB</b> (bloque de control de proceso): estructura del kernel con PID, PPID, estado, contador de programa, registros, prioridad, memoria asignada y ficheros abiertos.</li><li><b>Estados</b>: nuevo, listo, en ejecución, bloqueado y terminado. <b>Transiciones</b>: listo→ejecución (planificador), ejecución→listo (fin del quantum), ejecución→bloqueado (espera E/S), bloqueado→listo (llega la E/S), ejecución→terminado.</li><li><b>En ps</b>: <code>R</code> ejecutable, <code>S</code> dormido, <code>D</code> espera ininterrumpible, <code>T</code> detenido, <code>Z</code> zombi.</li><li><mark>Concurrencia</mark>: varias tareas avanzan de forma intercalada (vale con 1 CPU). <mark>Paralelismo</mark>: se ejecutan a la vez en varios núcleos.</li><li><b>Demonio</b>: proceso en segundo plano sin terminal, normalmente iniciado con el sistema (suele acabar en «d»: <code>sshd</code>). <b>Proceso de usuario</b>: lo lanza un usuario desde una sesión.</li><li><b>Creación</b>: <code>fork()</code> clona al padre y <code>exec()</code> carga otro programa. El proceso 1 es <code>init</code>/<code>systemd</code>. Los <b>hilos</b> comparten la memoria del proceso.</li></ul>`],
['10. Control de procesos y comandos del sistema',`<ul><li><b>Listar</b>: <code>ps aux</code>, <code>ps -ef</code>, <code>pstree</code>, <code>pgrep</code>, <code>top</code> (en vivo).</li><li><b>Señales</b>: <code>kill -l</code> las lista. <code>SIGTERM</code> (15, terminar), <code>SIGKILL</code> (9, no se puede ignorar), <code>SIGHUP</code> (1), <code>SIGINT</code> (2, Ctrl+C), <code>SIGSTOP</code> (19) y <code>SIGCONT</code> (18). <code>killall</code> y <code>pkill</code> actúan por nombre.</li><li><b>Prioridad</b>: <code>nice -n 10 cmd</code> al lanzar y <code>renice</code> después. Rango <mark>-20 a 19</mark>: cuanto menor, más prioridad; solo root puede bajar de 0.</li><li><b>Planos</b>: <code>cmd &amp;</code> segundo plano, <code>Ctrl+Z</code> detiene, <code>bg</code> reanuda en segundo plano, <code>fg</code> trae a primer plano, <code>jobs</code> lista.</li><li><b>Recursos</b>: <code>top</code>, <code>ps -o</code>, <code>lsof</code>. <b>Otros</b>: <code>uptime</code> (tiempo encendido y carga), <code>w</code> (usuarios conectados), <code>free -h</code> (memoria), <code>uname -a</code> (kernel).</li><li><b>/proc</b>: sistema de ficheros virtual del kernel: <code>/proc/cpuinfo</code>, <code>/proc/meminfo</code> y <code>/proc/PID/</code> por proceso.</li></ul>${P(`sleep 300 &\nnice -n 10 ./tarea.sh &\nrenice 5 -p 1234\nkill -9 1234`)}`],
['11. SysV init, cron, tareas en Windows y systemd',`<ul><li><b>Niveles SysV</b>: 0 apagado, 1 monousuario, 2-5 multiusuario (en RedHat 3 texto y 5 gráfico), 6 reinicio. Scripts en <code>/etc/init.d</code>; enlaces <code>/etc/rcN.d</code> con <code>S##nombre</code> (start) y <code>K##nombre</code> (kill). Comandos: <code>runlevel</code>, <code>telinit</code>, <code>service</code>.</li><li><b>cron</b>: <code>crontab -e / -l / -r</code>. Formato: <mark>min hora díaMes mes díaSemana comando</mark>. Admite <code>*</code>, listas <code>1,15</code>, rangos <code>1-5</code> y pasos <code>*/10</code>.</li><li><b>PowerShell/Windows</b>: <code>New-ScheduledTaskAction</code>, <code>New-ScheduledTaskTrigger</code> y <code>Register-ScheduledTask</code>; en CMD, <code>schtasks /create</code>.</li><li><b>systemd</b>: gestiona <b>unidades</b> con <code>systemctl start|stop|restart|status|enable|disable</code>; registros con <code>journalctl -u</code>. Los <i>targets</i> sustituyen a los niveles.</li><li><b>Crear un servicio</b>: fichero <code>.service</code> en <code>/etc/systemd/system</code>, luego <code>systemctl daemon-reload</code> y <code>enable --now</code>.</li></ul>${P(`30 2 * * 1-5 /home/alumno/copia.sh   # L-V a las 02:30\n\n[Unit]\nDescription=Mi servicio\nAfter=network.target\n[Service]\nExecStart=/usr/local/bin/mi.sh\nRestart=on-failure\n[Install]\nWantedBy=multi-user.target`)}`]];
const AC=[
['Escribe un script Bash que reciba un número como parámetro, avise si no se pasa ninguno y diga si es <b>par o impar</b>.<br><span class="tag">Pista: <code>$#</code> y <code>$(( n % 2 ))</code>.</span>',`#!/bin/bash
if [ $# -ne 1 ]; then
    echo "Uso: $0 numero"
    exit 1
fi
if [ $(( $1 % 2 )) -eq 0 ]; then
    echo "$1 es par"
else
    echo "$1 es impar"
fi`],
['Script Bash que pida nombres con <code>read</code> hasta que se escriba «fin» y muestre cuántos se han introducido.',`#!/bin/bash
n=0
read -p "Nombre: " nombre
while [ "$nombre" != "fin" ]; do
    n=$((n+1))
    read -p "Nombre: " nombre
done
echo "Nombres introducidos: $n"`],
['Script PowerShell que muestre el nombre de los servicios <b>en ejecución</b> cuyo nombre empiece por «W».',`Get-Service |
    Where-Object { $_.Status -eq "Running" -and $_.Name -like "W*" } |

['Entrada de cron que ejecute <code>/home/alumno/copia.sh</code> los lunes y miércoles a las 18:15, y fichero .bat que muestre un saludo con el primer parámetro.',`15 18 * * 1,3 /home/alumno/copia.sh

@echo off
echo Hola %1
pause`]];
const C=[['$?','Código de salida del último comando en Bash: 0 es éxito, distinto de 0 es error.'],['$# y $@','Número de parámetros y lista de todos los parámetros recibidos.'],['return en Bash','Solo devuelve un código de salida (0-255); los datos se devuelven con echo y $(...).'],['Ámbito en Bash','Variables globales por defecto; local las limita a la función.'],['Sustitución de comandos','$(comando) inserta la salida del comando.'],['test / [ ]','Evalúa condiciones sobre enteros (-eq, -lt…), cadenas (=, -z) y ficheros (-f, -d).'],['until','Bucle que se repite hasta que la condición se cumple (al revés que while).'],['break / continue','Salir del bucle / saltar a la siguiente iteración.'],['Fichero .bat','Texto ASCII con comandos de CMD; goto y etiquetas simulan funciones.'],['%ERRORLEVEL%','Código de salida en CMD; if errorlevel n se cumple si es mayor o igual que n.'],['ExecutionPolicy','Política que controla qué scripts de PowerShell se ejecutan (Restricted, AllSigned, RemoteSigned, Unrestricted).'],['$_','Objeto actual en una tubería (Where-Object, ForEach-Object).'],['try/catch','Captura errores en PowerShell; con -ErrorAction Stop los no terminantes también se capturan.'],['Ensamblador','Lenguaje de bajo nivel con mnemónicos, casi 1:1 con el código máquina.'],['ISA','Conjunto de instrucciones que entiende una CPU.'],['PCB','Estructura del kernel con la información de un proceso (PID, estado, registros, prioridad…).'],['Concurrencia vs paralelismo','Concurrencia: tareas intercaladas. Paralelismo: ejecución simultánea en varios núcleos.'],['Demonio','Proceso en segundo plano, sin terminal, normalmente iniciado con el sistema.'],['nice','Prioridad de -20 (máxima) a 19 (mínima); renice la cambia en caliente.'],['SIGKILL','Señal 9: termina el proceso y no puede ser ignorada. SIGTERM (15) pide terminar con limpieza.'],['/proc','Sistema de ficheros virtual con información del kernel y de cada proceso.'],['Formato de cron','min hora díaMes mes díaSemana comando.'],['Niveles SysV','0 apagar, 1 monousuario, 2-5 multiusuario, 6 reiniciar.'],['systemctl','Gestiona servicios systemd: start, stop, restart, status, enable, disable.']];
const Q=[['¿Qué variable de Bash contiene el código de salida del último comando?',['$$','$?','$!','$#'],1,'$$ es el PID del shell, $! el del último proceso en segundo plano y $# el nº de parámetros.'],
['Verdadero o falso: en Bash, return puede devolver una cadena de texto cualquiera.',['Verdadero','Falso'],1,'Solo devuelve un código 0-255; para texto se usa echo y $(...).'],
['¿Cuál es el ámbito por defecto de una variable dentro de una función Bash?',['Local','Global','Solo de lectura','Depende de la función'],1,'Se limita con local; en Python es al revés.'],
['¿Qué operador de test compara dos enteros "mayor o igual"?',['-ge','-gt','>=','-le'],0,'-gt es estrictamente mayor.'],
['¿Qué hace un bucle until?',['Repite mientras la condición es cierta','Repite hasta que la condición se cumple','Se ejecuta una sola vez','Solo recorre listas'],1,'until es el opuesto de while.'],
['¿Qué extensión tienen los ficheros por lotes de Windows?',['.ps1','.sh','.bat','.cmd.txt'],2,'.ps1 es de PowerShell.'],
['En CMD, if errorlevel 2 se cumple cuando el código de salida es…',['Exactamente 2','Mayor o igual que 2','Menor que 2','Distinto de 2'],1,'Se evalúa como mayor o igual.'],
['¿Qué var automática de PowerShell representa el objeto actual de la tubería?',['$?','$args','$_','$null'],2,'Se usa en Where-Object y ForEach-Object.'],
['Quieres capturar con catch un error no terminante de Get-Content. ¿Qué añades?',['-Verbose','-ErrorAction Stop','-WhatIf','-Force'],1,'Convierte el error en terminante.'],
['¿Cuál es la relación entre ensamblador y código máquina?',['Ninguna','Casi una instrucción ensamblador por cada una de máquina','El ensamblador es de alto nivel','El código máquina es texto'],1,'El ensamblador traduce mnemónicos a binario.'],
['¿Qué estado tiene un proceso que espera una operación de E/S?',['Listo','En ejecución','Bloqueado','Terminado'],2,'Cuando acaba la E/S pasa a listo.'],
['Verdadero o falso: concurrencia y paralelismo significan lo mismo.',['Verdadero','Falso'],1,'La concurrencia es posible con un solo núcleo; el paralelismo exige varios.'],
['¿Qué valor de nice da MÁS prioridad a un proceso?',['19','0','-20','10'],2,'Cuanto menor, más prioridad; bajar de 0 requiere root.'],
['¿Qué señal no puede ser ignorada por un proceso?',['SIGTERM','SIGHUP','SIGKILL','SIGINT'],2,'SIGKILL es la 9.'],
['¿Qué significa la entrada de cron «*/10 * * * *»?',['Cada 10 horas','Cada 10 minutos','Cada 10 días','A las 10:00'],1,'El paso */10 en el campo de minutos.'],
['¿Qué orden recarga systemd tras crear un fichero .service?',['systemctl reload','systemctl daemon-reload','service restart','init 6'],1,'Después se activa con enable --now.'],
['Ordena los pasos para crear un servicio con systemd',['Escribir el fichero .service en /etc/systemd/system','Ejecutar systemctl daemon-reload','Ejecutar systemctl enable --now','Comprobar con systemctl status'],'o','Siempre se recarga systemd antes de arrancarlo.']];
const S0=()=>({done:false,known:{},wrong:{}});let S=S0();
try{Object.assign(S,JSON.parse(localStorage.getItem('aso_ex2')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('aso_ex2',JSON.stringify(S))}catch(e){}};
let V='th',FP=false,FI=0,FL=false,tm=null;
const VS=[['th','Resumen'],['ac','Actividades'],['fc','Flashcards'],['ts','Test'],['ex','Examen'],['rv','Repaso'],['gl','Glosario'],['ch','Chuleta']];
function prog(){const n=C.length+1,k=(S.done?1:0)+C.filter((_,j)=>S.known['c'+j]===1).length;$('#pg').style.width=Math.round(100*k/n)+'%';$('#pt').textContent=Math.round(100*k/n)+' % completado · '+Object.keys(S.wrong).length+' preguntas por repasar'}
function nav(){$('#nv').innerHTML=VS.map(v=>`<button class="${V===v[0]?'on':''}" onclick="V='${v[0]}';clearInterval(tm);R()">${v[1]}</button>`).join('');prog()}
function R(){nav();const m=$('#m');m.innerHTML='';({th,ac,fc,ts,ex,rv,gl,ch})[V](m);window.scrollTo(0,0)}
function th(m){m.innerHTML='<h2>Resumen del 1er trimestre</h2>'+TH.map(s=>`<details><summary>${s[0]}</summary><div>${s[1]}</div></details>`).join('')+`<p><button onclick="S.done=!S.done;save();R()">${S.done?'✓ Tema completado (quitar)':'Marcar tema como completado'}</button></p><p class="tag">Fuente: guía de estudio del 1er trimestre de ASO (curso 2026/2027); contenido desarrollado a partir de sus epígrafes.</p>`}
function ac(m){m.innerHTML='<h2>Actividades resueltas</h2><p class="tag">Intenta resolverlas antes de abrir la solución.</p><p class="tag">Soluciones de ejemplo; puede haber otras válidas.</p>'+AC.map((a,i)=>`<details><summary>Actividad ${i+1}</summary><div><p>${a[0]}</p><textarea rows="4" placeholder="Escribe tu solución…"></textarea><details><summary>Ver solución</summary><div>${P(a[1])}</div></details></div></details>`).join('')}
function fc(m){const L=C.map((c,j)=>({k:'c'+j,q:c[0],a:c[1]})).filter(c=>!FP||S.known[c.k]!==1);if(FI>=L.length)FI=0;m.innerHTML=`<label><input type="checkbox" ${FP?'checked':''} onchange="FP=this.checked;FI=0;R()"> Solo pendientes</label>`;if(!L.length){m.innerHTML+='<div class="card">🎉 ¡Todas dominadas!</div>';return}const c=L[FI];m.innerHTML+=`<p class="tag">${FI+1}/${L.length}</p><div class="card fc ${FL?'back':''}" tabindex="0" role="button" onclick="FL=!FL;R()" onkeydown="if(event.key==' '||event.key=='Enter'){event.preventDefault();FL=!FL;R()}">${FL?c.a:'<b>'+c.q+'</b>'}</div><div class="row"><button onclick="mk('${c.k}',1)">✓ La sabía</button><button onclick="mk('${c.k}',0)">↻ Repasar</button></div><p class="tag">Pulsa la tarjeta (o Enter) para voltearla.</p>`}
function mk(k,v){S.known[k]=v;save();FI++;FL=false;R()}
const qs=()=>Q.map((q,j)=>({k:'q'+j,q}));
function ts(m){m.innerHTML=`<div class="card"><p>${Q.length} preguntas con feedback inmediato.</p><button class="on" onclick="quiz(sh(qs()),true)">Empezar test</button></div>`}
function ex(m){m.innerHTML=`<div class="card"><p>Examen aleatorio sin feedback hasta el final.</p><label>Nº de preguntas: <input type="number" id="en" value="8" min="3" max="${Q.length}" style="width:80px"></label> <label><input type="checkbox" id="ec" checked> Cronómetro</label><p><button class="on" onclick="quiz(sh(qs()).slice(0,+$('#en').value||8),false,$('#ec').checked)">Empezar examen</button></p></div>`}
function quiz(L,fb,clock){const m=$('#m');let i=0,res=[],t0=Date.now();clearInterval(tm);
const head=()=>`<p class="tag">Pregunta ${i+1}/${L.length}${clock?' · ⏱ <span id="tc"></span>':''}</p>`;
if(clock)tm=setInterval(()=>{const e=$('#tc');if(e){const s=Math.floor((Date.now()-t0)/1000);e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}},500);
function rec(it,ok){res.push({it,ok});if(!ok)S.wrong[it.k]=2;else if(S.wrong[it.k]&&!--S.wrong[it.k])delete S.wrong[it.k];save();prog()}
const nxt=()=>{i++;i<L.length?show():end()};
function show(){const it=L[i],q=it.q;if(q[2]==='o')return ord(it);
m.innerHTML=head()+`<div class="card"><b>${q[0]}</b>`+q[1].map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join('')+'<div id="fb"></div></div>';
m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const j=+b.dataset.j,ok=j===q[2];rec(it,ok);if(!fb)return nxt();m.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.j===q[2])x.classList.add('ok')});if(!ok)b.classList.add('ko');$('#fb').innerHTML=`<div class="fb ${ok?'ok':'ko'}"><b>${ok?'¡Correcto!':'Incorrecto.'}</b> ${q[3]}</div><p><button class="on" id="nx">Siguiente →</button></p>`;$('#nx').onclick=nxt;$('#nx').focus()})}
function ord(it){const q=it.q,pool=sh(q[1]),ch=[];function d(){m.innerHTML=head()+`<div class="card"><b>${q[0]}</b><p class="tag">Pulsa los pasos en el orden correcto.</p><ol>${ch.map(x=>`<li>${x}</li>`).join('')}</ol>`+pool.filter(x=>!ch.includes(x)).map(x=>`<button class="opt" data-v="${x}">${x}</button>`).join('')+'<div id="fb"></div></div>';m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ch.push(b.dataset.v);if(ch.length<pool.length)return d();const ok=ch.join('|')===q[1].join('|');rec(it,ok);if(!fb)return nxt();d();m.querySelectorAll('.opt').forEach(x=>x.disabled=true);$('#fb').innerHTML=`<div class="fb ${ok?'ok':'ko'}"><b>${ok?'¡Correcto!':'Orden incorrecto.'}</b> Orden: ${q[1].join(' → ')}. ${q[3]}</div><p><button class="on" id="nx">Siguiente →</button></p>`;$('#nx').onclick=nxt})}d()}
function end(){clearInterval(tm);const ok=res.filter(r=>r.ok).length;
m.innerHTML=`<div class="card"><div class="big">${(10*ok/res.length).toFixed(1)} / 10</div><p>${ok} de ${res.length} aciertos${clock?' · '+Math.round((Date.now()-t0)/1000)+' s':''}.</p></div>`+(res.some(r=>!r.ok)?'<h3>Para repasar</h3>'+res.filter(r=>!r.ok).map(r=>`<div class="card"><b>${r.it.q[0]}</b><p>${r.it.q[2]==='o'?r.it.q[1].join(' → '):'✓ '+r.it.q[1][r.it.q[2]]}</p><p class="tag">${r.it.q[3]}</p></div>`).join(''):'<p>🎉 Sin fallos.</p>')}
show()}
function rv(m){const w=qs().filter(x=>S.wrong[x.k]),pc=C.map((c,j)=>({k:'c'+j,q:c[0],a:c[1]})).filter(c=>S.known[c.k]===0);
m.innerHTML=`<h3>Preguntas falladas (${w.length})</h3>`+(w.length?`<button class="on" onclick="quiz(sh(qs().filter(x=>S.wrong[x.k])),true)">Practicar fallos</button>`+w.map(x=>`<div class="card">${x.q[0]}</div>`).join(''):'<p>Ninguna. Se eliminan al acertarlas dos veces.</p>')+`<h3>Flashcards por repasar (${pc.length})</h3>`+pc.map(c=>`<details><summary>${c.q}</summary><div>${c.a}</div></details>`).join('')}
function gl(m){m.innerHTML='<input type="search" id="gq" placeholder="Buscar término…" aria-label="Buscar en el glosario"><div id="gr"></div>';const f=()=>{const q=$('#gq').value.toLowerCase();$('#gr').innerHTML=C.filter(c=>(c[0]+c[1]).toLowerCase().includes(q)).map(c=>`<div class="card"><b>${c[0]}</b><br>${c[1]}</div>`).join('')};$('#gq').oninput=f;f()}
function ch(m){m.innerHTML='<div class="card"><h3>Chuleta</h3><ul><li>Bash: <code>$?</code> salida, <code>$#</code> nº params, <code>$(cmd)</code>, <code>[ ]</code> test, return = código 0-255, global por defecto.</li><li>CMD: .bat, <code>%1</code>, <code>%ERRORLEVEL%</code>, goto + call.</li><li>PowerShell: Verbo-Nombre, <code>$_</code>, <code>-eq -gt -like</code>, try/catch + <code>-ErrorAction Stop</code>.</li><li>Procesos: estados listo/ejecución/bloqueado; concurrencia ≠ paralelismo; nice -20..19; SIGKILL=9, SIGTERM=15.</li><li>cron: <code>min hora dm mes ds cmd</code>. SysV: 0 halt, 1 single, 6 reboot. systemd: unit + daemon-reload + enable --now.</li></ul></div>'}
$('#th').onclick=()=>{const r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'};
$('#rs').onclick=()=>{if(confirm('¿Borrar todo el progreso?')){S=S0();save();R()}};
document.documentElement.dataset.theme='light';R();
</script></body></html>
